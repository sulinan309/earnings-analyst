<title>本周电波 · 每周播客中文文稿</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#F1F1EC; --surface:#FAFAF7; --surface-2:#E7E7E1; --raised:#FFFFFF;
    --ink:#1D2127; --muted:#585E67; --faint:#8B9099;
    --line:rgba(29,33,39,.12); --line-strong:rgba(29,33,39,.22);
    --accent:#43678F; --accent-soft:rgba(67,103,143,.12);
    --shadow:0 1px 2px rgba(20,24,30,.04), 0 8px 30px rgba(20,24,30,.06);
    --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111418; --surface:#171B21; --surface-2:#1E232B; --raised:#1B2027;
      --ink:#E7E9EC; --muted:#9AA1AB; --faint:#6B727C;
      --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
      --accent:#6E9BD1; --accent-soft:rgba(110,155,209,.16);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111418; --surface:#171B21; --surface-2:#1E232B; --raised:#1B2027;
    --ink:#E7E9EC; --muted:#9AA1AB; --faint:#6B727C;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --accent:#6E9BD1; --accent-soft:rgba(110,155,209,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.34);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}

  /* reading progress */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}

  /* layout */
  .shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
  @media (max-width:960px){.shell{grid-template-columns:1fr}}

  /* sidebar */
  .side{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--line);
    padding:26px 20px 40px;display:flex;flex-direction:column;gap:22px;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .eq{display:flex;align-items:flex-end;gap:2.5px;height:20px}
  .eq span{width:3px;background:var(--accent);border-radius:2px;animation:eq 1.1s ease-in-out infinite}
  .eq span:nth-child(1){height:7px;animation-delay:0s}
  .eq span:nth-child(2){height:16px;animation-delay:.18s}
  .eq span:nth-child(3){height:11px;animation-delay:.36s}
  .eq span:nth-child(4){height:19px;animation-delay:.10s}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .brand h1{font-family:var(--serif);font-size:20px;letter-spacing:.02em;margin:0;font-weight:650}
  .brand .wk{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-top:2px}

  .nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:0 4px}
  .eplist{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .epitem{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .15s;border:1px solid transparent}
  .epitem:hover{background:var(--surface-2)}
  .epitem.active{background:var(--accent-soft);border-color:var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--ep,#888);box-shadow:0 0 0 3px color-mix(in srgb,var(--ep,#888) 20%,transparent)}
  .epitem .show{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--faint);text-transform:uppercase}
  .epitem .t{font-size:13px;line-height:1.35;color:var(--ink);margin-top:2px;font-weight:550}
  .epitem.active .t{color:var(--ep)}

  .toc{display:none;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:16px;margin-top:2px}
  .toc.show{display:flex}
  .toc a{font-size:12.5px;line-height:1.4;color:var(--muted);padding:6px 10px;border-radius:7px;border-left:2px solid transparent;transition:color .15s,background .15s}
  .toc a:hover{background:var(--surface-2);color:var(--ink)}
  .toc a.active{color:var(--ep,var(--accent));border-left-color:var(--ep,var(--accent));background:var(--surface-2)}

  .side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
  .themebtn{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 11px;border-radius:8px;cursor:pointer}
  .themebtn:hover{color:var(--ink);border-color:var(--line-strong)}

  /* main */
  .main{min-width:0}
  .view{display:none}
  .view.on{display:block}

  /* home hero */
  .hero{padding:76px 8vw 40px;border-bottom:1px solid var(--line)}
  @media (max-width:600px){.hero{padding:52px 24px 32px}}
  .hero .kick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
  .hero h2{font-family:var(--serif);font-weight:650;font-size:clamp(34px,6vw,58px);line-height:1.08;margin:16px 0 0;letter-spacing:.01em;text-wrap:balance}
  .hero p{max-width:56ch;color:var(--muted);font-size:16.5px;line-height:1.85;margin:20px 0 0}
  .stats{display:flex;flex-wrap:wrap;gap:30px;margin-top:34px}
  .stat .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:8px}

  /* episode cards */
  .cards{padding:40px 8vw 90px;display:flex;flex-direction:column;gap:18px}
  @media (max-width:600px){.cards{padding:30px 24px 70px}}
  .card{
    position:relative;display:grid;grid-template-columns:auto 1fr;gap:26px;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:26px 30px 28px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ep)}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong)}
  @media (max-width:640px){.card{grid-template-columns:1fr;gap:14px;padding:22px 22px 24px 26px}}
  .idx{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.05em;padding-top:5px}
  .card .show{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ep)}
  .card h3{font-family:var(--serif);font-weight:640;font-size:23px;line-height:1.28;margin:8px 0 0;text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--faint);font-family:var(--mono)}
  .meta b{color:var(--muted);font-weight:500}
  .blurb{color:var(--muted);font-size:15px;line-height:1.8;margin:14px 0 0;max-width:64ch}
  .who{margin-top:14px;font-size:13px;color:var(--muted)}
  .who .g{color:var(--ink);font-weight:550}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .tag{font-size:11.5px;font-family:var(--mono);letter-spacing:.02em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 9px;border-radius:20px}
  .read{margin-top:18px;font-size:13px;font-weight:600;color:var(--ep);display:inline-flex;align-items:center;gap:6px}
  .card:hover .read .arw{transform:translateX(4px)}
  .arw{transition:transform .18s}

  /* reader */
  .reader{--ep:var(--accent)}
  .rtop{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 8vw;display:flex;align-items:center;justify-content:space-between;gap:16px}
  @media (max-width:600px){.rtop{padding:12px 22px}}
  .back{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);cursor:pointer;background:none;border:none;padding:6px 4px}
  .back:hover{color:var(--ep)}
  .rtop .rshow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ep);text-align:right;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .rhead{padding:56px 8vw 30px;border-bottom:1px solid var(--line)}
  @media (max-width:600px){.rhead{padding:38px 22px 26px}}
  .rhead .show{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ep)}
  .rhead h2{font-family:var(--serif);font-weight:650;font-size:clamp(28px,4.6vw,42px);line-height:1.18;margin:14px 0 0;text-wrap:balance;max-width:22ch}
  .rhead .rmeta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;font-family:var(--mono);font-size:12.5px;color:var(--faint)}
  .rhead .rmeta b{color:var(--muted);font-weight:500}

  .article{padding:16px 8vw 120px;max-width:880px}
  @media (max-width:600px){.article{padding:12px 22px 90px}}
  .prose{font-size:17px;line-height:1.92;color:var(--ink);max-width:42em}
  .prose h1{display:none}
  .prose h2{font-family:var(--serif);font-weight:640;font-size:25px;line-height:1.35;margin:52px 0 4px;padding-top:14px;letter-spacing:.01em;scroll-margin-top:80px;text-wrap:balance}
  .prose h2::before{content:"";display:block;width:34px;height:3px;background:var(--ep);border-radius:2px;margin-bottom:18px}
  .prose h3{font-family:var(--serif);font-weight:620;font-size:19px;margin:34px 0 2px;color:var(--ink);scroll-margin-top:80px}
  .prose p{margin:16px 0}
  .prose strong{font-weight:640;color:var(--ink)}
  .prose em{color:var(--muted)}
  .prose code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
  .prose a{color:var(--ep);border-bottom:1px solid color-mix(in srgb,var(--ep) 40%,transparent)}
  .prose ul,.prose ol{margin:16px 0;padding-left:1.3em;display:flex;flex-direction:column;gap:9px}
  .prose li{padding-left:4px}
  .prose li::marker{color:var(--ep)}
  .prose hr{border:none;border-top:1px solid var(--line);margin:40px 0}
  .prose blockquote{
    margin:26px 0;padding:16px 22px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--ep);border-radius:0 10px 10px 0;color:var(--muted);font-size:15px;line-height:1.82;
  }
  .prose blockquote p{margin:8px 0}
  .prose blockquote p:first-child{margin-top:0}.prose blockquote p:last-child{margin-bottom:0}
  .tablewrap{overflow-x:auto;margin:26px 0;border:1px solid var(--line);border-radius:12px}
  .prose table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
  .prose th,.prose td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
  .prose th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--surface);font-weight:500}
  .prose tr:last-child td{border-bottom:none}
  .prose td:first-child{color:var(--ink);font-weight:550;white-space:nowrap}
  .prose td strong{color:var(--ep)}

  .endcap{margin:60px 0 0;padding-top:26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .endcap .nextbtn{display:inline-flex;flex-direction:column;gap:3px;cursor:pointer;padding:12px 18px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .15s,transform .15s}
  .endcap .nextbtn:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .endcap .nextbtn small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .endcap .nextbtn span{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}
  .totop{font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none}

  /* filter bar */
  .filterbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:34px 8vw 0}
  @media (max-width:600px){.filterbar{padding:26px 24px 0}}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:inline-flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--line-strong);color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip .ct{font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}
  .chip.on .ct{opacity:.75}
  .filtercount{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.03em}

  /* category badges */
  .catrow{display:flex;flex-wrap:wrap;gap:6px}
  .catbadge{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ep);padding:3px 8px;border-radius:5px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--ep) 32%,transparent);background:color-mix(in srgb,var(--ep) 9%,transparent)}
  .cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .cardtop .catrow{justify-content:flex-end;flex-shrink:0;max-width:52%}
  @media (max-width:640px){.cardtop{flex-direction:column;gap:8px}.cardtop .catrow{justify-content:flex-start;max-width:100%}}
  .rcats{margin-top:18px}

  /* card highlights */
  .hlwrap{margin:16px 0 4px;padding:15px 18px;background:color-mix(in srgb,var(--ep) 5%,var(--surface));border:1px solid var(--line);border-radius:11px}
  .hllab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ep);margin-bottom:10px}
  ul.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.hl li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.62;color:var(--muted)}
  ul.hl li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;background:var(--ep);border-radius:1px;transform:rotate(45deg)}
  .cardfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px}
  .cardfoot .tags{margin-top:0}
  .cardfoot .read{margin-top:0}

  /* reader highlights box */
  .hlbox{margin:6px 0 30px;padding:22px 26px;background:color-mix(in srgb,var(--ep) 6%,var(--surface));border:1px solid var(--line);border-left:3px solid var(--ep);border-radius:0 14px 14px 0}
  .hlbox .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ep);margin-bottom:14px}
  .hlbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .hlbox li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.68;color:var(--ink)}
  .hlbox li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;background:var(--ep);border-radius:1px;transform:rotate(45deg)}

  /* mobile drawer */
  .menubtn{display:none}
  @media (max-width:960px){
    .side{position:fixed;z-index:50;width:300px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow)}
    .side.open{transform:translateX(0)}
    .menubtn{display:inline-flex;align-items:center;gap:8px;position:fixed;top:14px;left:14px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-family:var(--mono);font-size:12px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
    .scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
    .scrim.on{opacity:1;pointer-events:auto}
    .hero{padding-top:66px}
    .rtop{padding-left:64px}
  }
  .scrim{display:none}
  @media (max-width:960px){.scrim{display:block}}
</style>

<div id="progress"></div>
<button class="menubtn" id="menubtn" aria-label="打开目录">☰ 目录</button>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand" role="button" id="brandhome" tabindex="0">
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div>
        <h1>__BRAND__</h1>
        <div class="wk">__BRANDSUB__</div>
      </div>
    </div>
    <div>
      <div class="nav-label">节目 · __COUNT__</div>
      <div class="eplist" id="eplist"></div>
    </div>
    <nav class="toc" id="toc" aria-label="本集目录"></nav>
    <div class="side-foot">
      <button class="themebtn" id="themebtn">◐ 主题</button>
      <span style="font-family:var(--mono);font-size:10px;color:var(--faint)">2026·08</span>
    </div>
  </aside>

  <main class="main">
    <!-- HOME -->
    <section class="view on" id="home">
      <div class="hero">
        <div class="kick">__WEEKLABEL__</div>
        <h2>__HEROTITLE__</h2>
        <p>__HEROLEAD__</p>
        <div class="stats">__STATS__</div>
        </div>
      </div>
      <div class="filterbar">
        <div class="chips" id="filters"></div>
        <div class="filtercount" id="filtercount"></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- READER -->
    <section class="view reader" id="reader">
      <div class="rtop">
        <button class="back" id="backbtn">← 返回本周总览</button>
        <div class="rshow" id="rshow"></div>

      <header class="rhead" id="rhead"></header>
      <div class="article">
        <article class="prose" id="article"></article>
        <div class="endcap">
          <button class="totop" id="totop">↑ 回到顶部</button>
          <div class="nextbtn" id="nextbtn"><small>下一集</small><span id="nexttitle"></span></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const EPISODES = __EPISODES__;

/* ---------- tiny markdown renderer ---------- */
function renderMarkdown(md, epid){
  const lines = md.replace(/\r/g,"").replace(/\t/g,"    ").split("\n");
  let out=[], i=0, toc=[], hn=0;
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => esc(s)
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>")
      .replace(/\bhttps?:\/\/[^\s，。、）)]+/g, m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
  const isBlank = s => !s.trim();

  while(i<lines.length){
    let line = lines[i];
    if(isBlank(line)){ i++; continue; }

    // hr
    if(/^\s*---+\s*$/.test(line)){ out.push("<hr>"); i++; continue; }

    // heading
    let h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      const lvl = h[1].length, txt = h[2].trim();
      if(lvl===1){ i++; continue; }               // title handled in header chrome
      let id="";
      if(lvl===2){ id = `${epid}-h${hn++}`; toc.push({id,text:txt}); }
      out.push(`<h${lvl}${id?` id="${id}"`:""}>${inline(txt)}</h${lvl}>`);
      i++; continue;
    }

    // table
    if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes("-")){
      const rowCells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const head = rowCells(line); i+=2;
      let body=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){ body.push(rowCells(lines[i])); i++; }
      let t = "<div class='tablewrap'><table><thead><tr>"+head.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>";
      t += body.map(r=>"<tr>"+r.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("");
      t += "</tbody></table></div>";
      out.push(t); continue;
    }

    // blockquote
    if(/^\s*>/.test(line)){
      let buf=[];
      while(i<lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out.push("<blockquote>"+renderMarkdown(buf.join("\n"), epid+"-bq").html+"</blockquote>");
      continue;
    }

    // unordered list
    if(/^\s*[-*]\s+/.test(line)){
      let items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,"")); i++; }
      out.push("<ul>"+items.map(t=>`<li>${inline(t)}</li>`).join("")+"</ul>");
      continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(line)){
      let items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,"")); i++; }
      out.push("<ol>"+items.map(t=>`<li>${inline(t)}</li>`).join("")+"</ol>");
      continue;
    }

    // paragraph (gather until blank / block starts)
    let para=[];
    while(i<lines.length && !isBlank(lines[i]) &&
          !/^\s*(#{1,6}\s|>|[-*]\s|\d+\.\s|---+\s*$|\|)/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    if(para.length) out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return { html: out.join("\n"), toc };
}

/* ---------- categories + highlights ---------- */
const CATLABELS = __CATLABELS__;
const CAT_ORDER = __CATORDER__;
/* ---------- app ---------- */
const $ = s => document.querySelector(s);
let activeCat = "all";
const rendered = {}; // cache
let current = null;

function buildSidebar(){
  const el = $("#eplist");
  el.innerHTML = EPISODES.map((e,ix)=>`
    <div class="epitem" data-id="${e.id}" style="--ep:${e.ep}" role="button" tabindex="0">
      <span class="dot"></span>
      <span><span class="show">${e.show}</span><span class="t">${e.title}</span></span>
    </div>`).join("");
  el.querySelectorAll(".epitem").forEach(n=>{
    const go=()=>openEpisode(n.dataset.id);
    n.addEventListener("click",go);
    n.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
  });
}

function buildFilters(){
  const counts={};
  EPISODES.forEach(e=>e.cats.forEach(c=>counts[c]=(counts[c]||0)+1));
  let html=`<button class="chip on" data-cat="all">全部 <span class="ct">${EPISODES.length}</span></button>`;
  CAT_ORDER.forEach(c=>{ if(counts[c]) html+=`<button class="chip" data-cat="${c}">${CATLABELS[c]} <span class="ct">${counts[c]}</span></button>`; });
  const el=$("#filters"); el.innerHTML=html;
  el.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    activeCat=ch.dataset.cat;
    el.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===ch));
    applyFilter();
  }));
}
function applyFilter(){
  let shown=0;
  document.querySelectorAll("#cards .card").forEach(card=>{
    const cats=(card.dataset.cats||"").split(",");
    const ok=activeCat==="all"||cats.includes(activeCat);
    card.style.display=ok?"":"none";
    if(ok) shown++;
  });
  const cnt=$("#filtercount");
  if(cnt) cnt.textContent = activeCat==="all" ? "" : `${shown} 档 · ${CATLABELS[activeCat]}`;
}
function buildCards(){
  $("#cards").innerHTML = EPISODES.map((e,ix)=>`
    <article class="card" data-id="${e.id}" data-cats="${e.cats.join(",")}" style="--ep:${e.ep}" role="button" tabindex="0">
      <div class="idx">${String(ix+1).padStart(2,"0")}</div>
      <div>
        <div class="cardtop">
          <div class="show">${e.show}　·　${e.eyebrow}</div>
          <div class="catrow">${e.cats.map(c=>`<span class="catbadge">${CATLABELS[c]}</span>`).join("")}</div>
        </div>
        <h3>${e.title}</h3>
        <div class="meta"><span><b>${e.date}</b></span><span><b>${e.dur}</b></span></div>
        <p class="blurb">${e.blurb}</p>
        <div class="hlwrap"><div class="hllab">本集要点</div>
          <ul class="hl">${(e.hl||[]).map(h=>`<li>${h}</li>`).join("")}</ul>
        </div>
        <div class="who">主持　${e.host}${e.guest?`　·　嘉宾　<span class="g">${e.guest}</span>`:""}</div>
        <div class="cardfoot">
          <div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
          <div class="read">阅读全文 <span class="arw">→</span></div>
        </div>
      </div>
    </article>`).join("");
  $("#cards").querySelectorAll(".card").forEach(n=>{
    const go=()=>openEpisode(n.dataset.id);
    n.addEventListener("click",go);
    n.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
  });
}

function ensureRendered(e){
  if(rendered[e.id]) return rendered[e.id];
  const raw = document.getElementById(e.md).textContent;
  rendered[e.id] = renderMarkdown(raw, e.id);
  return rendered[e.id];
}

function buildToc(e){
  const {toc} = ensureRendered(e);
  const el = $("#toc");
  el.style.setProperty("--ep", e.ep);
  el.innerHTML = toc.map(t=>`<a href="#${t.id}" data-id="${t.id}">${t.text}</a>`).join("");
  el.classList.add("show");
  el.querySelectorAll("a").forEach(a=>a.addEventListener("click",ev=>{
    ev.preventDefault();
    const t=document.getElementById(a.dataset.id);
    if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
    closeDrawer();
  }));
}

function openEpisode(id){
  const e = EPISODES.find(x=>x.id===id); if(!e) return;
  current = e;
  const {html} = ensureRendered(e);
  const reader = $("#reader");
  reader.style.setProperty("--ep", e.ep);
  $("#rshow").textContent = e.show;
  $("#rhead").innerHTML = `
    <div class="show">${e.show}　·　${e.eyebrow}</div>
    <h2>${e.title}</h2>
    <div class="rmeta">
      <span><b>${e.date}</b></span><span><b>${e.dur}</b></span>
      <span>主持　<b>${e.host}</b></span>${e.guest?`<span>嘉宾　<b>${e.guest}</b></span>`:""}
    </div>
    <div class="catrow rcats">${e.cats.map(c=>`<span class="catbadge">${CATLABELS[c]}</span>`).join("")}</div>`;
  const hlbox = (e.hl&&e.hl.length) ? `<div class="hlbox"><div class="lab">本集要点</div><ul>${e.hl.map(h=>`<li>${h}</li>`).join("")}</ul></div>` : "";
  $("#article").innerHTML = hlbox + html;

  // next episode
  const ni = (EPISODES.indexOf(e)+1)%EPISODES.length;
  $("#nexttitle").textContent = EPISODES[ni].title;
  $("#nextbtn").onclick = ()=>openEpisode(EPISODES[ni].id);

  buildToc(e);
  // active states
  document.querySelectorAll(".epitem").forEach(n=>n.classList.toggle("active", n.dataset.id===id));

  $("#home").classList.remove("on");
  $("#reader").classList.add("on");
  window.scrollTo({top:0,behavior:"auto"});
  closeDrawer();
  updateProgress();
}

function goHome(){
  $("#reader").classList.remove("on");
  $("#home").classList.add("on");
  $("#toc").classList.remove("show");
  document.querySelectorAll(".epitem").forEach(n=>n.classList.remove("active"));
  current=null;
  window.scrollTo({top:0,behavior:"auto"});
  updateProgress();
}

/* progress + scrollspy */
function updateProgress(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const p = max>0 ? (h.scrollTop||document.body.scrollTop)/max : 0;
  $("#progress").style.width = (p*100)+"%";
}
function scrollSpy(){
  if(!current) return;
  const {toc} = rendered[current.id]||{}; if(!toc||!toc.length) return;
  let activeId = toc[0].id;
  for(const t of toc){
    const el = document.getElementById(t.id);
    if(el && el.getBoundingClientRect().top <= 120) activeId = t.id;
  }
  $("#toc").querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.dataset.id===activeId));
}
let ticking=false;
window.addEventListener("scroll",()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{ updateProgress(); scrollSpy(); ticking=false; });
});

/* theme */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themebtn").addEventListener("click",()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark"
    : matchMedia("(prefers-color-scheme:dark)").matches;
  applyTheme(dark ? "light" : "dark");
});

/* drawer */
function openDrawer(){ $("#side").classList.add("open"); $("#scrim").classList.add("on"); }
function closeDrawer(){ $("#side").classList.remove("open"); $("#scrim").classList.remove("on"); }
$("#menubtn").addEventListener("click",openDrawer);
$("#scrim").addEventListener("click",closeDrawer);

/* wire */
$("#backbtn").addEventListener("click",goHome);
$("#totop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
$("#brandhome").addEventListener("click",goHome);
$("#brandhome").addEventListener("keydown",e=>{if(e.key==="Enter")goHome();});

buildSidebar();
buildCards();
buildFilters();
updateProgress();
</script>
