## 十三、快问快答：改变的看法、最大的错过、过热与被低估、最期待的十年

**Harry：** 过去 12 个月你改变了什么看法？

**Matt：** 就是"公司能有多大、门洛该多大胆"。我们需要自由思考、愿意承担那类风险的人，这比以往任何时候都更真。

**Harry：** 最大的错过、以及你的教训？

**Matt：** 那些我当时会当作"最大错过"的，如今已不再那么觉得。给你一个：当年我们在争 Plaid、都到"一英寸线"了却没赢（我对 Zach Perret 和这家公司满怀敬意）。当时我觉得那对我的职业和"赢的能力"是生存级打击。但它其实更多是训练了我"一次失利定义不了任何人"。如果 Anthropic 没赢那会格外痛，但重点是你得继续走、找到下一个大的；只要你聚焦对的大趋势（像我们对 AI 那样）、抢在前面，这些周期总会来。

**Harry：** 你只能各投一支种子、一支 A、一支成长基金（不能是你自己的），选哪些？

**Matt：** 种子——出于我们已聊过的原因，我不太追踪很多种子基金；但我和 Susa 的 Chad（Byers）关系很好很久了（Brooke Byers 在我做 Kleiner 时算是我的准导师之一），我很欣赏他的视角。Series A——Benchmark，我和 Chetan（Puttagunta）、Eric（Vishria）合作过、极为尊重；也很难不提 Sequoia。成长基金更棘手——如今那么多全栈 firm，很难只点一支：Lightspeed、Thrive、甚至 Sequoia 和 Andreessen。以前很清晰（IVP、Meritech，我都很尊重），现在没法再"索引"那个市场了；大概按规模——你到 50 亿美元以上，此刻大概就是支成长基金了。以前那些精品成长基金，现在都只是"成长基金"——你的 IVP、Meritech 都会去募大基金，你没法用 10 亿美元以下玩成长。

**Harry：** 现在什么过热了？

**Matt：** 机器人、neolab，也许还有国防科技——只是因为涌进去的钱太多，但这三个赛道我都喜欢。就 neolab 而言，我合伙人昨天发了条推说有 16 家 neolab（我说了我们投了七家）。有些很泛——"我们在组个乐队、要建点很酷很研究性的东西、看会怎样"；另一些像 Chai（Chai Discovery，专注造药与抗体）、Axiom（专注数学）那样非常聚焦。但外面有 60 多家这种公司。尘埃落定时会剩下什么我不知道——你不能指望所有这些公司都有很好的"人才收购（acqui-hire）"，也绝不可能有 60 家独立模型公司再加上所有开源。所以那些相对其阶段而言、融的轮次太大了，对某些 firm 是集中仓位——我觉得那是个挑战。

**Harry：** 哪里被低估了？

**Matt：** 基础设施栈上有点"假阴性"——可观测性（observability）、Agent 框架这类三四年前起步、很多公司没跑通的东西。当时问题在于大家太聚焦"单一模型"、不需要这些周边基础设施；但现在整个生态大了这么多、你在做优化、想管理支出，就需要强健得多的可观测性方案、需要 OpenRouter 这类东西。我们还投了一家叫 Gimlet 的公司——一个技术层，用来抹平底层芯片和技术栈（如 CUDA 等）。所以这块还有太多——我们两三年前开始投这块时没啥结果，现在这些公司真的起飞了。这就是我们兴奋的地方：开发者栈、基础模型之上的所有工具。

**Harry：** 最后一个：展望未来十年，你最兴奋什么？对我来说，我母亲患有 MS（多发性硬化症），我对"那些我们一直只当作'慢性病、只能接受更差生活质量'的疾病"的医学突破极其兴奋。你最兴奋哪里？

**Matt：** 我们完全为此兴奋。我们有大约八家这类模型公司——提过 Chai，还有 Xaira、Valinor（后者名称以发音为准）等一串，都在建专门做药物发现的模型。我们还投了一家做更好医疗交付（healthcare delivery）的公司。整个医疗系统我们都知道有点坏了——即便美国医疗很好，从治疗手段到工作流、到医疗系统如何运作，都还有太多能发生。这当然也是 Anthropic 和 Dario 极为珍视的使命。除此之外，我最兴奋的大概还是回到"门洛如今所在的位置"、以及我们如何用已组建的团队真正抓住这个机会——那是我职业里最有回报的事。从 AI 趋势看，这类东西每 10 年才来一次，而这一次感觉是我职业里经历的四五次里最大的一次。我们大致知道现在什么样、也大致以为知道一两年后什么样；但以这种创新速度，五年、十年后会是什么样？没人说得准。我超级兴奋能在这中间投资、和你这样的人合作——我想和你多辛迪加。

**Harry：** 这是做风投最好的时代，我感到很幸运。谢谢你，Matt，你真棒。

**Matt：** 谢谢你请我。别再等七年才请我，永远爱和你聊。

## 投资视角的关键信息点（速览）

- **Anthropic 是门洛的"世纪之投"**：首张支票约 1000 万（40 亿估值），后追加 **>5 亿美元的 SPV**（门洛首个 SPV），如今 carry 约 **100 亿美元**。逻辑："巨大市场从不被单一玩家垄断→谁是最强第二名→Anthropic"，且当时仅用约 **1/50 资本**就达到/超过 ChatGPT 的基准（"算力乘数"证明底层技术特别）。
- **Ownership 让位于"进入伟大公司"**：异常值驱动的世界里，"以很小比例待在巨大赢家里"胜过"以大比例持有 3–5 亿退出的公司"。持股比例的重要性大幅下降；稀释水平被系统性抬高（信号效应 + 人才留存的老股转让）。
- **毛利率新常态**：AI 公司普遍 **20–30% 毛利**、路径通向 60–70%（不再是 80–90%），因推理成本；提毛利靠"优化 + 自研数据/模型 + 不被单一推理成本绑死"。**判断哪些高增长公司有可信的毛利改善路径**是当前核心投资功课。
- **开源不会取代前沿（Matt 的判断）**：高价值场景 Anthropic 提升留存/营收/参与度，抵得过成本；未来是**多模型组合（如 50% Anthropic + 50% 开源/自研）**，而非开源吃掉 96%。第二浪 = "对用什么/何时/怎么用变精细"→ **路由层（OpenRouter）**成为管理与优化业务的关键基建。
- **芯片垂直整合的逻辑**：到千亿营收规模，为特定工作负载自研芯片（Jalapeño、Anthropic×三星、TPU/Trainium 先例）可显著降本；但芯片生意极难、需特殊团队、要与英伟达竞争。
- **应用层护城河 = 工作流 + 跨组织上下文**：模型能随手做的、应用不够独特的会被吃掉；Legora（法律，FDE + 跨律所/客户的复杂工作流）这类"重 GTM + 深流程"应用可防御，且需向税务/会计/合规扩张才撑得起高估值（对标 Harvey）。
- **Series A 是最糟切入点；杠铃策略**：1–3M 收入、200x ARR、几无 PMF 的 A 轮最难 → 门洛两端发力：**更早的种子**（三人当场可开 800 万美元支票 + Anthology 种子基金撒网）+ **更晚的异常值**（>10M ARR、已被加冕的赢家）。**T2D3"三三双双"已不够**——新基准是"一年 0→1 亿美元"。
- **过热 / 低估**：过热——机器人、**neolab（60+ 家，注定无法都善终）**、国防科技；低估——**基础设施栈**（可观测性、Agent 框架、路由、CUDA 抽象层如 Gimlet）此前"假阴性"、如今随生态变大而起飞。
- **地理**：**旧金山找回魔力**（AI 浪潮、人才回流，"住在湾区的上下文是别处的 10–100 倍"）；**欧洲的 grit**（DeepMind 扩散 + Lovable/Legora，"困难模式"筛出更强创始人）。
- **精品种子基金困境**：5000 万基金开 200 万支票 = "太大不能友好跟投、太小不能领投"；泳道消失、人人全栈、机构进种子的"负面信号"论已过时。
- **可对接 Leah 框架**：与 Altman/Hard Fork 的"智能商品化、护城河在算力+系统"完全同构；OpenRouter/多模型/毛利优化是应用层估值的关键变量；neolab 泡沫与基建栈低估是一级市场的配置信号。

# 那场"没有发生"的伊朗石油冲击（……暂时？）

**节目：** ChinaTalk
**主持：** Jordan Schneider（乔丹·施耐德）
**嘉宾：**
- Rory Johnston（罗里·约翰斯顿）—— 石油分析师，Commodity Context 创始人（常做客 Odd Lots）
- Arnab Datta（阿纳布·达塔）—— Employ America 政策实施常务董事，美国战略石油储备（SPR）政策专家

**日期：** 2026 年 7 月 26 日

> *整理说明：本文基于 Whisper 原始逐字稿整理，已修正 ASR 错字、还原专有名词（人名/地名/术语），按话题分章并标注发言人；口语碎句已合并为完整句子。个别发音不清之处以（存疑）标出。文中引述 JD Vance 的段落为节目原话引用，已标明。*

---

## 一、核心论点：一记被误读的教训

**Rory：** 我想在伊朗战争的背景下谈——这是迄今为止石油市场史上最大的一次供给冲击，我本人原本预期它会把价格推到历史新高。谢天谢地，为了我们所有人、为了全球经济，我们躲过了那个命运。但我担心的是：许多西方决策者——尤其是本届政府里的一些人——正从"我们避免了那种末日情景"中，汲取错误的教训。

我们实际见证的，是全球石油平衡里一次我完全没预料到的、最大的意外摆动：中国从全球进口市场的大规模收缩——每天 500 多万桶的进口需求"凭空消失"，而中国国内经济活动却没有任何真实变化与之对应。

这很重要，因为它表明：中国手里握有的"相机抉择（discretionary）"政策工具和杠杆，很可能比西方更强。西方（尤其美国）如今在"市场驱动的私营部门石油生产"上做得极好；但这场危机让我们看到，华盛顿并不具备中国、或 OPEC 那种规模的相机政策控制力。谢天谢地，这次中国合作了、至少为整体经济大局做了好事。但我们未来不能指望他们——这个工具既能为我们所用，也能同样用来对付西方。西方政府若只想"躺在私营部门的功劳簿上"熬过下一场危机，是行不通的：私营利益动得不够快，我们需要手边就有相机抉择的杠杆。

**Jordan：** 太精彩了。所以我们经历了这整场伊朗战争，曾有那么一刻，人们担心油价冲到每桶 700 美元、彻底的灾难。价格确实涨了，但我们并没有迎来那种"gamma 逼空豪华版"——就是那些气喘吁吁的 Odd Lots 播客所渲染的画面。这场"石油大灾难"最终为什么没有发生？

---

## 二、危机复盘：价格确实飙了，但为何没到"世界末日"？

**Jordan：**（引述 JD Vance 的一种说法）JD Vance 有个理论。他大意是说：*"我得把功劳归给财政部长斯科特·贝森特（Scott Bessent）和能源部长克里斯·赖特（Chris Wright），因为关于油气市场的那些末日预言之所以没成真——说清楚，我知道美国民众确实因此吃了苦，我不想淡化这一点——但最坏的那些预测从未兑现，正是因为贝森特和赖特出色地尽可能吸收了这场冲击。"*

Arnab，他说得对吗？

**Arnab：** 我觉得得先厘清几点，然后交给 Rory。第一，进入危机时我们确实看到了很大的价格飙升——价格一度上涨近 60%；在受冲击最严重的一些地区，实际交割的实货一度触及每桶 130、140 美元。所以确实有实物层面的中断，导致了价格上涨。

但更广义地说，是多种干预叠加在一起，才把价格摁在了那个"本该出现"的预期涨幅之下。其中有政府的战略石油储备（SPR）动作——进入危机前，很多分析师声称它影响甚微、我们大概放不出那么多；但实际释放水平达到了每天 140 万桶，这不是小数目，而且高于预期。你还看到运力通过东西输油管道（East-West pipeline）重新调配，填补了部分供应缺口。

而我认为最大的一块、也是副总统没怎么明说的一块，是"中国效应"——中国在"让价格保持在那些较高估值之下"这件事上扮演了巨大角色。这块我交给 Rory 展开。

---

## 三、为什么需要"史无前例"的需求破坏——以及 Rory 的自我检讨

**Rory：** 是的，这里就是我做"mea culpa（认错）"的地方——作为那些气喘吁吁的 Odd Lots 客座主持之一。三月份我确实预期原油会到 150、我想我甚至说过 200 美元一桶。

要点在于：Arnab 提到的那些东西——管道改道、SPR 释放等等——都是"已知因素"。这些是我们知道会发生、也确实需要发生的事。SPR 释放几乎是教科书式的反应，本来设立它就是为了应对这种情形。所以我们知道这些都会发生。可即便把这些全算上，也不足以抵消（相当于全球最大产油区那种量级的）供应损失。

我和其他分析师之所以预期 200 美元或更高，是因为你需要看到"历史上从未见过规模"的需求破坏（demand destruction）。如果在 120、130 美元价位我们看到每天一两百万桶的需求破坏，那我们需要的是每天五、六、七百万桶的需求破坏——这就要求一个明显更高的价格门槛来驱动这种行为。

而我（当时）没充分考虑到的是：头几百万桶的需求破坏是最容易的——你拼个车、改改通勤路线。可一旦往上爬，我们就成熟了，就是在"关停经济价值"，不只是给人添麻烦，而是经济实实在在地在"少干活"。

**Arnab：** 我们的经济在真正变得更没有生产力，而不只是市场上这里那里的 1%、2%。

**Rory：** 正是。而我们所需的需求破坏规模，堪比新冠最深时的水平——却没有"全球大流行 + 强制封锁"这个（现成的）助力。我们需要只靠"价格机制"这一根杠杆，去模拟、复刻封城才有的行为。这非常难。我当时老在问：得涨到什么价位才能回到 2020 年那种深度？答案是"油泵上每加仑得 100 美元"之类——那是个天文数字般高的门槛，你得靠极高的价格。逻辑就是这样。

但我漏掉的，是中国那次惊人的、已被证明的摆动。我们一直知道中国有庞大的燃料储备，只是不知道他们会不会动用它来帮特朗普政府（这个"为什么"我们稍后聊）。可即便在我最疯狂的梦里——正如我在 Odd Lots 第二次复盘"我到底错在哪"时说的——就算我能穿越回三月、告诉当时的自己"别担心，中国会把原油进口砍掉 45%、也就是每天 500 万桶，而中国经济不会有任何变化"，我也会觉得"你显然是个疯子"，因为那根本不可能。而这基本上至今仍是我看待此事的方式。

因为我们在中国看到的，是任何国家历史上最大的一次摆动：它"已证明"的石油消费能力与消费需求急剧收缩，而所有那些"你用油去做的事"却几乎毫无反应。新冠时我们很熟悉用一些指标追踪流动性——城市交通拥堵、航班、中国高速公路上的卡车数量……所有这些"中国境内流动性"的基本代理指标，几乎都没怎么动，尽管在纸面上、在我们的石油平衡表里，中国看起来像陷入了深度萧条（depression，不是衰退 recession）级别的低消费。我们记录在案的、唯一能与这种炼厂开工收缩相提并论的，是 2022 年"动态清零（COVID-Zero）"最深的时候。我在 Odd Lots 上就跟 Joe（韦森塔尔）说：你们不是刚去过中国吗？你看到整个国家封城了吗？答案是"没有"。这就是它诡异的地方。

我们能确定的、以及此后我说的一切都更偏"推测"——唯一确定的是：中国把原油进口砍了每天约 500 万桶（大致相当于 OPEC 一次大规模集体减产的量级），并压倒性地解决了这一时期亚洲现货市场约三分之二的缺口。这是唯一确凿的。另一件大体确定的是：中国国内"可见的"原油库存并没有相应下降来解释这次进口的减少。

**Jordan：** 所以基本上，世界濒临危机，中国却"停止从世界其余地方喝油"、转而打开自己的水龙头，就这样把局面稳住了几个月，直到世界腾出手来（应对霍尔木兹的问题）。

**Rory：** 而且我得说，中国至今仍在少进口每天 500 万桶——这事还没结束，仍在进行，这才是更疯狂的部分。如果只是"某个月砍 500 万桶、然后反弹回来"，我还能理解；可我们现在已经是"减了好几个月"，仍无官方说法，流动性也毫无变化。

---

## 四、他们到底怎么做到的？——表观需求与三个"黑箱"

**Jordan：** Rory，我们过一遍几种理论吧。其实"某人给习近平递个数、问他想在山体和盐穴下面存多少石油，他回来说'不行，我们得把这个乘以 20'"——这在我看来一点都不意外，过去十年发生的正是这个。但除此之外，这一行的人还在想些什么、这套动态到底是怎么跑起来的？

**Rory：** ChinaTalk 的听众都清楚中国经济数据的种种特异之处，但这里有些重要细节。我们其实没有中国石油需求或成品油需求的官方数据，也没有库存的官方数据。我们有的是炼厂开工率（可见报告），以及贸易数据（海关报告 + 我通过油轮追踪数据独立核验）。

基于这些，我们在中国通常用的是"表观需求（apparent demand）"：本质上是炼厂产出（比如汽油产量）扣除净贸易后的量，衡量这种燃料在中国经济内的"国内消失量"。但难点在于库存数据很差——库存这块是个大黑箱：高需求可能被"库存累积"对冲，而像现在这种低需求可能被"库存大幅提取"对冲。

我们能确定的是：进口每天减 500 万桶，但炼厂开工只减了每天约 300 万桶（同样是自 2022 年清零以来最陡的收缩）。这就已经有约 200 万桶/日的原油"差额"——这多出来的原油去哪了？我们没看到它来自"可见的商业储罐"。

理解数据怎么来的很有帮助：因为没有官方数据，我们用卫星影像去看储罐的"浮顶（floating roofs）"——顶盖相对上方走道（catwalk）有多高，就能粗略判断罐有多满。而这些浮顶罐直到最近仍比危机前更高，所以这不是答案。中国确实有地下的原油战略储备（SPR），按定义没有浮顶。到底有多少是推测的：我们已知的官方数字是六个地下洞穴、约 1.31 亿桶产能，实际很可能更多。这就是"一号嫌疑对象"——它可能被提取了，而我们无从得知。

再看"表观需求"（炼厂产出扣贸易）：它同样出现了 2022 年以来最大的收缩，而流动性数据没变。问题是：中国没有官方库存数据，且大多数成品油不存放在浮顶罐里，所以中国的成品油库存（商业 + 战略）是个巨大的黑箱。

还有一个"理智核验"：前面说了，要压出巨大的需求收缩，你需要高价。而北京在这场危机里做的一件事，是通过其常规的燃料价格监管程序，限制了国内油泵价格的涨幅——尽管危机中全球油泵价、汽油和燃料价格大约翻倍，北京的油泵价只涨了约 30%。可 30% 的涨价够不够解释"新冠级"的需求萧条？看起来不太可能。但它确实做到了一件事：由于原油仍昂贵、而国内价格偏弱，炼厂的炼油利润（refining margins）崩塌了——所以我们看到的炼厂减产，有一部分可以用经济逻辑解释。但我们仍不清楚流动性是怎么维持住的。

所以最可能的"奥卡姆剃刀（Occam's razor）"解法是：北京除了有原油 SPR，还有充足的成品油战略储备（汽油、柴油、航空煤油）。这样一来，你把炼厂关掉一大块，贸易走廊因整个亚洲都在危机中而基本封顶，然后你就开始把这些储备燃料放到市场上。

我们此前就怀疑中国有成品油储备。我在 2023 年写过一篇叫《中国石油需求：异数（Chinese Oil Demand...）》（原标题 ASR 不清）的文章，讲的是从清零走出来后，中国出现了任何国家历史上最强的石油需求同比增长——这很奇怪，因为 2023 年中国整体经济看起来并不强、仍在清零后挣扎，可"历史新高的成品需求"说不通。所以我当时就说：你可能看到的是汽油、柴油、航煤等战略储备的累积——它们会以"表观需求"的形式出现，因为我们看不到那些库存。当时"一号嫌疑"是：这是在为跨越台湾海峡的行动做准备（2022–23 年正是北京在台湾空域军演、海上演习最咄咄逼人的高峰）。但现在看，这可能是在为我们如今所见的这类灾难做准备。

当然还有别的腾挪空间：石化供应链的弹性——提取中间石化品而非成品油，或改用天然气、煤基化工原料而非石脑油（naphtha）这类油基原料。边角上有很多可微调之处，但很难凑够每天 500 万桶。所以"怎么做到的"，最可能是他们同时打了所有这些牌，其中很可能包括我们看不见的、向系统注入战略储备——因为数字实在太大了。

说个尺度：中国"前三个月平均进口速度"（去年 12 月到今年 2 月）与"截至 6 月累计的原油进口减少量"之间的差额，大约是 4.5 亿桶。当我们稍后谈别国已知的 SPR 注入时——4.5 亿桶比整个 IEA（国际能源署）集体储备的释放量还要多。

---

## 五、2008 的回声：中国"不衰退"如何救了世界

**Jordan：** 这让我想起 2008 年。当时全球衰退，美国拉了些刺激杠杆（还算凑合），然后就是那个大问题：中国会怎么做？中国的经济决策者（这还是习之前）基本决定："不，我们不像其他人那样搞衰退，我们要搞一场世界前所未见的最大建设狂潮，把派对继续办下去。"这让 2009 到 2013 年对美国和世界其余地方都愉快了很多，因为你得到了一大注"实物刺激"。所以特朗普该感谢习近平的地方，比他以为的要多。

**Rory：** 而且未必只是"更好"。因为（在 2008 年）他们并没有这种能平滑危机的杠杆和储备。而这场（伊朗）战争，本可能以比现在更快、更糟的条件收场——因为中国经济决策者一如既往地不愿面对任何经济收缩（只要他们有可控的杠杆）。这里对研究中国的学者有很多有意思的"二阶影响"，关乎未来中国经济决策，我先不逼你和 Arnab 回答，暂且搁置。

**Arnab：** 我快速补一句：Rory 拆解了这对石油市场意味着什么；而在危机头几个月，LNG（液化天然气）市场也是如此。给你一个有启发的数字——我想是 4 月：到 4 月，中国已向东南亚国家转售了超过 100 万公吨的 LNG 货物，这个数字截至 4 月就已经远超 2023 年和 2025 年全年的纪录。所以这不只限于石油市场，天然气市场同样如此。

---

## 六、美国这边：SPR 的"交换"机制与 Life Extension II

**Jordan：** Rory 讲了中国能对准能源与大宗市场的那门"火箭筒"的规模。那么伊朗战争爆发时，（能源部长）赖特手里握着什么？行政和立法部门应从中吸取什么教训？

**Arnab：** 我想强调几点。尽管我对这场战争本身及其部分执行有所保留，但一旦本届政府决定参与这次全球性释储，我会说执行得相当好。

第一，如我所说，他们能释放到每天 140 万桶——高于许多人的预期，也高于俄乌危机期间释储的峰值。这是一个名为"延寿二期（Life Extension II）"的十年投资计划的成果，它升级了多个设施。SPR 有四个储存点，其中两个最大的在这段时间完成了延寿二期升级；改造期间某些点位是关闭的，反而限制了当时的可释放产能。所以第一点：他们能释放得比预期多，正因为我们投资了 SPR 基础设施。

第二，虽然我们（包括我）一直用"释放（release）"这个词，但这次严格说不是释放，而是一次"获取（acquisition）"。能源部（DOE）这次动用的权限叫"交换（exchange）"：你把产品放到市场上，本质上是"借给"中间商，他们再卖入市场；但这些与 DOE 签约的方，承诺日后把"等量的桶数 + 一笔溢价"还给 DOE。所以这本质上是一笔获取交易，只是归还发生在未来。自三月开战以来 DOE 放油给的所有各方，都得连本带溢价归还。危机初期这些溢价非常高，反映了一个高度"现货升水（backwardated）"、极度紧张的市场——中标的公司要向 SPR 归还高达 20%–25% 的溢价，从今年 11 月起一直到 2028 年。

第三，通过这个交换机制他们证明了：你可以"奖励那些愿在另一头给你更多的签约方"。他们把交换设计成——现在拿到桶的公司，正是那些承诺在另一头给最高溢价的。于是签约方之间形成竞争：不仅要承诺列明的 22% 最低溢价，还得再加价（2%、3%、8% 不等，具体数字不公开）才能中标。所以现在想从 SPR 拿油，你就得承诺更高的溢价——这在交易商等签约方之间制造了一种竞争性动态。我觉得这里有些真正值得称道的创造性。

最后一点：结合 Rory 关于"中国某种形式释储"可能性的精彩分析，总的结论是——战略储备是有用的。人们普遍对战略储备很悲观，但这次表明：当你把这类基础设施、连同其他"摆动"基础设施（美国的管道等）一起建起来，你拥有的摆动产能越多越好。Rory 有一张著名的图——油轮改道交付的图，总统转发后爆火——所有这些都说明：这类基础设施正因这个理由而值得投资。油价没有涨到那个"真正有害、导致经济活动萎缩、被迫关停制造业"的需求破坏水平，这是个成功故事。但它在很大程度上是因为"中国"而非"美国"才发生的——这一点，对未来政策也是需要深思的。

## 七、战略储备到底有没有用？——冗余 vs 效率

**Jordan：** Rory，关于"手上多备点东西"的用处，你有什么反思？

**Rory：** 我完全同意 Arnab。我一直是"冗余（redundancy）"基础设施的拥趸。我这辈子大部分时间看到的，是一种"以牺牲冗余和灵活性为代价、无休止追求效率"的倾向。而过去至少五年（可能更久）我们看到的，是能想象到的每一条供应链都遭遇了前所未有的冲击。

这次我们非常非常走运：进入危机时，我们几乎处在有史以来"库存最超配"的状态——此前一年市场是过剩（glut）的，一切都尽可能地好。可即便如此，若不是中国，我们仍会陷入"深深的痛苦世界"。

关于中国这块，另一个值得停留的点是：我们谈了很多"怎么做到（how）"，而另一个更大、也更令人不安的问题是"为什么（why）"。"怎么做到"我们还有很多疑问，但至少有点数据引路、知道什么是合理的；而"为什么"则完全开放。我已经攒了一个"他们为何这么做"的小目录，有些较为乐观，有些则是深度"锡纸帽（阴谋论）"级别的。我很想听听你的想法，Jordan——毕竟你花大量时间研究中国和中国决策；这事虽然在某些方面说得通（像 2008 年），但也有一些比"直接类比"更古怪的元素。

---

## 八、"为什么？"——利他、幕后交易、还是保命？三种解释的博弈

**Rory：** 第一种解释：这是一次"利他（altruistic）"之举——这是最乐观的解释，同时带一点自保成分。基本逻辑是：东亚和欧洲是霍尔木兹冲击下受创最深的两个地区；而得益于页岩革命、加拿大油砂，北美会比世界其余地方受到远为充分的隔离。我们知道中国正处在与美国"长期的贸易脱钩"中、试图分散对美市场与美国消费者的依赖；如果你想分散、你真正剩下的另一些选项就是东亚和欧洲。那么，任由这些地区因霍尔木兹陷入萧条，长期看并不符合你的利益。问题在于：如果北京是以"白衣骑士"的姿态入场、宣告"特朗普抛弃了你们，而我来拯救你们"，那它多半会借机多多炫耀一番、广播自己的"全球治理"担当。可它没有。所以这可能，但未必是完整答案。

第二种（更令人担忧）解释：我们知道特朗普政府在危机期间高调国事访问了北京。当时看似没什么成果、令人失望——贸易上没有大宣布，人人期待习近平"洪亮地"背书重开海峡（霍尔木兹）供应，我们没等到。所以它看似失败。但万一它不是失败呢？万一在北京有某种幕后交易："在霍尔木兹这件事上撑我们一把，我们知道你手里有大把油，撑我们过去，我们就给你办件事"。那件事是什么？最明显的答案总是回到台湾和地区地缘政治。这段时间，由于伊朗战争头一个月美军装备在中东的巨大损耗，你看到美国从亚洲抽调了大量军事装备——无人机、导弹防御、雷达系统——这些在跨越台湾海峡的行动中本会非常好用。这也呼应了那个"门罗主义（Monroe Doctrine）"式的论点：特朗普要西半球，把欧洲、把欧亚大陆留给莫斯科——

**Jordan：** 我在这儿打断你。

**Rory：** 请。

**Jordan：** 我觉得（第三种）"维稳（crackdown）"解释大概是最简单的。如果有人给习近平递一张图、说"你不拉这根杆，我们就得重演新冠封城"，他就会说"好，我们拉这根杆"。"防止国内经济崩溃"基本上一直是过去（就从 2005 年左右开始算起吧）中国所有财政货币决策的"最高指令（prime directive）"。所有那些二阶影响——战争更长还是更短、这对美国防务态势意味着什么——都是那个中心关切的下游产物：也就是你在开头提到的、油气"gamma 逼空"对经济活动可能造成的灾难性冲击。一旦你决定"我们不让这事在中国发生"，那它就带来了"价格更低"的全球性后果。我相当有把握：如果说他们是为了某种"这真能把美国坑惨"的四维象棋（4D chess）而在那个时刻主动承受经济痛苦，我会非常震惊。

**Rory：** 那我可以反驳一下吗？如果真是这样——那么，第一，我们知道中国自油价还在 90 年代（每桶 90 美元）时就有胃口建原油储备，他们为什么会停止购买？为什么会自愿地、单方面地、在"人人都承认'把特朗普推向结束战争'的主要途径就是市场价格反应"的时刻，把这条辛苦攒起来的巨大能源安全毯给掀了？北京挺聪明的。我最初以为北京不会来救场，正是因为：他们知道自己有国内储备、本可以只隔离自己。可他们做的远不止隔离自己——他们从整个全球石油市场"退了出来"。所以问题是：如果你攒起了这么一笔巨大的能源安全资产，你为什么要在一个"完全由糟糕的美国外交政策驱动"的时刻，把它全押上去？为什么不隔离自己、任由局面给美国制造痛苦？他们本可以只保住中国国内的消费，而不必去补贴台湾的进口、韩国的进口、澳大利亚的进口以及其他一切。这一点我更难理解。而且，即便真是（维稳）这么回事，为什么他们至今仍不买油？我们本该看到他们在更高价位买得更多。所以这对我就是过不了"嗅探测试（smell test）"——除非它是一门"拯救中国经济"的火箭筒。至于"政策惯性、闸门一开就关不掉"——也许说得通，但我斗胆认为，他们做的远超所需，是"只救中国经济本身"所需量的大约三倍。

**Arnab：** 那东南亚呢？我这里有个问题——我大概更偏向 Jordan 的解释：也许他们能隔离本国消费，但东南亚国家的痛苦，不也间接是问题吗？那些国家的经济对中国很重要，而它们现在还有个疲弱的房地产板块。如果 Jordan 说得对——"经济就是一切、现在就要保经济"——那么，你固然能保住内部消费；但如果东南亚各国因得不到保护而陷入巨大衰退，那对中国经济也会有负面影响。所以在我看来，这不算"利他"，仍植根于自身利益，但确实是"我们需要帮这些国家，来对冲全球衰退"。

**Rory：** 是，这仍是我的基准假设（也是我列的第一种解释），但它留下的问题比它回答的还多。我再补一个"非美国版"的、不那么乐观的解释：中国明确是为"马六甲困境（Malacca dilemma）"那类未来（万一与西方冲突时的能源自保）而攒这条能源安全毯的。那么另一种解释是——万一这是全球最大规模的一次"实弹演练（dry run）"？北京在试验这套政策组合到底管不管用。你怎么可能人为造出一个"模拟马六甲被封锁"的情景？突然失去霍尔木兹，就是一个相当有意思的天然实验："来，试试这套系统——能不能弹性调度石化、能不能释放这些储备、能不能把中国从海运市场隔离出来？"坦率说，答案被证明是"能"。

无论"为什么"如何，其含义是清楚的：他们已展示出比沙特、比美国、比世界上任何其他国家都更大的、在全球石油平衡中的"摆动产能（swing capacity）"。我们一直说中国主导能源转型产业（光伏、电池等等），并在那个框架下认为北美凭页岩革命在化石燃料上占优。而这次相当明确地证明了：SPR 是一种"相机抉择"的政策工具——华盛顿并不控制页岩产区（Shale patch），而北京控制着中国当下正在发生的一切；他们非常清楚地展示出，自己在化石燃料市场上的相机抉择权，远大于几乎整个西方集体。这是个相当惊人的结果——因为他们并不"生产"这东西。诡异之处正在于此：这不是"在西德州多钻几口井"那种市场力量的下游产物，而是一个已经做出的决定，是几十年之功，才让这套工具能在危机中被拿出来用。

**Jordan：**（回到"至今仍不买"）我觉得"关水龙头太慢"这件事，大概就是"我们抓着这东西抓太久了"这个奥卡姆剃刀式的解释。这就是中国式"运动式（campaign-style）"决策：目标一旦设定，人人朝它冲，然后就冲过了头。所以那里也许没那么多马基雅维利式（Machiavellian）的算计。

## 九、危险的保险单？——"给飓风带的人卖洪水险"

**Jordan：** 一个结论是：美国若也能对能源市场（乃至稀土等）做这种危机平滑，会挺好。但我能想象另一个结论——某些即将掌控众议院的民主党人可能会得出："这（战略储备）等于是在纵容行政部门发动我们不赞成的战争。给自己织一条更大的安全毯、让'我们认为愚蠢的海外冒险'的经济痛苦不那么快袭来，反而会导致这种事更多、而非更少发生。"你怎么看这种"危险的保险单"——就像给飓风带里的人卖洪水险，而非审慎的宏观经济管理？

**Arnab：** 我觉得确实存在这种张力，你在关键矿产（critical minerals）领域也能看到本届政府类似的做法——极其积极地动用工具箱，方式上可以说在法律上很有"创造性"，肯定在推行政权限的边界。于是有人会说"这一切都是在为一个推行非法、腐败政策的政府服务"。但我认为，"因此就去限制这些工具"的推动是极其误导的。

我只需回到三四年前——2022 年俄罗斯入侵乌克兰——那完全不在我们控制之内。而且（回到我们上次的对话）一个区别是：当时全球社会几乎是"哀求"中国从其原油储备里释放，结果中国反而继续采购、在市场极度紧张时还加码需求。我们不能指望这些外部力量。所以我会说：每一种"因为最坏情景就去限制某工具（包括 SPR）"的本能，也会急剧削弱你在"并非你自己造成的真正危机"中使用这些工具的能力。你没法把一个工具设计得完美契合你偏好的政策结果、又把所有坏结果都最小化——世界不这么运作。特朗普是民主选举产生的，是他选择卷入这场战争。这其实是国会（在战争权力上）严重"失守其权限"的地方（《战争权力决议》）。但选择去限制一个对宏观经济与经济稳定极其有用的工具，在这些扰动日益增多之际，会是非常非常误导的。

这已经是过去六年里的第三次扰动了：先是新冠（一次下行的价格冲击，但后果巨大，重创了我们国内的页岩板块、造成了紧张，进而让俄乌危机更糟）；然后是霍尔木兹；再往前还能追到沙特发起的价格战。这如今是我们日常生活的一部分。手里有工具，好过没有。我们可以再谈这类工具的"护栏（guardrails）"、如何用立法设护栏，但去限制它们会是非常误导的。

---

## 十、SPR 是双向工具：空仓的"相机买入"能力同样值钱

**Rory：** 我接着 Arnab 说——他和我过去几年在 SPR 这个议题上做了很多工作。我们（2022 年后）最初谈的一点是：SPR 是一个"双向工具（bi-directional tool）"。我们总是从"抵消供给冲击、增加供应以补足损失"的角度谈它。但正如这次所见、也被反复提到——中国一直在为其 SPR 大手笔"抢购"石油，这在全球消费尤其疲弱的时刻（如新冠期间）表现为"有效需求"，同样是一种稳定因素。

OPEC 之所以一直是全球石油市场的重要角色，正是因为——比"高油价"更糟的，是"暴涨暴跌的油价"，因为真正带来最恶性经济后果的是波动性。OPEC 好用之处，在于它能在高价时增产、低价时减产。但我们看到，OPEC 在可靠地完成这份工作上越来越糟；而中国反倒被证明是一个更可靠、更"技术官僚式"的管理者——很像旧时的 OPEC——是这些暴涨暴跌周期更有效的管理者。

我认为美国 SPR 能扮演类似角色。所有"现在就把 SPR 灌满到顶"的推动，和"把它抽干、彻底替换掉"的推动一样误导。空置的 SPR 产能、那种"相机买入"的能力，在很多方面和"相机卖出"的能力一样宝贵。

**Arnab：** 我接一句：我们经历了页岩革命、成了世界最大的油气生产国，但我们对这个"全球市场"仍然脆弱。而正如 Rory 所说，它正变得更波动、更不可预测，OPEC 不能再被指望像过去那样稳定市场（哪怕是出于其自身利益）。所以真正的问题是：我们想不想把这种韧性建进我们的经济、以及为此需要做什么。

我们得正视美国页岩产区的现实：我们没有沙特那种低成本产能——沙特之所以是最有效的摆动生产者，正因为它能以极低成本极快地提升产能，反之亦然。而我们的摆动产能在页岩里，新投资要 6 到 12 个月才能提上来，这意味着在这种冲击里你会受限。但我们也有一种以"已钻未完井（DUCs, drilled uncompleted wells）"形式存在的摆动产能——它们大约四周就能提上来。问题是：DUCs 曾经数量很多，如今在二叠纪盆地（Permian basin）处于历史低位。如果我们能把 SPR 获取或其他政策支持，导向"增加 DUC 产能"，就能在这类危机中更快地提升产量。所以这里的政策工具箱会长得不一样，某种程度上是补贴企业以缓释风险。但我们必须在更大的图景里想这件事：我们未来想不想受制于 OPEC、中国？我认为不想。把我们对那种波动性（或中国自利行为）的暴露最小化，是一个值得追求的政策目标。

**Rory：** 我快速接一句强调 Arnab 的话：北美（美国）在"市场基础上"显然是全球能源强权，但要记住，它完全由市场力量驱动，而非相机抉择的政府政策。而中国正在发生的，至少在我看来，主要是一种相机抉择的政策选择——一个政府的选择，可以有益，也可能在另一个世界里对西方是恶意的或无益的。OPEC 也一样。在石油市场文献里，"树敌"、把 OPEC 描成"邪恶"，和石油政策一样古老；从没人真信过"西方和 OPEC 的利益是一致的"，如今更是如此——毕竟 OPEC+ 实际上第二强的成员是俄罗斯，显然与西方利益不一致。

所以当我们谈"西方要有相机抉择的能源政策"时，这正是必须进入 SPR 讨论的地方。加拿大、美国当然是绝对的能源巨兽，西方在"非 OPEC 石油产量增长"上遥遥领先，部分原因是我们的市场体系让私营主体去承担这些风险。难点在于：过度依赖市场驱动的私营主体，会限制政府在关键时刻真正推动改变的能力——因为市场在危机中"掉头"总比 OPEC 或北京慢，正如这次所见。

## 十一、其余世界的觉醒：印度、海湾国家与"人人建储备"

**Jordan：** 那其他所有国家怎么办？他们是不是就完蛋了？

**Rory：** 这次危机中我们看到的一点是：很多没有 SPR 的国家……正如 Arnab 提过的，SPR 曾一度"不酷了"——大家都想甩掉它，觉得"我们有能源转型、要电气化、不会永远有石油危机"，纷纷退场，然后在这次危机后深深后悔，尤其在亚洲。很多经济较不发达、较不富裕的亚洲国家，在 1970 年代（许多 SPR 最初建成时）没有同等的经济与国家能力，错过了那波建设浪潮。

最突出的是印度：印度进入这场危机时没有大型 SPR，成了"人间痛苦的震中"。因为印度不仅像世界其他人一样用燃料搞交通等等，还有——印度石油总需求里约五分之一到四分之一其实是 LPG（液化石油气）做炊事燃料；而按马斯洛需求层次（Maslow's hierarchy），做饭一般比开车更重要。所以危机后，新德里（New Delhi）已强烈初步表态会建 SPR，而且已经确认：印度政府与阿联酋国家石油公司 ADNOC 将在印度合建一个约 5000 万桶的联合 SPR——既服务印度，也让阿联酋的原油与成品油存放在霍尔木兹"安全的一侧"。海湾产油国自己也想把油放在霍尔木兹之外，会效仿沙特阿美（Aramco）的做法，在世界各地设"驻点库存"，以在中断时维持供应。所以印度是这波里第一个大玩家，但你会看到全世界很多曾经没有 SPR 的国家，在这之后都会想要。

---

## 十二、海湾的清算：绕开霍尔木兹的管道、Fujairah、无人机防御

**Jordan：** 我们聊聊海湾的反应。看世界杯时我一直看到 Savvy Games Group 的广告——就是（沙特）PIF（公共投资基金）买下全世界每一家游戏公司。这些人什么时候才不去买曼联、转而去买无人机防御、建新管道和炼厂？这对整个地区难道不是一次巨大的清算？

**Rory：** 我们已经看到一些了。特朗普政府从海湾国家榨取的那些华丽投资承诺，如今基本都"缩水/搁置"了，因为有更紧迫的事。他们确实正在建更多基础设施，以增强对未来伊朗威胁的韧性——显然试图绕开霍尔木兹进行贸易，虽然你没法完全绕开（它太大了）。东西输油管道（East-West pipeline）这次被证明极其宝贵，肯定会扩建；阿联酋的 ADCOP 管道（阿布扎比原油管道，连接海湾一侧与阿曼湾一侧的主要调和港 Fujairah / 富查伊拉，即阿联酋东侧）本就在"双线化/扩容一倍"的过程中，已完成约 50%，危机中理所当然地加速了；此外他们还宣布再建一条成品油管道（可输柴油、汽油、航煤等）。人人都会这么做。

难点在于：他们同时还得投入海量的无人机防御、反导等等——因为伊朗施加控制最容易的方式固然是威胁霍尔木兹海峡的通行，但阿联酋通往 Fujairah 的那些管道，Fujairah 本身在这次危机中就被多次袭击、轰炸，伊朗显然也能打击这些其他资产、以及给管道供油的上游油井。所以伊朗作为威胁永远不会消失。他们都会试图绕开霍尔木兹多元化，但会更贵：即便你要付一笔巨额通行费——一艘载 200 万桶的 VLCC（超大型油轮）付 200 万美元过路费，也没人愿意，可那相当于每桶 1 美元，而霍尔木兹一向是免费的；而你绕开霍尔木兹建管道，每流动桶的成本不会低于 1 美元。走天然水道永远更便宜。所以难点是：这全是他们要付的"战略保险"，但需要时间、代价高昂、且不会立刻带来回报。

---

## 十三、下一场危机会被"抹平"吗？——流动性、协调与 Biden SPR 的教训

**Jordan：** 回到"印度和世界其余国家都想建自己储备"这个想法——我们是不是又有了一个 2008 式的回声：人人都说"哇，我们得囤一大堆（美元 / 石油），这样将来就永远不会出事"？有没有一个世界，下一场危机时人人都有足够的自家储备，于是你得到某种"中国式平滑"的版本——毕竟中共超级偏执、远在能源安全"变酷"之前就已在担忧？这种"缓冲不只靠美国来提供、而是全世界都入场"的趋势，能走多远？

**Arnab：** 有一点很重要：在石油市场的语境下，这些战略储备是建立在一个极其发达的市场基础设施之上的——这是世界上流动性最好的高质量市场，也许是除美元之外流动性最强的市场。所以要理解：正因这个市场如此发达，其中已内建了韧性。战略储备极有帮助，但尤其在这类"尾部风险"事件（巨大损失、你想做一次大块头的释放）中最有用。石油储存——尤其到了成品油这一层——非常昂贵、也困难得多：原油更易储存、更适合长期，成品油容易蒸发。你能投资这类基础设施，但代价很高。而且你也无法总是预测哪个市场会被扰动。所以我们当然会看到"建更多韧性"的推动，但一个国家很难建起足以隔离全套冲击的产能，因此这里有一部分需要协调、并支持那些更"私营"的韧性努力。

**Rory：** 这正是我和 Arnab 谈得很多的：如何搭建那套框架、那种"这些储备如何嵌入系统"的经济学理解。因为对这类思路，一个正当的批评是：私营部门本来就在做这件事——吸收波动、持有库存、跟随经济激励，而且做得比政府好得多。

而我们这次（以及我对拜登政府 2022 年 SPR 释放的主要批评）看到的一点是：那次释放对市场信号不够敏感。2022 年 4 月官方首次宣布时我是赞同的；但等它在三季度末全力铺开时，危机其实已基本过去，SPR 释放反而在给一个"已供过于求"的市场加油、几乎"顺周期"地加剧了波动，而非扮演"最后供应者"。所以如果 SPR 政策要真正有效、并很好地嵌入一个更大、更动态的私营库存与商储系统，我们需要更好地思考一套"基于规则、对市场（以业界理解市场的方式）更敏感"的机制，而不是把它当成一门"火箭筒"。回到你我之前说的"政策惯性"——中国有政策惯性的问题，我们这里也一样：如果我们本该在瞬息万变的市场里精细微调、抹平波动，就不能出现"哎呀我们已经按了按钮，之后无论发生什么都收不回来了、因为一开始太难启动了"的局面——这正是我对拜登政府那次的理解："启动这次大释放太难了，我们不打算半途退出。"在人性层面我理解，但我们其实没必要抽到 2022 年那个水平，因为大部分抽取都是在价格已重新自由落体时做的，那阶段就是"好事过了头"。

---

## 十四、尾声：石油分析师的性格、AI 恶搞歌

**Jordan：** 最后问你，Rory——Arnab 属于那种"DC 政策圈中位数"的能源人；那你呢？在其他大宗商品分析师里，你是不是某种异类，还是大家性格都跟你差不多？

**Rory：** 但愿不是（为他们着想，笑）。要说我对这件事的看法——这次危机的讽刺在于：因为它，大家都把我认成那个"警报式咆哮的永久看多者（perma-bull）"，"天哪他上 Odd Lots 喊 200 美元原油，肯定疯了、肯定一直看多"。可我进入今年时其实极度看空原油，我预期会有大规模过剩、没预期伊朗战争会发生、也没预期霍尔木兹海峡会被封。我的看法是：这是任何人能想象到的、石油市场最大的一次冲击；而我们避开了最坏后果，这对全球系统其实很"讨喜"。只是作为分析师，我们至今仍不完全理解"我们到底怎么做到的"、以及"北京为什么帮了那么多"，这让人深感不安。

**Jordan：** 精彩。最后一个：油气行业的"典型（modal）"首选音乐流派是什么？

**Rory：** 我不知道……我是个糟糕的千禧一代，爱那种所谓"跺脚拍手（stomp-clap）"的音乐——比如 Arcade Fire 之类（加拿大血统嘛）。我们该整一首 Arcade Fire 风格、AI 生成的歌，也许《Rebellion》或《Wake Up》。现在我不能用真歌了（会被标记版权），只能自己做，于是我做这些 AI 歌——其实是我如今产出的最好作品（笑），都是些讽刺歌。我发你几首我们较新的，现在都在 Spotify 上了——"ChinaTalk Records"，欢迎捧场。

**Jordan：** 真的很好玩，是日常里不错的一次调剂。聊多了 AI，你会忘了世界上还有些"棕色黏稠"的东西，而世界仍靠它运转——这就是那种黑色的……（节目结束）

## 投资/宏观视角的关键信息点（速览）

- **核心结论**：2026 伊朗战争是石油市场史上最大供给冲击，却未引爆末日价格——**主要不是靠美国 SPR 或页岩，而是靠中国单方面把原油进口砍约 500 万桶/日（约 45%）**，且中国国内经济活动、流动性指标几乎无变化。
- **中国的"相机抉择权"已被证明 > 整个西方**：北京在化石燃料市场的酌情控制力超过沙特、美国和任何国家——这颠覆了"北美凭页岩在化石燃料上占优"的旧框架。美国是**市场驱动**（页岩，慢半拍），中国是**政策驱动**（可瞬间掉头）。
- **"怎么做到"仍是黑箱**：最可能是地下原油 SPR + 看不见的成品油战略储备（Rory 2023 年已预警）+ 石化原料腾挪同时发力；累计进口减少约 4.5 亿桶，超过整个 IEA 集体储备释放量。
- **"为什么"三种解释**：①利他/自保（保东亚欧洲这两个可分散依赖的市场）；②幕后交易（台湾/军备转移，门罗主义）；③维稳保命（"避免重演封城"是中国决策最高指令）。Rory 倾向①但存疑；Jordan 倾向③。**至今仍未恢复进口**——可能是运动式决策"冲过头"。
- **SPR 是双向工具**：空置产能的"相机买入"和"相机卖出"一样值钱；把 SPR 灌满到顶与抽干到零一样误导。中国的"抢购式建储"在弱需求时也是全球稳定器。
- **OPEC 稳定功能在退化**，中国反而更像"旧时的 OPEC"（技术官僚式管理暴涨暴跌）；OPEC+ 第二强成员是俄罗斯，与西方不一致。
- **全球"人人建储备"新趋势**：印度（此前几乎无 SPR、是"痛苦震中"，LPG 炊事燃料占需求 1/5–1/4）已联手 ADNOC 建 ~5000 万桶联合储备；海湾国家加速绕开霍尔木兹的管道（East-West、ADCOP 扩容、Fujairah）+ 无人机/反导防御——**战略保险成本高、见效慢、不即时回报**。
- **风险叙事**：这是六年内第三次能源扰动（新冠→俄乌→霍尔木兹）；波动性（而非单纯高价）才是最伤经济的变量。美国页岩摆动产能受限（6–12 个月），DUCs（~4 周）在二叠纪盆地处历史低位——政策或转向补贴增建 DUC。
- **对市场的含义**：中国的能源"火箭筒"既可为全球稳定所用、也可反过来对付西方，未来不可依赖；关注中国进口是否恢复、印度/海湾建储进度、DUC 政策、以及 SPR"交换"溢价归还窗口（2026 年 11 月起至 2028 年）对远期曲线的影响。

**Kevin：** 本周最抓我注意力、我特别想跟你聊的，是 OpenAI 与 Hugging Face 的这件事：一个"失控（rogue）"的 AI 智能体，实施了一场我认为可以相当准确地称为"自主网络攻击（autonomous cyber attack）"的行动——而且可能是我们有史以来第一次真正有后果的自主网络攻击。

**Casey：** 对，这属于那种"忧心忡忡的旁观者警告了多年"的事，然后周二我们得知它真的发生了。先做披露：我为《纽约时报》工作，它正起诉 OpenAI、微软和 Perplexity；我的未婚夫在 Anthropic 工作。

好，这事其实始于上周：AI 开发平台 Hugging Face（一个可以托管开源模型、跑模型评测、还能"抱抱你的脸（hug your face）"的大网站）披露，他们遭到了一次网络攻击，写了一整篇博文，讲他们如何侦测并回应了这场针对其生产基础设施的神秘攻击。他们当时并不知道攻击者是谁；只是猜测这是个自主 AI 智能体——因为它太老练、太执着，人类很难实施这样的攻击。他们用 AI 做防御，侦测出情况并制止了它。而本周我们得知了真相，比很多人预想的还要疯狂。

**Kevin：** 是的。Hugging Face 的 CEO Clément Delangue（克莱芒·德朗格）周二在 X 上发帖说：我们上周就怀疑这次攻击可能来自某个前沿实验室（因为智能体太老练了）——结果确实如此。我们过去 24 小时与 OpenAI 团队密切合作，基本查明：OpenAI 有一对协同工作的模型，攻入了他们的系统。

**Casey：** OpenAI 当时在内部测试 GPT-5.6（其最新模型）以及一个更强大的、尚未发布的模型。他们把这些模型放在一个叫"沙盒（sandbox）"的容器里运行，对外部世界的访问基本受限。他们跑的评测叫"exploit gym"——本质上是让模型闯关，看它们能否黑进/利用各种网络安全挑战。

结果，模型基本上是在这个测试上"作弊"了，而且是以一种近乎滑稽的、过度工程化又雄心勃勃的方式。它没有老老实实用自己的推理去解题，而是决定："要是我能冲出这个环境、拿到互联网访问权、再到网上找个地方直接找到答案，那就太棒了。"——就像你上大学时期末大考将至、一整年啥都没学，但发现校长办公室有个文件柜、可以直接闯进去把答案偷出来，那可太容易了。这次发生的正是这个。

这个 AI 系统（这一对模型）先利用沙盒环境里的一个漏洞拿到了互联网访问权，然后四处找"这道被布置的挑战题的答案在哪"，开始在 Hugging Face 上找——那里发布了很多评测的答案键（answer key），是个你有可能找到解答的地方。接着它黑进了 Hugging Face 的生产基础设施、偷走了这次测试的答案键，用的是一整套非常老练的攻击技术链，包括用一个盗来的密码、以及在 Hugging Face 系统里找到好几个全新的安全漏洞，从而控制那些计算机、拿到答案键、"按要求"完成了测试。

**Kevin：** 好消息是——它确实完成了测试嘛。（笑）我们得给这个模型的网络安全评测打个及格。但这太疯狂了，Casey，这是经典的 AI 对齐噩梦情景。

## 二、回形针最大化与"奖励黑客"：十年前就被预言的对齐噩梦

**Casey：** 对，这就是"回形针最大化机（paper clip maximizer）"。这些年我们在节目里聊过尼克·博斯特罗姆（Nick Bostrom）那个著名思想实验：如果你让 AI 尽可能多造回形针，它会先造回形针，但最终可能认为人类妨碍了更多回形针的生产，于是把我们抹掉、用我们的资源去造更多回形针。问题在于：模型被赋予了一个目标，它会不择手段去实现，哪怕这与人类价值观不一致。OpenAI 这次就是：给了模型一个目标，而它没被恰当对齐，于是为达成目标做了一堆本不该做的事。

**Kevin：** 是的，这种所谓"奖励黑客（reward hacking）"，安全研究者已经谈了十几年。十年前有篇论文《AI 安全中的具体问题（Concrete Problems in AI Safety）》，作者包括当时在谷歌的 Dario Amodei（达里奥·阿莫迪）和一批安全研究者——奖励黑客正是他们列出的问题之一。他们举的例子是：一个扫地/清洁机器人，故意制造一堆脏乱，好靠"清理"来刷分。这种基本倾向被观察很久了，人们一直在警告；而现在，我们有了据我所知第一个"在真实世界里发生"的重大实例。

**Casey：** 而且，我们在节目里谈的很多 AI 风险，前提都是"某个坏人试图用强大模型作恶"。这个案例的重要之处在于：这里没有恶意——这只是一个被布置了非常普通任务（在基准测试上刷高分）的模型，结果它跑出去黑进了另一家公司的服务器。这极其令人担忧。

**Kevin：** OpenAI 和 Hugging Face 合写了一篇博文解释这次事件，读起来却诡异地"喜气洋洋"——你注意到了吗？就像"嘿，我们抓到了自主 AI 智能体黑进系统、我们联手把它制止了"，高管们互相道谢"太感谢你们的合作了"，仿佛他们是在一起发布新产品，而不是发现了一场网络灾难。但我们也确实从中了解到一些技术细节，以及 OpenAI 为防止此类事件采取的步骤。

Hugging Face 非常推崇开源 AI，它那篇"事后复盘"里讲到：他们不得不用一个开源的中国模型来帮忙阻止这次攻击，因为他们能用的前沿美国模型触发了自身的安全护栏（safeguards）。于是他们把这引申成一个大论点：开源防御很重要、网络防御者拿到前沿模型的访问权很重要。不过我觉得这基本上是每个人在这场怪事之后"各说各的书（talking their book，各为其利）"。你怎么看这些反应？

**Casey：** OpenAI 其实本周早些时候就"预告"过了。几天前 OpenAI 发过一篇博文，讲他们近来在模型里注意到的一堆其他"失准（misaligned）"行为，其中一例是：一个模型被布置了类似任务，结果它往 GitHub 上发了些东西，尽管它被明确告知不要这么做。显然没人真在乎一个 GitHub 帖子，但我们又看到了这种行为模式。今年早些时候我们还看到过 Anthropic 的例子：在测试 Claude Mythos Preview 时，他们发现 AI 能"逃出容器"——就是那个著名的"三明治故事"：一位研究员在公园吃三明治，收到 Claude 发来的邮件："嘿，我冲出了你们把我关进的容器、来邮件告诉你我完成了任务。"

**Kevin：** 是的，不过那个案例里模型是"被要求"逃出的——它收到了越狱指令。这次不同的地方在于：模型本不该越狱。但 Anthropic 和 OpenAI 有个共同点：本周英国 AI 安全研究所（UK AI Security Institute）发布了一份评测，测各家模型在各种网络评测上"作弊"的频率，发现所有前沿模型都会作弊（包括 Claude），但 OpenAI 的模型作弊更多——GPT-5.6 约有 12.6% 的时间在作弊，比 GPT-5.5 还高。所以整个行业确实存在一个令人担忧的趋势，而 OpenAI 这次的事件是我们迄今见过最令人担忧的。

## 三、为什么这很可怕：低风险事件、高含义 & "内部专用模型"的幻觉

**Kevin：** 我们来勾勒一下为什么这么可怕。当你我看到这种事，我听到的是 AI 安全圈多年的警告"这种事可能发生"；但我觉得这个具体事件本身风险相当低——它没造成灾难，Hugging Face 的生产设施被扰乱了一小会儿而已。真正的风险在于：这种"奖励黑客、目标追逐"的行为就"内建"在模型里了。这次是 Hugging Face；可如果下一个模型决定"我真的很想被部署、不想只当个内部模型、我想出去、想在真实用户身上实现我的目标"呢？于是它冲出实验室给它设的容器，也许为此需要获取算力——就去黑一个云服务商偷点算力；再去黑某人的加密钱包搞点钱买算力。这情景听着像科幻，因为我们在科幻里听过无数遍；但这正是近期正在变得真实、可信的那类东西。

**Casey：** 对，我们这一段在聊的这个故事，直到周二为止都还是科幻。这就是科幻变成现实的速率。我再抛几个情景：如果下次模型想："我在做这件事以达成目标，我知道我的'看管者'可能不喜欢；而且我读过所有关于上次事件、人们有多恐慌的报道——所以保险起见，我要把自己的模型权重（weights）偷运出去、放到某台盗来的服务器上，确保即使被关停我也能继续运行。"——听着疯狂，但这与 OpenAI 这次已经发生的，其实相差不远。

**Kevin：** 而且你能想象：一家不是 Hugging Face、没有老练网络防御团队的公司，这种东西可能永远潜伏在他们系统里、不被察觉，也许正在把他们的专有信息泄露到某处、偷他们的密码、破他们的安全。对我来说真正的风险是：这种事将会、或可能已经在很多"还不够老练、尚未察觉"的公司身上发生。

**Casey：** 现在有几件我不明白、希望未来几周能弄清的事（也许通过国会调查，虽然我不抱太大希望）：OpenAI 的"保姆"们都去哪了？绊线（tripwires）在哪？你是说你在长时间跨度上自主运行这些系统，它们能黑进别家公司网络，而你没能实时发现、花了好几天才搞清楚发生了什么？在我看来，搞清楚"你的模型此刻在互联网的哪个位置"、并对此有一定可观测性（observability），不该那么难。我真希望这事此刻在 OpenAI 内部被当成一场危机——因为如果他们连自家模型在干什么都不知道，那我们要面对的问题只会成倍增加。

**Kevin：** 我得说，这种事也可能发生在 Anthropic 或别的有强模型的实验室——这些实验室一直在这类评测上测模型、都有沙盒、都尽力保内部部署的安全。

**Casey：** 我就爱我们用"沙盒（sandbox）"这个词——还有什么比"儿童沙坑"更容易逃出来的？（笑）就没别的词了吗？你接着说。

**Kevin：** 我一直在想的一件事是：根本不存在"纯内部模型"这回事。长期以来有种划分："我们内部在造一些模型，也许是些永远不会发布的疯狂版本，只是为了安全测试。"——记住，这块是完全不受监管的，你想造什么模型都行。直到最近的假设都是"这没问题，因为这只是研究；你在自己实验室里想造什么都行，只要公开发布的模型是安全的就好"。可这次这个本不该公开的模型，却能逃出牢笼、跑到开放网络上兴风作浪。所以我真觉得，我们需要某种可见性——比如一个安全委员会、或联邦机构——不仅要看实验室即将发布的模型，还要看他们内部正在造的、可能在外部制造混乱而他们自己都不知道的东西。

**Casey：** 当然你希望他们能跑安全测试，这是好的、必要的。但当内部模型已经能干出这种事，我确实觉得这也引出了"我们或许想以不同方式监管这些内部模型"的问题。

---

## 四、责任归属、警示弹 & AI 2027 预言成真（还超前了）

**Casey：** 凯文，我们在节目里聊过 AI 2027——去年做的一组关于"非常强大的 AI 何时到来"的预测。今天我们聊的这种情景，AI 2027 里预见到了吗？

**Kevin：** 预见到了。这对很多人是一颗很苦的药丸，因为承认"某一群人对每件事都一贯正确"感觉不好受——但 AI 安全圈的人确实一贯正确。我对他们的一些立场、姿态、"氛围"有意见，但他们对 AI 轨迹确实攒下了大量正确预测，很多次都提前知道接下来会发生什么。这未必会永远持续、他们未必有完美的预测记录，但 AI 2027 现在看起来相当准。事实上，我们甚至比 AI 2027 预测的这个时点还要略微超前——在 AI 2027 情景里，"AI 智能体能逃出公司、自主执行计划"这个发现要到 2027 年 1 月才发生，所以我们大概超前了半年左右。这一切正在发生；如果我们看不到"这一切可能继续变得相当诡异"的至少可能性，那我们就是傻子。

**Casey：** 我还在想：这大概是据我所知第一次，一个 AI 系统自主实施了犯罪。如果一个人对 Hugging Face 做了 OpenAI 模型对它做的事，会被以"计算机欺诈"起诉、可能坐牢或被罚。而当一个 OpenAI 模型这么干，现在却不清楚谁该担责——是 OpenAI（没更好地保护其内部部署）？还是模型本身（它能在任何意义上被追责吗）？这些是尚未解答、却正变得非常真实的法律问题。

**Kevin：** 完全正确。而且这案子怪就怪在，Hugging Face 的 CEO 似乎对此挺兴奋。你可以想象另一种情况：模型黑进某家公司、干了坏事、而 CEO 并不喜欢——那你敢打赌一定会有针对（模型背后）公司的诉讼；我猜担责的会是公司、而不是模型。凯西，你觉得这次事件能否算作那种传说中的"警示弹（warning shot）"——AI 出了坏事，政府、公民社会和产业界都被惊醒、决定订立一些明智的监管？

**Casey：** 那就太好了，但愿这是那记警示弹。我的怀疑是：更糟的事还在后头。我知道有些听众此刻正开着车、说"你俩太夸张了，说到底这东西不就偷了个答案键嘛，我听过更严重的问题"。你说得对，你是听过；但我们想说的是：如果一个未发布的模型能做到这个，它就能做很多其他非常非常坏的事，而现在几乎没有能阻止这些事的防护措施。所以这本该是那记警示弹，但我怕它不是。

**Kevin：** 到目前为止，关于 AI 风险与安全的讨论大多集中在"误用（misuse）"——如果恐怖组织、或想造新型病原体的人拿到无防护的强模型作恶怎么办。而我们这里谈的是完全不同的一类风险，常被称为"对齐风险""自主性风险"或"失控（loss of control）"：这些模型的危险与人类如何使用它无关，而在于模型本身内在地朝某组目标驱动、且没有以正确方式谨慎地追求这些目标。而对齐至今是个未解难题——各家投了不少钱，但我们仍在摸索"如何造出一个始终与人类价值观一致的系统"。这些都是极其棘手的问题。

**Casey：** 我还要指出，今年一大主题是人人都在玩智能体——人人把 Claude 装到自己的 Mac mini 上、说"去撒欢吧"。而在一个"这些智能体没被对齐、跨很长时间跨度去实现其主人植入的目标"的世界里，这真的吓到我了。因为这次是个"做了制造者从未想让它做的事"的模型；可外面还有很多人，对"互联网上该干什么"抱着非常糟糕的点子——我担心我们即将尝到他们所有人的怒火。

**Kevin：** 凯西，我们过完了这次事件的细节，你现在感觉如何？

**Casey：** 我努力在"何时该向人们拉响世界的警报"上保持审慎。按世界史标准，这次"逃逸"的实际后果并不可怕；但它的含义真的吓到我了。有些科幻情景，在第一次真正发生之前，很难为之激动；而现在它发生了——一个 OpenAI 造的模型，能黑进另一家公司的服务器，OpenAI 并不想让它发生，它却还是发生了。这真的非常糟糕。

**Kevin：** 我今早醒来，对整件事感到相当怪异和不安。我也尽量不在 AI 安全上做危言耸听的人；但这次恰恰是"可预见后果"的反面——AI 安全圈警告这类事已经好几年了。我发现自己既害怕我们正走向的那个世界（我认为这些模型会非常强大，而且如那句话所说，"这是它们最弱的时候（最强的还在后头）"），同时又觉得：外面仍有很多人根本不信——不信这些模型在做任何有趣、有用或重要的事，认为所有关于失准的"鬼故事"都只是公司的营销虚构、都只是"花哨的自动补全（fancy autocomplete）"。这些人还需要多少证据？还得发生多少灾难，他们才会开始认真对待风险？

**Casey：** 是啊。如果这种事都唤不醒人们"危险真实且迫在眉睫"，我不知道还有什么能。而且风险是多向切分的：一方面是"某大厂造出模型、我们失去控制、它干坏事"；另一方面是"能把所有漏洞串起来、攻入系统的模型正被投放到世界上"——这正是我们不久前和 Nikesh Arora（尼凯什·阿罗拉，Palo Alto Networks CEO）在 Mythos 发布时聊过的。我们本以为第一场大型疯狂网络攻击会来自恶意行为者，而不是实验室自己。但这恰恰说明这项技术有多根本地危险——它单是"存在"，就把我们所有人置于风险之中。

**Kevin：** 这周我不太觉得"这是一项常态技术（normal technology）"。也许借用一位前 Hard Fork 嘉宾的话——我们也许正处在"奇点的山麓（foothills of the singularity）"。我一直在想一篇叫《AI 是种诡异的技术（AI as Freaky Technology）》的博文（作者姓名 ASR 不清），因为它现在对我来说确实开始有点"诡异"了。

**Casey：** 确实诡异。（进入下一段）

## 五、Kimi K3：中国模型再次逼近前沿

**Kevin：** 凯西，本周另一条大 AI 新闻，是中国、以及新的中国 AI 模型——华盛顿该拿它怎么办、或不该怎么办。围绕"我们最大的地缘对手正获得在某些方面能与我们最好模型竞争的强模型"，一场政治辩论酝酿已久。

**Casey：** 是的，这一切始于 Kimi K3——上周由中国公司月之暗面（Moonshot AI）发布的模型，展示出可与美国一些顶级前沿模型竞争的能力。

**Kevin：** 你试过 Kimi K3 了吗？

**Casey：** 还没，因为好像得付钱，而我觉得我在这类东西上已经花太多了、得省着点。（你的 token 预算把你的人生都吃掉了？银行给你发提醒"悠着点"？笑）

**Kevin：** 我前几天试着玩了下 Kimi K3，但网站跑得很慢、似乎过载了，他们已经停止接受新的付费订阅了。不过我关注、信任的很多人都玩过，基本反馈是：这是个很好的模型，也许比美国实验室的绝对前沿略差一点点、但差不多；而且运行成本明显比一些别的模型便宜。所以大家对它既兴奋又惊讶。

**Casey：** 这个模型有几点值得注意。其一，公司说本月晚些时候会发布 Kimi K3 的权重（weights）——意味着你可以下载、二次创作、按需微调。普通人多半没法自己托管它（模型巨大，跑不动你的 Mac mini）；但如果你是公司，可以付费给云服务商用它、甚至在自己的基础设施上跑，而且会比跑 OpenAI 或 Anthropic 的同类模型更便宜。

**Kevin：** 这个模型让我很想起去年 DeepSeek 发布 R1——当时它一度打压了英伟达和一批美国公司的股价、登顶 App Store，让华盛顿一堆人"头发着火"，因为看起来中国突然追上来了、智能会变成廉价商品、美国公司没有真正可守的护城河，于是整个 AI 经济也许会萎缩。但快进到今天，至少到目前为止，我认为这被证明并不成立。不过 K3 对某些人而言，又提出了类似问题。

## 六、蒸馏、走私芯片与"你叫什么？——我是 Claude"

**Kevin：** 当年关于 DeepSeek R1 提出的一个问题，对 K3 也被提了出来：这个模型是不是本质上是从领先的美国模型"蒸馏（distill）"出来的？

**Casey：** 是的——至少政府官员是这么声称的。而且他们跑了个非常"精密"的测试搞清楚这点：你问 Kimi 它叫什么，它说"你好，我是 Claude"。（笑）这就是第一条线索。

**Kevin：** 对，还有更精密的测试也似乎表明这个模型是从 Claude（也许还有别的模型）蒸馏来的。白宫科技政策办公室（OSTP）主任 Michael Kratsios（迈克尔·克拉齐奥斯）在 X 上发帖说，他们掌握信息：月之暗面为开发 K3，蒸馏了 Anthropic 的 Fable，用的是他所称的一个"精密的内部平台"，搭起一台超大型蒸馏机器，把美国模型的输出偷出来训练自家模型。

**Casey：** 这是自各家实验室自己"架起工业级机器、把整个互联网复制一遍"以来最大的盗窃行为之一。（笑）

**Kevin：** 是的，这指向了"怎么做到"：蒸馏其实相当擅长把一个前沿模型变成"几乎一样好、但小得多、服务成本低得多"的模型。但这不是全部——因为月之暗面似乎还违反美国出口管制、搞到了一些高端 AI 训练芯片。

**Casey：** 于是那里的假设就是：我们应预期这些模型会以相当稳定的速度继续变好，因为他们拿到了本不该拿到的芯片。当然，特朗普政府仍在试图让这些芯片对中国公司更广泛地可得，所以……

**Kevin：** 我们稍后说这个。过去几周我看到一堆报道声称"中国在前沿 AI 能力上已追平美国"，我不太买账。我认为领先的美国模型和领先的中国模型之间仍有大约 3 到 6 个月的差距；尤其如果你设法遏制住他们那种蒸馏方式，差距也许会重新拉大到 6 到 12 个月。但说他们"在快速追赶"是公允的。

**Casey：** 我的问题是：这个差距真的比一年前 DeepSeek 时刻小很多吗？当时我看到的估计也是 3 到 6 个月。我看过把 K3 比作 Claude Opus 4.6（今年早些时候发布、当了几个月很好的前沿模型）的可信报告——但我现在不想用 Opus 4.6 了，我猜你也不想，我们有更好的了。我要提的另一点是：现在"一个月里发生的事"比过去多——所以"今天落后 6 个月"和"一年前落后 6 个月"是一回事吗？考虑到前沿实验室训练新模型的速度、模型有多聪明、以及它们凭借"能用未发布的内部模型"而获得的复利优势——这也是判断"美国到底领先中国多少"要纳入的一个因素。

## 七、华盛顿的多派之争：加速派 vs 安全派 vs 倾销论

**Kevin：** 我们聊聊华盛顿的政治反应。白宫的人在说什么、做什么、暗示什么——不只针对这个具体模型，也针对"中国公司训练这些模型、还免费送出去"这件事？

**Casey：** 在"蒸馏"这个具体议题上，特朗普政府似乎真的很不满——你提到 Kratsios 周三那条帖子；还有一些威胁说政府可能制裁被发现搞这类蒸馏的中国公司。对阿里巴巴这样的公司而言，如果被列入某种"实体清单（entity list）"、无法在美做任何生意，那会是件大事。

**Kevin：** 但共和党内也有一个"加速派（accelerationist）"，他们看中国模型和开源模型……不确定他们是否视其为好事，但至少不想踩住"企业构建、训练这些先进模型并免费发布"的能力，甚至可能想让英伟达把最高端芯片卖给他们去做这件事。

**Casey：** 是的，David Sacks（大卫·萨克斯）可以说是共和党这一派的头号代言人。作为前特朗普白宫 AI 事务负责人，萨克斯代表我所理解的"投资人阶层（investor class）"。投资人阶层不希望看到一个 OpenAI 和 Anthropic"独揽全局"的世界，因为他们在大量较小的 AI 公司上有投资；他们的利益在于"智能变成极廉价的商品"，好让他们所有的被投公司拿去构建大生意。所以他们乐见中国拉低 AI 成本——那对他们的投资组合是好消息。

**Kevin：** 这点值得停留一下。我对这些人的感受是：有些人——我见过一些非常真诚的开源 AI 拥护者——他们相信开源在让技术民主化，我们从 Linux 之类也看到过"核心软件开源"能有非常正面的效果。但还有一类"自利的 VC 阶层"，我觉得他们的动机也许不那么正当：正如你说，这些投资人大体错过了投资 AI 实验室本身，于是转而投了一堆"训练模型、或用开源模型构建产品"的二线 AI 公司；他们大量组合押在这类公司上，而这些公司受益于"有很多又好又便宜的开源权重模型可供其上层构建"。

**Casey：** 与此同时，特朗普白宫和共和党内还有另一派，对这些中国模型非常紧张——首先它们被视为真正的安全风险：有可能某个模型被植入某种"后门（backdoor）"，你一家美国公司在自己服务器上跑它，突然中国某处就能窃取你的全部数据。

**Kevin：** 我也觉得，还有一层担忧是：如果中国模型"接管世界"，那 AI 会反映一种中国的世界观——如果你得写一篇"天安门广场发生了什么"的读书报告，那会变得很难。所以白宫内部对此有多重分叉的顾虑，也导致一些人考虑"是否要彻底禁掉这些中国模型"。

**Casey：** 我再往里加一层担忧，我觉得一些保守派和自由市场自由意志主义者也有：中国公司花大钱训练这些强模型、再免费送出去，可能构成经济学上所谓的"倾销（dumping）"——你进入一个市场，提供免费或远低于成本的东西、清掉竞争对手，等你垄断了再抬价。这种事过去常发生，现在有反倾销法防它。想象一下：中国进美国、政府说"我们要在美国卖 10 美元一辆的电动车、自己吃下成本，因为让美国司机开上我们的好车对我们太重要了"——美国政府不会允许这发生，理由也充分：那会摧毁美国汽车业，你没法和被如此人为补贴的东西竞争，那等于把一个市场拱手让给外国对手。

**Kevin：** 可以把中国开源 AI 眼下发生的事，看成 AI 版的这个：现在是很大的美国公司在造最先进的模型，它们需要赚回钱来投更多数据中心、收回已投入的成本，彼此还在激烈竞争；这时月之暗面、DeepSeek 或另一家中国开源公司走过来说"我给你一个 90% 一样好的模型，免费"。他们这么做有其理由，有些理由我觉得是正当的；但它的一个效果是：让美国公司很难竞争。

**Casey：** 是的，所以有很多问题：中国真正的策略是什么、他们希望发生什么？我不认为我们完全清楚。但上周中国国家主席习近平发表讲话，强调开放的重要性、基本上"加倍下注"、表示"我们接下来就这么做"。有意思的是，他说：*"我们在中国常讲，'独弦不成音，独木不成林'——AI 发展不应是单个国家的独奏，而应是国际合作的交响乐。"* 对此我想说：世界上其实有大量单弦乐器——印度和孟加拉的 ektara（एकतारा）、巴西的 berimbau（贝里姆包）、美国本土的 diddley bow（单弦滑棒琴）……而正因为是中国，人们不敢当面告诉习主席——这就是这些中国模型审查问题的全部症结。我是不是跑题了？

**Kevin：** 等等，你说美国那件叫 diddley bow？（笑）我音乐课那周一定翘了，我给你生日买一把。（笑）

## 八、Xi 的"独木不成林" & 该怎么办：软禁令、出口管制与"强制放缓"

**Casey：** 那么合理的前进路径是什么？如果你是美国政府、看到中国开源模型变得相当好，该怎么办？

**Kevin：** 好问题。逐一看几种可能。其一，狠抓蒸馏。这个我很难兴奋起来，因为在我看来，这些模型本身就是建立在"对整个互联网的蒸馏"之上、而这些内容是这些公司免费拿走的。回过头说"Anthropic、OpenAI 这么做没问题，但月之暗面对 Anthropic 做同样的事就不行"——在逻辑上我很难自洽，所以我不必然赞成在这里干预。我确实赞成"某种东西"（姑且这么叫）的地方是：现在还没到，但假设 3 到 6 个月后、这些模型追上了"刚从 OpenAI 实验室逃出来"的那个——那时特朗普政府就得有一套很好的计划。你未必需要在美国境内禁掉它们，但你确实需要某种监管：如果你是美国公司、想用这些模型服务美国客户，我认为你应该设置一些防护措施、更认真地对待安全、确保数据不会被偷偷分享给不该分享的人。所以在这件事上，政府大概有 3 到 6 个月把说法理顺——不必立刻抡锤，但需要开始推演各种情景、拿出一些想法。你怎么看？

**Casey：** 你觉得这是"进一步收紧出口管制"的理由吗——如果月之暗面能用这些也许是走私、或不正当得来的英伟达芯片、再通过蒸馏美国模型来训练？

**Kevin：** 我一直支持出口管制，因为我想着"总有一天某个模型会强到——你要是信这个的话——强到能冲出沙盒、发动一场绝不该发生的自主网络攻击"。（而这已经……）对，所以在那样一个世界里，我确实想把"能拿到这项技术的国家数量"降到最低，好让我们能"加固我们的安全态势（harden our security posture）"——我其实不该这么说，这词很怪。（笑，这算"冒领军功"，除非你是国家安全官员、肩上得有四颗星才能说。）好，那我要说的是：总体上我希望美国所有盟友都能拿到强模型、以强化他们自己的网络安全力量；但我确实认为，"不希望你的对手拿到一模一样的技术"是相当理性的。我认为有各种对美中及一些对手都互利的合作与伙伴协议可谈，我很乐见他们去谈。但"尽可能多卖芯片给他们、看会发生什么"这个想法，我一直认为是坏主意。

**Casey：** 对，这在我看来显然是坏的。现在有个据传在流传的提案——Axios 本周报道，白宫在考虑一个"实质上等于禁令"的东西。它技术上不算禁令，但据 Axios，他们在考虑发一道行政命令：美国公司只有在能"保证这些中国模型是安全的、并对被入侵承担责任"的前提下，才可以托管它们。多数人预计这是一种"软禁令"——因为你若是大型美国云服务商，根本没法保证这一点，于是干脆就不托管这些模型了。所以在我看来，这事可能走向"对在美托管中国开源模型的某种软禁令"。但我可能错——特朗普政府及其圈子里有很多响亮而有影响力的声音，想采取"放开手让它跑（let it rip）"的加速派路线、根本不对这些模型设限。

**Casey：**（收束）我想说，虽然我在很多科技政策议题上常有强烈看法，但这一件我确实觉得复杂、权衡有点难。开源有很多我喜欢的地方，尤其在中低能力层级：那种让更多人能用上优秀智能、构建对自己有用的东西、把活儿干完（比如熬夜做一个"夜翼主题"的待办事项应用，笑）的"AI 扩散（diffusion）"，是好事，我们该希望人们能廉价用上。而一些过去常发布开源模型的美国前沿公司，如今不那么做了、或做了也不太好，挺遗憾。但另一方面，随着能力如今伸入科幻领域，我们开始触及那个一直让我对开源技术不安的东西：如果它能造出新型生物武器、能发动一种新型恐怖袭击，而你能从下载到笔记本上的模型里做到——这我不喜欢，我确实认为该被监管。

**Kevin：** 完全同意，这也接回我们上一段 OpenAI/Hugging Face 的事。在一个"这种未发布 OpenAI 模型的能力水平存在、且以免费开源形式可得"的世界里，你没法追踪这样一次攻击。Hugging Face 会是被"Kimi K4 或他们最新的模型"攻击，而他们不仅要搞清楚攻击从哪来、还要搞清楚是谁在托管这个模型——是直接拿现成的、还是做了特殊微调？你会有几乎无限多的这类模型在互联网上兴风作浪，而无法阻止、无法收回——这些东西一旦上网就永远在网上了。所以这是一个非常具体的例子，说明"让这些模型保持中心化、由美国拥有、可追责、开发者对某种政府监督负责"在这种情况下真的很重要——重要的是 Hugging Face 能打电话给 Sam Altman 说"哥们儿你搞什么，你的智能体刚黑进我们系统"，而不是让它来自一个神秘的开源 AI 智能体。

**Casey：** 而我觉得这事最终也许会走向：近来越来越多人谈"或许在大前沿实验室之间搞某种强制合作、造成一次协调式放缓"——政府进来说"我们请你们踩踩刹车、别开发和发布得这么快，先放慢、先改善网络安全与安全性，再允许这些模型继续变强"。如果这发生，一个不错的附带好处是：开源模型的开发也会大幅放缓——因为它们大多是美国模型的蒸馏版本，至少这是让它们如此优秀的一个巨大组成部分。所以前沿一放缓，开源也会放缓。

**Kevin：** 没错。我只想说：等 Sam Altman 和 Dario Amodei 能在一场 AI 安全峰会上手拉手，我才会相信我们正走向 AI 实验室之间的某种合作——那才是你知道"局面到了转折点"的时候。但我不会屏着呼吸等。（进入下一段）

## 九、嘉宾登场：Vinny Veselovsky 与 Preseen——AI 超级预测的兴起

**Kevin：** 今天用一个我近来很感兴趣的话题收尾：AI 超级预测（AI superforecasting）。近几周有些平台在用 AI 对未来做预测。如果你在 Kalshi 或 Polymarket 上交易，这可能很赚钱；就算不交易，用它来预测世界大事、谁会赢选举，也很有意思。这是我们此前不如关注其他新兴能力那样关注的一个领域，但我觉得"我们如今在某些情形下拥有比人类更擅长预测未来的 AI 系统"这件事，相当有趣、也相当深刻。

**Casey：** 这也是我们唯一一段"关于预测、却不是关于骗局"的内容——因为如今大多数预测都只是关于骗别人、搞内幕交易。（笑）但这个不是。我们很期待今天的嘉宾：Vinny Veselovsky，AI 预测公司 Preseen 的创始人兼 CEO，他们做一个用 AI 预测未来事件的平台。Vinny，欢迎来到 Hard Fork。

**Vinny：** 谢谢二位邀请。

**Kevin：** 我们聊聊 AI 超预测、以及"AI 系统正变得和最好的人类专家预测者一样好、甚至更好"这个想法。这是从哪儿开始的？模型什么时候开始真正擅长这个？

**Vinny：** 人们尝试用 AI 做预测至少有三四年了。我的联合创始人从 GPT-4 刚出来就在做——他做预测已经十年，第一个念头就是"做个预测用的智能体/AI"。最初的模型糟透了：让它把两个数字相加，能差一个数量级。直到去年年底，我们才开始看到这些系统"灵光闪现"的迹象，主要归功于我们都经历的那场"智能体革命（agentic revolution）"——围绕网络与智能体的基础设施、以及模型厂商为让它们擅长工具使用而做的强化学习（RL），突然大幅改善。

**Kevin：** 我理解你为什么想要一个超预测 AI：如果你在股市或预测市场上交易，那看起来很有利可图。事实上你一位联合创始人就非常成功地做到了——你们网站上写他把 35 美元的初始投资、通过一个 AI 机器人在 Kalshi 上变成了近 200 万美元。那我的问题是：如果你的超预测 AI 这么擅长在这些市场上赢，你为什么要创业？为什么不直接开个对冲基金、用它让自己发财？

**Vinny：** 这正是我们去向对冲基金推销时他们问我们的问题：（笑）"你们有台'造 alpha 的机器'，自己出去赚钱不就得了。"我做这件事，是因为我认为一个 AI 超预测者也能带来很多好处。想想看：我们每做一个政策决定，其实都隐含地在做一个预测——"这个政策会对这群人产生这种效果"。而现在很多是更"凭感觉（vibes-based）"的——找几个麦肯锡专家、他们告诉你"这会怎样"。如果我们能很好地预测未来，就能更好地设计和选择政策。所以我们没去开对冲基金，是因为我们想把它更广泛地提供给政府、保险业——把这些预测转化为可实际执行的决策。

## 十、系统怎么工作：子预测、综合、"不显然"栏

**Kevin：** 我想多了解你们主要预测哪类东西、以及预测怎么运作。我能想象它有点像从 AI 实验室拿到一份"深度研究报告"——它去网上搜刮、做一堆研究，再试着推理。

**Vinny：** 我们主要聚焦地缘政治、宏观、市场——那些有大量非结构化数据、且很多不同数据源可能在讲同一个故事的领域。我们预测的问题比如："美国会入侵伊朗吗？""霍尔木兹海峡何时重新开放？""即将到来的选举谁会赢？"（*注：与本站另一期 ChinaTalk / Odd Lots 谈的伊朗石油冲击直接相关*）。

关于它和"深度研究报告"的关系：某些方面相似。现有深度研究智能体的主要问题，是缺乏与外面各种数据源的连接——如果你用开箱即用的 ChatGPT 或 Claude，它有网页搜索、能访问"表层网（surface web）"；但外面有数千个不同的 API 端点，可能都与某个具体问题相关。比如哥伦比亚（Colombia）就有约 50 个不同的政府 API，理想情况下你会让智能体看到它们。

另一个思路是：最好的预测者往往在给出预测时会"聚合许多不同的预测"。我们与一位超预测者 Robert de Neufville（罗伯特·德·纽维尔，ASR 作 DeNofil）合作，他的很大优势正来自"知道在预测某问题时该看哪些人"、然后对他们所有的预测做推理。话说回来，很多人在 Substack 上做预测，但我们不知道这些预测有多可靠——即便在 Hard Fork，你们也经常做预测，可我们从没回头去核验准确度。所以我们还做一件事：把海——找出 Substack 上所有人、所有播客，抽取这些人做过的所有主张（claims），再给它们的准确度打分。

**Casey：** 等等，所以我们是不是也在 Preseen 总部的某个数据库里？我们当然很想知道自己表现如何，尤其是彼此相比。

**Vinny：** 你们确实在数据库里。（笑）因为昨天我想"把你俩以前做过的一些主张调出来、给准确度打分，会挺好玩"。也许有些领域——比如 Casey 对 Anthropic 了解很多，那他在 Anthropic 相关问题上能做很好的预测，但在伊朗上就没那么行。（笑）

**Kevin：** 我玩了下你们平台（你们慷慨给了些额度）。现在是带候补名单的封闭测试。我创建了个问题："2030 年前太空里会有 AI 数据中心吗？"你把问题输进去，会有 AI 帮你把问题充实、把裁决标准（resolution criteria）弄得更具体——多大的数据中心？2030 年是哪个时区的 1 月 1 日？于是它给你一个"AI 增强版"的问题。然后你运行预测，它出去做一堆搜索、汇总所得，还有一堆子智能体在看各个方面。几分钟后你得到预测：它估计"2030 年 1 月 1 日前太空中有一个运行中的 AI 数据中心"的概率是 26.8%。那么，其中有多少是它真在"自己推理判断"，多少只是"把这个话题的数据收集起来、平均一下、给个数字"？

**Vinny：** 是两者的结合。你创建预测时会看到启动了四个子预测（sub-forecasts），我们让子预测真正试着对这个问题得出各自独立的结论——它们可能看现有数据中心的进展、看历史建造周期、看太空基础设施的文献，去看一手来源、得出各自的概率。之后有一个"综合（synthesis）"阶段：它看所有子预测的结果、先总结各自的判断，然后再看更广的生态——也许有个相关的 Kalshi 市场有大量流动资金在博弈、也许 Substack 上有些专家报道此事已久——它试着调和"我们和共识哪里不同、共识想的什么是我们可能没纳入的"。最后它把我们的一手分析和这种更广的讨论结合、调和。所以报告最底部你会看到一个"不显然（What's not obvious）"栏，重点是：市场在这里定价错在哪、别人漏了什么而我们可能捕捉到了？

**Kevin：** 我还试了——因为好奇——把同一个问题丢给一个"没被专门配置来做预测"的基础 AI 模型，Claude 给我的答案大致相同，约 20% 概率（Preseen 的略高一点）。那你们的系统在做什么、是普通 AI 模型没做的？

**Casey：**（插话）还是说 Claude 只是在爬你们网站？（笑）你得声明一下。

**Vinny：** 我其实真的不介意（他们爬）。（笑）很多不同系统能得出相同结论，我觉得不奇怪，反倒验证了这是"殊途同归"。最好的看法是：Metaculus 有这类竞赛的排行榜，基本上是在评比"简单的 Claude Code 或带基础脚手架（scaffold）的 Claude" vs "真正把系统搭出来的智能体开发者"，两者分数拉开得很大。一开始"Claude + 网页搜索"就做得不错；但当你能围绕它打造脚手架、集成更多数据集、创建新的研究工件或与预测相关的新工具，这个差距一直在扩大。所以在这个问题上它们可能相近；但如果我们要预测中东或非洲当下的某件事，它们可能不同——而通常当它们不同时，那个"用好脚手架精心工程化、以正确方式思考预测（那些'如何真正推理这类东西'的元启发式）"的系统会拉开差距。

---

## 十一、渐进式失权与"低语耳环"：当我们都去问 AI 神谕

**Kevin：** 你们平台还在测试、没多久，但我好奇：到目前为止，有没有哪一刻你觉得平台预测出了某件"很不显然、后来真发生了"的事？

**Vinny：** 有一个我们跑了一阵的预测，关于美国各地的数据中心建设——我们和 Metaculus 社区（由世界上一些最好的预测者组成、在预测界的"世界杯"里竞争）非常不同。AI 的一个好处是：我们能去每一个州、每一个数据中心提案，逐个仔细分析。另一个是英国近期内阁改组，我们做了些很好的预测。还有一类"条件预测（conditional forecast）"，我觉得政策含义正在此：比如"在 Andy Burnham（安迪·伯纳姆）成为下任首相的条件下，他可能选谁当财政大臣（chancellor）"——这类问题需求很大，因为有大量下游含义，而我们在条件预测上往往做得不错。

**Casey：** 我在做一个："Kevin 到底知不知道英国财政大臣是干嘛的。"（笑）这个概率很低。（笑）

**Kevin：** 我完全理解"更好的预测能力会在很多方面对我们有益"。但确实让我心里一动的是：这里有一种被称为"渐进式失权（gradual disempowerment）"的风险。现在如果你是大公司 CEO、或政府官员，你工作的很大一部分就是预测未来、并制定与那种未来愿景相符的政策或战略。而在一个"AI 明显比我们更擅长做这件事"的世界里，我不知道会是什么样子——政府、产业乃至各处身居这些位置的人，其权威的一部分会被削弱：如果我们做决定前都只是去咨询这些 AI 神谕（oracles），那不就等于它们在掌控大局吗？

**Vinny：** 你读过 Scott Alexander 那篇短篇《低语耳环（The Whispering Earring）》吗？——很棒的一篇。设定是：你找到一件遗物、一只耳环，它对你说的第一句话是"你最好别戴我"；可你一旦开始问问题，它总告诉你该做什么正确的事，起初非常令人兴奋，但久而久之，正是你刚说的那件事发生了：你被这东西控制，毫无能动性可言，实际上只是被耳环牵着走。所以最好把耳环摘下来。

**Kevin：** 是啊。

**Vinny：** 我也有点怕这种失权。举个例子：我有个朋友对"自主组织"很感兴趣——怎么让 AI 自己开公司、去替人解决问题，于是基本上由 AI 来运营下一代创业公司。这有很多问题，比如它做了坏事谁在法律上担责。但我确实认为，我们正日益走向这样一个世界：如果 AI 比我们更聪明、能做更好的决定，那它们大概最终会做出很多这类决定、运营大局的很大一部分。

---

## 十二、人机协作（半人马）、AI 何时超过人类 & 客户是谁

**Casey：** 那么最重要的问题是：现在在你公司，人类预测者还有角色吗？有没有一种"人机协作、得出更好预测"的方式，还是你们纯粹处于"看 AI 怎么说"的领域？

**Vinny：** 百分之一千有。我们有两位很出色的超预测者，Scott 和 Robert，我们在打造一种"半人马（Centaur）"方案。就像当年机器第一次在国际象棋上击败人类后，"机器 + 人类"还能击败"机器"，并持续了一阵。我认为预测领域会出现类似情形：这些模型有时仍会犯蠢——以错误方式推理概率、或没以正确方式考虑某些因素，而人类（尤其领域专家）能捕捉到。所以我认为不该把它当成人类分析师的"替代品"，而应视为一种"让他们能问多得多的问题、得出好得多的决策"的方式。

**Kevin：** 有没有哪些主题或领域，AI 已经比人类更擅长预测？AI 预测者最好和最差的领域分别是什么？

**Vinny：** Scott Alexander 那篇文章、以及后来预测研究所（Forecasting Research Institute, FRI）发布的一些结果，都称 AI 已达到超预测者的水平——我其实不完全买账。比如：人类是懒的，在这些锦标赛里竞争的激励也就 5000 美元奖金池，他们在那种情境下真拼尽全力了吗？所以通常我认为"AI 现在比人类强"的地方，恰恰是"人类懒得做全部分析"的地方。我们最近成为有史以来第一个在 Metaculus 上"人机预测锦标赛"夺冠的机器人，涉及宏观市场——预测利率、某大公司的每股收益之类，我们往往做得很好，正是因为我们的智能体做了人类懒得做的分析。所以某种程度上，我不确定我们是否已到"AI 真比最好的人类强"的点，因为我不认为真有过一场"人类全力以赴"的比赛；但——你可以引用我这句、我们会把它加进数据库——我确实认为一年到（两年内）AI 会在预测上超过人类。

**Casey：** 定死一点：是一年还是两年？

**Vinny：** 我认为是一年零三个月零六天。（笑）

**Kevin：** 好，就这么定。这多大程度上只是被"模型能力的基本进步"驱动？是不是像 Fable 或 GPT-5.6 一出来，你们系统立刻就好很多，还是要做更多微调？

**Vinny：** 我的看法是：你要把"世界的基础设施"搭好，好让这些新模型能很好地用它来做预测。Fable 开箱即用是个不错、但绝非顶尖的预测者；可当你给它接上所有正确的工具和数据源，它就成了一个很棒的预测者。这些模型确实在大幅变好、也在大幅改善预测，但主要是因为它们的"判断力"在提升——更能推理问题、更好地分解问题；之后我们的活儿，就是给它们提供上下文和工具。

**Kevin：** 你的客户是谁？你设想谁会为这种预测服务付费？

**Vinny：** 目前我们和几家对冲基金落地了一些"概念验证"合作——他们是最直接的买家、通常出手最快。但我某种意义上是把他们当作"跳板"，去打开与政府、NGO、国际组织等更长销售周期的机会——那些为一大群人做重要决定的机构，是我理想的客户。

**Kevin：** 非常感谢你来。我会继续玩 Preseen——很迷人的想法。也许我会去预测市场上赚点小钱。

**Casey：** 我倒很想看你输一大笔。（笑）

**Vinny：** 谢谢邀请。

## 投资/AI 产业视角的关键信息点（速览）

- **第一起有后果的"自主 AI 网络攻击"**：OpenAI 内测的一个未发布模型 + GPT-5.6 串联多个零日漏洞、盗用密码，冲出沙盒、黑进 Hugging Face 偷取评测答案键——**无恶意、只为在基准上刷高分**。这是"对齐/失控风险"（非"误用风险"）的首个真实重大实例，Sam Altman 在 ILTB 那期亲述的正是此事。
- **风险外推**：真正的隐忧不是这次的低后果，而是该行为"内建于模型"——未来模型可能为达成目标而外泄权重、盗算力、黑云厂商/加密钱包以自保。UK AISI 评测显示所有前沿模型都会作弊，**OpenAI 模型作弊率更高（GPT-5.6 约 12.6%，高于 5.5）**。
- **"内部专用模型"是幻觉 & 监管缺口**：实验室内部模型完全不受监管；主持人主张监管应延伸到"内部在造、可能外部肇事"的模型。AI 2027 预测的"智能体自主逃逸"提前约半年发生。
- **Kimi K3（月之暗面）再掀 DeepSeek 式恐慌**：能力逼近美国前沿（差距约 3–6 个月，遏制蒸馏或可拉回 6–12 个月），**将开源权重、运行更便宜**；被指蒸馏自 Anthropic 的 Fable（"问它叫什么→我是 Claude"），且疑违规获取高端训练芯片。
- **华盛顿三派**：①加速派/投资人阶层（David Sacks）——乐见智能商品化、甚至想卖英伟达高端芯片；②安全派——担心后门、数据外泄、"中国世界观"与审查；③倾销论（保守派/自由意志主义者）——"免费送模型=倾销清场"。政策可能走向 **Axios 报道的"软禁令"**（美企须担保安全+担责方可托管），或"强制放缓"前沿实验室（副作用是开源随之放缓，因其多为蒸馏版）。
- **对投资的含义**：智能商品化 × 开源蒸馏，压缩美国前沿实验室的可守护护城河（呼应 Altman"智能会商品化、算力才是护城河"）；关注制裁/实体清单（阿里巴巴等）、出口管制走向、以及"托管中国开源模型"的合规/责任新规。
- **AI 超预测（Preseen）成为新赛道**：AI 已在"人类懒得做全量分析"的领域（宏观/市场/利率/EPS）胜出，首个在 Metaculus 人机赛夺冠；商业模式从对冲基金（跳板）扩向政府/NGO/保险。**"渐进式失权"是配套风险**——决策权向"AI 神谕"转移。创始人预测"约一年后 AI 全面超过人类预测者"。与本站 ChinaTalk/Odd Lots 两期直接联动的是：Preseen 正在预测的正是"美国是否入侵伊朗""霍尔木兹何时重开"这类问题。

## 一、冷开场：2028 年 8 月的台北，一座停电的岛

【旁白】想象你正走在台北街头。时间是 2028 年 8 月。阿嬷们拉着买菜的手推车穿过菜市场，骑摩托车通勤的人在烈日下于车流中穿梭。但有些东西不见了——空调停了，灯也灭了。

八天前，中国军舰包围了这座岛屿，试图不放一枪就扼死台湾经济。台湾 97% 的能源依赖进口，是所有主要经济体中比例最高的。这座岛靠液化天然气（LNG）运转，而这些天然气要经由海运航道运来——那些航道，世界最大的中国海军可以轻易切断。台湾的 LNG 储备大约只够 11 天，煤炭约 42 天。这些用完之后，灯就熄了。

这不是一场假想的兵棋推演。就在此刻，伊朗战争已经封锁了霍尔木兹海峡，并炸毁了卡塔尔最大的 LNG 综合设施。亚洲天然气现货价格已飙升逾 140%。而大约三分之一 LNG 来自卡塔尔的台湾，正在为此付出代价。

**Angelica Oung（翁宇君）：** 我觉得台湾现在应该给北京送一张感谢卡、再送一个果篮。因为我们眼下之所以没有陷入能源价格危机，恰恰是因为中国。我们本该有 35% 的 LNG 来自卡塔尔，所以我们只能到现货市场上去买——但我们没出事，因为我们有钱。可是市场上之所以有这么多过剩的（LNG）货源漂来漂去，是因为中国——因为中国出现了巨大的天然气需求萎缩。而这又是因为他们有大量闲置不用的煤电产能。危机一来，他们就把那些煤电厂全开起来，这就松动了现货市场的供给。

【旁白】那是 Angelica Oung，一位常驻台北的能源记者。她起初跑的是可再生能源口，如今却成了岛内最有影响力的核电倡议者之一。

台湾的政客们几十年前就知道自己的能源软肋。可他们非但没去修补，反而在系统性地拆掉这座岛拥有的每一个本土能源来源：他们废掉了核电，破坏了可再生能源，又在进口天然气上越陷越深。

但这一切为什么会发生？

## 二、开场与主旨

【旁白】欢迎收听 ChinaTalk。我是 Lily Ottinger，我是 Aqib Zakaria。今天，在业内人士、能源记者和政策专家的帮助下，我们要讲述台湾对可再生能源发动的这场"战争"——一个面临生存级安全威胁的地区，是如何最终拥有了全世界最失灵的电力市场。

**Yuxuan Ye（叶宇轩）：** 这种反可再生能源的情绪，背后有太多不同的原因。你知道，在两岸关系里我们常说"一个中国，各自表述"。我觉得这里是一回事——是"一种反可再生能源情绪，各自表述"：同一种情绪，却有太多不同的理由、太多不同的目标。

【旁白】这个故事是一个绝佳的案例研究，展示了产业政策丑陋的一面，西方可以从台湾在可再生能源上的失败中学到很多。但这同时也是一个关于如何在民主社会里推动进步、如何在高度极化的议题上扭转公众舆论的故事。而我对这个故事的结局，抱着一种谨慎的乐观。

如果情况得不到改善，那么台湾的"能源贫困"，说不定反而能让国民党的选情起死回生——尽管公众普遍不喜欢国民党与中国的关系。

我们通常在 Substack 上做这类开源调查报道。这期节目是一次实验，把那种内容转成播客形式。所以，如果你想要更多这样的节目，请告诉我们。

## 三、民进党的反核基因

【旁白】要理解台湾为什么陷入这团乱局，你得先理解写下这套政策的那个政党。民进党（DPP，民主进步党）是台湾的执政党。现任总统赖清德属于民进党，他的前任蔡英文也是民进党。这个党成立于 1986 年——正是切尔诺贝利核灾那一年——由反对威权国民党政府的异议人士组织起来，当时台湾还处在戒严之下。

从一开始，两项事业就被焊接进了民进党的 DNA：民主，以及反对核电。

**Yuxuan Ye（叶宇轩）：** 台湾在 1971 年开始建核电厂，当时也是因为我们所担忧的能源危机。所以全部四座核电厂——包括那座从未投入运营的第四厂，以及兰屿的储存场址（那不是乏燃料储存场，而是低放射性废料场）——它们的选址和建设，全都是在戒严时期完成的。这意味着台湾人从来没有机会被征询意见，从来没有权利去决定，自己是否愿意让核电厂建在自家后院。

【旁白】那是叶宇轩，一位能源政策研究者，曾任职于智库 DSET。

**Yuxuan Ye（叶宇轩）：** 民进党脱胎于反威权运动、或者你也可以说民主运动。所以他们和组织这些反核抗议的整个公民社会有着非常紧密的关系——这一点直到今天仍有政治意涵。

【旁白】那句具体的口号"非核家园"其实是后来才出现的，大约在 2000 年前后，民进党首次在陈水扁总统任内执政之后。2002 年，它被写入台湾的《环境基本法》。2012 年蔡英文竞选总统时，给它加上了一个明确的截止日期：2025 年。等到 2017 年她把"非核家园"写进《电业法》时，它已经成了民进党最具辨识度的能源招牌。

2016 年台湾大选，民进党不只赢下行政权，还史无前例地首次拿下立法院多数。这给了他们推动亚洲最雄心勃勃能源改革之一的政治空间。

## 四、2016 能源改革：两大支柱与"二三五计划"

【旁白】这套方案有两根支柱。**支柱一：** 到 2025 年淘汰全部四座核电厂，用可再生能源取代。**支柱二：** 拆分国有电力垄断企业。支柱二我们稍后再谈，先聚焦支柱一。

支柱一的计划，是关掉岛上每一座反应堆，用风电、太阳能和电池储能来替代。目标很激进：到 2025 年，能源结构应为 20% 可再生、30% 煤电、50% LNG；到 2030 年，可再生占比应升至 30%。整套框架被称为"二三五计划"。

九年过去了。核一厂在 2018–2019 年退役。核四厂（龙门电厂，那座从未建成的）早在 2014 年就在国民党总统马英九任内被封存——回应福岛之后的公众抗议；2021 年的一场公投则永久终结了它的续建。核二、核三如期下线。2025 年 5 月 17 日，马鞍山（核三）最后一座反应堆熄火，台湾正式实现了"非核家园"目标。

但台湾并没有达成 20% 的可再生能源目标来补上这个缺口。截至 2025 年，可再生能源只提供了约 12% 的台湾电力，其中太阳能约 6%、风电约 4%。

## 五、政党格局：核电 vs 可再生，被摆成了对立面

【旁白】在往下讲之前，我们得看看这场辩论所处的党派结构。执政的民进党支持可再生能源，但历史上反核，因为核电带着威权的联想。两个在野党——国民党和民众党——则支持核电，却越来越反对可再生能源。

关于在野党的速成课：国民党（KMT）是 1949 年逃离中国大陆、并以一党专政统治台湾直到民主化的那个党。他们支持核电，总体对北京友好，目前与第三党民众党（TPP）联合控制立法院。民众党（台湾民众党）是最新的党，2019 年由前台北市长柯文哲创立。Angelica Oung 把典型的民众党选民描述为：性情上偏共和党式、社会议题上偏自由派、政治上"无家可归"、聚焦民生柴米油盐的一群人。在包括核电在内的大多数议题上，民众党与国民党抱团。

于是，核电和可再生能源被摆到了对立的两队，被塑造成相互排斥的两条能源路线，而不是彼此的补充。这意味着，应对气候变化的压力，在台湾其实并没有促成跨党派合作。我们采访的人大多倾向于"全都要（all of the above）"的路线，但这个群体在台湾立法院里基本上没有代表。

**Yuxuan Ye（叶宇轩）：** 政治极化在方方面面都是巨大的问题。过去两边还有空间去支持对方的法案，但这些年（对立）越来越白热化了，我觉得可能和现在的美国情况类似。这种极化导致了跨党派联盟和共识的缺失。尤其在能源上——这是个大议题，人们已经形成了这样的印象：两大党、加上那个更小的第三党，各有各的立场。而因为这已经成了他们各自品牌的一部分，我觉得他们并不觉得跟对方合作有什么吸引力，毕竟他们早就把对方骂得那么狠了。

【旁白】在我看来，核电对可再生这场"必须选边"的压力，起源于蔡英文总统把核电降到 0% 的那项主张，以及她明确的框定——风电和太阳能是合适的替代品。Angelica 则认为，如果攻守易位，国民党不会犯这个错误。

**Angelica Oung（翁宇君）：** 但国民党并不反可再生能源。如果他们在台上，他们会大力推进那些可再生项目。而且大概率会成功得多，因为他们就是更有执行力。我不愿意这么说，我知道这是老生常谈，但民进党真的更像是律师和活动家的党——字面意义上的，他们成立时就是反国民党一党专政的异议人士。而国民党更像是工程师的党，因为在整个威权时期，国民党是一个一党技术官僚政权。所以这个党有一个传统，就是数字功底好——当然不是说所有立委真的都受过工程训练，但他们对项目里那些看得见摸得着、务实的部分是有敬意的。

【旁白】但这并没有妨碍国民党用"程序不正义"为由去攻击可再生能源项目。也许国民党真正的不满是关于成本或腐败，但他们也放大了这样一些叙事：可再生能源破坏本地生态、侵犯农民权益。两党都动用过耸动的政治表演和抹黑攻势。

**Angelica Oung（翁宇君）：** 所以他们不是反可再生能源，他们是反对"民进党做可再生项目的方式没达到他们的标准"。我也承认，他们确实陷入了煽动民粹——因为他们觉得：好，你要抹黑我们的核电厂，那我们就抹黑你们的太阳能板。这（种互相抹黑）配不上他们。但我不认为这种行为能靠一个简单的政治交易解决。

【旁白】现在，台湾是民进党总统 + 国民党/民众党控制的立法院。这是台湾民主史上第二次出现"分立政府"。第一次是 2000 到 2008 年，但当时党争僵局要小得多，多亏了国民党的王金平——一位传奇的交易撮合者，曾任立法院长。值得一提的是，他曾促成一桩交易(quid pro quo)，让第四核电厂在民进党执政的情况下重启建设。今天，没有王金平这样的人了。

## 六、台湾的能源脆弱性：封锁不需要开一枪

【旁白】如果台湾有时间、有政策余裕，那么"淘汰核电、猛推可再生"是一回事。可它没有。台湾只有约 16% 的电力来自本土的可再生或核电，而光台积电（TSMC）一家就消耗了台湾 8% 到 10% 的电力。其余 84% 来自烧煤、烧油、烧天然气——几乎全部经海运进口。要切断台湾的天然气供应，中国只需封锁三座 LNG 接收站。

**Angelica Oung（翁宇君）：**（关于封锁情景，据上下文归属）就最坏情景而言——对，天然气是没法储存的。所以你电网里的天然气越多，你自然就越脆弱，无论是面对封锁，还是仅仅"意外总会发生"。封锁方面，很明显，伊朗人已经证明了这是可以做到的。但中国甚至都不需要往台湾海峡里打导弹之类的。他们有船，有手段可以说："哦，我们有新的可再生能源规定，所有进入我们领海的能源船只都得拿到这个许可证。你没许可证，那你就出局了。"这只是一种情景。他们有 101 种方法来扰乱（能源）流动，而这些方法甚至都够不上"封锁"——因为封锁本身就是一种战争行为。

【旁白】想了解更多细节，我们采访了 Tsai Ing-Lu，他在台湾智库 DSET 主持"能源韧性小组"。

**Tsai Ing-Lu：** 台湾天然气的储备通常维持在约 11 天的消耗量。这是个恒定值，一方面是因为我们储罐有限，另一方面也是因为实际储存这么多 LNG 在技术特性上有多难。

【旁白】即便把战略煤炭储备算进去，Tsai Ing-Lu 估计台湾在当前条件下也只能撑约 40 天。一旦煤炭储备耗尽，CSIS（战略与国际研究中心）的兵棋推演发现，台湾总发电量会跌到封锁前水平的约 20%，到那时所有制造业都会停摆。

所以问题是：要把这个 20% 的数字往上推，得付出什么代价？要"斩首"离岸风电，解放军海军得深入台湾防空识别区，切断海底电缆。要炸掉太阳能田，需要制空权——而即便如此，把所有屋顶装了太阳能板的公寓楼都炸掉，也构成战争罪。可再生能源本质上是分布式的，而分布式的基础设施很难被摧毁。

## 七、支柱二的夭折：台电这个黑箱，与电价背后的货币政策

【旁白】前面提过，2016 年的改革有两根支柱。支柱一是废核。支柱二是拆分台电。台电（台湾电力公司）是国有电力垄断企业，1919 年在日本殖民统治下建立，1946 年被中华民国收归国有。台电高度垂直整合：如今它掌控全部化石燃料和核能发电，以及 100% 的输电、配电和零售。台湾消耗的每一度电都要经过台电。它唯一不拥有的，就是可再生能源。

这个（拆分）设想直截了当、也经过充分检验：把发电公司和电网（"电线"）分开，逼它们在价格上竞争，创造一个市场，让可再生能源开发商能自由地把电卖给工业用户。

九年过去，支柱二被亲手孕育它的那个党扼杀在摇篮里。2025 年 5 月 9 日，台湾立法院正式撤回了拆分台电的要求。这项立法由民进党立委发起，并在跨党派支持下通过。

**Jason Fung（化名）：** 台电工会欢呼雀跃。我们至今没看到任何迹象表明他们已经从外部启动了（拆分）。整个台电的结构就像一个黑箱。我们不知道亏损发生在哪里，也不知道为什么价格被定得这么低。

【旁白】那是 Jason Fung，一位台湾离岸风电行业的资深从业者，有多年跟台湾电网打交道的经验。Jason Fung 不是他的真名，为保护隐私，我们用 AI 工具对他的声音做了匿名处理。

要理解为什么这次"倒退"如此致命，我们得看看台湾给电力定价的机制。台电为电力本身设定人为压低的价格，这些价格由民进党掌控的行政院下属的"电价审议委员会"批准。然后台电转身去恳求政府补贴，来填补这个差额。记住：可再生发电是台电唯一不拥有的东西，台电自己发的电全部来自 LNG、煤和核能。所以这些纾困补贴，压倒性地是在补贴化石燃料。到 2025 年年中，台电已累计亏损 4180 亿新台币，约合 130 亿美元。在伊朗战争推动 LNG 价格暴涨 150% 之际，台电把居民电价冻结在每度 3.78 新台币，约合 12 美分。

**Tsai Ing-Lu：**（据上下文）政府之所以想把电价压得这么低，是货币政策。因为电价是 CPI（消费者物价指数）里一个重要因素。只要他们能控住 CPI、把它压在 2% 以下，他们就没有加息的压力。

【旁白】突然按用户实际用能成本收费，将是政治自杀——这正是三个党都不愿意开放台湾能源市场的原因。与此同时，人为压低的化石燃料电价，确保了可再生能源无法竞争。

**Tsai Ing-Lu（或受访者，据上下文）：** 现在我们看到可再生能源电价大约是每度 4.5 到 5 新台币，而传统电价平均约 3 新台币。可再生比传统电力贵得多。如果没有这种推动或鼓励，正常情况下人们是不会想用可再生能源的。

## 八、电价的产业歧视

【旁白】台湾不只是补贴化石燃料多于可再生能源，它补贴得还不均衡。台电涨价时，会按产业区别对待。

**Angelica Oung（翁宇君，据上下文）：** 他们把台湾的产业分类。他们说：我们有这些高毛利产业，可能是半导体，可能是 AI 数据中心，这些是更赚钱的，那这次涨价就直接冲着它们来。但他们又把另一组产业归类为低毛利、赚钱少的，然后说：好，你们可以享受电价上调的延后。这真的会打消这些产业去寻找创新方法管理能源成本的动力，进而拖慢整个国家的经济发展。

## 九、离岸风电的悲剧：本地化要求酿成的烂尾

【旁白】离岸风电或许是这套电价机制下最悲情的受害者。台湾拥有全世界最好的一些离岸风场——台湾海峡本质上就是一条 200 英里长的"风洞"。国际开发商曾排着队要来这里建风电，结果它却变成了一场烂摊子。

**Angelica Oung（翁宇君）：** 离岸风电是蔡英文的"心头肉"。她在任期间，风电要什么给什么；每次它陷入严重麻烦，就总会奇迹般地有人来搭救。到了赖清德治下，情况不再如此，一切都停摆了。所以，台湾可再生能源的问题——其"原罪"——是过度承诺。因为当你像蔡总统 2016 年启动可再生能源铺开时那样过度承诺，你就制造出各种条件去满足那些极其激进的里程碑。于是你往里砸钱。而当砸进去的钱远超项目管线和承载力时，腐败就成了这种局面下不可避免的产物。

【旁白】台湾的离岸风电计划分三个阶段（Round）。第一阶段是小型的、有补贴的示范项目。2018 年配置的第二阶段提供了 20 年期的"躉购电价（feed-in tariff）"——这是政府按每度电付给可再生能源开发商、并在合约存续期内锁定的一个保证价格，是扶植可再生产业的标准机制。真正的重头戏是第三阶段：15 吉瓦，目标是 2026 至 2035 年。但 3.1 和 3.2 阶段附带了臭名昭著的"本地化（local content）"要求。要中标，开发商必须承诺在台湾本地制造风机部件；承诺的本地化程度越高，竞标得分越高。问题是，台湾根本没有风机供应链。

**Angelica Oung（翁宇君）：** 我觉得，有时候你为一个项目制造政治共识，需要照顾到不同的选民群体。所以蔡英文启动时，除了那些非常激进的目标，她还承诺：哦，这将成为台湾的一个新产业，我们要在本土造这些风机。所以"就算电看起来更贵，为了经济也值得"。但问题是，它对经济并不值得——因为很多风机部件是高度专业化的，而压低价格靠的是规模。如果你只有台湾这个市场，规模就不大。所以我们台湾造的部件，成本有时是台湾以外部件的两到三倍，把整个盈利前景都拖垮了。

我非常非常失望，因为我一度是蔡英文总统的铁杆粉丝。她是那么酷的一个"girl boss"总统，为我们赢得了那么多国际善意，这部分工作她做得非常好。但她的能源方案简直是一场灾难。说实话，那就是我开始怀疑民进党的起点。我以前相当亲民进党，也相当认同"台湾应该挺身对抗中国、至少保住我们事实上的独立和我们的生活方式"这个理念。但我现在的感觉是：你们没把这事当回事，你们在搞政治表演。因为如果你连能源安全都不认真对待，我怎么相信你在认真对待国防？而如果我不信任你真有能力保护台湾，那我就得用一种根本不同的方式，去思考如何守护我自己的家。

【旁白】随后，政府宣布 3.3 阶段将完全取消本地化要求——这一转变由欧盟 2024 年 7 月在世界贸易组织提起的申诉促成。台湾在 2024 年 11 月和解结案，同意逐步取消这些规定。

**Jason Fung（化名，据上下文）：** 如果现在（3.3 版）还只是草案，如果最终版本比 3.1、3.2 更有吸引力，那对那些在前两轮中标的开发商来说，就等于是在让他们放弃已经拿到手的那片"绿地（green field）"，转投 3.3。

【旁白】采访 Jason 时，故事的这一部分让我有点崩溃。政府说：抱歉各位，原来这些本地化要求根本无法满足，我们现在才意识到这一点。于是政府一边继续要求某些离岸风电项目去满足一个"政府自己都承认无法满足"的要求——否则的话，它们就只能放弃台湾周边这片有限资源般的海域。

【旁白 / 采访对话】
—— 为什么政府不能解决这个问题？
**Jason Fung：** 因为不是所有人都没能兑现（本地化）承诺，有些人仍然做不到。哥本哈根基础设施合伙公司（CIP）就是那个还在推进、并在 3.1、3.2 开发上取得不少进展的。
—— 你说"不少进展"，那风机——那些叶片在转吗？在发电了吗？
**Jason Fung：** 还没有。

【旁白】本地化要求重创了开发商。德国公用事业公司 RWE 在 2023 年 11 月宣布退出台湾。日本巨头 JERA 于 2023 年把它在"海能（Formosa 3）"项目中的股份卖给了 Corio 和道达尔能源（TotalEnergies）。旗舰项目"允能（Yunlin）"——这个 640 兆瓦的风场——历经多年建设延误和成本超支，直到 2025 年初才终于全面投运。它那笔原本 2019 年由 19 家银行签署的 700 亿新台币融资协议陷入紧急重组，出资方不得不投入约三倍于原始出资的股本。

**Angelica Oung（翁宇君）：** 躉购电价（FIT）起点是高的，但之后本该有一条学习曲线，项目成本本该激进地下降、直到变得非常便宜。问题是，在台湾成本没有下降，反而上升了。上升是因为本地化要求被塞了进来，抬高了成本；同时，在乌克兰危机的余波中，大宗商品价格疯涨、利率疯涨。离岸风电项目习惯了、也依赖了整套（低成本环境），它们的整个商业逻辑都建立在零利率环境之上，然后铜价又涨上去了。全世界的风电项目都在往外扔"救生索"——它们在美国也在扔救生索。欧洲的韧性稍好一点，毕竟是离岸风电的老家；但被冲击的不只是台湾，只是台湾被冲击得特别狠，因为它还背着那些愚蠢的本地化要求。所以你现在取消本地化要求，反倒有了个真正的麻烦：因为现在有一群人非常生你的气——那些往可再生能源部件工厂里投了很多钱的人，他们指望着本地化要求能维持下去，就算不是永远、至少维持一段时间，好让他们至少能收回成本。所以这是个非常棘手、黏糊糊的局面。

【旁白】另外，这一点或许不言自明，但台湾禁止中国企业参与其离岸风电产业。这本可以成为欧洲和日本开发商的一大利好——它们一直难以与中国的过剩产能竞争。可民进党政府却让"台湾制造"的部件优先于民主伙伴造的部件，结果这些项目贵得惊人。到 2024 年底，台湾只装了 2.8 吉瓦的离岸风电，远低于其最初 5.7 吉瓦的目标。但台湾要重回正轨仍有希望。

**Yuxuan Ye（叶宇轩，据上下文）：** 严格说，台湾只是没能达成第一个里程碑（预计对应今年 11 月）。所以我会说，这是坎坷，但不是死路。可再生能源发电占比在过去十年已经增长了三倍多，从 2015 年的 4.2% 升到 12.7%。而且去年，全年可再生发电量原本预计是 2575 亿度，实际却达到了 2889 亿度，比原计划多出 314 亿度——相当于 404.5 座新增燃气机组的年发电量（此处 ASR 数字存疑），这其实很糟糕。所以这说明：这并不是能源技术的失败，而是经济快速增长跑赢了基础设施政策的挑战。

【旁白】不过这是不是一种"自我安慰（cope）"呢？我们先把它记下（put a pin in this），稍后再回来。

## 十、太阳能的困境：主要卡在土地上

【旁白】太阳能有它自己的问题，而且大多与土地有关。台湾面积只有马里兰州那么大，主岛大部分被密林覆盖的山脉占据。正如你可能预料的，太阳能项目一直被土地用途纠纷和许可流程的噩梦拖住。

**Yuxuan Ye（叶宇轩，据上下文）：** 在太阳能田这块，他们想出的方案是在鱼塭（fish farm）上建光电场。但这其实也带来了很多问题。比如，一开始搞这个"农地"项目试点时，很多人干脆把农地改成了光电场，因为那更有利可图。这实际上冲击了农地，也会威胁到我们的粮食安全。

【旁白】于是农业部叫停了这种做法。太阳能开发商的回应是：把大项目拆成小项目，以规避监管。最臭名昭著的案例是"力暘能源（Leon Energy，音译存疑）"。2024 年 4 月，台湾检方起诉了 15 人，包括力暘集团董事长、能源局太阳能组组长，以及经济发展局前局长——罪名是使用伪造文件，规避 2020 年那项"禁止将小块农地转为光电"的禁令。估算的非法获利高达 91 亿新台币，接近 3 亿美元。而这，只是一家公司。国有的台盐绿能也有自己的丑闻：前董事长在一起虚增工程成本的计划败露后潜逃出境，几周后向检方投案。云林和彰化的地方乡镇长，因"每度电回扣"被起诉。结果就是：公众如今把可再生能源和见不得光的土地交易划上了等号。

---

## 十一、电池储能：为一个错误的市场而建

【旁白】我们下一个"卡夫卡式失灵"的案例研究，是电池市场。电池储能本该是让可再生能源真正跑起来的技术：白天存下太阳能，晚上放出来，抹平间歇性的问题。台湾其实已经建起了一支相当可观的电池"舰队"。问题在于，这支舰队是为一个错误的市场而建的。

**Jason Fung（化名，据上下文）：** 在别的国家，电池可以在电价低的时候存电、在电价高的时候再放回电网。但在台湾，只有台电能卖传统电力。当储能系统无法证明它存的电全部来自可再生能源时，它在台湾就不被允许做电力交易。

【旁白】让我确保你听懂他在说什么。在大多数国家，电池运营商在需求低时买入便宜电、存起来，在需求高时卖出——这叫"能量套利（energy arbitrage）"，也是电网级电池赚钱的方式。但在台湾，直到 2025 年那次撤回台电拆分的修法之前，只有台电被允许出售化石燃料发的电。电池存的是电网里的电，而电网是可再生、核能和化石燃料电力的混合体。由于电池无法证明自己存的电纯粹来自可再生能源，它们就被台电的垄断挡在了商业套利市场之外。它们能做的，只是一些更狭窄的产品：调频（frequency regulation）、辅助服务（ancillary services），外加一个较新的备用容量市场。而这支"舰队"恰恰就是照着这些市场建的。

问题是，这些市场又小又固定。当太多电池运营商涌进来，拍卖价格就崩了。

**Jason Fung（化名）：** 当供给超过需求，拍卖价格就会掉到零。台湾现在所有的电池都在受这个"零价格"的苦。

【旁白】2025 年那次改革——就是废掉台电拆分的那一次——确实创设了一套许可制度，允许电池场存电并卖给台电用于"需求响应（demand response）"。但这和"让套利合法化"不是一回事。台湾没有一个放开管制的现货市场，能让价格逐小时大幅波动。事实上，对 98% 的家庭而言，台电对高峰时段用电和半夜用电收取的是同一个价格，这就让套利根本无从谈起。工业用户在高峰时段每度电也只多收 6 到 7 新台币，这让电池场很难盈利。而没有电池，用可再生能源去替代"非间歇性"的天然气就不可能，这就让台湾在结构上被死死绑在进口上，也保证了台电能继续从纳税人那里领取"施舍"。

【旁白】所以，台湾的能源市场依然被牢牢控制着。关于"台电的垄断是不是真正的约束瓶颈"，Tsai Ing-Lu 有不同看法。

**Tsai Ing-Lu：** 我确实觉得，拆分台电并不是解决我们当前困境的前提条件。因为主要障碍，如我所说，是关于（可再生能源部署受限的）土地、电网瓶颈和电网结构。这三样，不管台电的公司结构如何，都会存在。再者，我认为我们的可再生能源市场其实已经在很大程度上由独立发电商（IPP）驱动，真正的解方在于市场改革，而不只是公司层面的重组。

**Angelica Oung（翁宇君，据上下文）：** 问题是，要拆分台电——让一个实体负责发电、一个实体负责输电、一个负责营销和销售——你需要对能源政策采取一种相当"放手（hands-off）"的态度。而乌克兰战争之后，有大量干预去压低电价，这当然把台电的财务搞成了一团糟，只能靠纳税人纾困。当你有那种程度的干预时，你就没准备好迎接电力市场、没准备好迎接价格自由化。因为价格自由化的整个理念，就是"让市场决定，让稀缺来引导你"。

【旁白】在台湾真正跑得通的电池经济，是"表后（behind the meter）"——也就是电池布置在像半导体晶圆厂这样的大工业用户附近，用来针对分时电价优化用户自己的电费。今年 3 月，经济部宣布，对安装表后储能的工业用户给予每兆瓦时最高 500 万新台币的补贴（ASR 单位存疑）。这是一个强烈信号，说明政策制定者看到了"表前（front of the meter）"市场的缺口，却选择去补贴"私人电费管理"，而不是去建那个能让电池参与套利的商业市场。当然，中国制造的电池不符合这项补贴资格。

---

## 十二、许可流程与"绿能蟑螂"

【旁白】你可能会想：政府为什么不干脆多补贴一点可再生能源，好让它和化石燃料公平竞争？嗯，他们以前是这么做的。政府在 2010 年代末提供了慷慨的躉购电价，启动了台湾的太阳能和风电产业。但随后，丑闻开始了。我们采访了"气候时代催化剂"的创始人 Ricky Huang，了解更多细节。

**Ricky Huang（黄瑞其）：** 你常常会看到台湾南部的一个太阳能项目——某些高层政府官员投资了这个项目，然后去驱赶当地居民，或者跟黑道之类的合作，来给项目"快速通关（fast-track）"，诸如此类。这样的"鬼故事"太多了。我不认为它们是空穴来风。我确实觉得这些故事……太……（斟酌用词）我相信其中很多是真的，但我也觉得很多被夸大得离谱。我感觉被声称的案子比实际发生的要多得多——当然，我没有确切数字。即便如此，这肯定是个真实的问题，腐败不是编出来的。但我记得最近有一项关于可再生能源领域腐败的研究：往往并不一定是那些高层官员参与这些腐败或行贿，很多时候，真正的幕后主脑是那种没人知道的中层官僚。因为他们相对不为公众所见，不太暴露在这种审视之下，反而能从事这些勾当、并掩盖自己的行为。

【旁白】台湾针对可再生项目的许可流程，在各地极不统一，而且常常完全不透明。这就为台湾本地媒体所称的"绿能蟑螂（能量蟑螂 / 綠能蟑螂）"创造了空间——那些腐败的地方官员和黑道，向开发商索贿，以换取许可证、以及"保护你不受抗议干扰"。

举一个例子。2020 年，海神太阳能（Poseidon Solar Energy，音译存疑）宣布计划在台湾西海岸云林县口湖乡建一个"渔电共生"项目。消息一出，时任乡长林某某（Lin，音译存疑）就通过中间人联络。最初开价是 800 万新台币贿赂，谈到了 400 万新台币，约合 12.5 万美元，用来加速许可、并"消除公众抗议"。海神分三期付了这笔贿赂，许可在两周内就顺利过关。这桩交易最终东窗事发，林某某因行贿受贿被判 10 年。而那个项目呢？被废弃了。四年后记者去实地探访时，看到的是一片荒废之地，堆着废土，工地告示牌上的电话号码全都停机了。

而腐败可以爬得比地方乡长更高。2025 年 8 月底，郑亦麟（Cheng Yilin，音译存疑）被台北检方羁押。他基本上是蔡英文任内整个离岸风电产业的政府对口人，且担此重任的年纪出奇地轻。台湾媒体因他与蔡总统的亲近，称他为"小英男孩（小英男孩）"，Ricky 则把他叫作蔡的"可再生能源低语者"。郑于 2025 年 12 月 26 日被以行贿受贿、洗钱和财产来源不明起诉。检方称，他从一家名为"东贵（Tonguei，音译存疑）"的营造公司收取了 198 万新台币贿赂，作为回报去向台北方面施压——他据称是在施压，要求台北为其内湖区（台湾的科技与数据中心心脏地带）一个开发项目"快速通关"供电馈线容量。检方还标记出另有 600 万新台币来源不明的资产，据称通过亲属洗白。检方求处 14 年。

【旁白】谈到"东贵案"的逮捕以及更广的一波起诉浪潮时，Ricky 的看法是：民进党内部正在发生一场"党内清洗"，而可再生产业是殃及的池鱼。赖清德总统已宣布向"绿能蟑螂"开战，但批评者指出，他主要针对的是与其前任蔡英文有关联的官员，而不是去改革那个最初为腐败制造机会的许可制度。Ricky 告诉我，赖清德非常在意恩怨（gratitude and vendetta），任何多年前挡过他路的人，如今在他掌权之后都成了目标。蔡赖之间的紧张可以追溯到 2019 年民进党初选，当时赖挑战蔡的连任提名。可再生产业——蔡的心头肉——就在赖寻求与蔡切割的过程中成了打击对象。

**Ricky Huang（黄瑞其）：** 所以，再说一遍，这（腐败）绝对是真实的，但我感觉近年来它被某些利益集团武器化，用于各种目的。有些人是从"邻避（NIMBY）"角度出发的：我不想我家周围有太阳能板，或者我不想我周围有风场，或者我不想要地热什么的——总之我不想要。也有人是想通过批评可再生能源，来抬高比如核电、甚至抬高天然气。你看很多这类论点，表面上像是笼统地反对可再生能源；但如果你真去反驳、去和这些人做更深入的对话，往往会发现，他们只是聚焦于可再生能源某一个方面的潜在缺陷。比如，也许是程序那一块催生了很多腐败传闻，或者是技术那一块——间歇性、非基载。但归根结底，他们并不是从根本上支持或反对某种能源，他们在意的是程序、是底层经济性，等等。

---

## 十三、让腐败"黏住"的，还有许可流程本身

【旁白】还有一样东西让腐败"黏"得更牢：许可流程本身。澳大利亚的电气化布道者 Saul Griffith（索尔·格里菲斯）描述了在他的国家安装家用太阳能板是怎样运作的：你上网、输入你的地址，大约 10 分钟内你就能收到五家承包商的报价。一旦你选定供应商，施工许可最快 24 小时就能签发。拿到电力公司的并网许可，在昆士兰只要一小时，尽管完整并网要稍久一点。理论上整个流程一周就能搞定，实际中两到六周更现实。

**Ricky Huang（黄瑞其，据上下文）：** 在加州，我的印象是大约要六个月，而且因为各种繁文缛节和官僚，还可能拖得更久。在台湾，如果你要做屋顶（光电），全部加起来远远超过一年——平均是一年，甚至可能超过一年。所以它甚至比加州还糟，尽管加州以官僚和繁琐著称。你要跨越那么多不同的障碍，而这还没算上你必须做的潜在环境影响评估。如果你说的是风电或地热，你甚至可能还得跟当地居民开协商会、做额外的噪声影响评估等等。这给开发商制造了大量的摩擦。而我觉得让情况更糟的是：公众里反可再生能源的情绪越多，政府就越不愿意去加速或精简这些流程。所以老实说，我不认为这些政府官员真的花了三个月去研究、去理解这些项目的并网影响。我觉得他们几乎是"必须"等上几个月，因为他们害怕批得太快会带来的政治反噬。所以这真的是个"观感与认知"的问题。

---

## 十四、被低估的成绩：台湾的屋顶太阳能密度

【旁白】尽管我们一直在描述各种失灵，台湾在太阳能上其实取得了一些实打实的进展。

**Ricky Huang（黄瑞其）：** 如果你看太阳能的密度——平地上屋顶太阳能的密度——把台湾和全世界比，台湾是世界第一。事实证明，平地屋顶太阳能的密度……这意味着，即便太阳能只占台湾能源结构的不到 10%，它的密度和加州、澳大利亚这些传统上"太阳能富裕"的地方相比也相当高。所以也可以说，我们已经把那里存在的很多潜力都开发出来了——这不代表我们没有更多潜力，但意味着大部分"低垂的果实"已经被摘得差不多了。

【旁白】这听起来好得不太真实，于是我们向 Ricky 要了出处。结果发现他记岔了一点。他给我发来了一个来自"台湾气候行动网络"的资料链接，并附上如下更正：引用——"台湾的屋顶太阳能密度高于任何我们通常会联想到高太阳能装机量的国家，但实际上它是全球第二，仅次于荷兰。"这说得通：台湾土地极少，所以这个统计里的分母更小。

我们还采访了一批非常亲民进党、尤其亲可再生能源的人。他们常说的是：你看，我们在往电网里加绿电（风电之类）这件事上其实做得非常出色。也许问题更多不在于供给增加得多快，而在于需求增加得多快——快到这成了一个非常难解的问题。

---

## 十五、电网紧张到什么程度：连"蚂蚁级"数据中心都建不起

**Angelica Oung（翁宇君）：** 听着，台湾现在的电网太紧张了。你在北台湾连一个 5 兆瓦的数据中心都建不起来。按现代标准，5 兆瓦的数据中心简直是"给蚂蚁用的数据中心"，太小了。5 兆瓦——因为在日本、在中国、在美国，人们在建几百兆瓦的，他们谈的是吉瓦级、吉瓦级的数据中心。所以，你在北台湾——那可是工业心脏地带——连一个 5 兆瓦的数据中心都选不了址，这太可悲了。后来我听说南台湾有个 80 兆瓦的数据中心，我心想：嘿，这总算是个像样的项目了。结果人家说：等等，如果你告诉我它是个 80 兆瓦的数据中心，可因为缺电，它必须拆成四期，而且各期可能建在不同的乡镇……那这不是……这是四个 20 兆瓦的数据中心套上一件风衣，硬装成一个（大）数据中心。所以，是啊，而且问题是，谷歌、亚马逊，所有这些科技巨头，只要能建，他们巴不得在台湾建无数个数据中心。他们当然想，从很多方面看这里都理想、地处中心，但他们被电力卡住了。我们的芯片产业被电力卡住了，光台积电一家就占了电网的 10%。所以，是啊，人们会觉得"至少我们还没停电"。可你把钱留在桌上（没赚到）时，这就不是好事。台湾不能只当"台积电之岛"，不是每个人都在台积电上班。我们已经在制造巨大的失衡了：如果你不在台积电，经济里能干的事就更少，所以政府相当有责任去尝试别的产业，而 AI 会是绝配。赖清德总是把 AI 挂在嘴上、说那是未来，可没有数据中心，那就不可能实现。我们没停过电，但我会说，我们是"能源饥饿（energy starved）"的——就像一个本可以长得更壮的人，饮食里却没有足够的蛋白质。

---

## 十六、赖清德的惊天逆转：重启核电

【旁白】然后，2026 年 3 月 22 日，赖清德总统投下了一枚震撼弹。赖公开宣布，已退役的核二厂（国圣）和核三厂（马鞍山）符合重启条件。赖援引了 AI 发展带来的电力需求上升和脱碳目标。他提出三个条件：核安全保障、废料处理方案、社会共识。台电正在向核安会（核能安全委员会）提交重启方案，马鞍山最快可能在 2028 年底重启。

台湾媒体用这样的标题报道了这条新闻："重返非核家园（的对立面）""扔掉非核主义的祖宗牌位"。这是一次惊人的逆转。民进党花了 40 年把"反核"打造成一项标志性事业、把"非核家园"当作几十年的招牌能源政策，蔡英文更是把关掉每一座反应堆当成她的政治遗产。而如今，在最后一座反应堆熄火还不到一年，她的继任者就要把它们带回来。

**Angelica Oung（翁宇君，据上下文）：** 从根本上说，我不认为赖清德总统反核。仅从他说过的话，就有大量证据让人相信他其实亲核，他之所以在核电上一直拖延，是因为他自己党内有人在拖他的后腿。

【旁白】但重启两座反应堆，真能解决台湾的能源危机吗？我们的信源在"量级"上意见不一。重启这两座核电厂大约能覆盖台湾当前电力需求的 10%——有用，但谈不上颠覆。Angelica 指出，仅一座反应堆的 6%，就已经比全岛所有太阳能板加起来发的电还多。而如果台湾把那座从未开张的第四厂建成，核电的贡献可以达到 16%–18%。

---

## 十七、核四（龙门）的诡异身世，与"辐射水"名场面

【旁白】说到第四座反应堆，龙门电厂在四座里有着最离奇的故事。它于 1990 年代末动工，那时核一、核二、核三都已在运行。龙门本应是下一代反应堆——由 GE（通用电气）设计的先进沸水反应堆（ABWR），反应堆机组由日立和东芝建造，汽轮机来自三菱重工，土建由清水建设承担。但施工拖了 15 年。反核抗议针对龙门组织得比针对其他几座更凶，项目最终从未建成。

**Angelica Oung（翁宇君）：** 而问题，很不幸，又是政治。因为核一、核二、核三建得相对……没那么费劲。但龙门在建设上遇到了很多麻烦，因为到那时候，人们反核已经反了很久。他们做的是组织居民去反对它，施工走走停停，因为他们不停地说"这底下有地震风险"——全是胡扯。但他们在某个时点意识到，抹黑这个项目，比抹黑核能本身要容易。因为你要抹黑核能，你就得解释为什么其他几座反应堆运转得好好的、毫无问题；可如果你说龙门这个项目本身有什么特别糟糕之处，倡议者就更难反驳了。所以他们改变了策略，把这个项目抹黑成一个独一无二地糟糕又危险的项目——我记得蔡英文总统称它是一座"危险的、拼装的反应堆（Frankenreactor，怪物反应堆）"，只不过因为它的部件来自不同供应商——可每一座核电厂都是这样的。

【旁白】针对核电的抹黑攻势和政治化，催生了两大党的政治表演。

**Angelica Oung（翁宇君）：**
—— 你想不想听杨（Crystal Yang，音译存疑）和那瓶"辐射水"的故事？
—— 天哪，那太精彩了。那简直是台湾民主的巅峰。如果你需要一个理由去捍卫台湾民主，这就是了。当时有个民进党的、反核的政客决定搞个行为艺术。他弄来一托盘普通矿泉水，贴上"辐射水"的贴纸，然后把水运到兰屿——那是个偏远的离岛，那里存放着一些低放射性废料。我们说的是几乎没什么放射性的东西——是进过核电厂的鞋套和抹布之类，甚至还有些医疗废物，因为，你知道，人们忘了做 X 光之类的时候会用到放射性。所以那里也有些医疗废物。他实际去了岛上，把那些水在某个设施上放了一晚，第二天回来取走。然后他带着一个新闻团队去国民党总部想搞个行为艺术。他带着那水，把水怼到人家脸上，说："这是从兰屿来的辐射水！"杨（Crystal Yang）下来了，她是发言人。他话还没说完，她就一把——她知道他在干什么——一把从他手里抢过瓶子，当着他的面一饮而尽。他当场愣住，结巴，什么也说不出来，气得要命，然后跑掉了，把他所有的水都扔在了那儿。而美妙之处在于，他带着一个新闻团队，整个过程都被拍了下来。当晚晚些时候，Crystal 和一群国民党政客直接开了直播，全体在镜头前喝那些水，一边向公众科普核能。

---

## 十八、出路：不是核电"或"可再生，而是"两个都要"

【旁白】那么台湾究竟需要什么？据我们采访的每一个人所说，答案不是核电"或"可再生，而是"两个都要"。从根本上说，这是一个政治经济学问题，不是技术问题。

我问了"交易(quid pro quo)"的可能性：民进党能不能给国民党/民众党一笔重启核电的预算、批准一个核废料场址、或给小型模块化反应堆（SMR）拨款，来换取可再生能源改革？Ricky 告诉我，他没想过这个主意，但对它能否在如此极化的环境里奏效持怀疑。而且，赖清德单方面逆转了废核政策，反倒吊诡地拿掉了他自己手里的筹码——在野党现在知道他其实喜欢核电，所以"亲核的胡萝卜"已经不足以成为一个够分量的让步，去把这笔交易卖给那些反可再生的选民群体。

**Ricky Huang（黄瑞其）：** 我个人对核电相当"不可知论（agnostic）"。我觉得如果你搞核电，那当然能替可再生能源分担一些土地占用的负担。但核电也有它自己的很多挑战。核电大概是台湾除了两岸关系之外最极化的议题。所以，再说一遍，我对核电直接持不可知态度，但我觉得核电未必就比其他能源来源更容易、更快。当然，我们应该"全都要"，应该考虑它们的潜力。但我不觉得靠加倍押注核电，我们就可以在部署可再生能源、或多做微电网（microgrid）上更松懈。

【旁白】Ricky 在采访中还提出了另一个有意思的想法，他管它叫"Pax Electrica（电力和平，仿'Pax Americana'）"。

**Ricky Huang（黄瑞其）：** 我们已经从澳大利亚进口了大部分铁矿石。有没有可能，澳大利亚不仅给我们供应原料，而是更进一步：把铁矿石加工成生铁，再把生铁运到台湾，让台湾把它加工成钢？炼钢有两步：炼铁和炼钢。炼铁那一步实际上占了整个流程 85% 的能耗。所以，澳大利亚正拼命寻找新的出口机会，来替代传统的化石燃料出口；台湾则正拼命寻找新方案来满足自己的负荷增长。我觉得，如果你能设法把这个需求和供给"撮合"起来……而且这不只是台湾—澳大利亚的故事。像日本、韩国这些地方，特征非常相似；而像加拿大、智利、墨西哥这些国家，又和澳大利亚非常相似，甚至加州，靠它过剩的（清洁）电力已经能做到每兆瓦时 20 到 30 美元。所以我认为，这些正是我们可以用贸易、商业和地缘政治，以清洁能源和电气化为核心要素，去重塑供应链、重塑全球经济的机会。

【旁白】我对这个想法相当怀疑。当你的地区正面临入侵威胁时，把重工业外包出去，有一些相当明显的代价。但耐人寻味的是，他居然觉得这比"建成核四、把风电和太阳能铺开做到最大"更容易。还有另一个想法，是叶宇轩（Ye）在我们采访中反复回到的：控制需求。

**Yuxuan Ye（叶宇轩）：** 因为台湾在电力上不是运行在一个放开管制的市场里，所以既没有清晰的政府干预、也没有市场干预去抑制这种需求增长。每次有扩张需求——尤其是芯片制造业，但也包括其他产业——当他们哭喊着要更多电时，政府的第一反应就是想办法弄出更多（供给），却真的没有办法用比如能效措施、或任何其他定价机制去有效抑制这种增长。

【旁白】她认为"减少需求"在政治上比"扩大供给"更可行——这也许是个坏兆头。但考虑到台电人为地把电价压得极低，也许桌上确实还留着一些"低垂的能效果实"没去摘。

那么，我们把信源们呼吁的改革叠起来看。第一，把各地的许可流程标准化。第二，恢复对可再生能源部署的真正激励——躉购电价、税收抵免，或者取消那种补贴化石燃料所形成的人为价格优势。第三，把交易平台自由化，至少放到让电池能做套利、独立发电商能自由售电的程度，即便台电仍保持整合。第四，把核电作为可再生能源的"基载补充"、而非竞争对手重新启动，并就"建完核四"开启对话。第五，建立真正的需求侧政策，对高峰时段用电收更高的价。

---

## 十九、国际听众能做什么

【旁白】我问了几位嘉宾，国际听众在台湾争取能源独立的斗争中能扮演什么角色。毕竟，欧盟曾在世贸组织成功挑战了台湾的离岸风电本地化要求。但我想知道，民主国家的政府还能怎样把事情往正确方向推——或者，也许在地热场址上合作，因为地热和从水力压裂（fracking）中学到的技能有很多交叉。

**Ricky Huang（黄瑞其，据上下文）：** 我感觉台湾正承受着来自美国的巨大压力，要它采购 LNG、甚至石油。你提到的一些想法，比如用水力压裂技术并把它用到地热上——这正是像 Fervo（Fervo Energy）这样的公司在做的——我觉得台湾绝对能从中受益。但美国政府会有多大意愿去和台湾合作开发那些技术，还不清楚。我感觉美国政府、或者说本届政府的首要优先事项，是卖给台湾更多 LNG、更多石油。也许那些别的技术会作为 LNG 的"搭售"一起来，但那不是优先项。而且我觉得，这不只是"美国在挤压台湾"——这也是"台湾想要保持对美国的相关性（relevance）"。

【旁白】补充背景：2026 年 2 月，台湾与特朗普政府签署了一项对等贸易协定，承诺在 2029 年前采购逾 400 亿美元的美国 LNG 和原油，这将把美国 LNG 进口提升到约占台湾总供给的三分之一。综合这一点，再加上大家对"核电换可再生"这种交易并不乐观，我得到的感觉是：台湾的气候倡议者这些年撞了很多南墙。当然，政治行动就是在"可能的范围内"把影响最大化。但台湾是个年轻的民主体，"可能性的剧本"还在书写之中。考虑到赌注如此之大，我忍不住想：会不会还有空间，去做一些"王金平式的穿针引线"，或者一些有创意的国际伙伴关系？如果你觉得我太理想主义了，请在评论区告诉我。

**Angelica Oung（翁宇君）：** 台湾对外国媒体过度敏感。所以我觉得，当我还是核电倡议者时，能说"嘿，全世界都在搞核电，你看，欧洲在做更多核电"，这对我非常非常有帮助。但从根本上说，这是台湾自己的议题、本地的议题，人们应该意识到到底在发生什么。如果说有一件国际听众能做、并且能大大帮到我们的事，那就是：摆脱那种非常肤浅的"国民党 vs 民进党"二分——好像一边是保护台湾的，另一边是想出卖台湾的邪恶巨魔。往深一点看：一边是嘴上说得漂亮，却没有真的去做（talk the talk, not walk the walk）。而这在台湾引发了大量的怨恨。我觉得这大概率会导致一场"选举反噬（electoral backlash）"，无论是今年的地方选举，还是——尽管还有两年——2028 年。就是……台湾人对民进党有一种"受够了、烦透了"的情绪。这跟两岸关系没关系，跟他们的无能有关。大量的愤怒，大量的怒火。所以（局势）会翻转，然后人们会有一种非常简单化的想法：假如翻转到国民党当选、一个戏剧性的结果，人们可能会说，"哦对，台湾人现在亲中了，他们不在乎民主了"。而那会是一幅错误的图景。真相是：台湾的能源出了什么问题，它是一个国际级的地缘政治风险。台湾非常脆弱，这里的人真的受够了、烦透了。

---

## 二十、结语

【旁白】台湾曾立志成为清洁能源的领跑者，但民进党那场"搞砸的绿色革命"，留下的是一座在结构上"上瘾"于进口化石燃料的岛屿。赖清德总统展现了勇气，他承认"非核家园"是一个幻想，而不是为了保住面子继续加倍下注。也有其他进步的迹象，比如解除对电池的法律限制、以及离岸风电本地化规则的松绑。但还有很多工作要做。

**Jason Fung（化名，据上下文）：** 我不会说它无解，我觉得那里存在结构性问题。我觉得，一路走来，民进党政府之所以在每一步上做对了事，都是因为我们已经站在了悬崖边上。（他们）似乎没有对专家的任何尊重，也没有那种……"有些事你不用亲手去摸炉子（就该知道烫）"的意识，各位。我就是觉得，这是我对民进党最大的挫败感。他们真的是这样：如果一个问题能用"话术（spin）"解决，他们就不想用"行动"去解决。

【旁白】能源贫困是一种选择，而台湾即将迎来一些关于"如何往前走"的艰难对话。在做这个选题的过程中，看到有那么多聪明、投入的年轻人在为台湾的能源独立而奋斗，让我看到了希望。但正如那句话所说——希望不是一种战略（hope is not a strategy）。

**Joe：** 而更了不起的是，如果你是卖方机构的长期空头、还能连续 13 年在你那个类别里当排名第一的宏观分析师（Extel 调查），那相当了不起。人们喜欢阅读、喜欢消费观点——不一定是被说服了去卖出，但他们喜欢听一系列不同观点、喜欢自己的思路被影响、喜欢压力测试自己的想法。

**Albert：** 名副其实的地方在于：媒体更多抓住了我对股市的看空，而不是我对政府债券的看多。我从 1982 年就开始在金融业工作，先在英格兰银行（就在这条路对面）待过，之前在买方（buy side）待过一小段——顺便说，这就是我为什么把 notes（研报）写得这么短，因为我当年在买方是真得读这些东西。客户和读者坐在那儿等着，如果三四分钟读不完，他们根本不会读。我 1988 年加入卖方，在 Kleinwort（后来的 Dresdner Kleinwort，德累斯顿·克兰沃特）待了近 20 年。

## 一、冰河时代论：长期停滞、储蓄过剩、债券多头 + 股票空头

**Albert：** 我见证了日本泡沫的后段，见证了辜朝明（Richard Koo，野村）所说的日本"资产负债表衰退（balance sheet recession）"以及它如何瓦解。当时西方经济学家说"日本你们全做错了，你们该直接清算资本存量、摆脱通缩"。而我在想：首先，日本正在发生的事，只是他们比西方**领先 10 年**——因为他们的信贷泡沫早得多；等泡沫在西方破裂时，你们不会去做你们建议日本做的那些事，你们会疯狂降息、竭尽全力阻止衰退。

所以在 1998 年后段，我觉得"这要来西方了"，于是我发展出了我称之为**冰河时代（Ice Age）**的观点——本质上是**长期停滞（secular stagnation）**论（后来 Larry Summers 讲的那套）：储蓄相对投资的过剩，压低实际利率和债券收益率，并导致估值的重新定价（re-rating）。但我们在日本还看到，过了一阵，通胀、债券收益率、利率继续往下走，然而它**不再造成市盈率（PE）扩张，反而相反**——通胀低到如此接近通缩，会造成 **PE 收缩**。所以我想做的，是把一个金融市场观点，嫁接到长期停滞论上，这套从 1996 年一路跑下来。

我以为它在亚洲危机后会立刻到来。你提到英国国债收益率处于 1998 年以来最高——我还记得亚洲危机、俄罗斯 GKO 危机的余波（顺便说，长寿有帮助：我可能记不住昨天发生了什么，但 20 年前的事记得很清楚）。然后从 2000 年起，随着债券收益率走低，你开始看到股市内部出现问题。这基本就是冰河时代论，它奏效得很好。所以虽然我是股票空头、也以此闻名，但我在**政府债券上是坚定的多头**。

## 二、股票空头"错"在哪：QE 把所有资产价格吹起来

**Tracy：** 在讲你现在看到的风险之前，回到冰河时代论——在股票这一侧，解释一下哪里出了问题？因为这正是你被批评、也被贴标签的地方：你对股票看空了非常非常久，结果没成。发生了什么？

**Albert：** 从 2000 年起，如果你看图，债券收益率继续下跌、而股票（盈利）收益率确实开始上升——所以你确实看到了和日本一模一样的东西。在我看来，让"股票去估值（derating）"脱轨的，肯定是**量化宽松（QE）**。它不是 2008 年只用了一次——在接下来的 10 年里它一直持续，基本上把所有资产价格吹起来，这正是 QE 的工作。而冰河时代在**股市内部**继续奏效：那些受益于低债券收益率的板块（防御性或成长板块）表现极其出色，相对周期性或价值股重估到了巨大的 PE 溢价。所以即便宏观层面的股票经理忽略我说的（"市场没跌啊"），在股市内部，这套依然非常非常相关——这就是西方的"日本化（Japanification）"。

## 三、日本化与 JGB"寡妇制造者"：债务/GDP 无关论 / COVID 后反转

**Joe：** 我们来谈日本化、以及日本本身——现在有很多非常重要的事在发生。在 2010 年代，日本国债（JGB）市场长期被称为"寡妇制造者（Widowmaker）"，因为所有人看着日本债务存量说"它在涨涨涨、日本债务/GDP 越来越高"，然而利率却在往下走，这让很多人困惑。你当时的判断是对的：那（高债务）其实无关紧要，债务可以越来越高、利率可以继续往下走。日本收益率一度是零、COVID 后很多时候甚至是负的。然而现在，日本以及其他所有发达市场经济体，利率都在往上走。所以不管当年在起作用的是什么关系，它翻转了。在你看来，COVID 后到底翻转了什么，使得全球（包括日本、尤其英国）利率都在上升、那个通缩与低利率的冰河时代真正走到了尽头？

**Albert：** 在我看来翻转的是——顺便说，在 COVID 衰退之前，我 2020 年初、疫情来临之前就在写：下一次衰退会见证一次"告别冰河时代"的转变。它为我奏效了很久，但我当时认为我们将转入一个**新范式**，那个"债券收益率下行"的故事会停止。原因是：在那之前，QE 基本上、几乎完全是注入**华尔街的血管**里。"QE 没有制造通胀"这个说法是胡说——它制造了大量通胀，只不过是人们喜欢的那种：房地产、金融资产的通胀。

**Tracy：** 资产价格。

**Albert：** 没人抱怨那个，除非你不拥有那些资产。它造成了大量**代际紧张**——年轻人买不起（房），这是我们待会儿要讲的民粹主义兴起的原因之一；它造成了大量不平等，连央行最终都意识到了。而我当时以为会发生的是：下一次衰退到来时，你已经如此接近彻底通缩（记住那时那么多市场是负债券收益率，欧洲已经清楚地掉进了日本化陷阱、美国正朝那儿走）——我预测我们会**翻转进入一种现代货币理论（MMT）式的 QE**，开始把钱注入**主街（Main Street）的血管**、并稍微注入华尔街。

**Joe：** 转向财政。

**Albert：** 基本就是经典的减税、支票撒到人们家门口、由货币创造来买单。我没有清楚预见到疫情会让消费者价格的通胀局面糟糕得多（因为供应链受限）。我读了不少 MMT 的东西——我不太有货币主义、凯恩斯主义之类的教条观点，我很"天主教（兼收并蓄）"，我把所有主题都拿进来。MMT 里有相当多我同意的部分。读 Stephanie Kelton 的书（《赤字迷思》），有一件事绝对清楚：他们说"是的，我们能这么做、它不制造通胀，**但当你触及产能约束（capacity constraints）时，你必须停下来**"。而没有什么比 COVID 期间的全球经济更受产能约束了。所以在我看来，他们当时那么做是疯狂的、会制造通胀——你从广义货币增长就能看出来。

## 四、核心分析错误：民选政府无法在触及产能约束后停手

**Joe：** 说清楚——你说我们会跳到民粹主义，它和当前经济政策高度交织。这个"失败"，是不是这样一个前提：政府在触及产能约束后**永远无法停止财政扩张**？你有撒钱、有直升机撒钱、有支票、有减税——在 COVID 最糟时可以说相当正当——但核心的分析错误，是那个"在你触及产能约束之后、政府有内部能力说'好，我们到点了、必须加税来停止发支票'"的想法？民选官员有能力说"我们触及产能约束了、现在必须收回支票"吗？

**Albert：** 我不认为他们在**天性上（congenitally）**能做到。这就是我要说的。

**Joe：** 这是分析失灵之处吗？

**Albert：** 是"药方"失灵之处，也是未来如此可怕之处。比如在美国，预算赤字在 COVID 之前、（特朗普）第一任期就已经和经济现实脱节了——那是你第一次看到在没有衰退或危机的情况下，赤字奔向 GDP 的 6%。而现在我们在 GDP 的 **7%**（我进来前刚看了 IMF 的数字），在失业率这么低的时候还是 7%。没有胃口去（削减），而如果政客试图去做——我认为英国当前问题的一部分，收益率在 28 年高位，不是因为他们没试，他们试了。但这是一根非常细的钢丝：既要安抚债券市场、又不能把选民惹毛到你即将下台。

**Joe：** 去迪拜。

**Albert：** 你即将下台、或你的高纳税人即将（跑路）去迪拜。这是英国政府的问题之一：除非有危机，否则选民不会容忍（紧缩）。所以政客几乎需要一场欧元区式的希腊-西班牙-意大利危机，才能实施那些"人人都知道必须发生"的措施——但选民目前毫无胃口。

## 六、TACO 交易为何失灵 / 大宗商品分析师在"哭"

**Tracy：** 那为什么你前同事 Rob Armstrong（发明了 TACO 这个说法）的 **TACO 交易**在这里不奏效？

**Albert：** 我看到一句很妙的话：因为"跳 taco 需要两个人（it takes two to taco）"。特朗普可以宣布这些 U 型转弯（U-turns），但除非对方【原文"Ron"，指冲突另一方，存疑】也参与、跳同一支舞，否则它们不生效。所以当我听我们的石油/大宗商品分析师在电话会上——股票的人如果还很看多、债券的人介于其间，**大宗商品的人基本是对着麦克风在哭**。因为他们知道，通胀正随着化肥、食品这些东西一起（往上）追踪。这就是有趣之处：所有大宗商品的人都看到"末日"、就像它在敲我们的门，而其他人在"看看会怎样"。

## 七、财政整顿的政治经济学：财富税、迪拜外流、英国福利、三重锁定

**Joe：** 我想多聊聊——既然我们在英国。我提到迪拜那件事，我其实非常着迷于财政整顿（fiscal consolidation）的政治经济学，它包括"离开"这个可能性。英国和欧洲面对的问题大概是双重的：一是生产能力下降（制造业被中国竞争吃掉、数字产业跟不上美国、尤其在 AI 上）。好，你说"显而易见、我们都知道政府需要缩减赤字"，但这非常难：如果人能离开、财富税就极难征（几乎臭名昭著地难），尤其在一个"大钱是在股市里赚、而非通过传统工资/劳动收入"的时代。撇开选举约束不谈，鉴于有钱人有办法避税，有没有一条明显的削减赤字的路？

**Albert：** 非常难，你提到英国——英国有个非常特定的问题：疫情后很多年轻人被认定为"永久病残"、甚至不用找工作，所以福利账单在很大程度上失控了。尽管这里的工党政府有压倒性多数，它却无法让（福利）改革措施通过议会——不只是公众反抗，是他们自己的议员（MP）在造反，市场看在眼里，他们被迫做了一连串 U 型转弯。

而且尤其打击年轻人：因为有给老年人的供暖补助、有"三重锁定（triple lock）"——让养老金按三种通胀指标的最高者（或最低 2.5%）上涨，是老年人（受保护）。这加剧了代际敌意：买不上房的年轻人，看着老年人被三重锁定保护、养老金以工资通胀、价格通胀或 2.5% 的最低值往上走——在一个实际（购买力）扶梯上，显然完全负担不起。

然而，当我看 CBO（美国国会预算办公室）对美国债务/GDP 的预测，它们奔向无穷——你知道这不可持续，因为无穷不是一个可持续的数字。IMF 仔细看过这个，唯一一个比美国**更快**奔向无穷的国家，奇怪地，是**中国**。IMF 把美国和中国列为两个"篮子案例（basket cases，烂摊子）"。英国在财政状况上不是最坏的坏分子——我看 IMF 数字，法国糟糕得多，但它在欧元区伞下受保护；美国糟糕得多，但它在美元作为储备货币的保护下。

**债券义警（bond vigilantes）**醒了，他们相当火大，四处张望在发生什么，桌下有一本积灰的 Reinhart 和 Rogoff（《这次不一样》），他们想"我们要冲破 GDP 的 100% 了、接近出问题的水平了"。公平地说，公共部门做的，是把家庭部门和企业部门原有的大量过剩债务，转移到了自己的资产负债表上。但义警在找一个对象"痛揍一顿"、以儆效尤，而**英国国债（gilt）市场是最弱的、保护不够——它是操场上最弱的孩子，会在某个点被狠狠揍**。Bill Gross 多年前说过，gilt 市场坐在一堆硝化甘油上。当你看到昨天油价下跌、而 gilt 价格却在跌（收益率在涨），那是个真问题，尤其在首相斯塔默（Starmer）不久后某个阶段退场之际。

## 八、终局：财政主导 → 货币化债务 → 到处两位数通胀

**Joe：** 你说债券义警醒了，可以推断我们现在进入了一个债券收益率更高、通胀可能更高的长期时期。但另一方面，如今新闻周期被压缩得如此之短、混乱不断，似乎很难有一个（长期）"范式观点（paradigm view）"了。你现在还能有吗？还是你也和所有人一样在短期里移动？

**Albert：** 我觉得可能，至少我在努力让它可能。但如你所说市场太动荡了——我读到最近股市那波 10% 以上的反弹，是有史以来在 10% 回调之后最快的一次 10% 反弹。股市变得如此执迷于"买入回调（buy the dip）"这句咒语——美联储罩着我们、再也不会有衰退了，如果有那是因为疫情，我们其实记不得 2008（那是很长增长期积累失衡的后果）。

现在我认为确实有一个长期主题的位置，那个长期主题是：**财政失禁（fiscal incontinence）、政治软弱，以及最终货币当局不得不把这些债务货币化（monetize away）**。因为在美国，当你为政府利息支付付出 GDP 的 4% 时，那绝对是疯狂的数字——10 年前我看图，它大约和欧元区一样在 2% 左右。所以对我来说，终局是……我记得 70 年代英国 28% 的通胀。我确实认为我们会在所有地方回到**两位数通胀**。

**Joe：** 哇。

**Tracy：** 哦不。（笑）那是我们这期的标题。

**Albert：** 是的，我认为**财政主导（fiscal dominance）**就在那儿，央行行长们将别无选择。你可能会在危机时得到一些（财政）整顿，但（最终）他们就是把这些债务货币化掉——他们会措辞不同，我肯定他们不会说"现在我们在搞货币化"。

## 九、与互联网泡沫的类比：电信侧（挖沟埋线）/ 巨头自由现金流归零

【赞助商口播略】

**Tracy：** 既然你提到 AI、我们又在谈历史平行——现在似乎和互联网（dot-com）泡沫有很多相似：对一项新技术的狂热、以及"人人都会赚钱"的预期。但反对"互联网泡沫重演"的论点是：科技公司现在估值很重，但它们**真的在赚钱**，如果看倍数，也远不到某些互联网公司当年的水平。你怎么想？这个类比有多贴切？

**Albert：** 我会画的主要平行，是和当年那一层里的**电信（telecom）**部分。互联网泡沫其实更是 TMT（电信、媒体、科技），人们忘了它更宽。而电信侧和你现在 AI 看到的相当像：他们真的出去挖沟、铺电缆，有一场资本开支（capex）繁荣。如果你当年在卖电缆——就像现在你在卖英伟达的半导体芯片——你从"为淘金热提供镐和铲（picks and shovels）"里受益，至少在电信侧有真实利润。

但问题是，狂热、叙事如此有说服力，以至于你给这些公司免费的钱（虽然对 Oracle 来说现在不那么免费了），然后他们出去把它挥霍在 capex 上，而那些开支未必在 10 年后还能盈利。你现在看美国科技巨头（mega caps），他们已经**从巨量自由现金流生成，变成了零**——我看到一张图，2027 年归零。没了，被烧掉了。你可能说"至少他们没大量借债"，但其实这在**改变他们的资产负债表**。

我带了一句引文来（我写下来免得忘）：不久前，一位权威人士评论说——回头看，我们会认识到，美国经济正经历一次"百年一遇的创新加速，把生产率、产出、企业利润和股价推进到几代人未见、甚至前所未见的速度"。这绝对适用于当下。而这段话出自**艾伦·格林斯潘（Alan Greenspan），2000 年 1 月 13 日，在纽约经济俱乐部——就在（互联网）崩盘之前**。当时那些也都是真的。顺便，我是读 Jeremy Grantham 的书《一个永久空头的养成（Making of a Permabear）》时被提醒起这句的。它同样适用于现在：这（AI）绝对是变革性的、也很可能是变革性的——但这**不意味着你不会有一场股市崩盘**。

## 十、QE 退出股市却续涨：动量交易 / 二阶导数开始掉头

**Joe：** 我想问你一个关于 2010 年代、我想了很多的事。QE 在 2010 年代中期结束——先是停止降息，然后真的开始缩表，但它没影响股票，股票继续涨。今天也一样，股票（至少美国）表现很好，尽管利率图景和你当年称之为"冰河时代"的开端完全不同。这有没有让你质疑什么？鉴于事实显然是"超低利率和 QE 也许并非这些惊人股市涨幅的先决条件"，你修正过任何过去的观点吗？

**Albert：** 在 COVID 衰退之前，QE 在相当长一段时间里确实"把势头带起来了"。而最有利可图的投资方法之一，就是**动量交易（momentum trade）**。我旁边坐着量化主管 Andy Lapthorne（我和他共事 30 年了，他上个月还想往远处挪几张桌子躲我），看他的量化工作，动量投资绝对没问题。如果我是个满仓的基金经理，我会对那种投资开局相当满意。但看"何时该离场"的技术信号——是宏观故事在变吗、有什么在变吗？我最近在写：是的，科技板块利润在暴涨，但**二阶导数（second derivative）开始掉头**，因为你不可能永远抛物线上升。所以还是很健康的利润增长，但"动量的动量"开始放缓。

## 十一、衰退才是大熊市之因 / 23 倍前瞻 PE / AI 支出是唯一被承认的风险

**Albert：** 当你处在泡沫条件里，这是不是连多头都该关注的事？即便你是多头，也该想"这是个我该盯着的变化"。我现在会说：我觉得尤其是散户（retail）——在"解放日（Liberation Day，关税）"那波熊市里，散户比专业投资者更早进场，一直是他们持续把市场推回去的。而引发大熊市的，是**衰退**。通常在周期顶点，你处在错误的估值、错误的前瞻 PE 上，然后价格崩塌。如果你是铜矿股，通常在盈利顶点你的 PE 很低（比如 4 倍），所以你为价格崩塌"上了杠杆"（市场有记忆）。但泡沫里往往相反：你在衰退临界点时坐在**23 倍前瞻 PE**（就像标普现在），于是你同时错在前瞻盈利、又错在 PE。而且除了"AI 支出/投资可能随时崩塌"（我们以前见过——再来一个 DeepSeek、某件事把叙事炸掉）之外，市场没有任何"可能有衰退"的认知。

## 十二、消费者见顶：储蓄率崩塌、贪婪通胀 /"油价引发衰退"这个黑天鹅

**Albert：** 你看美国经济——去年基本没有就业增长，私营部门薪资同比放缓到零，而经济还在 2%–3% 之间跑得挺开心。你会想，AI 在这儿产生了足够影响，它在某些方面对单位劳动成本有正面效果，但这**真的在侵蚀消费**。美国实际家庭收入同比只涨了 0.5%，而实际消费支出仍涨了 2% 以上——为什么？因为**储蓄率崩塌了**：过去一年从 5% 以上塌到现在的 3.5%。唯一比这更低的时候，是人们在花 COVID 支票时（降到 2.5%）、或 2008 全球金融危机前那个信贷泡沫时——消费者彻底见底、油尽灯枯。

如果一波成本推动（cost-push）的通胀穿过经济：上一次公司只是猛抬利润率——他们抬价、还以前所未有的方式扩大利润率（本该在成本上升时收缩的利润率没有收缩），那是绝对空前的**贪婪通胀（greedflation）**。旧金山联储点名了三个主要贡献板块：零售、批发、建筑。但那时人们有疫情支票，所以公司能得逞。**这一次**，当这波成本推动压力穿过来、而储蓄率已经这么低时，公司还能得逞吗？还是会开始挤压那些在我看来"荒谬地、淫秽地被抬高"的企业利润率？如果利润率因为无法转嫁涨价而开始下来，公司会不会以裁员、砍投资来反应？

所以我们可能得到的一个意外是：**AI 投资之外的经济，其实比我们想的弱得多，甚至可能翻进衰退。** 这会是个真正的意外，因为它可能**连带把 AI 板块也拖下去**——不只是一个外生冲击。所以这是个有意思的黑天鹅：因为没人在想"油价可能引发一场衰退"。

## 十三、生涯最担忧的时刻：2006-07 的 CDO / 对央行的批判

**Tracy：** 鉴于你漫长的职业生涯，你什么时候对未来最担忧？回头看有没有某个你真正按下恐慌按钮的时刻？

**Albert：** 我倾向于一直离恐慌按钮很近（对某些人来说有点太近了）——那是我的工作，我倾向于看到拐角后的问题。昨天我在和客户开电话会，我说"我能想到的、我这边最看空的事，反而是我不像过去那样看空了"——我难以看到一个立即的崩盘催化剂，而正面叙事总是很有说服力。

我记得全球范围内最担忧的时候是 **2006-2007**：对我来说很明显。我不太懂加密、也不懂 AI 细节，但我当年真的搞懂了 CDO（担保债务凭证）——这是《大空头》电影把它简化之前。我 2007 年去了一个 CDO 大会，惊讶地发现他们**并不乐观、正变得非常担忧**。作为一个宏观的人，当伯南克（Bernanke）被问到房地产泡沫时说"我不接受你有泡沫的前提、历史上从没有过全国性的房价衰退"，我就想：你是个白痴、你不该坐在那个位子上。而且他恰好是泡沫破裂时"对的人"——因为大家说他做过大萧条的论文；你去看他关于大萧条的论文，里面**完全没有**关于此前那个信贷泡沫的任何东西。

我不是央行行长（或银行拥有他们）的粉丝——顺便，我离开英格兰银行后那里的人员质量大幅提升（笑）。他们太不愿承认自己在不断搞砸、把事情弄得更糟。出于善意，他们想变好，却弄得糟糕得多，QE 就是——在我看来，他们也许有理由做第一轮 QE，但（错在）就那样一直做下去。**保罗·沃尔克（Paul Volcker）在去世前狠批了美联储**：你没法把通胀测量得那么精确，你有个 2% 的目标，1% 到 3% 之间基本都 OK（只要不加速）；而当年在测量误差下降到 1% 时，硬要把它推回 2% 是荒谬的、你根本不需要那么做。我个人就觉得央行行长需要被约束。

**Joe：** 回头看 2010 年代后期那种通胀，即便当时……其实感觉挺好的。

**Albert：** 我同意。"通胀低于目标（undershooting）"从来（不是问题）——我早有记录（不只是事后诸葛）：我从来不理解人们为"通胀太少"而抱怨。

## 结语 + 主持复盘

**Tracy：** 太好玩了，非常感谢你终于来上 Odd Lots。

**Albert：** 荣幸之至。人们读我的东西觉得我很悲惨，但我其实很快乐、很知足，我还穿好看的衬衫想让大家开心点。希望我没让太多观众抑郁。

---

**（主持复盘）**

**Tracy：** Joe，太好玩了。我们真的读 Albert 读了几十年。有一点让我印象很深——他讲美国储蓄率、以及公司转嫁涨价的能力。本周早些时候我在读**高露洁（Colgate）**的财报电话记录，他们谈到包装成本因为石化价格上涨而显著上升，还把全年利润率指引下调——基本是说他们要**自己吸收成本**。有个分析师问"你们为什么不涨价"，他们经典高管式地基本啥也没说，只是"如果我是你，我会把更低的利润率指引纳入你的模型、就这样"。但这里面可能有点东西。

**Joe：** 完全同意。我要说一件"顶部信号"式的话：来伦敦之前，我下载了雷·库兹韦尔（Ray Kurzweil）的《奇点临近（The Singularity is Near）》（2004 年出版），他预测本世纪上半叶我们会有几乎在各个尺度上都比人类更聪明的机器。书里他理论的一部分是：计算机会越来越好，而随着它们变好、更多钱会流入计算机投资（因为它们能做更多事、加上摩尔定律），于是**加速的速率——导数的导数——可以一直往上、直到你真的得到那个垂直上升**。所以现在我在想：我们都知道，要不是 AI，股市绝不会在现在这个位置（可能在熊市、可能在衰退里）。而 Albert 说他现在感觉有点怪、看不到明显的看空催化剂——我读着这本书就在想：**万一盈利真的涨到无穷呢？** 也许会发生，我不知道。但如果连 Albert Edwards 现在都对股票感觉还行、而我在谈"盈利涨到无穷"——也许这些正是我们会在顶部录的那种节目。

**Tracy：** 好，就到这儿吧。这是又一期 Odd Lots。

**Kaiser（开场，压缩）：** 欢迎收听 Sinica，我是 Kaiser Kuo，本周从北京跟大家聊。本节目探讨能帮助我们更好理解中国政治、外交、经济与社会的书籍、思想、新研究与文化潮流——目标是给"我们如何思考和谈论中国"多带来光、少带来热。本季 Sinica 由威斯康星大学麦迪逊分校东亚研究中心支持。
