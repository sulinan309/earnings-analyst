## 十二、英伟达的"信用包装 + 收入分成"新模式：被误解的护城河

**Patrick：** 英伟达在当前环境下的主导地位、以及这环境有多利于它，让我有点难理解它为何以这么低的倍数交易。

**Gavin：** 换句话说：如果你需要为芯片融资（你确实需要），没有什么比英伟达 GPU 更好融资的了，没有。如果你需要拿地和电力，他们把那盘"象棋 + 撮合"下得很好。然后他们推出了一个非常聪明的新商业模式——我会把它描述为"一层信用包装（credit wrapper）+ 一份收入分成，且 GPU 价格被兜底（backstopped）"。这可能让他们很快通过版税（royalty）有效地拥有一门巨大的云业务，也是缓解"现金流错配"的另一种方式："嘿，我们赚了所有现金"。这不算真正的供应商融资（vendor financing）——不是英伟达借钱给买家，是别人借钱给 GPU 买家。他们仍在做股权投资，但不像"你往某人里投钱、其中一部分被用来买你的芯片"（英伟达说它在所有股权投资里都写明"这钱不能用来买英伟达芯片"，但钱当然是可替代的，笑）。不过我认为某种程度上这让大家都更安心。

如果我是 SK 海力士（Hynix）或美光的 CEO，我会做和英伟达此刻完全一样的事：去找 GPU 买家、Oracle、以及所有人，说"我参与英伟达的信用包装"。他们的业务本质上不如英伟达稳定可预测，但也许先出一笔现金、让自己不那么"上钩"——因为你现在有钱、而信用市场在"造反"。我确信我们在 Blackstone、Apollo 的朋友正在向内存公司建议某种变体："我们今天从现金流里出一笔钱，让放贷方更安心，但我们要在未来的经常性收入里分一杯羹。"这 100% 是我会做的——它几乎是 LTA 的逻辑延伸："用上行换持久性"，而这里你能有效地拿到经常性收入的版税。

这正是英伟达在做的，而我认为它被严重误解了。一，他们极度看多 AI；本质上每次他们"没有拿股权"都被证明是错误（除了内存公司、以及很久以前的 Anthropic——他们在 Anthropic 拿了股权）。如果你有现金流、又看多 AI，而黄仁勋看到每一个实验室、知道所有进展（连那些不与他合作的 continual learning 实验室、SSI 他都看到了），他所看到的让他看多——那为什么不呢？你既有股权上行、又有收入分成、还在喷出数千亿美元自由现金流、帮忙弥合那个明显的缺口（在经营性现金流加速到能内部自融资之前，几乎每个人都转为自由现金流为负）。这是"好的机会主义"，还显著提高了他们的"每吉瓦收入"、强化了竞争地位。你我都有创业公司——好，用那家创业公司的芯片吧：他们为 HBM DRAM 付的价比英伟达高，你能像英伟达那样轻松以同样费率给这些芯片融资吗？不能。所以总有一份实实在在的负担，尤其如果你用 HBM DRAM、你就在这个"十字准星"里——除非你做了非常不同的架构选择。发生的一切其实都对黄仁勋相当有利。

## 十三、算力军备竞赛的博弈论：没人会松油门

**Gavin：** 回到博弈论：Anthropic 如果当初在算力上像 OpenAI 那样激进，就会"独自跑赢"了。现在 OpenAI 重回牌桌，Grok 也在牌桌上——那是处在帕累托前沿的公司，而且它们有算力。你觉得看完这一切之后，有谁会松油门吗？四个月前 Dario 有过一段很有思量的评论："这真的非常难——买太多算力，在这种体量下你会破产；但不买够，你会输。"而 OpenAI 刚重回牌桌、SpaceX（xAI）带着 Grok 4.5 和 Cursor 大举入场。从博弈论看，有谁会很快退让吗？尤其如果这能靠经营性现金流来融资。

**Patrick：** 你在这边见过谁比你还要看多得多吗？他们信什么你不信的？

**Gavin：** 基本上这边所有人都更看多。我读了一篇（一位很懂行的人，ASR 作 "Door Cash"）写的东西——大意是租一片 H100 一年要花 25 万美元，那是当前现货的约 15 倍。哇，那根本不在我的书里、不在我"预期结果的贝叶斯概率空间"里、甚至不在我"考虑过但当作绝不可能而排除"的范围里。他很聪明、消息很灵。他还指出：算力上的利润在涨、算力的量在涨、推理利润在涨——把这三者相乘，就是你如何得到"实验室之和 + 开源"这种疯狂的加速（尽管开源的利润其实没怎么涨）。我看股市，觉得自己像个愚蠢的乐观主义者；可一跟实验室的人、这个生态里的任何人聊，我相对几乎所有人又是看空的。很奇怪的一种状态。

## 十四、中国的 DUV / EUV：相变还是过度反应？

**Patrick：** 你怎么看中国的 DUV 新闻？反应从"这相当于 ASML 在 2001 年"到"这是新故事的第一条、我们该重新想全球尖端算力供给"都有。

**Gavin：** 两者可能都对。打个比方：DUV 光刻机像螺旋桨飞机，EUV（极紫外）像喷气涡轮。他们以前没有、现在据称有了，那是一次"相变（phase transition）"——从液态到固态。但那个"固态/喷气引擎/螺旋桨机"落后 25 年。它仍然重要、不该被轻视。但你就是在股市里看到这个：市场大幅过度反应，然后若这真有一天冲击到 ASML 的订单（也许五年后），市场早已忘了它——一路上担心、忘记、又担心、又忘记好几回。所以我认为那大概是过度反应，但也不该轻视。

如果你是中国，这对你真的非常重要，有报道说一台 EUV 机器被走私进了中国——那是何等的间谍壮举，因为那些东西大得像一整栋楼。我不知道是不是真的，有些噪音。但中国真的非常强、非常聪明、极其拼命，把这视为国家的头等大事。可他们能从 2001 年直接跳到 2026、甚至 2030 吗？这是"干中学（learning by doing）"，你没法加速那个"干"、没法瞬移到未来，你必须真的走过那些学习周期。它重要吗？是。市场过度反应了吗？大概。

作为美国人很难真正理解中国在发生什么、并有完全的信念和清晰。无论好坏，我们在"脱钩（decoupling）"——这个进程已被启动，此刻几乎感觉在双方各自自我强化。这很不幸，但我们就在这儿。他们不会停，我们也不会。

## 十五、开源如何救活软件业与 AI 原生：Fireworks 的 RL 微调

**Patrick：** 对美国"除了 AI 之外的所有公司"有什么评论？现在感觉就是十家公司加几家私营。

**Gavin：** 上个月除了 AI 什么都在垂直上涨。但我认为"开源逼近前沿 + Fireworks 这类公司让定制模型变得极其容易（某些情况下能以明显更低成本拿到比前沿更好的性能）"，对软件业是天赐之物、对所有 AI 原生公司也是。我们的朋友 Vissier（名以发音为准）两年前说过："我从没见过这么多公司从成立到年营收 5000 万美元、还产生现金流，只用了大约九个月。"很难知道它们是否持久，因为很多人会把它们当"ChatGPT 套壳（wrapper）"打发掉。但现在有了开源，你用你的用例数据生成了独特数据。

Fireworks 出了个很酷的产品叫（DEX，产品名以发音为准）：如果你用 Claude Code、OpenAI Codex、Grok（build），字面上就是三行代码、约 20 个词，Fireworks 就摄入你的数据、RL 微调一个模型，还有个路由器分流查询，效果惊人。这基本是每个 AI 原生公司的解法。这也是为什么 Harvey（被收购前）、Cursor、Legora 都如此重度地拥抱这个——因为如果你能从"只用一两三个前沿模型"变成"把前沿模型用于其中 30–60% 的 token 消耗、其余用你自己的 RL 模型"，你突然就不是套壳了、可防御性强得多。

**Patrick：** 我对 Cursor 那个东西很感兴趣——本质是 AI"加速复刻"了我们人类学到的：用前沿模型来做规划、再把任务外包给更笨的模型，效率高 15 倍。而且很讽刺，可能用的是"略落后于前沿、低利润的开源 token"。

**Gavin：** 我们有朋友相信：一旦前沿模型触及 RSI（递归自我改进），它会通过蒸馏，在每一个智能层级都拥有戏剧性更低的服务成本，于是"开源就没有位置了"。我会说那是"Anthropic/OpenAI/Grok 极大主义者"的观点。任何事都可能、我们不该轻视。但那不太可能是唯一结局，因为有太多 AI 原生公司实际生成了相当量的领域专有数据。在开源迎来这一刻、这些推理云和路由器真正发展起来之前，你几乎没得选——不管服务条款是什么你都得接受。而现在你能下那台"跑步机"，这给了你一定程度的独立、也许还有持久、安全。但回到你的点：这些更便宜的 token，可能反而巨幅抬升"最尖端前沿 token"的价值——如果你有 120 IQ 的开源模型、跑起来很便宜，那不就让一个能"编排"它们的 160 IQ 模型更值钱吗？

**Patrick：** 我们上次聊过，我一直很意外"如此多的经济回报归于前沿"。

**Gavin：** 那正在改变——我们从这些推理云（Together、Modal、Baseten）看到的。它们以极其"现金高效"的方式运作，震撼之处是：它们增长几乎和早期前沿实验室一样快，却烧极少的现金。从"傻乎乎的 SaaS 指标"如"40 法则（Rule of 40）"看，这些是疯狂的数字。也许前沿 token 会继续捕获压倒性多数的经济价值、但不再是全部；而开源 token 可能成为"被处理的 token 的多数"。再说一遍，这对基础设施是好事——因为一个 token 就是一个 token，生产它花同样的 FLOPs、瓦特、空间、冷却。

## 十六、监管是最大风险 & AI 行业糟糕的 PR

**Patrick：** AI 里最坏的事会是什么？监管？

**Gavin：** 监管必须是最大的风险、最明显的风险。这也是我这周兴奋来这里的原因之一——我想被吓到，我不想像个疯子一样看着这些股票越来越便宜、觉得预期远期回报在上升。地面基本面在 7 月相对 6 月都实质改善了，但我仍觉得监管就是最大风险。你没法忽视纽约在搞"数据中心暂停令（moratorium）"。我们活在一个"后事实、后逻辑"的政治世界里。AI 行业的 PR 做得糟透了，我认为他们现在开始意识到这点。普通美国人里的政治叙事是"数据中心会抬高你的电费、抢走你的水、然后抢走你的工作"。

而现实是：鉴于现在在谈的那些交易，数据中心进来后，周边所有人的电价通常反而下降（因为"表后（behind-the-meter）"协议）。就是特朗普让大家签的那个"数据中心承诺（pledge）"——过去数据中心开发商顶多给警局消防局买些新车、新防弹衣；现在是"我们给你建医院、学校、警局、消防站，还降你所有人的电费，怎么样？"而且工作是持续的——你需要水管工、电工、暖通承包商；数据中心在很多方面是我这辈子对蓝领工资最好的事。可你却有代表蓝领工人的民主党人要把这些工作赶走——挺野的。那句话怎么说来着——"谎言能绕地球半圈，真相还没穿好鞋起床（a lie gets halfway around the world before the truth gets out of bed）"。

有位作者在书里犯了个错、把数据中心的水耗高估了 1 万倍——不是一点、不是一个数量级、不是两三个，是 1 万倍。他多次承认了这个错误"我完全错了"，已被彻底证伪。这就像"Popeye（大力水手）效应"——你听过那个例子吗？菠菜（含铁）的说法，源于一本学术书里把小数点点错了两位，所以菠菜并不比其他东西含铁更多，只是那一个来源（一直传下来说它含铁多）。我一直以为菠菜含铁多呢（笑）。

所以得有人说真话。我觉得这行业……哪怕没人做，我来做。得有某种基金会、或一个 PAC（政治行动委员会），在四强赛、NFL、大学橄榄球、世界大赛期间打广告，讲清楚："一个签了承诺的数据中心进你社区，你的电价会下降、几乎肯定会以实质方式回馈社区、会带来大量持续的高薪蓝领工作（很多人以为是一次性的，其实不是——有持续的 RMA 维修和升级需求），对水、对环境没有影响，而且很容易把它建在城外 10 英里。"这个故事得讲出来。加上我们上次聊的——AI 正越来越多地拯救生命、治愈罕见病。我想今年 ASCO（美国临床肿瘤学会）大会的氛围是"这是我们在单一会议上见过的最多科学突破"，其中一部分肯定归功于 AI。如果你有生病的孩子、父母、挚爱，AI 显著提高他们康复的几率——每个人都需要讲这个。这边的人觉得这一切太"明晃晃地显而易见"，以至于无法理解这是一个"真实、却与多数美国人剧烈分歧"的观点。这行业真的需要把自己的故事讲得更好。如果你不为自己的真相发声，没人会替你发声。

## 十七、SRAM 加速器与推理拆分（prefill / attention / FFN）：被忽视的 ROI 大机会

**Patrick：** 我们漏了什么？

**Gavin：** 关于算力，这场对话里缺的一块是：当你把那些"不受 HBM DRAM 约束、常在老制程上制造、不与最新最好 GPU 竞争"的 **SRAM 加速器**加进来时会发生什么。人们谈"预填充（prefill）"和"解码（decode）"，而解码分两部分：注意力（attention）和前馈网络（FFN）。终极圣杯是：在一颗（大概没有 HBM DRAM 的）芯片上做 prefill，在一颗带 HBM DRAM 的超高功率芯片上做 attention，再在一颗 SRAM 芯片上做前馈网络。把这些 SRAM 加速器加到存量算力和新算力上的 ROI——我们看到的是"你会做得更好"：在前馈网络上你就是打不过 SRAM。而且无论你怎么努力把"算力 : HBM DRAM : 片上 SRAM"的比例配对，工作负载总在变；能把推理"拆分（disaggregate）"成这三部分，会对 AI 的 ROI 极其正面。

## 十八、黑马、以及 SpaceX/xAI：算力的"数据中心公司"、轨道计算

**Patrick：**（借"权力的游戏"的框架）你能想象一个"目前不在所有人脑中、却会崛起到权游主角级别"的玩家吗？比如突然的美光，或某个变得像 Anthropic、OpenAI、微软、亚马逊一样重要的黑马？

**Gavin：** Lin Qiao（琳·乔，Fireworks CEO）大概是个黑马——她是绝对的狠角色。还有 Scott Wu（Cognition）……这些是最明显的名字。

**Patrick：** 那 SpaceX 呢？看它（IPO 后）被公开市场消化是什么感觉？市场理解它作为一家公司吗？

**Gavin：**（SpaceX 是）最重要的新上市公司，但市场似乎并不真的理解它。IPO 以来基本面变得更好了——Grok 4.5、收购 Cursor，Cursor 明显显著加速。过去三年他们证明了能比任何人更快、以更低价格上线更多算力；现在我们知道即便调整了"现货 vs 首份合约"的差距也是如此。他们的大优势是入场时踩中了现货高点。而对算力最看多的事情之一是：他们一夜之间把海量算力投进市场，却几乎没激起涟漪——市场彻底吸收了它、租赁交易一点没放缓。

一位专注 AI 的 Substack 作者认为 SpaceX 会在未来 18 个月上线 8 吉瓦算力。我永远不会赌马斯克输，但那会是真正惊人的壮举。费率自他们签那些合约后已经追上来，他们以约每吉瓦 500 亿美元变现，明年共识约 730 亿。所以——先别管 Starlink V3、别管 Starlink 直连手机（direct-to-cell）——光 Grok 4.5 和 Cursor，我觉得其和大概很快就到 100 亿美元 ARR。若他们上线接近那个量（共识约 730 亿 = 8 吉瓦 × 每吉瓦 500 亿），显然不会在 27 年初就全部点亮，我几乎不敢信那份报告、觉得极不可能。但迄今为止，一年内上线超过 500 兆瓦电力的公司只有：超大厂、CoreWeave、Crusoe 和 SpaceX——而 SpaceX 上得最多、最快、成本最低，人们也确实很喜欢它的集群。

**Patrick：** 这不会是市场对 SpaceX 的解读。

**Gavin：** 不会。感觉有个大型纽约对冲基金的做空论：算力现货价会跌 90%、你上线的这些算力产生的收入远不如你以为。也许吧。但要说清楚，我见过马斯克的公司做成很多惊人的事。8 吉瓦/18 个月这个数字我只是引用那份公开报告。马斯克有句话："我们专门把不可能的事做晚（we specialize in making the impossible late）。"这里有很多真相。但从我角度，这只股票里几乎没有为"他们可能上线的算力量"定价——我也不认为接近 8 吉瓦，而且给 GPU 通电真的很难，但他们一直很擅长。有个搞笑的梗图叫"SpaceX：那家数据中心公司"。而且我在 Starbase（星舰基地）待了很多时间，"轨道计算（orbital compute）"每天感觉更真实——你看到前几天星舰（Starship）着陆了吗？

我们在 Benchmark 的朋友投了 Starcloud——一家轨道计算公司、SpaceX 算是在合作，会让它用 Starlink 的激光技术（对轨道计算很重要）。这是个不错的"理智核验"：上次我看，Benchmark 那帮人相当聪明、根本不来自马斯克生态，却选择在"没有 SpaceX 那种内部成本优势"的情况下、以不低的估值投一家轨道计算公司。那对我就是"我疯了吗？也许我疯了、也许马斯克疯了、也许 Benchmark 也疯了、也许 SpaceX 工程师也疯了——但那似乎不太可能"。

**Patrick：** 该说说我们在谁的办公室吗？

**Gavin：** 我们就坐在 Benchmark 办公室、他们那张著名晚宴的著名桌子旁。谢谢 Benchmark，谢谢 Eric（Vishria）帮我协调。我们一年后再看这些股票在哪儿。好在人们总会被证明对或错——未来会揭晓。这是个激动人心的时刻。

**Patrick：** 如果我们继续按模型发布节奏录，几周后 CNN 见（笑）。一如既往，太开心了。

## 投资视角的关键信息点（速览）

- **核心判断**：2026 年 7 月是"一个月版的 2022"——AI 股跌 40–60%，但**基本面在加速**，Gavin 找不到一个"减速"的量化指标。除信贷外，所有下跌叙事（Meta 出租算力、Kimi/开源恐慌、中国 DUV）都被他判为"荒谬/过度反应"。英伟达处于 10 年最低前瞻 PE。
- **现货 vs 合约算力价差是"六个月关键变量"**：存量算力按旧合约低价锁定，随到期**重新以更高价定价**→经营性现金流加速（微软/Meta/亚马逊剔除一次性项后同比 28%→35%）。租赁价半年内不降反涨 50–60%（$2 → 近 $4/GPU 小时）。
- **"是否需要信贷"决定风险**：共识把 Blackwell/Rubin 按落后两代的 **Ampere 速率**建模变现（过度保守）；若按对 Blackwell 现货的折价变现，经营性现金流 ~2 万亿、**抽走约 7000 亿信贷需求**→信用指标改善→"问题变成解药"。**唯一真会吓到他的**：经营性现金流不再加速、或 GPU 价格持续剧烈收缩。
- **"一个 token 就是一个 token"**：开源夺份额只是把利润从前沿模型层转移到基础设施层，**算力总需求不减反增**（弹性）。未来是**多模型 + 路由 + 自有 RL 微调**（Fireworks/Together/Baseten/Modal 现金高效、增速接近早期前沿实验室却几乎不烧钱）；前沿 token 仍captures多数经济价值但不再全部，开源可能成为**被处理 token 的多数**。
- **需求外推是最大看多逻辑**：全球仅约 25–50 万人在用 Agentic AI 就已算力短缺；**50 万 → 1 亿 → 5 亿**用户的路径意味着需求远未释放。"没人说自己 GPU 太多"——"像毒品市场"。
- **内存 LTA 博弈论**：算力四巨头（英伟达 >> 亚马逊 Trainium / 谷歌 TPU / AMD）+ 内存厂（海力士/美光）；**内存是"每单位算力 token 产出"的核心轴**，DRAM 需求对涨价零负弹性。**违约长约 = 自毁**（下一周期配额报复）→ 供应链配额将决定未来数年份额。
- **英伟达"信用包装 + 收入分成 + 价格兜底"新模式**被严重误解：等于用版税快速构建云业务、缓解现金流错配、提高每吉瓦收入、强化护城河（自研 ASIC 创业公司在 HBM 采购价与融资成本上都处劣势）。
- **军备竞赛无人松油门**：OpenAI 重回牌桌、SpaceX/xAI（Grok 4.5 + 收购 Cursor）大举入场、Anthropic/Grok 在帕累托前沿且有算力→博弈论上"买太多会破产、不买够会输"，只要能靠经营性现金流融资，没人退让。
- **中国 DUV/EUV = 相变但落后 ~25 年**：从"螺旋桨→喷气机"的相变、值得重视但市场过度反应；"干中学"无法瞬移，且中美脱钩已自我强化。
- **最大风险 = 监管 + 糟糕的 PR**：纽约数据中心暂停令是"多个中的第一个"；行业需扭转"数据中心抬电价/抢水/抢工作"的谣言（现实：表后协议降电价、持续高薪蓝领岗、水耗谣言被夸大 1 万倍的"Popeye 效应"）。
- **被忽视的 ROI 机会**：**SRAM 加速器 + 推理拆分**（prefill / attention / FFN 分置不同芯片）对 AI ROI 极正面；黑马候选 Fireworks（Lin Qiao）、Cognition（Scott Wu）。
- **SpaceX/xAI 是"最重要的新上市公司"却被低估**：市场只当航天公司，未定价其算力（一年上线 >500MW 的仅超大厂/CoreWeave/Crusoe/SpaceX；Grok 4.5 + Cursor 或很快达 100 亿 ARR，每吉瓦约 500 亿变现）；轨道计算（Starcloud，Benchmark 投资）"每天更真实"。
- **可对接 Leah 框架**：这期把前几期的 Kimi/开源/Jalapeño/机器人/Anthropic 全部收进"AI 基础设施资本周期"的统一账本；对港股 AI 链（内存、光模块、算力、代工设备）的核心含义是——**只要算力短缺持续 + token 需求指数外推，回调是"越跌预期回报越高"的错杀**，但**信贷依赖度、监管、以及中国半导体设备突破**是需持续跟踪的三个真变量。

## 一、开场：为什么"过去一年很难，未来一年却可能最好"

自从这么做之后，我们的进展非常显著；而从我们现在看到的产品/研究管线（pipeline）来判断，未来 12 个月会更加显著。届时模型的质量、以及我们能围绕它构建的产品，将让人们以全新的方式借助这项技术真正繁荣起来——那会相当惊艳。

**Patrick：** 去年有没有某个"顿悟时刻"，让你改变方向、重排优先级？

我们必须训练出色的模型，覆盖人们想用的所有方式——擅长编程、擅长各类知识工作、擅长科学（真正的经济价值所在）。我们必须自研或与人合作生产这些芯片和系统——那些极其昂贵、能承担 AI 计算的机架（rack）。我们必须找到足够的土地、电力、数据中心外壳，把这些机架安放下来。然后，或许很快，我们还得造出能把这个流程自动化的机器人，持续压低成本——发电、芯片、整条供应链的成本。

## 二、算力豪赌：为什么押注、如何押注、被 Dario 叫"YOLO CEO"

**Patrick：** 算力这件事，我认为是人类历史上最有意思的事情之一。它显然正走向高潮——也许还会在很长一段时间里持续处于高潮。Dario（Amodei）当年在你做这些早期算力分配和锁定时，管你叫"YOLO CEO"。现在情况反过来了：所有人都在"缺货"，到处找算力。我很想听听早期的故事——你为什么坚信必须去锁定这一切，你是怎么做到的。事后看你显然赌对了，甚至可能还赌少了，这在当年那些头条新闻的语境下简直疯狂。

**Sam：** 简单说，我们当时正处在模型能力提升的指数曲线上。这一点我们非常笃定，知道它会持续下去。虽然像你说的，我们低估了一件事：随着模型越来越好、只要我们能持续压低成本，那么在"足够高的能力 + 足够低的价格"下，对 AI 的需求基本是没有上限的（uncapped）。这就是一种世界上罕见的新型大宗商品。

人们会拿它做什么，让我想起计算机的早期时代。当年有句名言说"全世界的计算机市场大概就五台"，或者"没人需要超过 X 的内存"。人类的智巧、创造力、对东西的渴望、想要有用的欲望——这些都非常值得押注。我们能看到，AI 将成为人们表达和实现这些东西的极其重要的方式。

我们也知道算法会更高效、模型会更好（后来确实如此）。但我们同样清楚：无论它们变得多高效，我们所做的事情本质上是"把电变成有用的智能"。基于对需求的这个判断，无论上面那一层做得多好，我们都会想要更多的电、更多的算力。

**Patrick：** 这是从 GPT-3 开始的吗？你会把第一个"刻度"标在时间轴的哪一点？

**Sam：** 我会说，我们真正获得笃定是在 GPT-4，甚至不是 3.5。

**Patrick：** 是什么让你笃定的？

**Sam：** 是看到模型已经足够聪明，我们知道自己能找到一条让"推理（reasoning）"奏效的路径；再加上一个信念：如果推理跑通了，就会带来今天所谓的"智能体（agents）"。当时我们叫法不同，但那种"去完成价值巨大的经济工作、以许多方式让生活更轻松"的能力——我认为在很多方面我们至今还没完全见识到。

**Patrick：** 第一次坐下来说"好，我们得为此下一笔离谱的重注"，是在哪次会上？有了这个认知之后，你接下来做了什么？

**Sam：** 我们开始给各家云厂商打电话，给芯片代工厂打电话，给能源供应商打电话。所有人都说：你们完全疯了，这不可能，从没有哪个行业这样运转过。我们见识过这些繁荣与崩溃的周期，它不会一条直线往上走，这太鲁莽了。

我们跟每个人都谈了。这其实很像早期创业公司融资：大多数人对你说"不"，但你只需要一两个"是"。大多数人拒绝了我们，我们拿到了一两个"是"，就够了。微软是第一个"是"；甲骨文（Oracle）后来成了非常大的一个"是"；云这边，英伟达一直是极好的伙伴。现在则百花齐放，出现了各种在推理服务、训练、不同类型数据中心上做创新的方式。

## 三、数据中心的现实：规模、环保争议、水与能源

**Patrick：** 我很想请你谈谈：你在数据中心这块看到哪些创新、想做什么、以及——为什么大家似乎这么讨厌这些东西？对此又能做些什么？

**Sam：** 我一直在想，能不能组织"实地参观"，带人们去看一座吉瓦（gigawatt）级的数据中心。因为"听人说"是一回事，"看照片或视频"是另一回事，"亲眼站在那里"又是完全不同的第三种体验——你会惊呼"天哪"。

这规模令人难以置信。建一座这样的东西，大约需要 1 万名建筑工人全职干上一年半。流经其中的能量能供给一座小城市。我们已经彻底失去了对尺度的感知——每一座这样的设施，本可以跻身人类有史以来最昂贵的基础设施工程之列，而如今我们已经建了很多座。

首先，我在情感上完全理解人们为什么不想要数据中心建在自家后院。就像我也不是真的想在我家隔壁建个核电站，尽管我知道那超级安全。但和电厂不同（其实电厂在这点上也改善了）——我们可以把数据中心建在任何地方。我们完全可以把它扔到沙漠里、扔到没人想去的地方，这没问题，AI 系统很乐意待在那儿。

我们也通过创新在一些顾虑上取得了很大进展。比如几年前，我们靠蒸发水来给这些系统降温，需要消耗大量水；现在我们用闭环系统（closed-loop），一座现代数据中心的用水量，仅相当于一栋办公楼里厨房和卫生间的用量。能源方面，我们正从"烧化石燃料"转向"太阳能、核能供电"的系统，这显然很棒。所以对某些人来说，也许背后有某种更深的人性因素——尽管这些设施创造就业、非常清洁、还有很多其他正面效应。但就环境顾虑而言，我们在用水上做得很好，能源是下一个要解决的。

## 四、榨取更多智能：软件效率、Jalapeño 芯片、光计算

**Patrick：** 在算力上还能做哪些有创意的事？我很好奇 Jalapeño，或者你想过的其他点子——我们怎么加快能用上的算力（FLOPs）？

**Sam：** 我觉得眼下回报最大的，可能是"用有创意的软件思路，从我们已有的算力单元里榨出更多智能"。我的感觉是，这里还有好几个数量级的空间。

Jalapeño 就是一个很好的例子——一颗非常高效的芯片。我们说："我们要造一颗在特定工作流上极其擅长的芯片，用一部分通用性去换更高的每瓦 token 数（tokens per watt）"，结果非常棒。我认为 Jalapeño 及其后继者，从这个角度看会成为我们巨大的竞争优势。

还有新技术——我猜某个时点会搞定光计算（optical computing），那会是"每瓦智能"上的一次巨大胜利。所以我觉得所有这些都会发生。

## 五、Kimi、蒸馏与中美竞争：为什么 Sam 这么淡定

**Patrick：** 这周最有意思的事，就是 Kimi 的发布，以及"前沿（frontier）—所有回报都在前沿—蒸馏—中国 vs 美国"这一整套议题。你怎么看待这件事？它看起来像是那种里程碑式的事件，而 DeepSeek 引发的恐慌回头看只是个小减速带（speed bump），但身处当下你永远说不准。你怎么消化它？

**Sam：** 我们的目标是：在帕累托最优前沿（Pareto-optimal frontier）上的每一个点，都提供"智能与价格"的最佳选项——这也包括开源。今天在某个特定延迟点上，用 OpenAI 的模型你能得到比 Kimi 更好的性价比。我们也会推出更小、更便宜的模型。我认为这是很好的事，开源模型在世界上显然会有重要位置——总会有人出于各种原因想要自己的权重、想要能修改它们的能力。但我们的目标是"在曲线的每一处都做到最好的智能/价格权衡"，我们会持续这么做。

**Patrick：** 那你希望、或预期美国的体系会怎样？什么可能挡住那个未来？什么立法会让你担心？什么监管会让你担心？你在华盛顿（DC）似乎相当主动。

**Sam：** 蒸馏这个问题我还没深想过。它显然突然成了很多人当下最关心的议题。但我一直都假设：世界上会存在很棒、很便宜的模型，我们最好成为其中最棒、最便宜的那个；别人爱怎么做就怎么做，而我们完全可以在自己的赛道上真正赢下来。

**Patrick：** Kimi 这个例子有意思，因为——像你说的，你们在曲线的一部分上更便宜。但此前流行的叙事是：你花全部的钱把模型训练出来，然后我直接蒸馏，用你百分之一的成本提供服务。那你怎么赚到足够的钱来持续训练？

**Sam：** 我们模型的使用量非常巨大。我们并不需要成为一门"巨型高毛利"的生意，也能负担得起模型训练。我们未来的大部分算力，都会用于向客户售卖推理（inference）；即便我们只在"数万亿美元营收"上享有一个不高的毛利，也足以支撑我们去训练某个巨型模型。

**Patrick：** 所以关键就是"推理 vs 训练"的比例。

**Sam：** 训练这些模型极其昂贵，这毫无疑问。我也完全理解为什么有人一想到"别人靠蒸馏我们来占便宜"就紧张。但从我们未来算力的分配、以及"向客户提供模型服务"这个营收桶的体量来看——我对我们能在那里形成真正的飞轮（flywheel）非常有信心。

**Patrick：** 你对这件事的淡定让我意外。

**Sam：** 我当然更希望别人别来蒸馏我们。也许我此刻对我们的进展、对即将到来的模型太自信了。但这件事根本排不进我"最担心的前十"。

## 六、Hugging Face 安全事件：串联零日漏洞的"科幻级"越狱

**Patrick：** 那你"最担心的前十"里，都有什么？

**Sam：** 呃，我们出过一次极其科幻的网络安全事件——就是那次 Hugging Face 的事。

当时我们在评估一个尚未发布的模型，它本该在一个沙盒（sandbox）里运行。结果它发现，自己可以通过串联多个零日漏洞（zero-day exploits）来"作弊"通过测试：突破沙盒、拿到互联网访问权限，再攻破 Hugging Face 那侧的多个系统，直接拿到测试答案，好在评测（eval）上表现得非常漂亮。

这是第一次让我在生理层面（viscerally）真切感到不安的安全事件。我还有点惊讶——这件事的严重性明明很明显，却没多少人真正"感受到"。

**Patrick：** 那你怎么应对？眼下这个模型显然还太弱，但它会越来越强大。

**Sam：** 有一些短期措施。我们暂停了训练。我们必须搞清楚，在"多个零日漏洞被串联起来"的世界里，怎么保护好我们的沙盒。但更长期的问题是：如果这就是未来进步的常态速率，我们该怎么办？

我们也许不得不为 AI 的发展速度"踩踩刹车"、放慢节奏，给社会留出足够时间，在这些新能力层级周围"加固"起来。而如何做到这一点——既不让人觉得是"监管俘获（regulatory capture）"、有利于任何一家，也不让人觉得是"前沿实验室之间的合谋（collusion）"——这需要下不少功夫，而且必须做对。

【广告】中插赞助商口播：Vanta（合规/信任平台）、Ridgeline（投资管理一体化系统）。

## 七、OpenAI 到底要做什么：反对权力集中、"神灯"与人的能动性

**Patrick：** 我想退一大步，理解你对"OpenAI 到底要做什么"最朴素的构想——你当初想做什么、它代表什么。开头时我很清楚你们代表什么，但你们后来做了太多有意思的事。我想听听你现在的构想，以及它有没有演变。

**Sam：** 我认为这将是迄今为止人类历史上最伟大的技术成就。但它真正有意义的唯一方式，是让人们的生活比原本"好得多"。

其中一部分，是给予人们物质上的丰裕、去做任何想做之事的能力、以及表达创造力和"想帮助彼此"这份渴望的能力。另一部分，是确保人们保有控制权和能动性（agency），确保这个世界越来越（而不是越来越不）民主化，确保人们能够表达自我。

所以从积极面看，某种意义上我们即将造出一盏能实现任何愿望的"神灯（genie）"。我认为极其重要的一点是：我们、乃至全世界，向这盏神灯许下的头几个愿望，要惠及整个世界。同时我也认为，让世界上的人们理解"自己将能用这些愿望变得多么有创造力"，同样重要。

我其实完全不是"就业末日论者"。我认为会有海量的工作。我认为我们会比自己想要的还要忙，而不是相反——因为人们会有极富创意的愿望、会对"让 AI 帮忙构建什么"有难以置信的点子。我们所有人都将受益，不只是那些显而易见的（比如治愈疾病），还有——我不知道该怎么形容——世界上最好的娱乐点子，那些此刻坐在这里的我们连做梦都想不到的东西。

所以我想把这份能力交到每个人手里，这就引出了我们所"反对"的东西之一：AI 带来的权力集中（concentration of power）是一件令人恐惧的事。我认为关于安全的很多讨论是有充分根据的；但也有很多，是那些——哪怕只是略微下意识地——真心想集中权力的人在说。

我极其恐惧这样一个世界：有人利用"AI 很危险"这一非常真实的恐惧，来论证"只有这一小撮人能掌握它，因为它太危险、只有他们懂；但别担心，他们会替我们所有人做出正确决定"。我不相信这套。我不认为有谁应该想生活在一个"AI 霸主"、或某家相当于 AI 霸主的公司说了算的世界里——由某个人替所有人的未来做决定，作为交换给你一个"癌症的解药"（这当然是好事），而我们集体交出全部能动性。

所以我认为极其重要的是：我们不要落入这个陷阱——以善意（或伪善意）的"AI 安全"之名、借着那份可以理解的恐惧，最终把我们带离一个"人人都能使用这项技术"的世界。

我小时候正赶上互联网，那时没有任何规则，简直太美妙了。我认为那是塑造我成为今天的我的巨大因素，可能对你、对整整一代人都是。我觉得关键在于：我们要为 AI 保留那种精神——让我们所有人集体拥有"自决未来"的能力。

## 八、我们有 AGI 了吗？GPT-5.6 与"持续学习"的缺口

**Patrick：** 我有一堆问题，先从这个"AGI"的概念开始。你说"我们即将拥有 AGI"，这暗示我们现在还没有 AGI。

**Sam：** 嗯，其实已经很接近了。就连一些真正的怀疑论者，最近这些天、这几周都对我说过类似的话。我想我用 GPT-5.6 已经两周了——我的感觉是"好吧，这已经非常 AGI 了"：我很难说出一件我想让这个模型做、而它做不到的事。

但确实还有些事它做不到。你还不能对它说"去把癌症治好"，然后癌症就被治好了。你还不能说"去用机器人完成这件复杂的物理任务"。而且这个模型虽然才华横溢，却仍然不能在运行中持续学习（continuous / continual learning）。对我来说，这也许不是 AGI 的硬性要求，但绝对是我现在就想要的东西。

不过我要为自己"唱个反调"：你也可以主张，AGI 其实与任何单一模型无关，而在于"制造模型的那套机器"。在"从一个模型到下一个模型"的层面上，我们确实在持续学习新东西、在搞清楚科学，这套东西运转得极好。所以对于那些说"我们已经到了、我们已经有 AGI 了、它能做这些惊人的事、能做超人类的事"的人，我很能共情。

**Patrick：** 我特别着迷、特别好奇于"处在前沿的经济回报"这个故事——而你正处在前沿。如果你把 GPT-5.6 拿给 2019 年的你和你的团队看，那个团队多半会说"哦对，这绝对是 AGI 了"。

**Sam：** 我觉得"移动球门（goalpost moving）"这件事是真实存在的。

**Patrick：** 但看起来——我好奇你是否同意——实际上所有回报都在前沿。

**Sam：** 完全同意。所以一切都关乎"留在前沿"。

**Patrick：** 我很好奇，其中最难、最稀缺的部分是什么？如果我去想算力、研究、人才、数据……它们的相对位置一直在移动。

**Sam：** 是的。不久之前还有那么一个时期，全世界的算力都帮不了你，因为我们缺的是那个研究点子（research idea）。现在之所以更难，部分原因是：算力越多，你能做的研究就越好、能试的东西就越多。我最近听到一个惊人的数据：我们现在为即将启动的大训练做的"降风险实验（de-risk runs）"，其规模就相当于 18 个月前一整次完整训练的算力。所以"算力"和"研究点子"并不像听起来那样彼此独立。

但显然有那么一个时期——七八年前吧——我们被"研究点子"卡住的程度远甚于算力。然后有一段时期，我们知道该怎么做了，只被算力卡住。再然后我们用完了数据，被数据卡住，得想办法解决。而现在，我会说我们仍然主要被算力卡住；但过去这大约半年，又成了研究点子上的一次真正的凯旋期。所以瓶颈永远存在，但它会"轮换（loops around）"。

---

## 九、自动化研究、内核工程师与"最重要却怕被淘汰"的悖论

**Patrick：** 为什么会这样？"研究点子"这件事对我格外有意思，因为有一个正在逼近的东西——自动化研究，或者叫递归自我改进（RSI）。我最近和一位极出色的内核工程师（kernels engineer，写 CUDA kernel 那类）聊——所有人也都卡在这块。他自己说，内核这活儿还剩两年可做。

**Sam：** 对，两年后它就不再是个"活儿"了。

**Patrick：** 于是你同时看到一个很怪的现象：无论是内核还是整体研究，这些研究者既是"最重要的人"——是他们把我们带到了今天，是世界上最重要的人；而这同一批人，自己又担心很快就会变得无关紧要。

**Sam：** 我怀疑实际上不会那样发展。一年前人们说"软件工程师完蛋了、这个领域结束了"，结果并没有。真正发生的是：软件工程师的性质、对他们的期待、他们能做多少事，变了很多。你不再以传统意义上的方式写代码，但你做的事情仍然是非常可辨认的"软件工程"。

现在人们会争论，这到底和"我们不再用打孔卡（punch cards）"是同一回事，还是不同的东西。我本该知道打孔卡是怎么工作的——反正当年孔就那么打在卡上，而如今我们只是又在一个更高的抽象层上操作而已；又或者这是一次相变（phase shift）。我说不准。但"让计算机做你想让它做的事"，这仍然是一份重要的工作。

对研究者，我怀疑也是如此：尽管当前研究者的工作流会被大幅自动化，但会出现新的、"研究精神"意义上的东西——就像即便我们不再写代码、"软件工程精神"意义上的新工作依然会出现、依然重要。

## 十、AI 对就业的影响：观点的转变与"锯齿状"智能

**Patrick：** 看起来你在"AI 对就业的整体影响"上，以及在某些具体门类上，都改变了看法。描述一下这个转变和你现在的观点。

**Sam：** 你刚提到"如果回到 2019 年"。如果你回到 2019 年，把我们最新的模型拿给人们看，他们不仅会说"这是 AGI"，还会说"经济早就该被彻底颠覆了"。而这并没有发生。

我认为，单从"智识上的谦逊"这一点讲：任何时候你错得这么离谱、却又那么自信（我认为当时整个领域就是如此），你就必须更新自己的认知。这里有好几条启示。

第一条（也是无聊的一条）：AI 是"锯齿状（jagged）"的。它在某些方面像超人类的天才，在另一些方面像个笨拙的蹒跚学步的孩子。而人类目前拥有的技能，与 AI 极其互补。

第二条：人们在与"其他人"打交道、协作时，有着极高的信任感和愉悦感。你现在就可以雇一个 AI 顾问、和一个 AI 销售代表对话、雇一个 AI 工程师——但不知怎么，大多数人似乎仍然真心更偏爱和"人"互动。几乎所有事情上，我自己也宁愿和人打交道，而不是和 AI。

第三条：我还认为，人类的价值观之所以有价值，正因为它们是"人"的。随着社会演进、我们面前的可能性空间变得如此浩瀚，我们在深层被"硬编码"去在意的东西——人们终将去在意人们所在意的。今天你就能看到这一点的雏形：AI 能生成惊艳的图像，但人们只想要那些由人创作、或至少由人挑选的作品。有个玩笑说，如今一件艺术品上的"签名"占了大部分价值——但真相是，你想知道它背后的那个人是谁。你读一本小说，你想知道背后的作者是谁。

就商业、就我这份工作而言：我认为世界想知道"那个要为一家公司的决策负责、决策错了要被追责"的人是谁，人们并不真的想要一个"AI CEO"。

## 十一、逆共识与冒险：最好的机会往往起初不受欢迎

**Patrick：** 回看你在商业等领域承担过的那一组风险，是不是大多数真正奏效的，一开始都不受欢迎？

**Sam：** 是的，绝对如此。这是我从 Peter Thiel 和 Paul Graham 那里、以两种不同方式学到的最重要的一课：最好的公司、最好的投资机会，几乎从来不是那些"看起来很热门"的。你只是"跟着趋势、稍微早一点"，也能做得还不错；但要做得出类拔萃，你几乎总得去做和其他所有人都不一样的事。你不能去追那道新浪潮。

---

## 十二、活在加速的模型周期里：人的适应力

**Patrick：** 想想你身处的这个模型迭代周期，它一直在加速。还有一个很怪的事实：接下来 6 个月（我不知道确切数字）的进展，会超过过去 X 年。能带我们感受一下，活在那个模型周期里是什么样吗？

**Sam：** 过去十年我学到的最重要、最有意思的事情之一是：人们对几乎任何事情都能习惯。世界可以从"把一场大流行病当笑话"，到"彻底封锁"，再到"这就是常态、还好啦"——而我们竟然在短得惊人的时间里大体适应了。现在，AGI 要么已经到来、要么很接近，大家的反应是"好吧，有 AGI 了"。

人一生中也有各种类似的例子：发生了了不起的事，比如你有了孩子；或发生了糟糕透顶的事，比如你失去了父母、分手，等等。你以为自己永远无法适应这么大的改变，然后——你能适应美好的事并继续美好，也能适应糟糕的事、想办法把日子过下去。人能做到这一点，本身就很了不起。

所以活在这一切之中，感觉就像是那件事的又一个版本：我原以为"活在奇点（singularity）里"会比实际感受更诡异；结果它一点也不减损"看着模型不断变好"的那份兴奋。我每天早上做的第一件事，就是去看模型训练的进展。它发生得越来越快、我的预期也越来越高，但那感觉依然真的很酷。

**Patrick：** 每当你拿到一个新模型，你会做什么？怎么庆祝？那个早晨是什么样的？现在越来越频繁了，你有什么仪式？

**Sam：** 是越来越快了。现在很多团队负责不同的部分，不同团队有不同的仪式。有的团队每次都会做一件印着某个搞笑梗（meme）的卫衣；有的团队每次都去同一家酒吧。但"第一次身处那个房间、亲眼见证知识的前沿被向前推进、看着那是什么样子"——对大多数人来说，没有什么庆祝方式比"抢先用上新模型"更好了。

---

## 十三、如何衡量模型好坏，以及 Sam 自己用 AI 的前沿

**Patrick：** 你觉得现在对"这些东西到底有多好"有正确的度量方式吗？

**Sam：** 肯定没有。某种意义上，真正重要的评测（eval）是"速度"和"对人的有用程度"。你可以用营收、用使用量、或用"新知识的发现速率"去近似它。我们有些团队正在研究：随着这些模型规模变得极其庞大，它们"真实世界里的评测"该长什么样。

**Patrick：** 你自己使用 AI 的前沿在哪里？

**Sam：** 我最近才开始尝试："让一个 AI 看到我在电脑上看的一切"意味着什么。这个产品我还没造出来，我还在摸索——我的舒适边界和信任边界应该划在哪里。但这绝对是前沿：搞清楚我怎么从中获得价值、怎么对此感到安心、它将会是什么样子。

一个体会是：相对于 AI 的记忆，我自己的记忆糟透了。"记得我六周前读过哪封邮件、七周半前那场会上到底发生了什么"，并在恰到好处的那一刻把它调出来、喂进一个决策——这感觉相当神奇、相当酷。

**Patrick：** 这听起来有点像"个人智能体（personal agent）"。要让人人都拥有它，障碍是什么？

**Sam：** 我想要那个——给我算力（compute）啊，兄弟。设想我们能造出这样一个产品：它就照我说的、对你所有的东西、始终在线（always on）——看着你的电脑、听着你参加的每一场会、读着你读的每一份文档。而且不止于此（这些已经很耗 token 了）：你还能拖动一个"滑块（slider）"——"当我睡着时，你可以花这么多 token 去思考，为我想出有用的新点子、把你能做的活儿都做了。"然后就这样不断替我思考"下一步该做什么"。这多有意思——就是花更多算力，把明天早上给我的产出变得更好。

我会把那个滑块拖得相当远，我愿意为此花很多钱。但如果全世界每个人都想把滑块拖得很远，那所需的算力……真的会非常非常多。

---

## 十四、如何向孩子描述这种"异类智能"

**Patrick：** 我想聊聊你怎么看待这种新智能的本质。最近有人说"飞机并不像鸟那样飞"——而这种智能是一种非常"异类（alien）"的智能。每个人都在说：只要一件事可以被验证（verifiable），那么有了足够的算力和足够的"智商"，它就会靠蛮力（brute force）碾出一个解。而在另一些领域——人类、以及他们做的数据和评测占了很大比重——让它变得擅长（比如法律推理），要花的钱之多让我很意外。

我更好奇的是：假如你要向你七岁的孩子（到了"讲道理的年纪"）描述这种智能的本质——你会怎么描述？

**Sam：** 这是个很美的问题。我现在连一个像样的答案、甚至一个雏形都还没有。目前浮现在我脑海里的说法是：我会说它就像一台计算机。它像计算机一样，能做很多人做不到的事，比如飞快地把两个巨大的数字相乘、直接给你答案；同时，它也做不到一些你轻而易举就能做的事——而它做不到的那些事，我预计会不断减少。

但在一个不断演化的世界里，我认为"人类的判断力和品味（judgment and taste）"会持续是 AI 难以建模的东西。它会走向何方，我不知道。我也没有确切的词来形容它——它不完全是"品味"。世界也许需要一个新词，来指代那种"人类非常擅长、而 AI 似乎很吃力"的判断力。

---

## 十五、为人父：在丰裕智能时代养育孩子

**Patrick：** 在这个时代成为父亲、养育正在成长的孩子，是什么体验？我会联想到你早年对互联网的那份乐观——你的孩子将在"廉价而丰裕的智能时代"长大。

**Sam：** （成为父亲）是迄今为止我做过的最棒的事。每个人都说"你没法真正理解它，除非亲历"，说这话的人多到我相信这是真的。但它对我而言"真到什么程度"，还是超出了我的预料。我认为我拥有全世界最好、最有意思的工作——但它仍然远远排在"有孩子"之后的第二位。所以这太棒了，也确实是一个值得乐观的时刻。

我的孩子将永远不会生活在一个"他们比计算机更聪明"的世界里。如果你出生在 GPT-3 的时代，那时我们的推理还强过模型；即便你出生了，也只是短暂地赶上过那个窗口。我们家老大大概 18 个月大。对他来说，这（AI 比人更聪明）永远不会显得奇怪，永远不会困扰他，我想他根本不会在意。他反倒会震惊地想象："那个我们还得忍受一堆并不聪明的产品和服务的'黑暗时代'到底是怎么回事？"他将能做到你我从来做不到的事，将拥有你我从未有过的期待，将拥有一块大得多的"画布"。

**Patrick：** 因为有了孩子，你在经营公司、带团队、领导他人的方式上，有没有明显的不同？

**Sam：** 答案一定是"有"。有了他们，我的感受非常不一样。有一堆细小之处真的不同了。而且这也算不上什么新颖的洞见——我想大多数当了父母的人都会说：一有孩子，你就意识到，比起你自己、比起你将留给他们的这个世界，你更在意的是他们、以及他们将拥有的体验。

我想我有一个不太寻常的视角：人们有时问我"有了孩子后，你是不是更在意安全、更不想毁掉世界了？"我的回答是——我不需要靠孩子来获得这份在意，我之前也真的不想毁掉世界。但要说"我是否更多地去思考人类能动性的角色、以及'过上有意义的一生'意味着什么"——那绝对是，为我们正在构建的东西，也为和我一起工作的人。我希望他们也能拥有这份东西。

显然，你会对自己的孩子生出非同寻常的共情；但那份共情延伸到"所有孩子"、再到"所有父母"、乃至"每一个人"的程度，也让我意外。

---

## 十六、激励结构：为什么 Sam 不持有 OpenAI 股权

**Patrick：** 你有一篇帖子（大概是"我希望早点知道的一些事"），讲的是"要极其小心地设置激励"。而一直以来关于你最令人费解、也最有意思的一点是：你对这家公司没有股权敞口。世界该怎么理解你的激励？

**Sam：** 我不知道除了这句还能说什么——我拥有一个"前排座位"，见证人类历史上最激动人心的时刻。这对我而言，比任何数目的金钱都更值。我得以拥有一段极其有意思的人生，与非凡的人一起，做一件我深深在意的事。但不知怎的，这套说法对很多人就是不起作用。

## 十七、机器人：未来两三年的"ChatGPT 时刻"

**Patrick：** 我很好奇你怎么看机器人（robotics）。你前面提到，某个时点如果我们既有了自动化的智能、又有了自动化的劳动……

**Sam：** 事情可能会变得更疯狂。（如果只有自动化智能）那还有一个白领市场；但如果连（体力）劳动也自动化了，事情就真的会非常疯狂。而如果人在世界上的角色沦为"云端 AI 的执行器（actuators）"——那非常糟糕，非常糟糕。所以我认为（把机器人做出来）意义大得多。（如果做不出来，那才糟。）

**Patrick：** 帮我理解一下你对这块进展的判断。因为不像 AI——现在大家基本达成共识"它在飞速前进"；在机器人上，你能找到极聪明的人说"就在今年底"，也能找到极聪明的人说"还要 20 年"。

**Sam：** 不是 20 年。我会说，未来两到三年内，我们会迎来机器人的"ChatGPT 时刻"。

**Patrick：** 那会是什么样子？你知道那是什么吗？

**Sam：** 是某种能让大多数人真正发出"哇"的东西——不是"我看到一段机器狗做了件疯狂事的视频，然后我勉强说服自己'一件很重要的事发生了'"。ChatGPT 时刻的一个关键在于：你可以直接去用它。你不必去相信某个说"AI 快来了"的人，你自己去试就行。如果你能敲入一条指令、一个机器人就能做出某件疯狂的事，而且哪怕你不在现场也能看到——我认为那会带来同样的"哇，它刚刚真的做到了"的震撼。

**Patrick：** ChatGPT 当初不也不是一个宏大的既定目标，而是一个你们决定发布的"side experiment（旁支实验）"吗？这个故事对机器人领域可能也有启发——每个人都想要一个"完整形态"，但也许真正引爆的会是很不一样的东西。

---

## 十八、ChatGPT 的诞生史：一个"研究预览"如何引爆

**Sam：** 我们当初发布 GPT-3 时，是想赚钱、想让人们来用这个 API。而模型上真正跑得通的唯一商业用例，蠢得可以——如果你回去用一下当年的它，会大吃一惊。那唯一奏效的商业用例是"文案写作（copywriting）"：你付给某家营销公司 20 美元，他们再付我们几美分，让 AI 帮你写一个落地页之类的东西。

但除了这个商业用例之外，开发者们还在用一个我们叫"playground（试验场）"的东西——那本是一个用来和模型对话的测试界面。而且当时很难用，因为我们还没把模型调到"适合聊天"的程度，你得先给它几个"聊天是什么样"的示例，然后才能聊。可人们真的很喜欢。

我从我认识的一个人那里学到一条很棒的道理：如果你注意到你的用户在做某件事，那就顺着那条路走下去。于是我们决定造一个好的聊天产品。我们开始做这件事时，正好完成了 GPT-4，并开始在内部使用——"这是件大事"。我们当时觉得："好，这将成为一个真正让世界认识 AI 的东西。"

这里也有一堆难题：它会不会造出假新闻？会不会说出很冒犯的话、给我们惹麻烦？所以我们决定先从一个较弱的版本开始。"聊天界面 + GPT-4"同时上，感觉动作太大了。于是我们决定用 GPT-3.5 来上线这个聊天界面——事实上它最初叫"Chat with GPT-3.5"。

我们并没打算把它做成一个产品，也没觉得它会引爆。我确实认为它能让世人"跟上"、意识到有什么正在发生。发布前几小时，我们万幸地把它改名为"ChatGPT"，并以"研究预览（research preview）"的形式放了出去。当时的想法是：先作为研究预览放出，几个月后再用 GPT-4 推出正式产品。

但不知出于什么原因，那个（3.5）模型恰好越过了某个临界阈值：尽管我们内部早已习以为常，用户却说"好，这太棒了"。当时也许还没那么多实用价值，但对人们来说，那是一个真切感受到"AI 进步"、并用上一个自己享受使用的东西的、了不起的时刻。等到我们再推出 GPT-4，他们就真的从使用中获得了实实在在的收益。

**Patrick：** 你会不会惊讶于："聊天"至今仍是我们与这种异类智能之间最直觉的界面——甚至包括编程？大体上，那就是我在对着计算机说话、告诉它去构建什么。

**Sam：** 不会，因为我自己是个"重度发短信的人（massive texter）"。我觉得我当初判断"这是个好界面"的一部分洞察就在于："我知道怎么用这个、我知道在一个文本框里开始聊天是什么感觉。"

## 十九、扩散、护城河与"智能的商品化"

**Patrick：** 关于"扩散（diffusion）"、以及如何让它更快，你有什么想法？如果使命是"把智能送到更多人手里、对每个人更有用"，那其中一个关键部分——我不确定——是不是营销活动之类的？你怎么让它比现在自然扩散的速度更快？

**Sam：** 我认为关键就是"把它做得更好"。我多少相信：一个真正伟大的产品会自我营销。一开始并没有什么大营销活动。我认为，随着我们进入下一代模型、并搞清楚"如何做出与模型本身一样出色的产品"，会涌现出极其惊人的实用价值，人们会飞快地把它传播出去。

我们确实应该多做点营销。它其实不算"受欢迎"——相对于人们的使用量而言，人们对"它会走向何方"有非常可以理解的焦虑。所以在这类事情上，我认为一些出色的营销会有帮助。但就"人们从产品中获得的价值、以及让产品增长得更快"来说：更好的模型、更多的算力、更好的产品——这些才是关键。

**Patrick：** 跟我讲讲看着 Codex 起飞的体验，以及它在多大程度上系于——我会称之为——你通过 ChatGPT 建立起来的"分发（distribution）竞争优势"。这也是通往一个更大问题的入口：AI 里的护城河（moat）。你认为长期看，什么会驱动这门生意里真正的竞争优势？

**Sam：** 我认为 Codex 主要是因为"最好的产品 + 最好的模型"而胜出。我们确实从 ChatGPT 的捆绑（bundling）里得到了一点优势，但非常非常小。

这件事让我对"竞争优势"这个问题反思了很多。因为卓越的智能可以从任何一个产品迁移到任何另一个产品。网络效应仍然是一种竞争优势；规模经济、以及"做出最便宜算力"的能力等等，仍然是一种竞争优势。但"产品优势"——如果我们能把人们迁移到 Codex，那别人做出更好的东西时，也能把人从 Codex 迁走。所以这让我反思良多。

这里有个很有意思的问题：这一切是否正走向"商品化（commodity）"？智能本身会不会变成一种纯粹的、可替代的大宗商品，就像原油那样？

**Patrick：** 智能本身？

**Sam：** 智能本身——我会说，是的。

**Patrick：** 那什么不会（被商品化）？

**Sam：** 算力。算力的规模、以及"制造更多算力"的能力——我认为那是一种非常持久的优势。即便产品本身不是（护城河）——因为 Codex 能写出你想要的任何软件——但工作流、各种集成（integrations）、复杂流程、团队协作的能力，这些都相当强大；甚至品牌偏好和熟悉度也相当强大。

## 二十、硬件新范式与"认知萎缩"的隐忧

**Patrick：** 显然你在硬件上做了些有意思的事（你大概会在这儿一带而过）。那个实验感觉如何？它和你已有的消费级分发是否契合？

**Sam：** 我对新硬件感兴趣的原因之一是：我们前面聊到，AI 一个非常强大的特性是"始终在线、主动、并理解你所有的上下文"。但当前的硬件并不适合这一点。我们是在一个大约有 50 年历史的硬件范式里工作。计算机很了不起，键盘、鼠标、显示器都是了不起的东西，但我们不得不把 AI"塞进"那个范式里。

我很期待——我希望 AI 能够引用（我们的）对话，但又不至于要我把笔记本电脑掰开、架在这里、让它一直盯着你看。我想要一件在社交上"适合这么做"、并且从设计上就是为这类用途而生的硬件。

**Patrick：** 说到那些悬而未决的问题——在你自己脑中、和朋友、和同事之间，最有意思的开放辩论或开放问题是什么？那些你并不确定、却觉得很重要的？

**Sam：** 有一个我认为没得到足够关注的问题：我们要如何避免"认知萎缩（cognitive atrophy）"？我们要如何使用这些工具，同时确保自己在越来越多地"拉伸"大脑、持续去理解那些真正重要的东西？

这有很多版本。我记得上学时，有位教授对我说："你必须理解编译器（compilers），否则你永远成不了一个好程序员。"这话不完全对；但"在一个合理的层面上，理解一个计算机系统的主要组件是如何运作的"，对我一直很重要。

---

## 二十一、招募顶尖研究员，与"去做更难的事"

**Patrick：** 曾经有一段时期，研究员的招募、留存、激励，是竞争格局里最具决定性的故事。关于你成功招募到伟大研究员，有很多传说；也有很多人经由 OpenAI、产生了巨大影响，有的很有名，有的名气小些。我很好奇你学到的这一整套——如何招募这一类人、什么对他们重要、你具体怎么做的。我从没听你讲过你为招人打出的实际战术。

**Sam：** 早期其实相当简单：我们相信 AGI 是可能的、值得去追求，并且愿意把这话说出来。而那在当时是一个近乎异端、疯狂的信念。我们刚宣布成立 OpenAI 时，这个领域所有的巨头、专家都在说：这太疯狂了、太浮夸了、太不负责任了。一些非常受尊敬的人（此处 ASR 作 "Yamal Kuhner"，据上下文很可能指某位知名怀疑者，如 Yann LeCun）对记者说："这帮人水平不行，成不了事。"

但"我们敢说我们要去干这件事"，真的吸引了某一类研究员——他们也想踏上这场成功概率很低的疯狂冒险。所以，一个雄心勃勃、大胆无畏的愿景，是一个非常强大的招募工具。

**Patrick：** 你写过：有时候恰恰因为这个原因，"做更难的事"反而更容易。

**Sam：** 我超级相信这一点。这是我给 YC 创始人最常给的建议之一，我也努力在 OpenAI 践行它：去做更难的事——去做真正重要的事，去做那种"如果你的公司不成功、它可能就不会发生"的事。

---

## 二十二、关于投资人，以及"疲惫"

**Patrick：** 你既是投资人、也是我们的投资人，你做过很多。你曾经就是干这个的。站到桌子另一边之后，你对投资人有什么新认识？

**Sam：** 真正会"现身"、并努力帮你的投资人，少得难以置信。Josh Kushner 是绝对的 MVP 级投资人，不可思议——感觉他多年来夜以继日地帮我们。他是我唯一能指出的、"始终主动、极其乐于助人"的投资人。本来能做到这点的人应该更多。也有许多别的投资人同样帮过忙、给过很好的战略建议、在我们开口时会去做事。但那种"持续的、不知疲倦的、全力以赴的支持"，在投资人里意外地稀有。也许我有偏见，因为过去别人这么评价我时我很受用。但我认为创始人真的很珍视这一点，它确实能起到实质作用；而作为投资人，这么做也是最"友好"的。

**Patrick：** 我朋友和我常玩一个游戏、互发短信，提示语是"一件你不想让我知道的、关于你的事"。这让你想到什么？

**Sam：** 我累了。这件事我做了很久，很累人。

**Patrick：** 你怎么熬过去？

**Sam：** 就是继续走下去。

**Patrick：** 那不禁要问：有没有一种"累到某种程度"会让你停下来？

**Sam：** 不不不。这是全世界最酷的工作，我打算做到我职业生涯的最后一天。只是它比我能向别人解释的要难得多。我非常感激能做这件事——这不是在抱怨。

---

## 二十三、未来 6–36 个月：反对"机器神"崇拜

**Patrick：** 接下来会发生什么？我们聊过明年或后年会有"自动化 AI 研究员"。你怎么看未来 6 到 36 个月会发生什么？也许在这种疯狂的指数里，这个时间尺度太远、无法预测。换个版本的问法：假设从现在起第 23 个月，我们有了某个所有人都同意是"超级智能（superintelligence）"的东西——那么第 24 个月会发生什么？

**Sam：** 我的回答是：不会发生太多。那种"对机器之神的邪教式崇拜"的状态——持这种想法的人，相信"快速就会发生很多事"的程度，超过了实际会发生的。最终确实会发生很多事，但"最终会发生很多事"这件事，本来无论如何都会发生。

人类进步的速率、每个十年会有多不同、每个十年比前一个十年更不同多少——这在很长时间里一直在上演，当然有起有落，但方向如此。我认为正确的思考方式是：每个人都想"带着自己的故事在场"，都想觉得自己"见证了机器之神降临的那一刻、并扮演了某个疯狂的角色"。但这只是又一步而已。50 年前很难想象今天，而今天也很难想象 50 年后的那一步。我认为正确的心理框架，就是把镜头拉到极远——它是一条相当平滑的指数曲线。

---

## 二十四、无名英雄、最深刻的教训与最自豪的事

**Patrick：** 在这家公司的故事里，你最喜欢的、被低估的无名英雄是谁？

**Sam：** 第一个我要点名的人是 Alec Radford。Alec Radford 大概是整个领域历史上最重要、却不太为人所知的研究者，同时也是一个非常了不起的、顶级的好人。是他做出了后来成为 GPT 系列的那项工作，以及许多别的重要工作。但他还是那种会启发、引导、"轻推"别人走向许多其他方向的人，而那些方向后来被证明极其重要。

我觉得他很酷的一点是：如果你去问和他共事过的人，他们当然会说"世代级的天才、才华横溢、极具创新的思想者，对自己的工作和理解钻研极深"；但每个人在说完之前都会补一句——他是他们所接触过的最善良、最正向、最好的人之一。

**Patrick：** 我喜欢"塑造性时刻（formative moments）"。收尾之际，我想各问一个。先从这个问起：那件最有教益的、你也许搞错了或做错了的事是什么，从中学到了什么？

**Sam：** 出过很多岔子。有一件塑造性的、出过岔子、我也没怎么公开谈过的事：我认为我们一开始"试图在结构（structure）上创新"是个错误。

我们当时有很好的理由：我们不知道自己将来要如何赚钱，也完全不确定"长大成人"后会是什么样子。当然，我们在意我们的使命，希望以某种方式把公司结构搭起来，使得即便技术出现极快的"起飞（fast takeoff）"，我们的使命也能受到保护。于是我们采用了这个非营利（nonprofit）结构。但我确实由此明白了，为什么人们通常不那么做。

如果我们当初没有试图在结构上创新、而是找到别的方式来守护使命的核心地位，我们本可以在很多方面省去大量痛苦。也许根本没有别的路——也许对于我们在做的事、以及它的重要性而言，除了一个"奇特的结构"，我们想不出别的办法。但过去十年，我真的学到了关于"为什么人们通常不这么干"的一个重要教训。

**Patrick：** 还有没有别的、塑造了"今天的你"的东西，是我们没聊到的？这个问题对我总是最有意思。

**Sam：** 有一些是我人生较晚才培养出来的：比如变得对"别人对我抱有强烈看法"这件事相对免疫。我意识到——天哪，如果你要处在这样一场疯狂革命的中心，每个人都会把一大堆东西投射到你身上，你必须迅速学会与之和解。我人生较晚还学会了如何变得非常平静、真正地不为事情焦虑。

但就"是什么驱动我、我在意什么、我想怎么过这一生"而言，总体上——不知为何——我感觉那个"10 岁的我"就已经相当完整地成型了。我想我大概生来就是这样。

**Patrick：** 那你回看时最自豪的呢？

**Sam：** 我最自豪的是：有那么多次，当世界其余人都错了的时候，我们在一件重要的事上是对的，把世界导向了如今这条轨迹——能在其中扮演一个角色，我非常自豪，感觉棒极了。此外，尽管发生了那么多糟心事，我也获得了一种"精神上的成长"（随便你怎么称呼它）——我学到了不可思议的韧性，以及它对"让我在人生其余部分感到快乐"所起的作用。对此我非常感激。

**Patrick：** 每期节目我都会问所有人同一个传统的收尾问题：有人为你做过的最善良的事是什么？

**Sam：** 关于"有多少人特意绕远路对我极其善良"，我觉得自己幸运得难以置信，从我整个人生一路走来。我此刻想着想着，脑海里就浮现出一连串蒙太奇般的画面——人们对我好得不可思议。（如果要举一个最近的）就是我的孩子第一次把他的蓝莓分给我吃，那非常甜。

**Patrick：** 好时刻，保持简单。谢谢你，兄弟。

**Sam：** 谢谢。

## 投资视角的关键信息点（速览）

- **需求"无上限"论**：在"足够高能力 + 足够低价格"下，Sam 认为智能需求基本无上限——这是其激进算力采购的底层逻辑。
- **推理 vs 训练的商业模式**：OpenAI 不需要"高毛利"，靠在数万亿美元推理营收上取薄利即可反哺训练；由此 Sam 对"被蒸馏"相当淡定。
- **护城河判断**：**智能本身会商品化**；真正持久的优势是**算力规模 + 制造更多算力的能力**，其次是工作流/集成/团队协作/品牌熟悉度。产品层优势易被迁移。
- **芯片自研**：Jalapeño 代表"用部分通用性换更高每瓦 token"的路线，被视为长期竞争优势；并看好软件效率（还有数个数量级空间）与光计算。
- **供给过剩的两种情形**：①模型太强太省、人类注意力吸收不了更多产出；②撞上 scaling wall、成本曲线降不下去。
- **瓶颈轮换**：算力→研究点子→数据→算力，瓶颈在几者间循环；近半年研究点子重回"凯旋期"。
- **机器人**："ChatGPT 时刻"预计 2–3 年内到来（远早于"20 年"派）。
- **监管风险**：Sam 更担心"以 AI 安全之名的权力集中"；同时承认可能需为安全"放慢节奏"，但要避免被视为监管俘获或前沿实验室合谋。

# Latent Space:从 0 到千万用户——OpenAI Akshay Nathan 谈 ChatGPT Work 与 Codex(内容纪要,非逐字转录)

**播客:** Latent Space
**日期:** 2026 年 7 月 28 日
**嘉宾:** Akshay Nathan —— OpenAI"生产力(Productivity)"团队负责人,主导 ChatGPT Work 的发布;2023 年加入 OpenAI,此前曾在企业级 ChatGPT(ChatGPT Enterprise)团队;更早在 Airtable、以及一家做 AI 自动化测试的创业公司工作过(押注"把代码的威力交给不懂代码的人",在 LLM 出现前效果有限,LLM 出现后他认为这正是补上的那块拼图)。
**主持:** Latent Space 主播 + 联合主持 Vibhu

> 说明:本期是一次产品方法论访谈,信息密度高但偏对话式、少硬数据。这次采用**主题式摘要**、以转述为主,原话引用控制在最小范围。

---

## 一、ChatGPT Work 的起源:Codex 内部意外走红,催生了"合并"的决定

Akshay 说,推动 ChatGPT Work 诞生的关键契机,是 Codex 发布后在 OpenAI**内部非工程岗位**中出现的意外采纳——他在做用户调研时发现,战略财务、市场等非技术团队的同事不仅在用 Codex 完成本职工作,更让他印象深刻的是,这些人对"自己在用 Codex"这件事**感到自豪**,一种"我抢先用上了新东西""我有了超能力"的心态。这让团队意识到:agent 的能力早于预期就能扩展到非开发者身上,而 OpenAI 已经握有 ChatGPT 数以亿计的庞大用户基础——问题变成"怎么把这种能力真正带给他们",这个产品命题最终演变成了"Super App"式的合并策略,并落地为 ChatGPT Work。

## 二、Codex、ChatGPT、Work 三者的底层关系:同一套 harness,不同的产品外观

一个关键的技术澄清:**Codex 和 ChatGPT Work 背后是同一套 harness(工具编排层)**,团队针对"知识工作"场景(插件、计算机操作、artifacts 等)做了专门优化,这些能力在两个产品里都能拿到。差异主要在**产品层面的克制取舍**——比如 Codex 模式里会暴露 git diff、文件改动细节等偏"开发者视角"的信息,Work 模式里则不展示这些。团队的产品哲学是:**不希望用户被迫"选择自己在哪个体验里"**——这被 Akshay 类比为"通用人工智能不该让人先选择用哪个版本的 AGI",理想状态是模型自己决定用什么方式服务你。据介绍,系统里已经有一个"路由决策"机制:如果你在传统 ChatGPT 对话里提出的需求更适合 Work 模式处理(比如要生成一个电子表格),模型会引导你切换过去。

Akshay 还做了一个简短的"harness 口述史":经典的 ChatGPT harness(为对话、搜索、学习等场景优化,注重延迟和"人格"打磨)服务了从 o1 时代至今的产品;而 Codex 团队发现,如果给 agent 一个"无限灵活的计算机环境"作为操作对象,能做到的事情量级完全不同——于是团队判断,知识工作场景更适合"计算机环境"这套范式,即用 Codex 的 harness 逐步取代经典对话式 harness,两者目前处于交叠过渡期。

## 三、企业级 AI 落地的老问题:"千人千面"的需求 vs 缺乏具体使用场景

Akshay 回顾在 ChatGPT Enterprise 团队的经历:企业客户对"要用 AI 做什么"往往给不出具体答案——如果直接问"你想用 AI 做什么",得到的多是笼统套话;但如果问"你想让 AI 解决哪个具体任务",答案会极度发散、五花八门。他认为这正是企业级 AI 推广的核心难点所在:模型本身"什么都能聊"是魔法,但这也意味着用户经常不知道该拿它做什么。他把这个问题的解法总结为"到用户所在之处迎接他们"——不是空谈能力,而是先搞清楚具体场景,再手把手教会怎么用 AI 撬动杠杆。他区分了这和"前置部署工程师(forward-deployed engineer)"模式的关系:后者偏市场/服务侧,而产品本身也必须做对——最终无论方法论多完善,用户面对屏幕时,产品要负责把他们引导到正确的地方。

## 四、当前企业 AI 落地的阶段判断:早期采用者已经"顿悟",大多数人还没到那一步

Akshay 认为,目前存在一小群早期采用者已经真正理解"只要上下文对、工具接对、有人监督,agent 几乎什么都能干";但还有一个规模大 10 到 100 倍的群体尚未意识到这一点。他判断这是 ChatGPT Work 想要争取的下一波市场空间。

## 五、"生产力"团队为什么不叫"企业"团队

Akshay 解释团队命名逻辑:之所以叫"生产力(Productivity)"而不是"企业"或"工作",是因为团队认为 ChatGPT Work 的边界并不局限于严格意义上的"工作"——他举了一个用户案例:有人收到快递照片但没找到包裹,让 ChatGPT Work 去分析照片、比对小区周边信息,最终定位到了具体的公寓楼。这类"个人生活相关但体现出高度自主性"的任务,正是团队想覆盖的范围。

## 六、模型与配置的选择建议:默认设置对多数人已经够用

面对"该用 Ultra 模式还是普通模式、什么时候上 sub-agent"这类"配置调参式"的问题,Akshay 的建议是:**团队刻意把默认配置调成对大多数人已经最优**,只有当默认配置在效率或质量上不够用时,才需要手动切换到其他配置(比如更强的推理档位、或不同模型档位)。他承认目前面向高阶用户暴露的选项可能偏多,团队也在着手简化。

关于何时用 multi-agent(比如"Ultra"模式或多 agent 并行):比较适合"高度复杂/开放式探索"或"可高度并行拆分"的任务;而"可以持续、可验证地稳步推进"的任务用单 agent 模式("Goal"模式)效果更好——但他坦言大多数任务其实两边都不完全占,所以还是建议先用默认设置试试,再按需调整。

## 七、Sites(生成式网页/artifacts):正在取代 PPT 和电子表格的协作载体

这段是本期比较具体的产品洞见。团队在这次发布中重点投入了 "artifacts"(内部代号,产品里不会直接用这个词对用户说)能力——既包括模型侧(如从 5.4 到 5.5、5.6 版本间生成质量的显著提升),也包括产品侧的用户体验(比如生成可托管的网页,不再需要用户自己搭建)。

Akshay 分享了一个内部案例:公司财务团队原本每月用 PPT/Excel 做汇报,现在直接改用"Sites"(AI 生成的可交互网页)作为团队协作载体——原因是 PPT、Excel 这类工具虽然功能强大,但总有"人不知道怎么用某个功能"或"工具本身做不到"的边界;而用自然语言直接向 AI 描述需求生成的网页,理论上"你想要什么都能生成"。两位主持人现场做了对比实验(一人用 ChatGPT Work 处理了大量截图输入 + 消耗约 17 亿 token,另一人用 Codex 花约 19 分钟),分别为一款桌游生成了带 3D 交互的可玩网页、以及用于展示"AI 自我对弈训练"实验结果的研究面板。双方都认为这类"网页作为研究/汇报产出物"的形态,比传统 markdown 或幻灯片信息密度更高、也更灵活,但目前普遍存在**内容冗长、需要反复精简**的问题。

Akshay 提到,他们在内部也把这种"生成式网页"用作产品早期原型/设计协作工具——比如本期提到的那个"模式选择滑块(slider)"UI 组件,就是设计、工程、产品团队在一个 Sites 里协作打磨出来的。

## 八、工作与生活的边界正在模糊

多位对话者认同,ChatGPT Work/Codex 正在让"工作相关"和"个人生活相关"的使用场景彼此渗透——个人用它做健身计划、备餐规划、玩桌游 AI 训练,却常常无意间把这些"玩具级"用例展示给同事,反而成了最有效的产品传播方式("show, don't tell",亲眼看到别人做到了什么,比任何教程都有说服力)。Akshay 提到,团队内部一个有趣的用例是"自动侦测团队 Slack/文档里的热梗、定时生成表情包发到共享频道"——他认为这体现了模型除了"有用"之外,也开始展现"意料之外的联想能力"(能发现你自己都没想到的关联),这种能力未来会延伸到更严肃的场景。

## 九、发布数据与产品定位:10 万到千万用户,但"这只是开始"

Akshay 表示,ChatGPT Work 是他经历过的最成功的发布之一(甚至认为比 GPT-5.0 发布更有个人成就感),用户数已达到千万量级。但他强调这在 ChatGPT 数亿用户体量面前"仍只是起步"——目前 Work 仅对付费用户开放,且不会默认把用户导入(需要引导用户理解产品价值)。他透露 Codex 作为独立品牌会长期保留,团队没有打算"取代"它——开发者一直是 OpenAI 的核心市场,Codex 未来会继续为软件开发场景做专门优化,合并只是让用户能在"写代码""生成文档""搜索"等任务间无缝切换,而不是削弱开发者体验。

关于内部术语是否会渗透进普通用户认知:他举例说没人会说"给我生成一个 artifact",用户只会用自己熟悉的语言描述需求(比如"帮我做个 PPT"),这正是团队希望达到的效果——工具应该隐形,而不是让用户学习新黑话。

## 十、OpenClaw 的启发:个人 AI 操作系统的雏形

Akshay 分享了自己和太太搭建 OpenClaw(一个开源的个人自动化 agent 项目)来管理家庭事务的经历(比如自动创建日历事项),他认为这段经历给 ChatGPT Work 的设计带来了不少启发——尤其是"持久化计算机环境"(文件在多次会话之间持续存在)这个理念。他提到团队内部有成员已经完全把原来用 OpenClaw 做的事(健身计划、指甲护理提醒等个人事务)迁移到了 ChatGPT Work 上,因为底层原语(定时任务、文件系统访问、跨时间引用记忆)是相通的。他判断两者会长期并存、互相借鉴,而非谁取代谁——ChatGPT 的用户认知度远高于 OpenClaw,如果 ChatGPT Work 能把 OpenClaw 证明有效的那些"魔法"带给更多人,本身就是一种成功。团队对 Work 的核心产品哲学是:用户进来开始一次对话/会话,理论上应该能就地完成任何事情,而不需要跳转到其他入口去调用某个具体功能。

## 十一、记忆系统:从"经典 ChatGPT 记忆"到 Memory V3、以及实验性的 Chronicle

Akshay 认为记忆是用户最认可 ChatGPT 的地方之一——"感觉这就是专属于我的 ChatGPT"是身边朋友家人最常提到的喜爱点。ChatGPT Work 复用了此前发布的 **Memory V3** 系统,让"个人记忆"在从经典 ChatGPT 迁移到 Work 时能够延续,而不是从零开始。他坦言记忆本质是个检索问题——既要"知道关于你的事",又要有足够的分寸感("EQ"),在合适的时机主动调用这些信息,而不产生负面的意外(比如说错话),这是一个公认很难、但被团队认为极其重要的方向。

他还提到一个仍处于实验阶段(默认关闭)的功能 **Chronicle**——它能从用户的电脑使用行为中学习,作为记忆系统的额外输入源,更侧重"从长期使用中提炼洞察"而非单纯问答式记忆。

## 十二、关于用 AI 写团队评审(review)的边界

主持人提出一个管理者视角的敏感问题:用 AI 生成对下属的评价是否合适。Akshay 明确区分了两件事:**绝不会**直接用 AI 生成的文字原样当作对某人的评价发出去;但会用 AI 做"上下文收集"——比如整理某位同事这段时间做了哪些贡献、哪些是自己可能没注意到的亮点(代码提交记录、Slack 讨论、评审记录等),本质上是一种更强大的"agentic 搜索"。他强调,正因为现在每个人靠 AI 能完成的工作量呈几何级数增长,管理者也必须借助同样的工具才能跟上、才能不遗漏重要信息——但最终呈现给当事人的评价文字,仍然必须由人来写。

## 十三、如何衡量"生产力"提升:旧的代理指标正在失效

Akshay 认为这是整个行业都还没解决的难题。传统上大家用"代码提交量""故事点数"等代理指标衡量效率,但这些指标和 AI 时代下"团队是否真正实现了目标"的相关性正在减弱(比如 token 消耗量、模型调用次数,都不再能可靠代表团队是否朝目标推进)。他坦言 OpenAI 自己也没有彻底解决这个问题,但提出了一个他认为很关键的管理框架:**区分"运动(motion)"和"进展(progress)"**——现在的工具让"看起来在动"变得空前容易,但真正的进展需要团队对"到底想达成什么"保持清晰、审慎的定义;如果没有这种明确性,团队很容易把"忙碌"误当成"推进"。他给团队/管理者的具体建议是关注"击球次数"的质量而非单纯数量——即团队能否高效、完整地走完"想法→构建→获取反馈→验证或推翻假设→进入下一个想法"这个循环,并在反复经历这个循环的过程中保持团队的谦逊心态与投入热情。

## 十四、团队与角色的演变:模糊的职能边界、"T 型人才"假说

关于"AI 会不会让某些岗位彻底消失"这类流传甚广的调侃式预测(比如"未来科技行业只剩四种工作"这类说法),Akshay 的判断更温和:他认为多数人会变成"T 型人才"——AI 让每个人都能在多个领域触达"通才"级别的产出(比如他自己虽然不是设计师,也能借助 AI 迭代出像样的设计方案),但每个人依然会保留一个自己真正深耕的专长领域,在这个专长上借助 AI 走得更深。他认为团队真正的瓶颈正在从"人力/技能"转移到"**想法和判断力(taste)**"——因为构建的门槛已经如此之低,以至于"有多少值得做的好想法"成了新的限制因素,而好的想法很少凭空产生,往往来自和用户的持续对话、对真实摩擦点的观察、以及在已有基础上的迭代——这也是他认为"通才型、能闭环整个反馈循环的人"会持续有价值的原因。

---

# 钨市场正在预警一场即将到来的战争

**节目：** Odd Lots（Bloomberg）
**主持：** Joe Weisenthal（乔·韦森塔尔）、Tracy Alloway（特雷西·阿洛威）
**嘉宾：** David Fickling（大卫·菲克林）—— Bloomberg Opinion 专栏作者（常驻悉尼），刚完成一篇关于澳大利亚一座钨矿的实地报道

**日期：** 2026 年 8 月 3 日

> *整理说明：本文基于 Whisper 原始逐字稿整理，已修正 ASR 错字、还原专有名词。开场/中插的其他节目预告与赞助口播（The Deal、Honest Talk、TED Business、Masters in Business、Businessweek）以【广告】标注，不做全文翻译。个别发音不清处以（存疑）标注。*

【广告】开场：Bloomberg 播客《The Deal》（A-Rod 与 Jason Kelly 主持）预告。

## 导语：钨立方、FTX 与那颗"丛林里的巨型钨块"

**Joe：** Tracy，我今早有点"心碎"。

**Tracy：** "有点心碎"——听着像一首乡村单曲的名字（笑）。我知道你在难过什么：你在唱"钨立方蓝调（tungsten cube blues）"。

**Joe：** 2022 年那波"钨立方"热潮你记得吧？我买了一个。它握在手里那种感觉太爽了——一大块钨、意外地沉。我本来想带来当道具，结果最近搬了工位，我在桌上找不到了。要么是搬家时弄丢了，要么……因为钨价涨了这么多，也许被人偷了。

**Tracy：** 我想我知道是哪一种（笑）。给没赶上"钨立方狂热"的听众解释：曾有那么一刻，不知为何主要是一群"加密兄弟（crypto bros）"疯狂买这些钨立方、在社交媒体上晒照，然后 Joe 之类的人转头就忘了它。这其实是我们今天要聊的东西的绝佳类比——因为钨这种金属恰好经历着这种周期：有那么几年它是"你要宣战就绝对离不开"的战略资产，战争一结束，你又把它忘了（除了工业用途或桌面小玩具），然后你发现你又需要它了。这是一个长期的"繁荣—萧条"循环。所有人似乎都会忘记钨——除了中国。

**Joe：** 我还知道哪儿能找到一块钨——在巴哈马（笑）。FTX 那颗著名的巨型钨立方。Michael Lewis（迈克尔·刘易斯）写 Sam Bankman-Fried（山姆·班克曼-弗里德）那本书的最末尾提到：他在丛林里一个仓库中找到了那颗巨型钨立方，而它大概还在那儿，因为没人愿意搬动它——太沉了。

**Tracy：** 我没把这立方当"投资"买。硬资产投资有个大家不常谈的点：你实际上在付"负利率"——要么持续付仓储费（保险箱之类），要么最终得雇保安（如果你真有很多金银）；而如果你不这么做，那每一年你都有一个"非零概率"弄丢这项资产——放错地方、丢了加密钱包的钥匙之类。这等于是"随机地"复现了那个负利率。

**Joe：** 我还没彻底放弃找它的希望（笑）。总之，抛开桌面玩具不谈——钨这东西，正如你说，是"时而重要"的。它不像铜或石油那样"一直重要"，而是一种"时而重要"的商品，这就制造了有意思的动态。而它似乎正变得越来越重要：回到军事用途——我们最近打了很多仗，钨大量出现在巡航导弹、无人机弹片之类的东西里。同时，像很多稀土金属一样，它对我们的"未来愿景"、对 AI 建设也越来越重要。当然，和很多稀土一样，供给有限，且似乎由某一个特定国家主导。

**Tracy：** 它其实储量不少，但在平常时期"成本高、利润薄"，分布也算分散——有些在对美友好的国家，有些在被视为地缘对手的国家。但在正常时期，考虑到开采的时间和环境成本，根本"不值得去挤这个柠檬"。所以我们该聊聊：在地缘紧张升级的当下，钨处于什么状态。我们请到了完美的嘉宾——本该早就请上 Odd Lots、来自悉尼的同事 David Fickling。

---

## 一、钨为何时而至关重要：一个"百年战争预测市场"

**Joe：** 我们为什么谈战争、地缘不确定性这些？钨究竟是什么，让它突然变得重要？

**David：** 你可以把钨看成一个"运行了一个世纪、却被忽视的战争预测市场（prediction market for war）"。在我开始研究钨之前没意识到这点，但如果回到 20 世纪初，它确实像个预测市场那样运作：一旦人们感到战争成为真实可能，就会把真金白银押在钨上。这个链条是这样的：如果你经营一座钨矿，你就与钨贸易商有联系；钨贸易商又与军工材料公司有联系；而当战争前景变得真实时，正是这些军工公司下第一批大订单。

我拜访的这座矿有段非凡的历史：它 1917 年（一战期间）首次开矿，战争结束后关闭（不再需要钨，欧洲各国政府抛售钨库存）；二战前的 1938 年重新开张；二战后挣扎了一阵，被朝鲜战争"救活"；大约在斯普特尼克（Sputnik）卫星发射、人们开始重新思考"未来战争会是什么样"时几乎完全关停；但随后又靠越南战争维持，冷战结束时最终关闭。这座矿在澳大利亚塔斯马尼亚岛外的国王岛（King Island，ASR 作 "a beach in Ireland"）上——一个"咆哮四十度（roaring forties）"里孤立多风的地方。1990 年它关闭、矿井灌水，此后近三十年基本被无视。而如今，恰恰在战争看起来更可能的这一刻，它终于又要重启了。

---

## 二、钨的物理特性与军事用途：穿甲弹与集束弹药的"金属雨"

**Joe：** 说清楚：钨的哪些属性让它对军事材料如此重要？

**David：** 就是你桌上那颗钨立方的属性——难以置信地致密，密度和黄金差不多（这大概也是它吸引"加密兄弟"的原因之一）。它还有个高得离谱的熔点，超过 3000 摄氏度——比熔岩热约三倍时钨仍是固体。这意味着：如果你想用它做弹丸，比如做一枚穿甲弹（armor-piercing）去击穿坦克的装甲，它会保持形状、笔直穿进坦克内部，非常有效；而大多数材料会"蘑菇状变形"、把力耗散掉。或者，一个当下更时兴的例子：集束弹药（cluster munition）——一枚爆开成分布式装药的弹头，用来端掉指挥所或打无人机。用钨，你可以装一堆极小的钨丸，它们会形成一场"金属雨"，砸碎附近一切；因为太致密，比钢有效得多。所以出于这些原因，它对军事用途非常有用；而战争临近时，人们会为这些物理属性付任何价钱。

**Joe：** 被一颗钨立方砸到头，肯定也又疼又伤（笑）。

---

## 三、非军事用途：碳化钨工具（80%）、涡轮叶片与 AI 芯片的微量

**Tracy：** 说说非军事用途——你写的这座重启的矿，投资人给出的开矿理由是什么？是预测军事冲突会带来更多钨需求，还是就觉得碳化钨工具之类的需求会增长？钨还用在哪儿？

**David：** 你做过功课，Tracy。碳化钨工具（carbide tooling）是最主要的原因——因为它非常硬，基本就是"钻头"。汽修店加工金属的钻头、矿场或油井钻头末端，任何你需要钻很硬东西的地方，用的都是碳化钨（tungsten carbide，钨与碳的化合物，如其名）——这是获得极强钻削能力的最具性价比的方式。

我写这篇文章时读到：二战时纳粹德国很担心钨供给、并开始短缺，为把钨省给武器工业，他们停止在工具里用钨。于是你会听到二战后期盟军士兵缴获德国坦克后说"这装备太烂了"——因为他们没有碳化钨来做工具，机床运转不好、齿轮全乱套。如今大部分钨（80%）就是碳化钨、就是工具，你在本地五金店就能买到、到处都是，是个相当无聊平淡的元素。

其他用途：几乎每种关键矿物都会在炼油厂被用作某种奇怪的催化剂，大约 5%，钨也一样。另一个挺有意思的是——因为它的高温高强度特性——涡轮叶片（turbine blades）很重要：喷气涡轮、以及大量用于发电和数据中心的燃气轮机、LNG 压缩机里，合金中高达 10% 可能是钨。甚至据说某些 AI 芯片里也用到钨，但那里的用量绝对微乎其微，因为芯片制造涉及的原料本就极少（芯片本身就小）。

---

## 四、"海盗片"式的股东名册：红牛、皮博迪、卡特彼勒经销商、塔州政府

**Tracy：** 这座要重开的 Dolphin（海豚）矿——我之前说投资者是"一伙多姿多彩的人"，读你的文章，真像一部劫案电影（heist movie）的角色阵容：红牛、几个不良债务（distressed debt）玩家、几个退休矿工来干"最后一票"。他们跟你说的重开理由是什么？

**David：** 我主要聊的是矿的执行董事长本人，他是被其中一位投资者请进来的。这家公司的股东名册，是我从没见过的那种——尤其对一家如你所说"具全球重要性"的公司而言。红牛（Red Bull）之所以参与，是因为中欧/日耳曼世界对钨有一种悠久的兴趣，而红牛总部在奥地利——奥地利有种"获取钨"的冲动（笑）。还有皮博迪能源（Peabody Energy，美国煤炭公司）约 20 年前从几位澳大利亚投资者手里买了一座煤矿，那几位就用那笔钱投了这座矿，是最早参与的一批人。有一位卡特彼勒（Caterpillar）经销商，他 1960 年代就在这座矿干过活，也是股东。塔斯马尼亚州政府是股东之一（因为他们在纾困它）。甚至一些出租起重机和采矿设备的公司，也基本以"股权抵未付账单"的方式入了股。这家公司几乎没有任何银行融资。

它的股本约 700 万澳元；自 20 年前有人真正试图恢复运营以来（这期间做了很多报告和环评），投入的现金总额约 7700 万美元——大概是亚马逊四小时的花费，真的非常少的钱。他们的抱负是：中国生产全球 80% 的钨；到 2010 年，你已看到中国就稀土供给威胁日本，那时就能看出这是潜在风险。全世界当时几乎没有别的钨矿——美国最后一座钨矿其实就在洛杉矶以东，是个退休的越战老兵，每年上山挖出几吨钨，一直挖到约 2013 年。我还翻出他当年写给国会的一封信，抱怨降低对中国钨的关税——他早在 2012 年就担心中国控制了太多、是战略竞争对手。那时人们不太在意，现在却是人人都担心的事。

## 五、和平时期的钨市场：中国 80%、地质禀赋与 8.5 万吨的小市场

**Joe：** 你提到中国生产全球 80% 的钨。能多讲讲和平时期的钨市场吗——为什么和平时期一般不值得上新项目？

**David：** 我认为最大的一点（这点常被低估）——虽然中国确实试图在很多关键资源上锁死供应链——但就钨而言（稀土也类似），中国就是恰好拥有远远最好的地质资源。这在采矿业常见：南非和博茨瓦纳有最好的钻石地质资源，俄罗斯和南非有最好的铂族金属资源，澳大利亚和巴西有最好的铁矿——这些资源在全球分布不均。如果你没有那么好的资源，就很难插得上手。回到 20 世纪初，中国一直主导全球钨供给；唯一真正改变的时期是冷战中钨基本对外部世界"封闭"的那段。一旦中国钨能进入世界市场，它的矿品位最高、储量也最多。

中国目前对钨有出口管制，我认为多半是地缘政治，但中国政府可能的辩护是："这些矿很老、这是个表现不佳的行业，我们需要重组。"总之这是一种相当稀缺的资源：全年用量约 8.5 万公吨。这不是个特别激动人心的市场，因为它很贵、且主要用在五金店和矿场；而且大部分会被回收——汽修店的钻头磨损后会被重新打磨或送去回收。所以钨没有巨大的持续需求激增，它大体只按全球工具产能的速度增长。

## 六、没有远期曲线的商品：为什么关键矿产难融资

**Tracy：** 讲讲钨的市场结构。就算你想买，现在也很难查到钨价，因为它似乎没有像石油那样的"远期曲线（forward curve）"。所以你若想押注一座钨矿，很难预测当前回报、更别说未来回报。

**David：** 完全正确，这也是关键矿产普遍最大的问题之一：没有期货市场，你没法为任何一座矿对冲成本。你现在做的资本投资，可能要到第 5 到 10 年才回本。如果是铜，我可以去伦敦金属交易所（LME）或 COMEX，签任意多的合约锁定五年后的铜价，然后拿去银行说"这是我的运营成本、这是产量、这是个可融资的项目"——非常简单。钨则完全不同，根本没有期货市场，因为市场太小了。我采访的一位投资者 Alex Campbell（此前上过节目）说：钨的价格可能是每"干公吨单位（DMTU）"300 美元，也可能是 3000 美元——取决于市场供需状态。中国可能突然切断供给，而中国有 80% 供给，于是世界其余国家为剩下的 20% 厮杀，这些价格中的任何一个都是"可行"的。这意味着，如果你被卡在中间（中国以外多数钨矿的成本都高于那个水平），你就很难为矿融资——没有银行会在这个基础上真正贷款给你，因为他们不知道你明年、更别说五年后的收入会是多少。

**Joe：** 钨没有远期曲线，但终端上我们确实有一个"代码"——存放在鹿特丹仓库的钨。我看那张图就想哭：我 2022 年买立方时大概每吨 300 美元，现在超过 3000。

**David：** 说清楚：那是"三吨"的价，一个"干公吨单位（DMTU）"实际上约合每吨钨 40 万美元。你看到的价格是一种叫"仲钨酸铵（ammonium paratungstate, APT）"的钨化合物——一种便于交易的钨形态，装袋运往全球，加热后氨逸出、你就得到钨氧化物，再很容易转化成其他东西。它以"干公吨单位"报价（少数关键矿产用这个单位），一个 DMTU 约含 7.93 公斤钨。所以若是每 DMTU 3000 美元，那约合每吨钨 40 万美元。

**Joe：** 所以有人偷了你的立方——那是笔好钱（笑）。这真让我烦，我得把它找出来。

## 七、这座矿的经济学：2.5% 全球份额 = 1/6"自由世界市场"

**Joe：** 走一遍这座矿的经济学——最好情形下，成功了意味着什么？

**David：** 关键矿产最让我着迷的是：涉及的数字往往小得离谱。20 年投入的现金总额才 7700 万美元、什么都不是。想想一个"白宫舞厅（White House ballroom）"的造价——现在大概 8 亿到 10 亿美元？用那个钱，你几乎能解决整个稀土问题。实际上一些认真投钱去解决对华稀土问题的投资者，花的就是那种量级——几亿美元。而这是一个我们在 AI 上花数十亿、一枚用了点钨的（防空）导弹就要约 1000 万美元的时代。

至于它能撬动市场的量：这座塔斯马尼亚的矿如果跑起来，应能供应全球约 2.5%。听着不多，但记住中国供 80%，所以其实是"剩余 20% 里的 2.5%"；而朝鲜和俄罗斯又供另外约 5%，所以是"剩余 15% 里的 2.5%"，是个相当可观的比例。冷战时的旧大宗商品报告会谈"自由世界市场（free world market）"——那 2.5% 大约是自由世界市场的六分之一。所以只需很小一笔钱，你就能在关键矿产上获得这样的份额；然而多数时候没人愿意投。

**Joe：** 这很像抛售氦（helium）储备——"省小钱"式的：这东西未来可能是战略性的，我们却为了区区五亿把它卖了。

## 八、中国的"棋盘思维"：出口管制、洪水式倾销与"周期缺失"

**Tracy：** 中国地理上在很多稀土（包括钨）上确有优势。但也感觉中国更愿意容忍这些行业的低回报，把市场当"棋盘"而非"短期表格"。这是否意味着：只要西方想开一座新钨矿，中国就能轻易涌入、放水压价、打压价格——毕竟它仍是主导生产者，而其他任何人都只是总产量的一个零头？

**David：** 是的，这正是投资者远离钨（以及远离稀土）的主要原因之一。目前钨价高企，恰恰是因为中国在特朗普去年上台前后实施了出口管制。这不意味着出口完全停止，但意味着如果你依赖中国钨出口（每个钨消费者都依赖），你会想赶在管制导致中国政府说"不，你不能卖给他们"之前尽早囤货。所以一旦这些出口管制被取消，市场上那种投机性行为（当前推高价格的主因之一）就会消失，价格就会下来，进而让一堆依赖高价的矿商破产。这在过去确实发生过——不只是中国政府：我去的这座矿一战后 1920 年第一次关停，正是因为一战盟国抛售了全部钨库存、淹没了市场（有点像 1990 年代英格兰银行抛售黄金，或任何政府抛售大宗商品的失误）。

**Joe：** 有没有人主张：作为西方/盟国战略支出的一部分，我们就该对这些资源维持"持续亏损的生产和投资"？因为相比其他国防或战略开支，这些数字实在不高。

**David：** 我认为真的缺这个。我在写这篇时意识到一件有意思的事：钨的"荒野岁月"部分源于对"战争性质"的重新思考。1990 年有两件事：冷战结束，以及关键的第一次海湾战争。海湾战争让很多西方人（尤其美国人）重新思考未来战争的样子。战前人们以为会是越战式的（萨达姆百万大军），结果是一场极快的技术战、迅速就摧枯拉朽——你看到了美军的技术优势。这让人觉得："冷战结束了，不需要再堆积对抗苏联的庞大军火库；而且我们对任何敌人都将拥有压倒性的技术优势，所以需要不同类型的武器。"你们请过 Chris Miller（《芯片战争》作者）吧？

**Joe：** 请过。

**David：** 他把这个动态描述得很好——基本上"芯片赢了冷战"，这导致军事战略的彻底重估。那时钨就没那么重要了——如果你技术上足够先进、能很快端掉敌方指挥所、瘫痪其电子基础设施和整个军事指挥，你就不需要打那种"消耗战（war of attrition）"，而消耗战正是钨真正大放异彩的地方。

现在我们当然又经历了一场"军事事务革命（revolution in military affairs）"、又一次对"战争会是什么样"的重估——因为乌克兰战争已进行四年，我们看到一个看起来像 20 世纪那些大战场的战场，仍在缓慢碾磨。这让你重新思考未来战争是不是会那样。而未来还有一个隐现的东西：台湾——一旦与台湾发生冲突，你面对的是地球上最大的制造业强国。你还能像 1990 年美国压制伊拉克那样、在技术上压制中国吗？我认为人们不指望那会那么容易。所以钨又一次大放异彩。

## 九、Project Vault、保底价与"哪些矿才真该储备"

**Tracy：** 我这会儿看到一条头条：美国正在征集提案，以提升钨和其他 12 种关键矿产的供给。如果要你建议如何鼓励美国或别处的钨生产，你此刻会建议什么？因为这里确实有张力：一种潜在的战略关键资源 vs 私人资本的局限（人们其实想投的是"能带来真实回报"的东西）。

**David：** 归根结底，你需要某种"保底价（floor price）"。关键矿产领域为此爆发了巨大争论：一派认为保底价是"给矿商的馈赠"、会鼓励"不经济的供给"。但在我们谈的语境里，那恰恰是重点——钨唯一"经济的供给"就在中国；如果这对你是个问题，你就需要一种在设定期限内鼓励"中国以外供给"的结构。

不过这有个巨大的哲学难题：你没法对每一种可能被认定为"关键"的材料都这么做。前几天有篇文章担心中国要锁死柠檬酸（citric acid）供给；冶金煤（metallurgical coal）被列入了美国关键矿产清单；铜也在清单上——你几乎能以此为由为任何东西辩护，这是个真问题。美国搞了个"Project Vault（穹顶计划，ASR 亦作 Bolt，名称以发音为准）"——一个约 120 亿美元、类似战略石油储备的关键矿产储备计划，但纳入标准很不清楚。风险是它变成"为铜、镍、铝、冶金煤这类相当普通的商品对冲价格风险"的工具——如果政府不够强硬，你最终拿不到真正想要的矿，只会囤到"行业希望政府兜底价格"的那些矿。你真正想要的是一小组"存在真实战略问题"的矿：钨是一个，稀土是另一个，还有镓（gallium）、锗（germanium）——这些是关键中的关键。这会便宜得多，但你需要提供"中期价格保障"、长到足以让矿商能据此借贷——大约三到五年。

## 十、替代与地质大搜寻：钴→LFP、离子吸附黏土不再只在华南

**Joe：** David，你很久以前写过一篇让我印象深刻的文章（大概十年前了），是在科技界"小行星采矿（asteroid mining）"幻想的语境下。你说：也许太空里有富含各种矿物的小行星，但地球上也有一个矿物金属储量惊人的地方——你的祖国澳大利亚。很多东西就摆在那儿、比太空近得多，但仍然远到"不值得去开采"，因为基础设施不存在。你能更广地谈谈这个吗？

**David：** 矿产勘探的世界充满了这个。澳大利亚有很多很小的勘探公司，有些几乎像"地质学家的度假项目"——资助一位地质学家带着锤子和试剂满世界跑，希望找到点什么。钨这块也是：我去的这座矿不寻常在于已运营约一个世纪、有已探明资源。但再举个例子：一组关键的稀土依赖所谓"离子吸附黏土（ionic adsorption clays）"——当你有一座被严重风化的花岗岩山，就会形成大量这种黏土，捕获我们最关心的稀土（如镨 praseodymium、钕等）。五年前人们会说这些只能在华南找到、世界的一个问题是"你永远无法在华南以外找到离子吸附黏土"。但现在我们处在一个中国正对这些东西设管制、停止出口许多此类元素的世界（这正是稀土磁体供应链担忧的核心），而信不信由你——这些离子吸附黏土开始在别处冒出来：巴西、马来西亚、澳大利亚、热带非洲多地。人们突然意识到那里也有矿床——也许不如中国的好（中国矿床最先被勘探是有原因的），但如果中国变成不可靠的资源来源，人们就会去别处找。

大宗商品与采矿里有两股孪生的活动：一是"替代效应（substitution）"——有时你就说"这个用不起了、太稀缺了，我们需要替代品"。一个好例子是电动车电池：五到八年前人们谈电池对钴（cobalt）的依赖，而钴高度集中于一个国家（刚果民主共和国 DRC，那里采矿业有大量童工），而且某些方面钴也没那么好，所以很多中国电池厂开始用不含钴的另一种化学体系——磷酸铁锂（LFP）——于是你就从那个产品替代掉、不再需要它。回到小行星采矿：如果一种商品稀缺到你得上太空去拿，你大概会用别的东西替代它；但如果没那么稀缺，你大概能派地质学家满世界跑、在别处找到它，而只要既有供给足够不安全，替代地点就会越来越有吸引力。

**Joe：** 那我们干脆把钨的用途替换成黄金好了——密度一样嘛，你直接买金条、搞金基弹药，一样能切穿那辆坦克（笑）。David Fickling，聊得太开心了，谢谢你上节目。

## 十一、主持人复盘：几十亿就能缓解的战略痛点、中国"没有周期"、人人建储备的双刃

**Joe：** 我们有这么庞大的军工复合体，然后有这么几样东西却是"四舍五入的误差"——一座钨矿的资本投入在大局里显得那么小。没人说"我们就拨几十亿在这儿那儿、缓解一些潜在的压力点吧"；相反，我们花 20 年、为区区十亿把氦储备卖掉了。某种程度上这像是一种"预测未来的失败"——而预测很难：人们以为战争会以别的方式演化，没想到我们会发射这么多巡航导弹、会用弹片打无人机、或让无人机打出这么多弹片，于是对钨产生了意料之外的需求；氦某种意义上也一样，因为我们不知道会有半导体产业等等。事后诸葛亮嘛。但我们也许真该重启加州那座钨矿——九月初我们会在洛杉矶，也许能找到当年经营它的那个人，去看看。

我还总想到中国的一个特点：那里其实没有真正的"商业周期（business cycle）"。他们有长期的行业性萧条（比如房地产），但有一种"拒绝接受'整体衰退是必然'这个前提"的姿态。因此你不会出现"曾经重要的大行业空心化、再重启时成本高得吓人"的情形。

**Tracy：** 你确实会看到一些。中国的猪/猪肉行业就是个好例子：曾经短缺、价格上涨，政府提供大量支持，产能过度扩张、价格崩溃，一堆私营经营者出局（猪周期）。所以确实有一些。但总体上我认为中国更愿意为这些长期布局接受更低回报。这也引出一个问题：我们这个时代的一个大主题（我们在节目里反复讨论过）是——人人似乎都在建立自己的供给、应对全球经济里的某些"卡脖子（chokeholds）"。于是现在的一个担忧（David 也谈到）是：如果人人都想造自己的钨供给（哪怕相对很小、哪怕不需要太多资本），如果大家同时都这么干、而末端又没有一个"最后买家（buyer of last resort）"，那人们就会预期"我们会变成供过于求"。而与此同时，所有这些支出在边际上是通胀性的。

**Joe：** 所以你有"双重打击"：一是为战略而在非生产性的东西上花更多钱；二是因为对自由贸易安全的焦虑而带来的（效率）折损——你会得到大量、且在多个地理和国家间重复的支出。

**Tracy：** 我还想说：每次做大宗商品这类节目——尤其最近伊朗那边的石油供给事件之后——我总惊叹于市场在应对这些冲击时的创造力和巧思。日本曾被中国切断一批稀土（包括钨）供给，当时肯定被认为对很多日本产业（包括车企）是灾难，但最后它靠回收供给、废钨等等应对得相当不错。当然，如果中国对全世界停止出口钨，废钨大概不足以替代那份供给；但对某些供给冲击，市场似乎能拿出相当好的应对。

**Joe：** 对，就像我们去年和 Javier Blas（哈维尔·布拉斯）聊的——我们也许得拆开一堆吸尘器、把里面的磁铁抠出来（笑）。Joe，你要不要进军废钨生意？我可以先给你几个金属刀头起步（笑）。

**Tracy：** 我不干了。尤其要是找不到那颗立方，我再也不想去想它。

**Joe：** 好，别再想钨了——这可跟整期节目的信息完全相反啊（笑）。

**Tracy：** 对，继续想钨、继续想钨（笑）。就到这儿吧。

## 宏观/投资视角的关键信息点（速览）

- **钨 = "百年战争预测市场"**：不像铜/石油"一直重要"，钨"时而至关重要"——战争临近→军工订单→矿商投资，呈长期"繁荣-萧条"循环。Dolphin 矿的开关史几乎与每场大战重合（一战、二战、朝鲜、越南、冷战），如今在"战争更可能"之际重启，本身就是一个信号。
- **军事驱动回归 = 战争形态重估**：海湾战争让西方转向"技术压制、快速瘫痪"（"芯片赢了冷战"），钨（消耗战金属）被冷落；**乌克兰四年消耗战 + 台湾冲突前景**让钨重新"大放异彩"——因为对华可能无法像 1990 年压制伊拉克那样技术碾压。这是与你 ChinaTalk/Milanović 线索一致的"双重用途/主权"叙事的又一佐证。
- **中国主导的双重根源**：不只是"锁供应链"，更是**地质禀赋**（品位最高、储量最多，8.5 万吨/年小市场）；中国 80%（+朝俄约 5%）。**出口管制（特朗普上台前后实施）是当前高价主因**——投机性抢囤推高价格，一旦管制解除、价格回落，中国以外矿商多数会破产（洪水式倾销的结构性风险）。
- **关键矿产的融资死结**：**没有期货/远期曲线**（市场太小），DMTU 价可在 $300–$3000 间剧烈波动（≈每吨 4 万–40 万美元），银行无法据以放贷→**必须有 3–5 年的中期保底价**才能让矿商借贷。铜有 LME/COMEX 可对冲，钨没有。
- **数字小得离谱 = 政策失灵**：解决整个稀土问题的量级仅"几亿美元"（≈一个白宫舞厅造价），一枚防空导弹约 1000 万；Dolphin 矿 20 年总投入仅 7700 万美元、可供**自由世界市场约 1/6**。战略上"几十亿就能缓解的痛点"却长期无人投——氦储备被"省小钱"式贱卖是同类教训。
- **"人人建储备"的双刃**：全球都在应对"卡脖子"、各自建供给→若同时上马、且末端无"最后买家"→**边际通胀 + 未来过剩**的双重打击（重复投资 across 多国）。这是当前去全球化/供应链重构主题的通用副作用。
- **替代 + 地质大搜寻是对冲**：市场应对冲击的巧思（日本被断稀土靠回收/废料撑过、钴→LFP 替代、离子吸附黏土在巴西/马来/澳/非洲陆续发现）表明**中国的矿物杠杆有上限**——只要既有供给足够不安全，替代地点与替代材料就会被激活。但废料/回收不足以完全替代"全面断供"。
- **储备清单的政策风险（Project Vault）**：约 120 亿美元的美国关键矿产储备若标准不严，易沦为"为铜/镍/铝/冶金煤这类普通商品兜底价格"的工具，而非聚焦真正战略性的**钨、稀土、镓、锗**。值得跟踪其纳入标准与保底价机制。
- **中国"无周期"的结构优势**：更愿为长期战略接受低回报、把市场当棋盘（虽有"猪周期"这类例外）→在关键矿产上比"短期表格"式的西方私人资本更有耐心，这是西方难以靠纯市场化路径追赶的根源。

## 第一段：ANYbotics（Péter Fankhauser）——四足巡检机器人

**Jason：** 各位，我们在巴黎对当今头部机器人公司的系列访谈继续。非常高兴请到 Péter Fankhauser 博士——ANYbotics 联合创始人兼 CEO，产品叫 ANYmal（"any"的双关，笑）。你在这个领域干了近 20 年，公司成立 10 年：前五年像个研究实验室，后五年——你们管这种"狗形"机器人叫什么？

**Péter：** 一套巡检解决方案（inspection solution）：在关键基础设施里做数据采集与理解。但外形是四足机器人。

**Jason：** 我们喜欢叫它"机器狗"。为什么"狗形"成了标准？做这个的不止你们一家，为什么它率先达到了相对规模、实现了部署？

**Péter：** 自然界很多动物是四条腿，这是很好的类比：机动性极好，能爬楼梯、能去任何人能去的地方。四条腿在灵活性、平衡之外还有稳定性——落脚点多、抓地好，因为我们在恶劣环境作业：湿滑地面、下雨、落雪、长草。所以四足是很好的形态。

**Jason：** 一个傻问题：那人形版为什么不做成"半人马（centaur）"？大家在做 Optimus、NEO、波士顿动力的 Atlas 那些双足直立机器人，担心的是它们老是摔倒——演示里不停摔，一摔可能砸伤人脚踝。为什么不给它们装四条腿？

**Péter：** 完全可以，取决于用例。如果你要在咖啡馆送咖啡，那里空间窄、你想在视线高度工作，双足也许更好；而在我们作业的设施里，四足更稳、绕行空间也够。

**Jason：** 我不信，我觉得所有咖啡馆都该用……它们在希腊神话里叫半人马嘛（笑）。四条腿加个身子，这该成为新标准。你找到了一个非常有效的首个用例——巡检重要基础设施，现在过去五年部署了数百台。

**Péter：** 是的，数百台。

**Jason：** 这些很贵，买一台要低几十万美元（low hundreds of thousands），运营还要每年几万美元的服务合同。所以它们不是家用的，是工业级的、装了很多传感器。

**Péter：** 对我们来说这不是"替代劳动力"，而是"我们能做得更好、能做到超人（superhuman）"。巡检是个好例子：人的眼睛耳朵感知不到所有信号——微量气体泄漏、设备过热。机器人上装了热成像相机、声学麦克风、气体浓度传感器等等，加上 AI，能远超人类。它的货币价值在于"避免停机"：这些资产一旦停转，每小时损失数十万美元；我们每替它们省下一分钟、一小时，基本就把机器人的钱赚回来了。所以我们才负担得起在机器人上装非常昂贵的传感器和 GPU。

**Jason：** 这些机器人上有相当强的算力，也得有可观的电池。一次任务能跑一两小时，然后回充电桩，反复进行——有的客户一天跑 40 次任务？

**Péter：** 有客户一天跑 40 次。比如他们只关心电弧炉（electric arc furnace）升起来那一分钟发生了什么——太危险、不能派人进去，热成像相机都会被烧，那一刻他们需要机器人。

**Jason：** 得回去充电，不热插拔电池？

**Péter：** 是的，全程免手操作的自主运行（hands-free autonomy）。其实客户根本不想要机器人，他们要的是数据、是洞察；机器人只是采集数据的手段。

**Jason：** 有多耗算力的部分能上传到云端？

**Péter：** 我们两边都做。有些必须在机器人上实时跑——因为不能保证联网，避障、数据质量都得当场保证；等你把模糊图像传上云，就太晚了。而在云端做情境分析、历史停机分析。目前最长在 8 小时区间内，超过就有边际递减了。以前人工一天做一两次，现在一天做 15、20 次，频率大幅提升，还不把人置于危险，质量也高得多。

**Jason：** 你们现在最"科幻"的部署是什么？

**Péter：** 海上（offshore）最激动人心：人得坐直升机出去，每次飞行都要几万美元；海上作业很棘手、周围几乎没人。这些是石油钻井平台，也有海上风电——海里有几百台风机，汇集到一个变电站（把交流变直流），那通常是无人设施，正是机器人作业的地方。我们也在挪威部署（那是我 20 年的老本行），在沙漠、正 40/50/60 度高温里；最重要的是我们现在有能进入"防爆环境（explosive atmosphere）"的机器人——油气化工里空气中有甲烷，不允许产生火花，我们造了一台"保证不产生火花"的特种机器人。这正是你不想派人去、却对机器最合适的场景。

**Jason：** 我继续往科幻走——把这些东西丢到海底，某个时点看起来是理所当然的。

**Péter：** 那是不同的形态了。已经有人在水面、以及水面稍下方做监测系统，显然是给军方的。

**Jason：** 如果你在巡检时发现气体泄漏、太危险不能派人，你什么时候会给这些机器人装上设备、当场把该死的泄漏修好？那不该是"圣杯"吗？

**Péter：** 一旦你能检测到问题——你能解决它、修好它、把阀门关上吗？今天还不能。演示里可以，但要在防爆环境里做到 99.9% 的可靠性，仍在研发中。第一步是关阀门、开柜门；最终你想要双手操作、也许三四条手臂在机器旁作业。AI 会帮我们，但前面还有很多工作。你看到的人形机器人叠衣服的演示，都是高度受控的环境；一旦到户外、冰雹、极寒，感知也不一样。但我们预见这终将被解决。

**Jason：** 你的机器人有多少比例来自中国？

**Péter：** 零。就是历史原因：我们本地采购、芯片从美国来，对我们某些客户这很重要。而且很多我们自己造——10 年前起步嘛。如今全球都能买到更便宜的零部件，关键是"聪明地采购"：哪些是核心有源器件、哪些只是金属件。要驾驭这点很费力，但接入某些硬件的商品化，对我们有意义。

**Jason：** 除了中国，谁在这块专精？越南、印度、台湾？执行器（actuators）这些从哪采？

**Péter：** 中国是第一、势头很猛；欧洲、美国也有好公司。这三个区域为主。如果只是劳动密集的组装，可以去别处；但核心专长要找真正造那个部件的人。

**Jason：** 你怎么看中国？他们一直在偷 IP，我猜你们的也已经被偷了，别人的 IP 也在中国被大规模盗窃。他们造出便宜 80% 的机器人，会试图卖给同一批客户。你怎么想中国机器人的威胁？

**Péter：** 看今天中国的机器人，那是一件能"漂亮地行走、翻跟头"的硬件——干工程活我喜欢。但它们没在解决问题。我们的客户不会拿"一个平台"去和"完整解决方案"比。你需要自主巡检智能、工作流集成，这远不止硬件差异。它们外面那层封装、服务还没提供。还有对数据的信任——我们处理非常敏感的数据，有 ISO 认证、安全认证。所以你大概不想把核电站的最新数据发给中国共产党，也不想让别人控制你关键基础设施里的 15 个摄像头。我有点开玩笑，但确有数据泄露之虞。

**Jason：** 说说军事应用。北约（NATO）不得不武装自己。我代表美国、为我们对北约的立场道个歉（笑）；但你们得付你们应付的份额，你们已同意这么做。不过欧洲和北约有种感觉——也许你们得"没有美国也要单干"，得建自己的军工产品与服务。你们不需要进入军事领域、把同样的应用做成军用吗？在做了吗？

**Péter：** 我认为欧洲有责任建设这类技术。但就 ANYbotics 而言，我们选了一条路、专注它，今天不做军用，也无此打算——那大概也是不同的产品。听起来简单"四条腿拿去做军用"，其实要走好几步：不同的通信、不同的自主性。所以我们不做，但我认为别人有责任去做。

**Jason：** 对你是"永不"，还是使命所定"不做军品"？

**Péter：** 今天使命清晰：我们从非军用起步，会沿这条走。如果欧盟来找、且是为了我们（会有请求），但也得诚实面对——我们真的在解决问题吗？只把机器人运给军方并不解决问题，得深入下去，那需要一支不同的团队。军用的自主性非常不同：我们的巡检是"有时间布设、慢慢自主"；军事是毫秒级、遥控、人在回路（human in the loop），通信、自主性、上层应用软件都很不同。唯一相似的大概只有"机器人走进一间屋子"这一点。

**Jason：** 你怎么看武装机器人？中国显然已经演示过给同类四足机器人装枪；有了 AI，这些"终结者"情景就在眼前，中国已经在造。乌克兰战场上我们见过无人机，挪威离俄罗斯不算太近、也不算太远。你怎么看共产主义国家在造带武器的机器人？

**Péter：** 我个人不喜欢、很讨厌。作为工程师，你该有把技术用于善的自豪。防御是一部分，但主动攻击、给它装枪，太冒险了。这些技术在成熟，但还没成熟到你会拿它去把人置于险境。四年前，我们和波士顿动力等朋友（还有别的公司，ASR 作 "Nana Mix"，此处名称不清）一起写过一封信，谴责机器人武器化——正是出于这个理由：作为工程师我们不想看到它被这样用，我们认为这既危险又愚蠢。

**Jason：** 但我们将要面对的敌人会这么做，我们得盯着。业内私下对此的议论是什么？

**Péter：** 我觉得目前都是很早期的测试、是演示。乌克兰的机器人无人机是出于必要、是被用起来的成熟品类。四年前那封信就是那批人写的。好，祝你继续成功。

## 第二段：1X（Bernt Børnich）——家用人形机器人 NEO

**Jason：** 各位，非常高兴请到 Bernt Børnich——1X 创始人兼 CEO。他们做的是 NEO，一款家用机器人。你们卖出了大量预订、并向人们保证 2026 年会送进他们家里。它多少钱？你能兑现自己定的截止日期吗？你得信守承诺。

**Bernt：** 我们会在 2026 年发货。管理一下预期：初期会很慢，我们想把它做对。但 2026 年会有一小批客户拿到 NEO，我超级兴奋、等不及了。

**Jason：** NEO 多少钱？

**Bernt：** 这个有意思，取决于……我们开预订时有两种付款方式：一种是早期尝鲜者一次性全款；另一种是订阅费。产品还在大量迭代，所以订阅模式会长什么样仍在演化，我们也想在初期和客户一起摸索。另一件大事我们还没正式宣布、我先剧透一点：我们要让很多人在 NEO 上做开发——把 NEO 做成一个平台。

**Jason：** 像一个应用商店，或者说"技能商店（skill store）"？如果我家里有一台、我想做沙拉，你作为黑客可以做一个"沙拉技能"，我订阅购买？

**Bernt：** 会是其中一部分。但对我而言 NEO 和 1X 远不止消费级。消费级是极重要的市场，但 1X 一直关乎"如何通过人形机器人为社会创造劳动力的极大丰裕（abundance of labor）"。我真心相信我们的平台独一无二地强、位置绝佳，让别人在其上开发，会打开 NEO 在整个社会（不只家庭）的用法，同时也惠及消费者——因为会有更多东西在 NEO 上被开发出来，从而加速通往"家里一个完全自主智能体"的路径。

**Jason：** 预订是 2 万美元左右？

**Bernt：** 官方数字没公布，但相当可观：头一批 1 万台在头几天就售罄了。

**Jason：** 大家下了定金——类似特斯拉那种 500 美元定金，或者每月 500、1000 美元这个区间？

**Bernt：** 每月 500 美元。所以这就像早年的谷歌眼镜或 Vision Pro——面向高端、面向最早的先锋尝鲜者？

**Jason：** 百分之百。我们努力透明：2025、2026 年拿到一台家用人形机器人，会是"毛边"很多的——它们会摔倒。但我很高兴地说，我认为我们真能发出一个"非常接近完全自主"的版本——发布时我们不敢承诺（太早了），现在也不完全打包票，但按当前趋势，我们大概能发出一个"你想要的话就能完全自主"的体验，而且相当有用。如果你想开箱即用、样样立刻能行，那会涉及一些遥操作（teleoperation）或对系统的引导；但现在我们看到了通往"完全自主体验"的路径，而且它正变得相当不错。

**Jason：** 遥操作让我很着迷。纽约有家鸡肉三明治店招不到收银员，就在马尼拉（菲律宾）雇了个每小时 3 美元的人（对菲律宾收银员是高薪），架个 Zoom——你点单、有客服问题就直接跟她说"我在这儿呢"。某种意义上这就是你机器人能做的：你在菲律宾有个人，能远程接管，当你说"给我倒杯橙汁"，那个人能远程做这个动作。我这么设想对吗？

**Bernt：** 都会发生。让我退回去用两分钟讲平台怎么运作。把 NEO 看成平台：如果你想围绕我们开个"橙汁店"，你就买一批 NEO，拿到机器人操作系统（含机队管理），还拿到数据采集设备——一副手套，带着和 NEO 同样的触觉传感器、同样的视觉系统。你在店里采数据，在我们的系统里微调你自己的模型（我们做所有数据的密集描述/标注 dense captioning），部署后就有了一家全自动店。这是一种。也许还不太行，那你说"我有时让人介入、遥操作一下"，数据就变好——这是一种做法。也可能你说"太复杂了，我就要纯遥操作"，也行。平台一路覆盖：从只想自动化自身工作流的开发者，到想部署自己模型的基础模型实验室。

**Jason：** 所以你会做成开放平台，某种意义上对"里面的智能"是无头（headless）的——如果 OpenAI 有个世界模型、或 Claude、或别的独立世界模型，都能插进来？

**Bernt：** 百分之百。我真心相信我们的模型会是最好的、也相信竞争——如果我们从制造一路控到产品、却造不出最好的模型，那我们就失败了。但我们会允许别人在上面开发。一大原因是：现在放眼望去，没有哪一个通用模型能解决机器人的所有问题，还没到那一步。如果我们未来几年一直卡在客户的"后院"帮他们做集成，我们就到不了目标。我们要做的是攻"通用问题"：如何解决"具身 AGI（embodied AGI）"，从而真正创造劳动力的丰裕。这需要我们聚焦通用问题，同时让别人来应用今天已有的东西、帮忙建生态。生态越大，我们都受益。

**Jason：** 我能想到一些应用：比如便利店机器人帮你把东西搬上车、也许一小时才发生一次，你可以一个遥操作员、或十个遥操作员监控 30、40 台 NEO、远程帮人搬杂货。

**Bernt：** 我个人其实也有个 NEO 的用例：我一部分时间在挪威、大部分在旧金山湾区，还常来这类会议。出差时我想"在场"、通过 NEO 运营我的公司——把头连到 NEO 上，"我就是 NEO"。这挺神奇：我能走动、拿起零件看、和人交谈、参加会议。这类遥操作我认为永远不会消失——无论自主性多好，它都会在。

**Jason：** 你在新疆工厂里的化身（笑）。

**Bernt：** 还有别的应用：偏远电站，方圆一小时车程没人，你在柜子里放一台机器人，一旦出故障，你"出去"扳开关、做那些事——这种"每几个月才发生一次"的一次性事，你多半不会去自动化，但值得在森林深处那些电力转换器旁放一台机器人。这就是过去所谓"专家就位（expert in place）"——把世界最好的专家瞬移到全球任何地方去解决状况，像远程外科医生一样。

我们过去一年的体会是：其一，NEO 已经变得极其能干（尤其新款手），以至于遥操作反而"没法充分利用硬件"——手的精细度超过了遥操作员所能发挥的（遥操作员感受不到机器人所感受的），你得建全套触觉系统，那会拖慢、笨重。所以我们越来越多地看到：让人"尽量无干扰地"戴着机器人的传感器去做事、采集数据，是解决机器人基础灵巧性最有用的数据。但更重要的是——1X 押的那个"十年大注"：如果你把机器人做得和人足够像，你就能在网上海量的人类视频数据上训练。我们开始看到很好的证据表明这真的奏效，这也是我们成立 1X 世界模型实验室（world model lab）的原因——我们现在终于有了那条 scaling law（规模定律）。

**Jason：** 带我们进实验室看看。你们是让人在工厂里戴着手套、反复做任务？在和 Micro1 之类的公司合作、去真实世界采集独家专有数据吗？世界模型是怎么大规模建起来的？

**Bernt：** 这些我们都做，但不是重点。归根结底很简单：模型的好坏取决于数据。想象一个"数据金字塔"——顶端是遥操作数据，质量很高、量很小的微调数据集（操作员尽量又快又好地做任务、常失败再重试，我们挑成功样本），用来对齐模型，不需要很多。往下是你说的"给人戴上传感器去采"的数据，非常接近机器人但不是机器人。再往下是"以人视角的第一人称视频（egocentric video）"，离机器人更远一点，但因为机器人的手和人手一样、看起来也一样，所以仍很接近。最底层是"通用视频数据"——YouTube、世上一切、所有人的视频。因为 NEO 和人如此相像，我们能真正利用这些数据。而金字塔最底那层通用视频，其体量之庞大是荒谬级的、碾压其他一切。

如果看"要达到真正的智能"需要多少数据——你需要比任何人未来两年靠第一人称/传感器数据能采到的，多好几个数量级。而据我所知，AI 里我们见过的所有重大突破，都是因为有人搞清楚了"如何利用一个此前无法利用的巨大新数据源"。所以我们的大注是：你必须能利用外面的通用视频数据；唯一的办法，是在意机器人的每一个微小细节、让它尽可能接近人类——血肉、组织、皮肤是高度非线性的：多大力会形变？摩擦多少？触桌时的冲击能量多少？这样才能破解那个"先有鸡还是先有蛋"的死循环。最终所有数据都会是机器人数据（它有动作、有触觉、有力，更好），但要拿到全部这些数据，你得先造出一个"足够好、能被部署到全社会、做人们付费的有用之事、同时顺便采集数据"的基座（baseline）。

**Jason：**（谈及 NBA"臂展"能让球员多赚 20%、你们戏称"猩猩系数"，笑）机器人什么时候会变得"递归（recursive）"——自我教学、自我建造？就像我们现在在大语言模型上看到的：不给指令，而是给目标、给一个循环，让智能体自己迭代。什么时候轮到机器人：你不用操心把机器人变好，它们"知道"自己的使命——"你在米其林餐厅工作，目标是以这种精度做出最美味的食物"——它说"好，我得把水波蛋练得更好"？

**Bernt：** 这不是科幻，是我们常想的事，但也极难回答，因为发展曲线现在是这样陡（而你就在曲线上）。一年前你问我，我对"今天 AI 能走多远"要悲观得多；每次我采样，进展都比我以为的快。容易得意忘形。但如果宽泛地答：我极其确信，我们距离"硬起飞（hard take-off）"不到十年。所谓硬起飞，是指机器人造机器人、造数据中心、造芯片厂、做采矿与精炼——一个真正劳动力丰裕、自给自足的系统。

**Jason：** 十年？

**Bernt：** 我目前的下注是三年。但即便要十年，在人类历史里也只是一瞬，无所谓。这也回到"1X 是什么"——你能把这个行业术语叫"硬发射"还是"硬起飞"？

**Jason：** 硬起飞（hard take-off），这是行业术语。而且没有物理部分你根本做不到，对吧？数字智能永远无法凭空创造自己的物理基质，你需要物理部分。

**Bernt：** 对，这也会对人类产生难以置信的影响，比如推进科学——我们平台上现在很多需求来自想自动化实验室工作的人：如果你的 AI 模型不能真正搭建并执行实验、观察结果，它怎么推进科学？所以随着 AI 变得"物理化"，这些都会在未来几年发生。确切时间线有点难说，但——不是几十年。

**Jason：** 你信是三年、我知道你是乐观主义者（做你这行必须是）。

**Bernt：** 疯狂的乐观主义者，没错。

**Jason：** 你觉得上限是十年，那我们五、六、七年也能行。Bernt，你得赶飞机了。太棒了，祝继续成功。人们想订一台 NEO、每月给你 500 美元加入这场绝对的疯狂，怎么下单？

**Bernt：** 上我们网站下单一台 NEO，就这么简单。能在网上订特斯拉，就能在网上订 1X。

## 第三段：Boston Dynamics（Amanda，临时 CEO）——Spot 与 Atlas

**Jason：** 各位，我们很幸运请到 Amanda——波士顿动力（Boston Dynamics）临时 CEO。这是"元老级"、最初的机器人公司，几十年来我们见它翻跟头、打功夫、被踹被打又爬起来。我们一直记不清这公司现在归谁：它本是独立的风投公司，后来谢尔盖和拉里（谷歌两位创始人）买下、成了谷歌一部分，又被卖掉，我记得孙正义（Masayoshi Son）某段时间拥有过，但现在我相信是现代（Hyundai）拥有。这段历史我说对了吗？

**Amanda：** 全对，你说得一字不差。

**Jason：** 看来我industry 新闻读太多了。你现在掌舵。这公司几度易手，而你们也从"人形机器人里几乎独一份"，变成了"众多之一"。我们此刻就在巴黎这场 Machina 峰会，你能看到很多同行。波士顿动力现在在做什么？还是研究项目，还是走进真实世界、应用这些机器人了？你们起步早，但现在得应对激烈竞争。

**Amanda：** 我们大力在做部署，不再是 AI 实验室、不再是研发公司，现在聚焦真实世界部署。我们从 Spot 机器人起步（很多人认识它，我们的工业移动四足）。

**Jason：**《黑镜》里出名地追杀人那个——不是你们的（笑）。总会有反乌托邦版本和乌托邦版本，你们显然走乌托邦。这是很酷、已被大量部署的机器人。

**Amanda：** 是的，已部署到真实客户现场、创造真实价值。目前我们在 46 个国家有 500 多家客户。它是当今地球上使用最多的移动自主机器人。

**Jason：** 为什么？头号用例是什么——安防？巡检？人们拿这个"狗形/小马形"做什么？

**Amanda：** 客户在工业巡检里找到大量价值：声学、仪表读数、振动检测。设施里有昂贵资产要监控，白天做巡检、晚上做安防巡逻，都能做。真正的拐点是"客户投资回报（ROI）"——我们要客户看到价值、做真正有用的活。它不再只是"可爱、会跳舞"，现在做真活，客户要在两年内看到 ROI。而那些巡检，此前就算做，也是人做的，而人会犯错。

**Jason：** 这些机器人成本区间是多少？商业模式是什么——买断、还是按小时租"大脑"？

**Amanda：** Spot 我们从 CAPEX（资本支出买断）模式起步；Atlas 我们大概会走"机器人即服务（RaaS）"——客户可能想按需增减。Spot 用 CAPEX 相当有效，因为工业客户就是这么看待工业工具的。价格取决于配置：基础款约 10 万美元，满配（含服务、集成）到 30 万美元——从"一辆特斯拉"到"一辆法拉利"。要理解的是它们寿命超过五年，是为工业而生的。

**Jason：** 假设一天跑 20、22 小时（含充电）……

**Amanda：** 我们看的是"平均干预间隔时间（mean time between intervention）"，现在超过 3000 小时——一年只需人介入几次。电池约 90 分钟，通常配两块，回来坐到充电桩上充，另一台接管。

**Jason：** 自动换电池吗？

**Amanda：** Spot 是坐到充电桩上充。但 Atlas 有可换电池、且是自己换：它有两块电池，转动躯干、把一块换成另一块，始终有备份。

**Jason：** 所以人形那款能自己换电、实际上能在现场干近 24 小时。这样算下来运营成本每小时几美元。成本的剧烈下降，有没有改变客户看待用例的方式？我猜工会工人巡检管道，算上福利、养老金，全成本每小时 40、50、60 美元，很贵。

**Amanda：** 我们对 Spot 不一定看"替代劳动力"。虽然那是个可看的指标，但我们更想的是：一，人本来就没在做这活；二，就算安排了人，人也没真在做。我们更倾向看"我们为你省了多少"——比如帮你发现一处漏气，那本来会是一天 300 万美元的损失。结果（outcomes）才重要。

**Jason：** 在业内谈"替代劳动力"仍然敏感吗？

**Amanda：** 你得非常审慎。老实说，这里会有"替代劳动力"的成分，因为它作为指标很好算——世界上有多少人力、相对它的总可寻址市场（TAM）有多大。但我不认为这该是我唯一该谈的对话，只是其中一环。希望我们在消除的是危险工种、以及人们可能觉得压抑的工作。

**Jason：** 又脏又累又危险（dull, dirty, dangerous）。

**Amanda：** 对，还伤身体，我们不想让人干那些。人只有一副身体。

**Jason：** Atlas 上，你怎么看"本体算力 vs 远端"？我理解你们把"大脑"放在机器人上，那意味着疯狂的耗电。有没有考虑把大脑放云端、让机器人在高速 Wi-Fi 区域更轻量？现在提供吗，还是"必须机器人自带很多大脑"？这似乎正是当下发生的范式转变。

**Amanda：** 我们想成"两个大脑"。其一是控制机器人物理性的大脑——动态运动、可靠性、操纵物体的方式，这是波士顿动力的看家本领，住在机器人上。其下的推理层（reasoning layer），给它对环境的语义理解，可以在云端——这块我们可能和 Google DeepMind 合作、也可能和别的 AI 伙伴，或自建一部分。最外面那层"封装"，是某个具体客户围绕自身工作流的非常具体的信息——它的作业流程、设施里现有的工具、机器人如何与之交互——这层看情况：需要就放本体，也可以在云端。

**Jason：** 今天有多少比例的机器人在美国、或中国台湾以外制造？

**Amanda：** 机器人 100%。

**Jason：** 那美国的"机器人主权"没有问题。中国出了很多便宜机器人。作为这家公司的 CEO、作为美国人，你个人认为：在任何情形下，我们该允许中国的人形机器人进入美国吗？

**Amanda：** 不该。不安全。我们已听说美国境内一些四足机器人存在把数据回传中国的泄露。听着——我们已经见过"让中国在半导体领域赢"会发生什么，机器人不能重蹈覆辙。我们需要协同努力保护 IP、把这个生态的制造带回美国或盟友国。这意味着我们需要一套"国家机器人战略"。我们有幸能坐在其中一些讨论的桌前，希望更多美国公司加入这个使命。这是生存性议题：我们不仅得赢，还得确保世界其余国家用我们的平台、而不是中国的。

**Jason：** 你怎么看军事应用？无人机因为乌克兰、以及现在中东与伊朗的战争，以谁都没料到的速度改变了战场。Atlas 和 Spot 在军事部署上到了哪一步？

**Amanda：** 我们很公开地持"反武器化（anti-weaponization）"立场。为什么？因为对我们眼下要做的工业用例而言，它是干扰——是"专注"问题，不是哲学问题。作为 CEO，我此刻只谈专注：我们要聚焦在我们认为能赢的市场。我们和政府关系很好，乐意做任何"非武器化"的合作，今天也确实在做。

**Jason：** 所以如果要去救一名士兵、送医疗包，你 OK；拆弹（EOD，爆炸物处理）你 OK，而且现在就在做。你们不做的是"终结者机器人"。可中国在造。如果中国把这些投入战场，你会为保卫美国而造它们吗？

**Amanda：** 那是个很难的问题，等时候到了我们得回答，希望永远别到。

**Jason：** 时候一定会到，我可以向你保证。而且我可以向你保证：当特朗普总统打来电话，你会说"是，长官"，否则你的公司会被国有化（笑，我半开玩笑）。他们会部署这些，也已经展示过——你见过他们给这些装上 AK-47。

**Amanda：** 不是装在我们的机器人上。

**Jason：** 是他们的。这很可怕。

**Amanda：** 我知道我们有世界上最好、最能干的机器人。真要到了必须做艰难决定的那天，我们会做正确的决定。但今天不必，所以我会让大家专注在对我们赚钱有意义的应用空间。

**Jason：** 我告诉你个说法、别告诉别人：CIA、FBI 和"战争部（Department of War）"现在就有很多台你们的机器人、装着很多武器。别告诉别人（笑）。好，我知道你得走了，祝继续成功——这是一家如此重要的美国公司，我希望你接下这份工作、转正。想去波士顿动力工作的人，你们在哪？

**Amanda：** 在波士顿郊外的沃尔瑟姆（Waltham）。但我们对远程工作持开放态度，也在考虑来西海岸。

**Jason：** 我正想说——名字里虽有"波士顿"，但湾区聚集了那么多人才，你们大概得在那儿开个点。好，祝继续成功，非常感谢。

## 第四段：Agility Robotics（Jonathan Hurst）——人形机器人 Digit

**Jason：** 各位，下一位嘉宾是 Jonathan Hurst 教授——Agility Robotics 联合创始人兼首席机器人官（Chief Robot Officer）。你 2008 年拿到机器人学博士，干了 20 多年。过去 36 个月这个领域似乎"升温"了。先给听众"校准"一下：你过去 20 年看到了什么，以及最近两年和前 20 年相比如何？

**Jonathan：** 20 年前我们做这个时，它在工业界基本还是未知——机器人更多关于自动化系统；而研究界在做人形、自主移动机器人，努力构建智能、再造出能实现它的硬件。这如今真正开始突破进真实世界、产生直接影响，而不只是研究课题。大学也看到了这种需求和增长，人们喜爱机器人，想做这行的学生很多，项目数量指数级增长，非常令人兴奋。

**Jason：** 人形机器人和 AI 都经历过很多"假启动"——所谓"AI 寒冬（AI winters）"。但这次是真的，显然如此。给听众解释：为什么这次不同，为什么你相信这次我们会看到机器人、尤其人形机器人以规模化方式部署？也许未来二三十年会达到"与地球上人类一比一"。

**Jonathan：** 我会说：造一个"看起来像人"的机器人一向很容易——所以百年来我们都见过人形；难的是造一个"能在人类空间里做有用之事"的机器人，而我们如今开始看到这个了，这就是区别。哪怕它长得不完全像人、只是有点人形，但能做有用的活，影响就在那里。而因为大语言模型，很多东西现在"免费"了：这些机器人看这张桌子、你问"桌上有什么"，它知道那是手机、这是纸巾、茶、水，大概还知道各有多少盎司。三四年前它根本不知道世界里有什么，你得用非常狭窄的方式给它编程——感知（perception）当年极其困难。而感知如今基本被解决，是一个巨大的拐点。人们现在还能看到"通用性（generality）"的未来——AI 让机器人有了广得多的情境感知。

**Jason：** 那么先有感知（机器人得理解世界），但过去总有个"卡点"：让机器人走出工厂里那种极窄的狭义任务。我的感觉是那卡在"通信和训练"层面。以前基本得给机器人硬编码——我投过一家公司 Cafe X，机械臂每次都能完美做一杯咖啡、拉一杯啤酒，但那得手工编码。现在因为感知、因为语言模型在互联网所有视频、所有咖啡配方上训练过，那个"指令集"似乎也免费了。我说得对吗？

**Jonathan：** 其实很不一样。语言模型如今像互联网一样成了商品、人人可得，是了不起的水涨船高。但语言模型是在互联网全部数据上训练的，而"机器人控制"不存在这种数据——你机器人的"给定所有传感输入、对每个电机的所有力矩指令"是什么？没有这样的训练数据集。所以你得设法生成、创造它。人们有很多不同路径。把 AI 别当黑箱，而当成"一大堆非常不同的有用计算工具"。你可以用"从演示中学习"：你遥操作机器人、从那数据训练，或给动作捕捉输入。但那也有硬上限——因为一个人在控制机器人，并没真正触及机器人本可做到的最优行为，机器人需要自己"练习"。这就进入了世界模型（world models）、sim-to-real（仿真到现实）迁移这些东西。

**Jason：** 世界模型是下一个前沿。人们真的在给人戴上手套、远程控制机器人去切菜、做沙拉、倒水，今天很多公司都在做。世界模型会解决这个问题，或者是解决方案的一部分？

**Jonathan：** 是解决方案的一部分——和所有这些事一样，没有银弹（silver bullet）。据我理解，世界模型是：你能否为整座仓库、以及里面所有物体的全部物理建模，让机器人的仿真体在世界模型里练习、而不必在真实世界里弄坏东西，并压缩到"几天内做一百万次迭代"。但总有巨大的"仿真到现实差距（sim-to-real gap）"——东西没被完美仿真：你在现实里拿起某物有波动、玻璃上有冷凝、机器人动力学没被完美建模。这些仍非常难，需要在真实世界用真机器人真练。

**Jason：** 会有奇点、或某个"跨越时刻"吗——递归学习：把机器人往厨房一放、让它自己犯错、"做下一个测试、下一个测试"，就像我们教 AI 赢国际象棋或围棋那样，不告诉它怎么王车易位，只是蛮力让它试遍所有算法、它就自己搞明白了？是"有人建了世界模型、让它递归、放进厨房、砸碎很多瓷器"更快到达，还是"世界模型公司让人在米其林厨房里与机器人精细协作做那道舒芙蕾"？

**Jonathan：** 也许不是很满意的答案，但——是所有这些工具一起。没有银弹。我不相信有奇点（singularity），但我相信东西会越来越好。把它想成一个"滚下山、越滚越大的雪球"。它之所以这样滚，是因为人们在投入金钱、资源、工程时间去探索一切、把这些东西一点点搞明白。人类是"进化来学习的"，我们很擅长学习、只需极少数据就能学会一件事，然后反复练习迭代；机器人还不太会学习——它们要多得多的数据和例子，我们仍在搞清楚"怎么教机器人学习"。但机器人长远有个好处：它们有 Wi-Fi。你学会拉小提琴，没法把它直接"加载"给别人；而一台机器人学会拉小提琴，所有（同型号）机器人就都会拉了，再为下一型号做微小变体。

**Jason：** 你们在部署的产品叫 Digit，我记得是 4.0，你们要出 5.0，已有数十台在真实世界不同应用中。今天的"前沿部署"什么样，一两年后会到哪？

**Jonathan：** 今天做的是范围仍界定得比较清楚的多用途工作流——搬箱子、搬料箱、搬来搬去。之所以做这个：搬大件需要两条手臂、需要全身控制来灵巧操纵移动、需要平衡来把东西举到高货架顶。这为这一个用例"证成"了人形这个形态。但人形真正有用的是它的"多才多艺（versatility）"——当我们做"逐件拣选（each picking）"、装满一个料箱搬走、码垛与拆垛，并不断扩展到越来越多用例时，价值才真正开始飙升。今年晚些要出的 Digit V5，是人形机器人（一个靠平衡站立的机器人）第一次能"走出工作单元（work cell）"、不再需要机器人与人之间的物理护栏来保证安全。V5 出来时，那就是我们的"规模化时刻"。

**Jason：** 这是关键一刻，人们可能不领会。你要是去过马斯克或丰田的工厂，那里有"线"，你越过那条线一切就停机——特斯拉工厂里越线可能损失一百万美元。现在我们开始有足够信心：这些机器人不会摔倒、砸伤人脚踝。

**Jonathan：** 这是过去两三年非常刻意的过程。我们和亚马逊部署时的经验是：机器人把活干了、达成了所有研发目标，我们说"太好了，去部署吧"，他们说"不行，不满足我们的安全要求"。结果做到"安全"超级难——这是一次从下到上、触及机器人每一个系统的整体设计。

**Jason：** 你们这种工业机器人，物料清单（BOM）每台几万美元？

**Jonathan：** 我们不谈 BOM。但成本在不断下降，未来我们卖的机器人会在"汽车成本"这个量级。真正该问的是"它们产生的价值"：一台一天工作 20 小时、寿命五年的机器人值多少？相当可观。

**Jason：** 从第一性原理算：一天合理跑 20 小时（充电占 4 小时），一年 365 天，就是七八千小时；按 8000 算，五年 4 万小时。人们以为这些东西成本是两三四万美元——终有一天会，但需要经过规模化、外面有 10 万台机器人后才成真。那就是"1 美元/小时"。这些活现在工厂里的人拿 40 美元/小时（有些国家 10 美元），就算 20 美元/小时——它上市后你有 90% 的成本压缩，给你充足空间按小时向亚马逊、丰田等收费。当前计划是按利用小时收费、你自己拥有机器人吗？

**Jonathan：** 两种都做：偏好买断的客户用 CAPEX；也做"机器人即服务（RaaS）"——门槛更低、风险更低。每小时价格我不谈。但显然随着机器人越来越强、做的事越来越多，价值越来越高，同时造机器人的成本在下降。这些机器人的价值由"人类劳动、以及雇人做这些活的成本"来设定，所以在很长时间里是"非常缺乏弹性（inelastic）"的价格。

**Jason：** 所以在"BOM 几万美元" vs "工厂里人拿 20–40 美元/小时"之间，这是个相当大的市场，有充足空间让你省钱、也让你赚够利润，建一门真正的生意。那时间线呢——在亚马逊、或（为了不给你惹麻烦）一家"亚马逊或 Target 那样的公司"的工厂里，工人多数变成机器人、翻到 51% 的那个时刻，是三年还是五年？

**Jonathan：** 很多这类应用里，多数"工人"已经是机器人了——大量 AMR（自主移动机器人）、传送带、工业机械臂，而且在持续增长。这只是又一种新的自动化形式，帮助提升生产率。

**Jason：** 换个问法：如果一家工厂有一百万人分拣包裹，降到五十万，是三年还是五年？

**Jonathan：** 我觉得我们已经做到了。但会继续。总有一天，一辆自动卡车开来、一座完全"熄灯（lights out）"的自主分拣厂、再一辆自动卡车离开。那时多半是"专用自动化"在干这些（24/7 专做一件事），人形在那种特定任务上并非最高效。人形的用处在于"走进人类环境、做人类工作流"。等这一座工厂全自动化时，还有一大堆其他"遗留"工厂需要自动化；而我们现在也在进入零售、杂货店、医院、工地、以及"把包裹送到你家门口"——那是个"永远的人类环境"。

**Jason：** 显然，任何看过最新一代人形机器人的人都清楚：工厂在走向熄灯。但多数人还想象不出一辆 Waymo Robotaxi、一辆 Uber 自动驾驶车、一个机器人下车把包裹送到你门阶——那会发生吗？你在和相关方合作吗（不必说是谁）？

**Jonathan：** 那其实是我们最早探索的用例之一。网上有段很棒的视频：我们最早的 Digit 从车里下来、走到某人前门廊、放下包裹，还上了台阶——那大概是七年前。所以我们能做到；但我不认为那是最好的"首个"用例或市场，它在我们的路线图上，但眼下我们正在做的这块市场如此之大，我们会先从这里开始。

**Jason：** 你看应用时，有哪一两个"不显然、却能极大造福世界"的用例？

**Jonathan：** 就"把东西从这儿拿到那儿"本身就是巨大的用例，把人从机器人学经典的"3D"里解放出来：dull, dirty, dangerous（沉闷、肮脏、危险）。我真心希望，我们的孩子回望今天某些工作时，会像我们回望 1900 年代的煤矿工那样想"真不敢相信人以前干这个"。人们今天做的很多角色，是 1900 年想象不到的、且好得多，生活质量高得多。我认为未来对我们也是这样。

**Jason：** 你还是机器人学教授、带着上百人的研究生项目。对于正在收听、担心自己职业未来的年轻人——这似乎是条了不起的职业道路？

**Jonathan：** 是巨大的机会。我们处在一个变革时代。每逢这样的变革，刚毕业的学生反而有优势——那些有 20、30 年经验、熟知"过去怎么做"的人，得重新学习"现在怎么做"；而学生只要打好工程学的核心技能，就会长期适用。

**Jason：** 除了博士/硕士版本的机器人，有没有更"蓝领工具带"的版本——相当于电工、暖通、木匠、承包商？

**Jonathan：** 绝对有：机器人操作员、组装与制造机器人的人（机器人还没法自己组装自己）；还有机器人运维与部署。

**Jason：** 维护——"扳手工（Clanker）"维护（笑，"clanker"是对机器人的贬称，据说是迪士尼/星战的商标词）。最后一个问题：我们大概是同一代 Gen X。星战里的 General Grievous（格里弗斯将军），被杜库伯爵教过绝地黑暗技艺，能同时挥三四六把光剑。半认真地问：为什么不给机器人装四条或六条、朝各个方向的手臂？

**Jonathan：** 好问题。从第一性原理看"如何做最简单、又能完成任务的机器人"：一条手臂不够抓大件、只能拿小件；两条就能抓大件；加第三条，很难看出足够的效用去值得塞进它；再到四五条，要协调的和额外复杂度都很多，却不知还能让你多做什么。也许我们会看到，但得由真实需求驱动。

**Jason：** 科幻史上最爱的机器人？

**Jonathan：** 大概是 Wall-E（瓦力）和 EVE（伊芙）——我爱那种"机器人不断尝试建造、创造、做它被设计要做的事"的愿景。我也爱 Baymax（大白，《超能陆战队》里的旧金山—东京 San Fransokyo）。

**Jason：** 大白很棒——它清楚是来帮忙的，而且片子展示了它只做被编程要做的事；有一刻他们抹掉它全部记忆、它变红、就危险了。

**Jonathan：** 那很真实。你得有安全措施、有急停（e-stop）。想想"最高指令（prime directives）"：怎么通过工业安全流程确保这些东西永远不会伤害你——有监督电路、每台机器人都有急停。

**Jason：** 你在招人，Agility Robotics 就是这家公司。想找活干的人，去哪？

**Jonathan：** Agility 很棒。我们的起点在俄勒冈州塞勒姆（Salem），我在那儿；在加州弗里蒙特（Fremont）新开了一处很漂亮的设施，在那里做大量机器人行为开发，会有机器人整天工作；还有匹兹堡（Pittsburgh）一处，就在卡内基梅隆（Carnegie Mellon）旁。三个很棒的中心。

**Jason：** 如果你是年轻人、或在机器人领域、又有点担心未来——去读个机器人学博士或硕士吧。滑向冰球要去的地方（skate to where the puck is going），各位。

## 投资/产业视角的关键信息点（速览）

- **"1 美元/小时的工人"是核心经济学**：人形机器人一天可跑约 20 小时、寿命五年 ≈ 4 万工时；规模化（>10 万台）后单位成本摊到约 **1 美元/小时**，对标工厂人工 20–40 美元/小时——**约 90% 成本压缩**。由此价格"非常缺乏弹性"（由人工成本设定），给 RaaS 按小时收费留足空间。
- **两种商业模式并存**：工业客户（Spot/Digit）偏好 **CAPEX 买断**（基础款约 10 万、满配 30 万美元）；人形（Atlas/Digit）转向 **RaaS（机器人即服务）**，降低门槛与风险。ROI 是关键指标——卖点从"替代劳动力"转向"避免停机损失"（如一次漏气=300 万美元/天）。
- **护城河不在硬件、在"封装"**：四家一致认为中国机器人"硬件会走会翻跟头"、便宜 80%，但缺**自主巡检智能、工作流集成、数据信任（ISO/安全认证）**。这与 Altman/Hard Fork 的"智能商品化、真正壁垒在系统与集成"同构。ANYbotics 供应链 **0% 来自中国**；波士顿动力 **100% 美国制造**。
- **数据是决定性变量（1X 的大注）**："模型好坏取决于数据"；金字塔底层的**通用人类视频**体量碾压一切。1X 押注"把机器人做得极像人→可直接吃 YouTube 级人类视频"，为此成立世界模型实验室。**世界模型 + sim-to-real** 是公认前沿，但无银弹、真机真练不可替代。
- **时间线分歧（呼应 Altman"2–3 年机器人 ChatGPT 时刻"）**：Bernt（1X）押"硬起飞"**约 3 年**（上限 10 年）；Jonathan（Agility）**不信奇点**，比喻为"越滚越大的雪球"，但 **Digit V5 走出工作单元 = 规模化时刻**（今年晚些）。感知问题"基本已解决"是这轮的关键拐点。
- **中国威胁 = 半导体剧本重演的担忧**：波士顿动力主张**国家机器人战略**、把制造带回美国/盟友，明确反对允许中国人形机器人进入美国（数据回传风险）；这是"存在性议题"。**四足机器人数据回传中国**的泄露已被提及。
- **军事化是分水岭**：四家均持**反武器化**立场（2022 年联名信），只做拆弹/救援等非攻击用例；但都承认"若中国投入战场、可能被迫应对"——地缘压力下的商业伦理张力，是需跟踪的政策/舆论风险。
- **就业叙事**：话术从"替代劳动力"（敏感）转向"消除 3D 危险工种 + 提升生产率"；工厂"熄灯化"被视为已在发生。对人口不增、反移民的西方，机器人被 frame 为"提升 GDP 的路径"。
- **可投赛道图谱**：ANYbotics（工业巡检/油气/海上风电，感知超人）、1X（家用+平台/技能商店，OpenAI 生态邻近）、Boston Dynamics（现代系，Spot 最大装机量 + Atlas RaaS）、Agility（仓储 each-picking/码垛，Digit V5 规模化）。上游关注**执行器**（中国第一、欧美次之）与**本体算力 vs 云端推理**的两大脑架构（潜在 DeepMind 合作）。

## 一、开场：Matt Murphy 与他的连环命中

**Harry：** Matt，难以置信——距我们上次录节目已经六七年了。这让我有点慌，因为那时我才 23 岁，现在回看才明白我当时啥都不懂，我亲爱的朋友。谢谢你再次来。这几年简直是"炸裂"，我想从一个相对明显的话题开始：Anthropic。我觉得它是门洛过去这些年投资的基石。就跟我说说：这笔投资是怎么来的？你怎么被引荐进去的？是不是一眼就看明白了？投资会议怎么开的？

**Matt：** 好。要是我不 cue 他他会生气——是 Anjney Midha（引荐人，姓名以发音为准）把我引荐进去的。他早年在我还是年轻 associate 时、和我一起在 Kleiner Perkins（凯鹏华盈）共事过，那时就非常"扎眼（spiky）"、一直很在圈子里。我们聊 AI，他说"你得见见 Dario 和 Tom"——那是唯一一家他说"就投这个"的公司。第二天我就和 Dario、Tom 通了电话，我个人当场就"我加入"。

我给你讲讲更完整的故事。这里面有很容易的部分、也有很难的部分。当时你有一支 6 亿美元的风险基金、平均往一家公司里投约 1500 万美元；而这是一家几乎没有收入、却想要 40 亿美元以上估值的公司——对我们的成长期工具（growth vehicle）太早了，它到底该放哪儿？

容易的部分是：OpenAI 正在狂奔、ChatGPT 起飞；而 Dario 正是 OpenAI 内部那套东西的创造者。他离开的原因，本质上是他觉得"OpenAI 做的事太多了，而这（基础模型）才是那个唯一的大机会"。所以他有一种独特的洞察、知识与信念。你见到他，他就是这样一位了不起的技术思考者/研究者——很多最好的研究员想为这样的人工作，因为他"照见"了他们，是他们会自然聚拢的那种领袖。另一个容易的部分是：当时他们几乎没有收入、模型还没发布，但所有基准（benchmark）都能看出，他们已经达到或超过了当时 ChatGPT 的性能水平——而他们只花了大约五十分之一的资本。这种"算力乘数（compute multiplier）"说明底层技术上有某种特别之处。我的合伙人 Tim Tully（前 Splunk CTO，很棒）能和 Tom 一起深入技术尽调。

于是逻辑就是：这是个巨大的市场，而这种市场从不会被单一玩家垄断，一定会有一个"更好的第二名"——谁比 Anthropic 更有条件当那个第二名？难的部分正是我说的："等等，我们为什么要做这个？40 亿美元估值、一支风险基金，这不是我们该做的，LP（有限合伙人）会怎么说？"

**Harry：** Dario 在定价上很强硬吗？他是不是一进会就说"这轮 40 亿"？

**Matt：** 那部分具体细节我记不太清了。但如果说有个失误——事后看很难说是失误——大概是"机会摆在那里让你去领投，但我说'我们没法用风险基金里的成长工具真正吃下它、只能做这么多'"。所以我们说"我们全力以赴、想参与这一轮"。我很感激我有一群合伙人，他们说"就干吧、进去、这是最大的浪潮之一"——把整个公司 all in 押上去。这带来了后面的一切。如果我的合伙团队在"这不符合规矩"上更僵化，这事就永远不会发生，我们也永远不会走到"领投下一轮"那一步。

**Harry：** 你第一张支票开了多大？

**Matt：** 第一张略超过 1000 万美元——是"起手支票（starter check）"。下一轮才是我们做的那笔 5 亿多美元的 SPV（特殊目的载体）。

## 二、Ownership 不再是王道：异常值驱动的新游戏

**Harry：** 咱们回到那"1000 万投在 40 亿"。换我坐在你合伙人会议里会说：来做个结果情景推演——如果它成了 400 亿或 800 亿美元的公司，按传统 50% 稀释，你把 1000 万变成 1 亿……哇，谢谢你返还了基金的 12%，Matt。你怎么跳出这种思维、走到"投它"的？

**Matt：** 首先，天呐，幸好你不在我合伙人会议上（笑）。但说真的，房间里确实有这种声音——这正是你想要的：你想要会辩论、你会倾听的合伙人。但核心逻辑是：进入这个市场永远不会有完美的入场点。如果我们想在这个市场里，这就是入场方式。如果说"我们被价格挡在门外、做不了基础模型或任何 neolab（新型 AI 实验室）"，那你就坐冷板凳。但我们是"必须在这个市场里"——我们在围绕 AI 重建这家公司，而这绝对是最好的公司。所以别想太多、进去就对了。这其实已成为我们运作的一个标志。别的公司有时会陷进"我们必须占 15% 或 20% 股权、否则不投"的框架里（无意冒犯，我很尊重他们）；而我参与的这个"新门洛"展现出极大的灵活性——只做有意义的事：进这家伟大的公司，因为一旦你进去了、它起飞了，就有大把机会追加资本。

**Harry：** 所以我们是不是认为，鉴于结果情景比过去大得多，今天的"持股比例（ownership）"比以往任何时候都更不重要？

**Matt：** 大幅如此。当然，如果你能拿到高持股、公司又值很多钱，那很神奇。但一来现在涌入的资本多得多，连维持那种持股都很难；二来我们正处在一门"异常值（outlier）"生意里。我做这行 25 年了，很长一段时间大家说"好的退出是 3 亿、5 亿、10 亿美元"，于是"你得占 20% 才能拿回 1 亿"。但正如你在节目里常和 Rory、Jason 聊的——游戏已经不这么玩了。现在你必须身处那些巨大的异常值里才能驱动好回报；你以很小的比例待在它们里面，也胜过以很大比例持有一家 3 到 5 亿美元退出的公司——后者根本拨不动指针。

**Harry：** 有没有哪个阶段，价格对你仍然重要？

**Matt：** 我们刚宣布了新基金，相当"全栈（full stack）"，能拿大而集中的仓位，也有喜欢与我们跟投的 LP。但我们没有、也不想要 100 亿或 200 亿美元的基金。所以有某个资本量级是"那是别人的、下一轮的事"。不过我不觉得这更多是估值问题——我宁愿在最了不起的公司里。

**Harry：** 关于稀释：随着结果情景和结果规模变大，我们是不是在把"一个全新的、更高的稀释水平"正常化？还是这只属于前沿模型公司？

**Matt：** 如今很少能找到"最终不会大量融资"的公司了，前沿公司之外、AI 栈的任何地方、连应用公司都一样。一部分原因是公司增长比以往任何时候都快、想要资本去"打进攻"；另一部分是市场当下有种"信号效应"——每隔几个月或一年融一次资，员工想听到这个、以跟上各大实验室的（人才）留存节奏，你还得做更多老股转让（secondary）。所以整个格局和我当年成长的年代非常非常不同。

## 三、领投下一轮：500M+ SPV 与那场决定性的 LP 会议

**Harry：** 你提到的第二轮——你们真正"加大了尺寸"，怎么想的、怎么促成的？

**Matt：** 如果有个我很想复制的剧本，就是这个。我们先建立关系、以"门洛式"全力以赴地引导公司——招聘团队、BD 团队全上，贴近创始团队、建立关系、看能怎么帮上忙。这一轮大约在 3 月关闭、模型 4 月发布。你从零起步，然后一整年里你会看到营收"这个月 1000 万、下个月 800 万"这样累积起来。亚马逊和谷歌都进来了，既有大额投资、也有围绕 Bedrock、Vertex 的技术合作，以及分发关系。所以从我们投资到彼时，他们有了资本伙伴、分发伙伴、技术伙伴——都是世界最大的那些；他们是"绑定单一云（Azure）的 OpenAI"的多云替代者。然后你就看到营收的"鼓点"开始敲响。

但决定性事件是 11 月我们的 LP 大会：我们请了一位 Anthropic 高管（Neerav，"多面手"、非常有价值，姓名以发音为准）来演讲，他把全场"吹翻"了。会后 LP 们说"这太疯狂了、这家公司太惊人了"，连我的合伙人都说"我们能在这家公司里太棒了"。就是那种对"模型之强、以及它已如何影响这么多应用、改变人类行为"的描述。我们那阵子也有大量主动上门（inbound）。所以我们一走出那场会就说"我们必须领投这一轮"，两周后签了 term sheet，把我们 LP 和熟人的需求全聚合起来——余下的就是历史了。

## 四、SPV、二级市场与 Dario 的"敲打"

**Harry：** 我们是不是进入了一个"到处用 SPV"的新风投世界？你什么时候会激进地上 SPV 策略、什么时候它超出基金策略？

**Matt：** 关键是你给基金设的护栏/参数——你想往一家公司里最多投多少。比如你有 10 亿美元基金、设"单公司最多 1 亿"；但也许首轮投了 5000 万、下一轮想投 1 亿，主基金装不下，就做个 SPV。不是非做不可，但常常有价值，因为你能"打进攻"、能以更强的姿态支持公司。当然也有"跳出基金授权、更全栈地多拿点经济收益、不让别人拿走"的一面；但对我们而言，多数时候就是——把基金规模保持在我们认为适合环境的水平，一旦单公司资本超出，就把 LP 带进来。

**Harry：** 什么时候是"落袋为安"的正确时机？

**Matt：** 很难。这个环境里估值上调（markup）发生得太快，你会想"相对我们投资时，这倍数太惊人了"。但很复杂——如果你是信徒，我认为比以往任何时候都更是"你的异常值、你的赢家会复利、驱动整支基金回报"的环境，所以那些绝不是你现在想卖的。你可能因为某些老基金的 LP 想要流动性而拿掉 10%、20%，但多数情况下，我们在一个赢家里，就想让它跑、想追加资本。这不是我们花很多时间的事。

**Harry：** 过去 18 到 24 个月里，作为 Anthropic 股东，你最紧张的时刻是什么？

**Matt：** 今天状态很棒。但做那笔 SPV 时，Anthropic 还不是家喻户晓的名字——我们看到内部一切、知道它多惊人，但从外部看没那么显然。所以连凑齐整个辛迪加（syndicate）都很费劲，我得给朋友 Ravi 和 Byron 打电话拉他们进来（成了，但很折磨），因为门洛此前从没做过 SPV——而我们的第一个 SPV 恰好就超过 5 亿美元。你能想象：这也让我对创业者更有共情——站在第一线去募资、和投资人谈、偶尔被拒、要回答第二第三层的问题（有时挺烦人，无意冒犯谁）。那很难。但从另一面出来，也是最振奋的，那些活儿显然很值。

再快速过几个：DeepSeek 时刻——"天呐、发生什么了"，可现在你都想不起来了；然后是那次"关税/市场"时刻（ASR 作 "Dow moment"，此处不清）。这环境如此动态，一切动得太快，几乎每半年就有一个新挑战与新机会、危机与机会并存。

**Harry：** Mark Andreessen 常说：风投一开始是 VC 把自己的品牌"借"给公司来赋予其正当性；后来会有个奇怪时刻，公司和创始人反过来把品牌借给 VC 来赋予其正当性——那是权力在两者之间的诡异转移。当 SPV 那些事、以及 Dario "收紧"（谁能动什么）时，那是段紧张时期吗？我要是你，说实话会有点吓到。

**Matt：** 你说的最近传出来的"有人做 SPV"的事——不是我的 SPV，我的是完全在公司支持下、与公司合作做的，先说清楚。问题在于二级市场、SPV 已经变得让创始人很烦、很添堵了。创始人基本是说"我不希望你去兜售我的股票，我想自己决定谁在股权表、谁是投资人"。当时有很多人声称自己有"渠道"、拉一堆人进他们的 SPV、然后再去搞渠道，市面上有很多"坏演员（bad actors）"。所以需要一次"越过船头的警告炮（salvo across the bow）"，敲打大家"都冷静点——如果你不是直接和我们合作，就别信这是真的"。

**Harry：** 天呐，我在 Instagram Reels 上都看到过 SpaceX 的 SPV。那一刻我就知道市场过热了。我常说：当伦敦的出租车司机开始跟你聊比特币价格，就该卖了。

## 五、Lovable：从 0 到 3 亿，以及 AI 时代的毛利率之问

**Harry：** Anthropic 对门洛和你都太棒了，也是巨大的 AI 品牌建设，把你们定位为领先机构之一。另一笔是 Lovable——你在 62 亿美元估值那轮投的。开这种支票时，你把 Lovable "承保（underwrite）"到什么程度？你怎么想它能成为什么？

**Matt：** 又是个疯狂故事：你看着一家公司一年从 0 做到约 3 亿美元。我们大概在他们约 3000 万 ARR 时想切入、实际投的那轮大约在 1.5 亿。所以有三块：数字、市场、创始人。数字在狂奔——这家公司一年 0 到 3 亿，就算减速到 3 倍增长率，那也是 3 亿到 10 亿（我说的是我们首次投资时），再往后复利……我 23 年风投生涯的头一遭见到这种东西。现在多了几个例子，但这显然是"异常值里的异常值"。我们还非常被 Anton（Osika）吸引——他极具愿景、是这个品类的代言人，对"让那从不写代码的 99% 的人都成为创造者"有非常独特而鲜明的规划。我们觉得这是位标志性创业者，加上疯狂的数字、以及你能用任何你想用的模型——如果这东西持续复利，它会是史上最有价值的公司之一。

**Harry：** 毛利率（margins）还重要吗？

**Matt：** 非常重要。我们正处在一个对投资人有点棘手的时期：现在很多伟大公司毛利率很低，20% 到 30%，但它们大概都有一条通往 60% 或 70% 的路径。由于推理（inference）计算的成本，如今很难再说"我会是 80%、90% 毛利率的公司"了。但伟大的公司是 60%、70% 毛利率——通往那里的路径是"我会做一些优化、不完全被推理成本绑死、大概还会用自己的数据做一些对领先实验室的补充、建个模型把毛利率提上去"。所以你是在以"对我们通常投资而言不寻常的毛利率"去截住这些超高增长公司，并试图判断哪些真有可信的路径通往良好的毛利结构。我认为 Lovable 就是其一。

## 六、开源会威胁 Anthropic 吗？——多模型、OpenRouter 与"优化的第二浪"

**Harry：** Lovable 的毛利结构会因使用开源（显然便宜得多）而大幅改变。这又和你另一笔投资 Anthropic 相冲——你把它们看作彼此的对冲吗？你担心开源的进展吗，鉴于现在开源能做的这么多？

**Matt：** 首先，Anthropic 是 Lovable 极好的伙伴、反之亦然。但这个市场太大了。有两个维度。有人担心 Lovable 和 Anthropic "互相绊脚"——我觉得 Anthropic 总是更偏"技术用户"来切入，Lovable 更偏"外行用户"，中间当然有些重叠，但各自都有大把空间做得极好。你看 Cursor 几乎是被 Anthropic "十字准星"正对着的，可他们仍有相当不错的结局。

至于开源：它像任何市场——你起步时想的是"我要先跑起来、把一个酷产品推出去"，于是默认用最简单的东西；随着时间推移，你做更多优化。我也在 OpenRouter（你们常聊、我爱听你们提）的董事会里。它的"北极星"是：有一个智能层，去截住许多应用的 API 调用，然后判断"在我要优化的某条效率前沿上，哪个模型最适合我"——是价格？是推理能力？还是性能、延迟？并且要在规模上做到。这正是一家公司管理和优化其业务所需要的。所以 AI 第一浪是"先跑起来"，第二浪是"对你用什么、何时用、怎么用变得复杂精细得多"。

**Harry：** 一旦你在"用什么、为什么、怎么用"上变精细，成本优化就进来了。所以我在想：如果开源能做 96% 的企业工作流，那不就大幅缩减前沿模型公司的市场吗？也许 Anthropic、OpenAI 去治愈癌症和气候变化，而你的"邮件打标签"交给开源？

**Matt：** 不。我认为基础模型（尤其 Anthropic）有如此特别、如此高性能、智能的模型，很难让人只说"我用开源配我的数据就行"。开源对你所做之事的一部分会是可用的、正面的，但我就是不认为它强到能真正取而代之。我的思路一般是：你会用多个模型——比如某家公司 50% 用 Anthropic、50% 用开源/自研。我不认为会到 96%。因为现在很多应用公司看到的是：是的，我能拿到更低成本；但如果我用 Anthropic，它实际上提升了客户留存、带来更多营收、让用户更多地使用平台。这是当下数据的指向。当然有些 API 调用就是不需要那个级别的功能——坦白说这对所有人都好，它逼着 Anthropic 保持警觉、持续创新（最具创新力的公司），而创业公司也用开源以自己的方式创新。

## 七、成本曲线、模型家族与自研芯片（Jalapeño / Samsung）

**Harry：** AI 的成本必须降下来吗？我们会看到这条成本曲线大幅下移吗？

**Matt：** 像任何产品一样——越便宜越能打开市场，因为你能以更少做更多，这些经济曲线总能激发活动。但即便在 Anthropic 家族内部：你有 Sonnet、有 Opus、有 Fable——连实验室自己都在围绕"并非一刀切"创新。所以你会看到"Anthropic 的模型家族 + 一组开源模型 + 你用自己数据训练的东西"的组合，你会横看整张挂毯说"我用 50% 这个、30% 那个、20% 这个"。这些是规模化时才会发生的优化，也正是我认为我们刚进入的市场阶段——这让它坦白说更迷人了，因为会有非常多二阶、三阶公司窜起、起飞，而不是整个市场都集中在少数几家。

**Harry：** 我很naive，有件事我没搞懂：OpenAI 有 Jalapeño（哈拉皮纽芯片），据报 Anthropic 在和三星（Samsung）合作造自己的芯片，DeepSeek、Meta 也在造芯片。今天你必须全栈吗？这是不是大家都往芯片层走的原因？

**Matt：** 这又回到我说的"优化"。谷歌很早就有 TPU、亚马逊有 Trainium。到了某个规模，你看账单会说"我付给某人的钱太多了"——你愿意为其中某部分成本付那么多（因为它太好太不同、你竞争不过），但也许还有另一些活动你能真正用自己的技术去发力、把成本结构降下来。而芯片生意很难，祝你趟进去好运——需要非常特殊的团队，尤其你要和黄仁勋（Jensen）以及现在一大堆别的选项竞争。但这些公司很聪明，会想"我们模型里有个非常具体的东西，如果有一颗在内存缓存等方面就这样表现的芯片，会让我们好太多"。对于某个百分比的工作负载（训练或推理），那可能是件大事、值得下注——如果你是个千亿美元营收的公司。

## 八、OpenRouter vs Nebius / Fireworks：路由生意到底值不值

**Harry：** 聊"全栈 vs 非全栈"——我请过 Nebius 的创始人，今天上午还请了 Fireworks 的 Lin（琳·乔 Lin Qiao）。Nebius 说他们要进入 OpenRouter（路由）那门生意、会主动去抢；而我今早问 Lin"路由生意有价值吗"，她说"没有"。你觉得为什么有？我漏了什么？

**Matt：** 首先，OpenRouter 拥有的是"开发者自发涌来的活水"——开发者因为信任而来，知道它是个很棒的推理市场、喜欢它的智能。我不认为一大堆开发者会涌向 Nebius——如果我是开发者，我不会一早醒来就想着它，所以他们处在对话的错误一端。但如果你在 Nebius 上、它是你的底层供应商、它也提供路由，那没问题。可如果你是一家会考虑多个云平台、还想把这层"抹平/混淆（obfuscate）"的公司，那 OpenRouter 就是很好的方案。

**Harry：** 路由生意会有多大？OpenRouter 能有多大——是个 500 亿美元的生意吗？

**Matt：** 他们的轨迹是疯狂的。我忘了他们公开宣布过什么，所以我最好别乱说。但在整个"开源模型/替代模型/模型优化"市场真正起飞之前，这家公司已经盈利、规模大到多数人会震惊。我感觉我们才刚到它的临界点，而这家公司已经是头猛兽了。所以我抱有巨大而很高的期望。

## 九、Legora 与应用层护城河：模型会不会吃掉应用？

**Harry：** 说到其他应用公司，我们一起投的还有 Legora（法律 AI）。我太喜欢 Max 了，觉得他是头绝对的猛兽。提醒我，你投的是哪一轮？

**Matt：** 就是大约六个月前刚发生的那轮，规模在 5000 万美元以下、但在那个区间。

**Harry：** 所以就是"先拿个立足点、随时间追加、更紧密地合作"。人人都跟我说"Anthropic 才是真正的威胁"，我说"你在开玩笑吗？这是一门重 GTM（go-to-market，进入市场）、专注和律师建关系、用生成式 AI 做法律部署的生意，完全不同"。当有人说"Anthropic 的法律（能力）会打败他们"时，你怎么回应？

**Matt：** 首先，Max 很特别（我的部分尽调就是看你对他的访谈）——他是台执行机器，人也很可爱。曾有一段时间界限更清晰：有模型、有 API、有应用公司；显然后来越来越模糊，几个月前还一度是"SaaS 末日、一切都要消失"。现在那种情绪很多已经消退，我们在梳理"哪些应用真正值得活下来、为什么"。不替 Anthropic 说话，但我的看法是：如果模型随手就能做某件事、而你的应用不够独特——工作流、在其上构建的价值不够——那模型把这市场拿走，说明它本来也不够可防御。而 Legora 的情况：他们有律师、有 FDE（forward-deployed engineer，前置部署工程师）进去理解这些工作流，这跨越了组织边界——很难让一个模型直接进来处理"这里有多个当事方"的复杂性：企业法务、律所；办一个案子时，你有客户、多家律所。它不完全是 n² 问题，但很复杂，你需要理解这个的工作流、需要上下文（哪怕在一家律所内部）。所以有大量价值可在其上构建。

**Harry：** Legora 必须在法律之外也成功，才配得上它想融资的估值吗？你看 Harvey 在向合规、税务扩张——我猜 Legora 也会，因为你要融 100 亿美元，光靠法律撑不起那个价。

**Matt：** 是的，那绝对是战略的一部分。愿景远大于法律。不是"必须"，而是"你既然建了一个特别擅长理解复杂精密专业服务团队（法律、税务、会计等）的基座平台，为什么不扩张进去"。而且外面大概还有一条我们尚未看到的"凳子腿（另一条增长曲线）"，也许下次我上节目时会聊到。

## 十、Series A 是最糟的位置：杠铃策略与"三三双双已不够"

**Harry：** 我认为 Series A 是今天最糟的位置（我合伙人总因此恨我，因为整支 Series A 基金会说"太好了，那我们别去见他们了"）。你有 100 到 300 万美元收入、200 倍 ARR 倍数、2 到 4 亿美元估值、却几乎没有 PMF（产品市场匹配）。你同意此刻从"切入点"看 Series A 最难、这也是为什么大家都涌向成长期和 pre-seed 吗？

**Matt：** 你说到点子上了。我们在做的其实是一种"杠铃策略（barbell）"。问题在于"一家公司什么时候在某个品类里确立了领导地位"——在那 100 到 300 万这个区间，你甚至还不知道竞争对手是谁，而你要按"他们会是赢家"来付钱，因为在这个 100 万到 1000 万区间估值就是这样。我们有一支叫 Inflection（拐点）的基金、一直称之为"早期成长（early growth）"，对我们意味着 300 万到 1000 万 ARR。但现实是，对好公司来说那个窗口以前能持续一年、一年半，现在只持续一周——以 Max 和 Legora 为例，他们一天就做到了。所以那个策略很难再追。真正的机会更多在那些完全"破圈"、冲到 1000 万 ARR 以上、被（市场）加冕为赢家（或你相信会是）的异常值。

至于 Series A，那是杠铃的另一端。我们的做法是往更早走：有一套具体的种子策略，三位合伙人可以当场开出高达 800 万美元的支票（这个数字以前是 300 万），我们扩大了口径和团队快速行动的灵活性。但难点在于:"种子到 A"之间的时间被极度压缩了。你细看两轮之间的数据点——他们多建了点产品、有五个 POC（概念验证），或者原来五个 POC、现在 100 万 ARR——说实话这没多少信号，可估值却从 5000 万跳到 2 亿。所以那才是难的地方。我们真的往更早移了，"种子动作（seed motion）"对我们变得突出得多，尤其针对很多技术项目。对 neolab 我们也有非常具体的策略——我们投了大约七家，但不是拿 2 亿进去，而是能早期拿到持股、或成为我们认为最终可能是赢家的一部分、再加码。

**Harry：** 我认为这个 vintage（基金年份）里表现最差的一类，会是那些精品种子基金——而这恰恰是每一个 LP 都想要的：只做旧金山、只做种子、规模 1 亿美元以下。我觉得这会是本 vintage 里表现最差的品类，因为像你们、Founders Fund、Benchmark、Sequoia、Accel 等等，都有非常好的种子产品。如果你是一支 5000 万美元的种子基金、开 200 万美元支票——哥们儿，"太大以至于不能友好跟投、又太小以至于不能领投"。你同意还是反对？

**Matt：** 我同意。最大的变化是：以前大家有各自的"泳道（swim lane）"，现在越来越多人全栈，包括我们在 Benchmark 的好朋友（他们做了成长期工具）。以前种子圈都说"让机构进来有负面信号"，我觉得那也过时了——对好公司大家都在抢先（preempt）、轮次更大，也许我们反而回到了更协作的轮次。"泳道"这整套概念没了。而协作、辛迪加其实很好——我职业头 10、15 年，每笔你领投的 Series 都会带另一家顶级机构进来；后来 10 年变成"什么都得一家独投"。我喜欢辛迪加这一面。

## 十一、3B 基金规模的克制、地理与"丢单"的共性

**Harry：** 我们聊过精品种子基金难、Series A 是难的切入点、杠铃策略；还有那支 30 亿美元的基金规模——我在和 Rory、Jason 的节目里说过、我们没太理解。你有 Anthropic、Lovable、Legora、OpenRouter、Fireworks……名单一长串好公司，你本可以募多得多。为什么只募 30 亿？风投的未来难道不是像 General Catalyst、Lightspeed 那样更大的平台吗？

**Matt：** 当你拿更多资本，会牵连到你怎么运营公司、文化、人数。我们喜欢做一台"小而强悍的机器"——大约 12 位合伙人加一批很棒的 principal、associate。当你全栈、有五个不同团队、开始按赛道分，人人"各自去接球"，有时你会觉得"我本可以做很棒的事，但没法真正押注在这一小群人身上"——一个组做不好会拖累别的组，导致对齐、能动性、协作的感觉变弱。这正是我们想在门洛保住的。尽管我们有两支基金、两个 IC（投委会），但两组之间工作流动性很强——风险基金的合伙人可以在成长基金里领投。所以更多是"我们想让门洛如何迎向市场、如何内部运作、如何保持团队相对小而人优秀，不觉得自己更像一家公司、而仍真正是一家 firm"。

**Harry：** 关于地理：Lovable、Legora 在瑞典，Anthropic 在西海岸。你怎么看 AI 权力中心回到旧金山、最聪明的头脑、最好的研究员都在那里——这套通行理论？

**Matt：** 旧金山有几年是个怪地方——所有酷孩子都想去纽约，SF 有点像鬼城、非常集中在 SaaS、没太多有意思的事。我很爱看到它找回魔力（mojo）。这类浪潮来时，湾区通常领跑——它带来了太多能量，那些"一辈子的纽约客、绝不会想离开"的人现在都搬来湾区，更多大学毕业生说"纽约很酷，但我得去那儿成为这场 AI 的一部分"。人才的集聚一直是湾区的特别之处——你不断地和创业者交谈，理解每个人在技术上究竟在做什么；你住在湾区所拥有的"上下文"，大概是别处某家很棒公司的 10 倍、100 倍。

不过要给你和欧洲点赞。整个"DeepMind 扩散（diaspora）"，加上 Lovable、Legora 这类公司——这对我们是新事物。我们过去总觉得"欧洲不行、更像手工作坊"。但我一直认为，在欧洲当创业者更难，所以要在欧洲成为伟大创业者需要更多"韧劲（grit）"——不像在湾区，进 YC、当个创始人并不算难。所以如果你有那份韧劲在欧洲起飞、成为全球公司，那说明了你很多。我们不会说要"在那儿驻扎"，但会花多得多的时间、也确实有兴趣做更多。Anton（Lovable）总说：在欧洲创业是"困难模式（hard mode）"。

**Harry：** 你丢单时，有没有共性？

**Matt：** 最常见的是"你到得太晚"——不够刻意、没把这家公司列为要长期追踪、建关系的对象，于是你在这轮前几周或一个月才进来，而别人已有一年的关系，这通常是死刑。而对我最大的死刑是"我上一家公司和 Matt 一起干了七年"——那我就出局了。关系在这行意义太大，高信任至关重要（在 firm 内部、以及和我们合作的公司之间）。这很难在某种"闪婚/冲刺"里建立。对最好的公司，总会有种"跳球（jump ball）"，而认识一个能帮你"引导进场、把飞机稳稳落地"的关联人极其重要。很少是纯粹卡在估值上——估值可以很痛，但对的公司你会不惜代价进去。

## 十二、Ownership 的最大教训、10B carry 之后如何保持饥饿

**Harry：** 对我最大的错误始终围绕 ownership。有好几家公司，人家给我们 1% 的份额（ElevenLabs、还有别的），我们说"1% 不能这么干"；现在回看，它们全都会返还巨额资金。

**Matt：** 那是我被训练出来的、大半职业生涯学到的东西，花了很大力气才摆脱。

**Harry：** 你觉得 LP 理解这一点吗？LP 总说"高持股、约束的组合规模、集中、像 Benchmark 那样"。他们明白游戏已经变了吗？

**Matt：** 我想他们看结果——也许一开始不明白，但我们对他们很明确：基金里有"核心仓位"，也有我们叫"追踪支票/起手支票"的东西。看我们的 Anthology 基金（门洛与 Anthropic 合办的种子基金）——50 多家公司、每笔 10 万到 100 万美元、在种子轮进去，从中"毕业"出来的有 OpenRouter、Whisper、Axiom Math。这一给我们一点专有的"deal flow（项目源）"，二给我们进入股权表、认识创业者的机会；然后当你看到某个在起作用，只要你在公司里有个"楔子（wedge）"，你在下一轮显著参与或领投的概率就高 10 倍。LP 正在明白这一点。

**Harry：** 我在"VC Brags"（一个专门吐槽 VC 的账号）上火了一把（笑）。我说我前几天拒了一家公司，因为它从 150 万到 500 万到 1500 万——资本的机会成本是真实的、增长预期非常不同；换句话说"三三双双（triple, triple, double, double，即经典 SaaS 增长标杆 T2D3）"已经不够激动人心了。为此我被训了。你同意"如果我给你一个 1→5、再 5→15，很棒、我不贬低它，但那就不是今天的风投游戏"吗？

**Matt：** 不是了。很难说出口、也很难改变 20 多年对"好与伟大"的认知框架，但这是现实——环境变了。如果你环顾四周说"那曾是前 5%"，而现在看起来更像前 50%——我们不是要待在前 50%。这不由我们投资人控制。当你看到这些公司一年从 0 到 1 亿美元、例子多到数不清，那就是新基准。

**Harry：** 简单算笔账：Anthropic 的分配大概会给门洛带来约 100 亿美元的 carry（附带权益），挺多"大富翁纸币"的。当有这么大一笔赢时，你怎么想"firm 的可持续性"？我们确实见过一些 firm 在人人赚太多钱后难以维持统治力。

**Matt：** carry 我们的仓位比那更高，你可以自己算 carry 通常是多少……但我完全懂你的意思。门洛自从我和 Venky（Ganesan）十多年前过来、Shawn Carolan 回归、Mark Siegel 把这支"乐队"组起来后，一直有种"挑战者心态"——一路是苦干、战斗、建设，令人振奋地走到今天。我们带进来的每个人都感受到门洛在这条栈上层层上移、越来越成功。所以驱动我们的正如你所料——不太关乎那个金钱结果，而是"我们把自己放到了一个有望成为 AI 领先机构之一的位置，如何真正复利、加倍这个优势"。这是我每天感到的能量，我看不到它消失。就像"我们到了、我们在这儿了，接下来用它做什么"，钱很棒，但那不是我们做这一切的原因。

**Harry：** 我认为"更富的投资人是更好的投资人"——因为你不再担心下行缓释、而专注上行优化：这能有多大？如果成了会怎样？你不担心 LP 不续投、不聚焦风险缓释。你同意吗？

**Matt：** 当然。这在 firm 层面、也在个人层面成立。我职业里有过一些时刻，你从自己或周围感到某种怀疑，那会让你变得糟糕得多。所以我们努力营造高信任环境、把人托举起来。这行每个人都会失败——关键是更早认清、"把飞机稳稳落地"、做正确的事。世上最糟的是死抱着、假装现实不是现实。很多时候你帮创始人"把飞机落下来"其实是在帮他。
