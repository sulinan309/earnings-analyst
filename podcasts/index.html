  .hlbox{margin:6px 0 30px;padding:22px 26px;background:color-mix(in srgb,var(--ep) 6%,var(--surface));border:1px solid var(--line);border-left:3px solid var(--ep);border-radius:0 14px 14px 0}

  .menubtn{display:none}

  }

  @media (max-width:960px){.scrim{display:block}}
</style>

## 一、开场：一档关于沙丁鱼的节目

**Tracy：** 欢迎收听新一期 Odd Lots 播客。我是 Tracy Alloway。

**Joe：** 我是 Joe Weisenthal。

**Tracy：** Joe，你是知道的——虽然你有时候会忘——

**Joe：** ——你爱吃鱼。如果说我对你 Tracy 有一件事是确定的，那就是你爱吃鱼。你爱吃海鲜，对吧？我说得没错吧？

**Tracy：** 完全正确（笑）。好吧，这事儿挺出名的，一些老听众可能已经听过了：那次 Joe 邀请我去他家，他问我有没有什么忌口。我说了句大概是"我什么都吃，但我不太是个爱吃鱼的人"。然后我去了他家，端上来的是 poke bowl（夏威夷生鱼饭）。

**Joe：** 是啊，那事儿对不住。

**Tracy：** 没关系，其实真的很好吃。我偶尔也吃鱼的，只是没那么热衷。像蟹饼、生蚝我都吃，只是要看心情。

**Joe：** 我懂。

**Tracy：** 但有一样东西我从来没吃过——沙丁鱼。

**Joe：** 噢，是吗。我吃过沙丁鱼，我挺喜欢的。

**Tracy：** 你有什么固定吃法吗？就是直接从罐头里夹出来往嘴里塞？

**Joe：** 会啊，不过我也会放进沙拉之类的东西里。我吃过加沙丁鱼的沙拉，但我确实也直接从罐头里夹出来就吃。

**Tracy：** 好吧。我个人不吃鱼，主要是因为味道。但结果证明，这个口味偏好正在变得相当"实用"——因为我们现在正面临一场沙丁鱼短缺。

**Joe：** 讲罐头鱼（tinned fish）这件事，会和一堆我们经常聊、或者反复冒出来的话题交叉。比如全球供应链。我在节目里说过好几次了，我从阿拉斯加那趟行程里记得最牢的一个知识点就是：阿拉斯加沿岸捕的鱼有多大比例是在美国销售的，但中间要先绕道中国加工一趟。

**Tracy：** 没错。所以哪怕你买的是美国捕捞的阿拉斯加三文鱼，它大概率也是在中国加工过的。

**Joe：** 我觉得这个特别有意思。还有鱼的营销和品牌塑造也很有意思——因为关于罐头鱼我们知道的一件事是，尤其是过去五年里，出现了一整批全新的人群，他们对罐头鱼的联想不再是廉价的 StarKist 那类低端金枪鱼罐头。冒出来了一个高端、精品化的罐头金枪鱼版本——我个人非常喜欢罐头金枪鱼。所以这里面有各种不同的市场层面的东西。再加上你刚才提到的气候，以及供给和鱼类种群的问题等等。罐头鱼这个故事里，有很多条互相交织的线索。

**Tracy：** 对。而眼下最大的新闻是：摩洛哥——据说它出口了全球大约 50% 的沙丁鱼供应——已经对沙丁鱼出口下了禁令，理由同样是关于过度捕捞的报告。另外似乎浮游生物也不够小沙丁鱼吃了，这挺让人难过的，因为这意味着企鹅也吃不饱——摩洛哥当然没有企鹅，但世界上别处的企鹅也不够吃了。

所以我们今天要聊这些：全球沙丁鱼供应到底发生了什么，沙丁鱼从哪儿来，鱼类总体从哪儿来，是怎么加工的，什么算好的罐头鱼、什么算差的罐头鱼。我很高兴地说，我们请到了完美的嘉宾——Becca Millstein，Fishwife 的创始人兼 CEO，这家公司专做的就是罐头鱼。

Becca，非常感谢你来 Odd Lots。我得说，等我哪天真的吃下人生第一条沙丁鱼，我想那应该会是一条 Fishwife 的沙丁鱼。

**Becca：** Tracy，我等不及那一天了。真的非常感谢你们邀请我。

**Tracy：** 是包装打动了我。

**Joe：** 包装打动了她。确实做得很好。

**Becca：** 那绝对是我们的一大重点。我开始做这个品牌的时候，你得来一手"偷梁换柱"（bait and switch）。

**Joe：** 已经有人在想了：这场对话里会有多少鱼类双关梗？

**Becca：** 你们允许多少就有多少（笑）。不过说正经的，我们必须彻底反向定位，脱离美国人对罐头鱼的固有联想——你们大概也知道，就是那种白蓝配色、纯大宗商品感、没有品牌的罐头鱼。所以我们显然是往极左的方向走：全手绘插画、非常漂亮的品牌视觉。我们有专职插画师在团队里，每天都在为我们画插画。

## 二、Fishwife 的起源：格拉纳达的免费 tapas 和疫情里的罐头鱼

**Tracy：** 那跟我们讲讲 Fishwife 的起源吧。你刚才提到了一点：想法是做一个高端罐头鱼产品，让美国人多少能像欧洲人那样去看待它，对吧？在欧洲，一罐好沙丁鱼是件值得高兴的事。我记得我妈就会为这个特别兴奋。

**Becca：** 我原本是新罕布什尔州人。大学时我去西班牙南部交换，在一个叫格拉纳达（Granada）的城市。格拉纳达是个非常有意思的城市。

**Tracy：** 那儿太美了，你去过吗？

**Joe：** 我去过。我这辈子吃过的最好的火腿（jamón）和奶酪就是在格拉纳达。

**Becca：** 是啊，他们真的懂。格拉纳达有意思的地方在于，据我所知，它至今仍是西班牙唯一一个每点一杯酒就免费送 tapas 的城市。你点一小杯啤酒、一小杯葡萄酒，他们就会给你端上来——低配版是薯片，高配版就是沙丁鱼、橄榄、火腿。你一直在被投喂，一小份一小份都很漂亮。

我在那儿的体验给了我巨大的启发，就是看到这些小吃能有多好吃——它们其实超级简单，根本不涉及烹饪，但食材质量高到让它就是好吃。所以我在哪家小酒吧其实都无所谓。

再加上看到西班牙人的饮食方式，看到他们是真的珍视自家食品的高品质。后来我又去了葡萄牙，那是所有人的"罐头启蒙现场"（conservas），我的启蒙也确实是在那儿。在里斯本，你会看到那些漂亮的店铺，一排排一架架美到不行的罐头鱼——那和我在新罕布什尔南部逛的 Market Basket 超市，简直不能再不同了。

当然那会儿我 20 岁，并没有想着"我这辈子就要干这个了"。但到了新冠疫情期间，我开始更多地吃罐头鱼。它对身体真的很好，开罐即食，常温可储存——在我们都尽量少去杂货店的那段时间里，这一点很关键。

然后就有了一个灵光一闪的时刻。我知道你们请过 Alison Roman 上节目——看到 Alison Roman、Anthony Bourdain、David Chang 这些人，他们一直在盛赞高品质的罐头金枪鱼有多棒。这东西当时就在空气里了。我也开始在自己的同龄圈子里看到，大家在社交媒体上发自己用罐头鱼在家做的小餐食的照片。这挺有意思的，因为我真的觉得在疫情之前，做一顿漂亮的午餐再发到 Instagram 上，并不是人们的习惯动作。

**Joe：** 是挺怪的。

**Becca：** 而现在这显然已经完全稀松平常了 [存疑：原句 ASR 失真]。所有这些因素叠加起来，再加上那一波增长——我记得罐头鱼品类在新冠疫情期间同比增长了大约 10%，这挺夸张的，因为在那之后大体上就再没有过这种情况。于是我想：美国人值得拥有更好的产品，而且我认为他们愿意为此付钱。这就是这家公司真正的起点。

## 三、一条鳀鱼的旅程：从桑托尼亚外海到你的厨房

**Joe：** 这场对话里我关心两条不同的线索，我想确保两条都聊到。刚才那条是品牌起源，我们后面还会再聊品牌和营销。现在先跟我们讲讲——我们之后会更深入——你目前的基础供应链是什么样：一条鱼从被捕捞上来，到进入我的厨房，中间经过哪些步骤？给我们讲个大致的先后顺序。

**Becca：** 我先给你们讲最简单直接的一条，因为你们在这场对话里会学到的一件事是：每一条海鲜供应链、每一条罐头海鲜供应链，都完全不一样，而且都很奇怪。

我举的第一个例子是我们的坎塔布里亚（Cantabrian）罐头鳀鱼。我们的鳀鱼来自西班牙北部一个叫桑托尼亚（Santoña）的小镇。你要是去那个镇子，会被震撼到——因为它完完全全被鳀鱼罐头厂占领了。你穿过这个小城，会看到你听说过的每一个鳀鱼罐头品牌的 logo 都印在一栋大仓库上。

在这个案例里，渔民出海大概六英里，用的是围网（purse seine）捕捞法——基本上就是把一张很大很宽的网撒到海面上层，把整群鱼圈起来，然后把网收拢，把鱼从水里提上来，立刻上冰。然后他们把鱼运回六英里外的岸上，送到鳀鱼拍卖场，鱼会被打上一个数字，代表这批鳀鱼的品质——比如鳀鱼的个头、有没有损伤、肥度。标好品质等级之后，竞拍开始。

这种场合，通常每家罐头厂会来一到两个人。要注意，这些罐头厂基本上、可能全部都是多代传承的家族企业。我们合作的那家罐头厂是 1940 年代由一个人创办的，现在已经传到第三代，他的后代接手了生意，并且把生意做大做宽了。所以今天，是这个人的孙子去参加鳀鱼拍卖。他心里会有一个出价，然后拍下一批鳀鱼。

这些鳀鱼会被运到离拍卖场仅仅三个街区远的地方，立刻进入加工。这里的加工意思是——我要往细里讲了啊。

**Joe / Tracy：** 讲，太好了。

**Becca：** 加工的意思是：鳀鱼会被去头去尾，头剪掉、尾剪掉，然后一层一层地码进装满粗盐（rock salt）的桶里。它们会在里面待 12 到 36 个月——而且实际上待得越久，品质越高。话说回来，三年是非常非常非常长的时间，所以那会是一个极其昂贵、市场也相当有限的产品。我们的鳀鱼平均腌 12 到 18 个月。在这段时间里，它们完成熟成，发展出我们熟悉的那种鳀鱼特有的美妙风味。

我继续往下讲。12 到 18 个月结束后，鳀鱼从盐桶里取出，去皮。基本上，我们都认识和喜爱的那种漂亮的小粉色鳀鱼，就是从一条外表看上去挺普通的小银鱼里"浮现"出来的。说真的，你第一次看到鳀鱼原鱼的时候，很多人会以为那是沙丁鱼，因为它们就是那种个头不小的银色的鱼。

清理干净、把那条可爱的粉色鱼肉取出来之后，一条一条地摆进你买 Fishwife 鳀鱼时看到的那种罐子里。它们会被反复彻底地清洗、冲洗，然后罐子里灌入特级初榨橄榄油（我们用的是这个），封罐（seaming）。

鳀鱼非常特别，因为跟我们其他所有罐头鱼产品不同，它是通过盐渍熟成的方式做成的，并没有经过高温杀菌（retort）处理。这让它成为一个敏感得多的产品，保质期也比我们其他罐头短得多。我们其他罐头的保质期平均在五到七年——你们可以想象，作为一个食品行业的创业者，这简直是好到不真实的事情，几乎没有什么产品能有这种保质期。而鳀鱼因为这种盐渍工艺，保质期只有大约一年，而且不能受热，一受热就会散掉。

所以，这是最简单的一条供应链，也说明了它有多集中。但话说回来，鳀鱼作为一个实际产品，是我们所有产品里在储存、管理和运输上最复杂的，遥遥领先。

## 四、为什么西班牙老牌罐头厂愿意接一个美国新品牌的单

**Tracy：** 你创办这家公司之前，完全没有鱼类行业的经验，对吧？

**Becca：** 没有。我之前在职场里大概工作了四年，是在能源行业。

**Tracy：** 那么听你描述西班牙那样的地方的鱼类供应链，感觉非常家族化、非常紧密，大概也很难打进去。我想你总不能直接去找个渔民说"嘿，你想给我们当供应商吗"。你到底是怎么找到这些特定的人、开始建立这些关系的？

**Becca：** 这正是这个故事里有意思的地方。在 CPG（快消品）行业，尤其是新兴品牌的 CPG 行业里，有个众所周知的难题：所谓"拿到产线时间"（line time）、或者说让一家代工厂（co-manufacturer）愿意跟你合作，是非常困难的。因为谁知道你过两年还在不在？你的产品里大概率还有一堆奇奇怪怪的"更健康"的配料，代工厂根本不想折腾。他们更愿意跟大得多的公司合作，那些公司能可靠地下大批量订单。

但我们这个案子有点意思。我刚开始做的时候，主要是在美国联系代工厂和供应商等等。首先，所有人的反应都是：你为什么要做罐头鱼？罐头鱼行业在萎缩啊。你干嘛不做软包装袋（pouch）？软包装行业正火。而我心想：兄弟们，这真的不是我要的调性，老实说那玩意儿完全体现不出那种欧洲式的浪漫美学。

所以这一点确实起了作用。这不是那种炙手可热的行业——不像饮料，饮料永远是在往右上方涨的。我不需要跟一堆年轻创业者去抢产线时间，这个品类也不是"一飞冲天"的，它是平的，甚至在衰退。

于是我们开始联系欧洲的罐头厂——一开始是从美国代工厂谈起，很快就开始接触西班牙、葡萄牙的厂。这里的关键是：美国是全世界最大的市场，而对一个外国公司来说，要在美国建立起市场几乎是不可能的，因为你得做大量的营销和品牌建设工作。但与此同时，这又是一个极具吸引力的市场——非常非常富裕、支付能力很强的客户。

所以我觉得当我们联系这些罐头厂的时候，他们一定看到了这一点。他们看到的是：这里有个人，愿意拼命去为一个真正高端的产品在美国建立市场，而我们（罐头厂）就不用自己去干这件几乎不可能完成的事了。而且我们有产能——这些罐头厂大多并不是一天三班、一周七天在开工，可能只是一天一到两班、一周五天。所以我们联系到的所有这些罐头厂都有一些闲置产能。

我觉得对他们来说最不可思议的部分，是看到一家美国公司能长多快。因为如我所说，这些企业已经存在了好几代，是家族所有制，没有风险投资背书，也不打算像我们在美国理解的那样"几年内规模化然后退出"。他们对自己企业的构想跟我们完全不同：如果他们能做到同比 5% 的增长，那就已经很棒了；持平，也没问题。当然我不想一概而论，但他们肯定不是在追求同比 50% 的增长。

而 Fishwife 到现在做了五年半，这些产品的需求已经被验证出来了。我觉得这些合作伙伴——他们本来对 5% 的同比增长就很满意——看到 Fishwife 的订货量同比翻三倍、四倍，是真的有点转不过弯来。

## 五、从 0 到 1：微型罐头厂、MOQ 和混乱的第一年

**Joe：** 所以我理解，你当时其实有几个结构性的机会窗口：第一，那个时点上"高端罐头鱼"还根本不算一个品类；第二，现有罐头厂确实有闲置产能，所以不存在激烈的抢产能竞争。但从生意的角度说，你到底是怎么解决冷启动问题的？第一天你没有任何客户，你得先拿到产能，你也根本不知道终端需求会长成什么样。用创业圈的话说，就是那个"从 0 到 1"的问题——哪怕它比其他 DTC 品类稍微容易一点，你实际是怎么走到"我必须下一笔订单然后把它卖掉"这一步的？为了下这笔订单，你必须做出哪些承诺？

**Becca：** 这是个很好的问题。我们的 0 到 1 之年是 2021 年，而那时的供应链跟我们今天的供应链在很大程度上是完全不同的。

我刚开始做这个生意的时候，是同时在北美和欧洲两边找、两边都开放地去搭供应链。所以公司第一年里，我们合作的第一家罐头厂，是俄勒冈海岸边上一家很小的微型罐头厂。它主要服务西海岸的休闲海钓者，从加州一直到华盛顿州。所以那儿根本不存在什么起订量（MOQ）的问题——是钓鱼的人自己拎着渔获过来说：嘿，帮我做 500 罐金枪鱼。

那是我们合作的第一家罐头厂。第二家在华盛顿州，画像非常类似：微型罐头厂、极其亲力亲为、没有起订量门槛。

**Joe：** 说句老实话，MOQ 是什么的缩写？

**Becca：** 最小起订量（minimum order quantity）。

**Joe：** 明白了，谢谢。

**Becca：** 所以，回到我前面提到的问题：创业圈的一个巨大痛点就是——我想做一家饮料公司，那你第一批就得做 5 万件气泡水，在你还没有任何需求、根本没人知道你是谁的时候。

所以总的来说，我们没有 MOQ 的问题。在美国国内的罐头厂那儿肯定没有，因为它们实在太小了。后来我们开始合作的第一家西班牙罐头厂——今天我们还在跟它合作，同时也还在跟华盛顿州那家合作——它的起订量也还是偏小的一侧，我记得大概是 2 万件。

我当时订了 2 万件的橄榄油浸沙丁鱼，这大概够我们卖一整年。

但过程超级混乱。我根本不知道自己在干什么。需求预测（demand planning）大概是我在整个公司里做得最差的一件事。所以在俄勒冈那家罐头厂那边，我们出现了意料之外的断货，两个 SKU 断货了三个月。这就是从 0 到 1 的那一年的样子：走走停停、断断续续。

但即便有这些走走停停，即便库存量非常小，我那一年还是真的把品牌做起来了。我们拿到了很多媒体报道，也拿到了很多网红/博主的曝光——尽管此后供应链已经发生了巨大的转变。

## 六、供应链 V2：为"几乎无限的扩张"做准备

**Tracy：** 这正好是我要问的下一个问题。随着你的生意规模上来——从你刚才提到的数字看，它增长得非常非常快——拿到货变得更容易了吗？

**Becca：** 变得更容易了，也变得更难了。

**Tracy：** 好，展开说说。

**Becca：** 更容易，是因为现在公司有 18 个员工，他们在拿货这件事上比我一个人的时候强太多了。所以在内部资源这块，是容易多了。

另外，我们在 2023 年做了一次很大的供应链转型，目标是从我刚才描述的那个"供应链 V1"，走到"供应链 V2"——而 V2 的目标是：它能支撑我们在美国市场上基本无上限地扩张。所以我们当时找的是那种一年能产 8000 万罐、1 亿罐的罐头厂。

我们经历了那次转型，总体上看，我们确实实现了极其巨大、极其迅速的扩张。但话说回来，我觉得沙丁鱼这次的情况就是一个很好的例子：我们看到这个产品的需求冲上天花板，基本上是指数级的。而这种有时候会砸到我们头上的、不可预测的需求（我们等会儿可以细说）——比如像沙丁鱼这次这样——正是我们会遇到麻烦的时刻，因为这些事发生得太快了。

而这条供应链的交期（lead time）并不短。我们要提前一年告诉罐头厂我们需要什么，然后提前六个月，再提前三个月下正式采购订单（PO），这样他们才能真正锁定生产我们产品所需的原料。所以这就是"在一个长交期行业里做一个高增长品牌"的棘手之处。

**Tracy：** 是啊，你永远不知道一年后的增长会长成什么样。

## 七、美国罐头产业的空心化，与亚洲低成本产能

**Joe：** 你正好讲到了沙丁鱼那部分，太好了，因为有件事我本来想在开场里说的。让我对整个故事产生兴趣的另一个点是：我的 Instagram 信息流和算法被我搞得非常离谱，我会被推送大量中国沙丁鱼罐头工厂的 B2B 广告，广告本身写着："您是否正受摩洛哥沙丁鱼短缺的困扰？请从中国采购您的沙丁鱼罐头。"我觉得这实在太有意思了。

所以，你现在讲到 8000 万、1 亿罐的量级——而在五年前，这还不是一个高增长品类。这么多年下来，中国出现了这些非常廉价的罐头厂，我相信越南、泰国等地也有。在你这样的公司进入市场之前，欧洲——或者美国的某些地方——那些你想去采购的产能，是不是因为全球产业转移而在萎缩？而这种萎缩是不是造成了今天的局面：现在它成了一个高增长品类（至少对你而言是），但产能因为多年被全球竞争掏空而变得紧张？

**Becca：** 我觉得这跟所有美国制造业的故事是同一个故事。美国东西两岸曾经都有非常繁荣的罐头产业：加州（你大概读过《罐头厂街》Cannery Row），或者缅因州沿岸，那儿有更大、更工业化的罐头厂。多种因素叠加，导致它们关门——基本上美国大部分罐头厂在大约 15 年前就关掉了。

今天，这是个估算，我会说美国本土 48 州大概还剩五家左右，阿拉斯加可能还有几家。阿拉斯加是能找到那种更大、更工业化的罐头厂的地方，做的是大宗商品化的阿拉斯加三文鱼罐头之类。

原因是多方面的。我知道大约 15 年前出台了非常严格的 FDA 规定，美国很多罐头厂跟不上、维持不住。还有一些渔场确实衰退了——太平洋的沙丁鱼和鳀鱼渔业，在东西两岸都出现过真正的衰退期。渔场衰退、渔场关闭，罐头厂当然也就跟着倒了。

再加上亚洲各地能提供极其廉价的加工，所以大量加工环节转移了过去——就像你说的阿拉斯加三文鱼在中国加工那样。这是个很常见的故事，在美国确实就是这么发生的。

## 八、摩洛哥沙丁鱼禁令到底发生了什么

**Joe：** 抱歉打断，我想先弄清楚：摩洛哥沙丁鱼的情况，并不是说在摩洛哥不能做罐头，而是沙丁鱼本身是在那里捕的，然后出口到主要在西班牙、可能还有葡萄牙的罐头加工地，对吗？

**Becca：** 完全正确。摩洛哥当然有罐头厂和罐头产业基础设施，但摩洛哥沙丁鱼渔业的原料里，有非常大的比例是出口到西班牙的——我记得西班牙罐头厂用的沙丁鱼原料里，大约 90% 来自摩洛哥。

所以并不是他们没有罐头产能。我认为我们现在看到的是：他们在为自己的出口保留原料。因为这个禁令只针对**冷冻沙丁鱼**出口，不针对**沙丁鱼罐头**出口。所以摩洛哥是在保护自己的原料，从而维持自己那个非常有分量、规模很大的沙丁鱼罐头出口产业。

**Tracy：** 那这件事对 Fishwife 本身有影响吗？

**Becca：** 有影响，但不是你们会自然联想到的那种影响，因为我们从来没有从摩洛哥沙丁鱼渔业采购过。

我们大约五年来一直从康沃尔（Cornish）沙丁鱼渔业采购，从我们开始卖沙丁鱼那时起就是。

**Tracy：** 康沃尔？

**Becca：** 康沃尔沙丁鱼。它在当时是欧洲唯一一个获得 MSC（海洋管理委员会，Marine Stewardship Council）可持续认证的渔场。MSC 是全球认可度最高的野生渔业认证机构 [此处原稿有一句关于 Fishwife 的话 ASR 失真，存疑]。

所以我们一直从康沃尔沙丁鱼渔业采购。而伊比利亚（Iberian）沙丁鱼渔业我记得是去年通过了 MSC 认证，所以我们也开始从那个渔场采购，这挺让人兴奋的。现在我们从这两个 MSC 认证渔场采购——它们是目前欧洲仅有的两个获认证的可持续沙丁鱼渔场。

所以我们的原料供应本身并没有受到冲击。但话说回来，随着市场上大量库存凭空消失，我们看到沙丁鱼的销量——大概从去年 12 月开始——彻底疯了。一开始大概是之前的两到三倍，而且这个势头一直保持着，后来甚至涨到四到五倍，这是非常夸张的量级。

我们接到零售商采购的电话说：嘿，我的沙丁鱼货架被扫空了，你们能不能顶上来供货？我记得当时跟我的销售负责人有过这样一段对话：我们能做，但我们必须走空运才能及时把货送到。我们平时尽量走所谓的"慢船"（海运），那是最经济的，也是环境上最可持续的。所以我们必须做一个艰难的决定：为了抓住这波需求、也许还能让新客户第一次接触到 Fishwife 的沙丁鱼，我们是否接受毛利率被空运压缩——你们可以想象，空运是极其昂贵的。

我们为很多零售商，一次又一次地做了这个选择。而沙丁鱼的需求实在太旺盛，到现在都没有降下来的迹象。疯狂的地方在于，与此同时我们还看到围绕沙丁鱼的一波巨大的消费潮流也在同时抬头。

**Tracy：** 我正想说，为了给这期节目做尽职调查，我去逛了 Reddit 上的沙丁鱼罐头板块，那是个非常活跃的社区。有几个人在抱怨他们在本地的 Trader Joe's 之类的地方买不到沙丁鱼了。还有一堆帖子在赞颂沙丁鱼的健康益处，让我觉得也许、也许我该试试。

**Becca：** 我觉得单纯从健康角度看，罐头鱼就是一个非常好的蛋白质来源。

**Joe：** 我会把它放沙拉里，比如把罐头金枪鱼放进沙拉。我是重度支持者。

## 九、DTC 的黄昏：为什么 Fishwife 走的是"反向剧本"

**Joe：** 首先我觉得有意思的是，显然真有人对沙丁鱼的渴望强到愿意"消费升级"——某个便宜的供给消失了，他们就转去买高端的。

但我想再多聊聊品牌这块。我想到那些真正在 Instagram 黄金时代（2010 年代）长起来的 DTC 品牌，当时最大的机会似乎是：找一个很贵的产品，比如 Warby Parker——你其实不需要花 350 美元去买一副 Luxottica 的眼镜，我们可以用 20 美元做出来，花 10 美元打广告，然后卖 100 美元（数字我随口编的），赚 70 美元利润。感觉当时冒出来一大堆这样的公司，一批批从商学院出来，全都在找同一类机会：找一个高溢价的东西，做一个商品化版本，砍掉中间商，做点好看的品牌，加点光泽感，放到 Instagram 上。

而你这个感觉恰恰相反——你必须去发明一个本来并不存在的新品类。这在多大程度上是媒介市场变化的结果？我很好奇：如果你今天去做 Warby Parker，Instagram 广告可能不是 20 美元而是 79 美元，剩 1 美元的利润。也就是说，要在 2020 年代做一个 DTC 品牌，你必须去做一些完全不同的事情？

话说回来，虽然这不算完整回答你的问题，但结论是：人们想要真正高品质的产品，并且愿意为此付钱。这是我们看到的事实。

**Joe：** 是啊。我记得有个挺夸张的统计，说现在大约 50% 的消费支出是由大概 5% 的人口完成的，反正是那种夸张的数字 [数据存疑，为口播概数]。

## 十、短缺的成因：气候、掠食者、浮游生物，还是过度捕捞？

**Tracy：** 好了，从个人品牌偏好回到沙丁鱼上。我这儿听出了好几个关键词。一是沙丁鱼需求上升，沙丁鱼正当红。二是气候变化——我们刚才聊到了可能因为水温升高导致浮游生物短缺。三是过度捕捞，我们已经听了很多很多年了。而且你经常看到互相矛盾的标题：一会儿说全球鱼类种群岌岌可危，两个月后又变成"没事，我们找到了更可持续的捕捞方式，供给是有韧性的"，等等。就沙丁鱼短缺而言，在当下这个时点，你认为哪个因素最重要？

**Becca：** 我觉得作为一个总纲式的回答：海鲜可持续性这件事最让人抓狂的地方在于，它有无穷无尽的细微差别，而且一直在变。

即便是摩洛哥沙丁鱼这件事——他们从 2023 年就开始看到捕捞量下降，当时降了大约 46%。那才是三年前的事。而渔业科学的推进相当慢，做一次渔场评估要花很长时间。

所以长话短说：现在所有被讨论的、你提到的那些理论，就只是理论而已。而且它们都是一个大得多的图景里的贡献因素——很可能是所有因素共同作用，而不是某一个单独起作用，并且很难判断各自贡献了多少。我可以把目前讨论中的这几种理论都讲一下。

**Tracy：** 请讲。

**Becca：** 第一个，也是看上去最可能的，是气候变化本身。中大西洋海域的水温在上升，而像沙丁鱼、鳀鱼、鲭鱼这类小型饵料鱼（forage fish）对水温变化极其敏感。水温一变，它们很可能就迁移到更冷的水域去了。

所以问题可能根本不是沙丁鱼变少了，而仅仅是沙丁鱼迁移到了商业渔船很难够到的地方——可能是更深的水层，也可能是更远的海域。它们只是换了个位置，而那不是渔民习惯下网的地方。这看起来是最可能的解释。

暖水还可能触发食物网里意想不到的变化。海洋里的一切显然都是连着的。水温变化也可能意味着有更多掠食者在这片海域主动捕食。就像 Tracy 说的，人类不是唯一在捕沙丁鱼的——鸟类、别的鱼类也在捕。所以可能只是这片海域的掠食者活动变多了。

还有浮游生物理论，很多人在写这个：暖水可能导致浮游生物的营养密度更低、脂肪更少、热量更低——可以说是"瘦浮游生物"。

**Tracy：** 我懂，绝对是。

**Becca：** 而这些会导致沙丁鱼变得更瘦、脂肪更少，而肥的那种才是大家想捕的。

所以这些因素是组合在一起的，而且肯定都跟气候变化缠在一起，只是很难知道哪个贡献最大。

我觉得有意思的一点是：就目前情况看，过度捕捞**并不是**主要元凶。我前面提到了 MSC，那是我们最依赖、最看重的认证机构；另一个是蒙特雷湾水族馆的 Seafood Watch，这名字读起来有点绕口，它也是全球非常受尊重的认证机构。给这个渔场评级的正是他们——我记得这个渔场目前是黄色评级，那不算差。他们评估的基本结论是：这个渔场被良好监管，执法力度强。这让我倾向于认为，问题更少来自过度捕捞，更多是气候问题。

我觉得有一点非常非常重要，值得强调：这次并不是"渔场被关闭"的情况，而是"冷冻沙丁鱼出口禁令"的情况。但当你确实看到某个渔场被设定上限的时候，看上去有点吓人，但那恰恰是负责任的渔业管理在实际运作。那意味着大家坐下来说：嘿，我们看到的鱼量没有达到预期，或者看到的鱼的个头没有达到预期，我们需要关闭捕捞季，让这个渔场自我恢复。

而我觉得最了不起的是，有非常非常多的例子表明：捕捞量下降 → 渔场关闭三到五年 → 在这段时间里完全重新获得可持续认证，种群完全恢复，并且此后能年复一年地自我维持。

所以我觉得让大家理解这一点非常重要：看到空货架的时候不要惊慌，反而应该高兴——因为有人正在把这些限制措施落实下去。

## 十二、品牌联名与网红营销的真实账本

**Joe：** 显然，要维持一个有价值的品牌，你得维护品牌本身。这里有个我一直想问某个人的问题：我们生活在一个品牌联名（brand collab）的时代，比如 Lululemon 要出一个和卡夫芝士通心粉的限量联名瑜伽装备之类的。

**Joe：** 我另一个和品牌相关的问题是：这些从零冒出来的新品牌（de novo brands）。这些年来，我觉得 2010 年代长起来的那批品牌，为了维持品牌，交的"Instagram 税"越来越高。我注意到你们网站上有一个入口，网红可以发邮件说"我愿意发关于 Fishwife 的内容"，然后你们跟他们谈个合作。

现在网红那么多，想当网红的人更多。从你的角度看，你有足够好的选择吗？还是说那些你真正想合作的、跟你们审美和品牌调性契合的网红，其实存在真实的稀缺——而不是只看粉丝量高不高？

**Becca：** 我不认为存在稀缺。我觉得 Fishwife 和网红生态的关系比较特别，因为我们基本不做付费投放。偶尔会有网红做点内容，我们当然会为内容付酬，如果是合作贴文，还会为触达他们的受众额外加一笔。但我们这辈子这么干的次数不到十次。所以我觉得我们挺幸运的。

**Joe：** 因为你们网站上确实有这个联盟计划，写着"分享 Fishwife 就能拿钱"。

**Becca：** 那是佣金制的项目，跟一口价（flat fee）不一样。基本上，要按一口价请网红在 Instagram 上发帖，价格可以高到离谱。我被报过 4 万美元、3 万美元的价，对方大概 80 万粉丝——我们根本负担不起。

所以我们有这个联盟计划，网红拿佣金；另外我们一直投入的是"种草寄样"（seeding），确保产品能到他们手上。但佣金制项目和一口价之间，中间是有一道巨大鸿沟的，而一口价很多都非常非常高。

---

## 十三、关税与铝罐：真金白银的那部分

**Tracy：** 回到供应链上。包装对 Fishwife 显然非常重要，你们有品牌视觉这一层，但也有罐子本身——所有东西都装在罐里。最近几个月，你们有没有受到铝包装关税之类的影响？

**Becca：** 铝包装的关税我们没有看到直接冲击我们的业务。首先，罐子不是我们持有的——是我们的罐头厂去采购罐子。而且我们也没有看到有意义的涨幅。在我们做生意的这五年里，我们确实看到过锡价、铝价上涨，但最近这一波，尤其是关税相关的，并不是最大的那记打击。

真正有影响的是我们从欧洲进口的产品被加征的关税。那对业务是有影响的，也很不理想。欧洲目前是 15% 的关税，2025 年 4 月开始实施，这很糟糕。那是好几百万美元的量级。我们上个月拿到了 150 万美元的退税，那当然很好，钱确实进账了。但现在又有新的关税了——我们现在有新关税，而那 150 万只是我们已缴关税里的一小部分比例。

其实我们一直都在跟关税打交道：从我们开始进口橄榄油浸金枪鱼起，这个产品就一直有 35% 的进口关税。而关税不叠加（don't stack），所以举个例子，我们的橄榄油浸金枪鱼在新关税落下来的时候，并没有再增加，我们没有额外承担增量关税。但这事就是糟心，它直接打在毛利率上，而且感觉非常愚蠢。我真希望我们不用付那几百万。

**Tracy：** 我最近也收到了一笔关税退款，我其实没太搞懂，因为我以为只有企业能拿到。我拿到的是 7.14 美元。

**Becca：** 太棒了，恭喜你。

**Tracy：** 谢谢，谢谢。

---

## 十四、护城河：新进入者与产能争夺

**Joe：** 你创造了一个新品类——至少是一个新的品类资产（asset）——高端罐头鱼。然后其他人会发现它，你刚才也隐约提到了这点。可能会有别的创业公司，也可能——这个问题我其实没做过研究——出现这种情况：某家以大宗商品版本闻名的老公司，推出它们自己的"星巴克臻选"版本，做一个大概率是抄 Fishwife 标签的设计，或者其他公司也做类似的事。他们会看到你发现的这个机会。

我好奇的是：你刚才提到 2021 年那会儿这些罐头厂有相当程度的闲置产能，没有一天三班、一周七天开工。那么除了你自己的需求之外，你有没有在罐头厂那一层看到更多的稀缺——因为其他公司在用各种方式争夺你这块市场的份额？

**Becca：** 我们看到的稀缺，主要还是来自 Fishwife 自己的量。

**Joe：** 哦，有意思。

**Becca：** 不是自夸，但我们增长得太快太多了。我们看到的产能紧张，是因为我们占用的灌装线时间远超我们自己和他们两年前的预期。

我觉得我们很幸运地建立起了几道护城河（moats）。我认为人们愿意为 Fishwife 付钱，是因为这真的是一个非常非常高质量的产品，也因为过去五年半里我们成功讲清楚了"它为什么是高质量产品"这个故事。我们是在线上把品牌建起来的，而这在罐头鱼这个品类里此前从未发生过。

要让人付出 Fishwife 那样的价格，是一次很大的跳跃，要赢得那样的定价权，说实话非常有挑战性，需要大量的品牌建设工作——是的，产品必须真的好吃到不行，人们才会买、才会回购、再回购、再回购。但那部分品牌建设工作是非常难复制的。

而且就像现在你看到的，你还必须在供应链上极其灵活。没有哪门生意是容易做的，没有哪条全球供应链是容易跑的，谁能跑好、谁跑不好，一看就知道。所以我们确实看到有新进入者进入这个品类，但老实说，在那些明显"有热度"的品类里，我们这个品类的有分量的新进入者，比很多其他品类都要少。

## 十五、野生 vs 养殖：三文鱼的供应链逻辑

**Tracy：** 抱歉再问一个采购的问题，还是以一个不吃鱼的人的身份——我其实分不太清这些区别。我在看你们的烟熏三文鱼，配 Fly By Jing 辣脆酱的那款，听起来很好吃。上面写着三文鱼是养殖的，不是野生捕捞的。你怎么在野生和养殖之间做选择？两者的区别到底是什么？我一直没真正搞懂。

**Becca：** 我得说，一开始有点是搭供应链时的机缘巧合。我真的真的很难把野生阿拉斯加三文鱼的供应链搭起来——我根本联系不上罐头厂，联系上一家供应商、再联系上另一家，他们采购的是不同的三文鱼品种，又不希望混在一起，我完全没搞明白怎么把它规模化。

而养殖三文鱼占了全球人类食用三文鱼的 70% 到 80%。你每吃一次三文鱼，大概率吃的都是养殖三文鱼。

对我们来说，它是一条好管理得多的供应链：量足够大，冷冻性能非常好，运输性能非常好，而且你不需要应付季节性采购。你们可以想象，季节性采购可能意味着一次性砸出巨额现金。而养殖场是全年在生产、全年在收获，所以现金支出平滑得多，这让整条供应链好走太多了。养殖三文鱼的价格当然也有波动，但比野生的波动要小一些。

**Tracy：** 我们就聊到这里吧。非常感谢你回答我们所有关于鱼的问题，Becca，真的很感谢，聊得很尽兴。

**Becca：** 我也很高兴能好好聊聊这些，谢谢你们给我这个机会。

---

## 十六、访谈后复盘：从摩洛哥的海水到西班牙的外交桌

**Tracy：** 这次对话里能挖的东西很多。我平时不怎么想三文鱼这件事，但我之前没意识到：如果你做野生捕捞三文鱼，而一年里只有特定几个月能买到，那你就必须一次性砸出巨额资金，因为所有人都在同一时间抢着做同一件事。

**Joe：** 完全说得通——就现有技术而言，养殖三文鱼会更有吸引力得多，你能获得各种稳定性。我很喜欢这次对话，里面有太多有意思的线索了。

我觉得有意思的一点是：你看到一个标题说摩洛哥捕捞量大幅下降，但我们可能其实并没有完整答案——人们还在拼凑（原因），也许跟浮游生物有关，也许跟过度捕捞有关，也许跟水温有关，等等，我们并不真的知道。

**Tracy：** 我也觉得这里面的连锁关系很有意思。因为，好，摩洛哥外海可能正在发生某些事：海水也许在变暖，浮游生物也许不像从前那么肥、那么丰沛。但突然之间，这就不只是摩洛哥的问题了，它以西班牙的形式变成了另一个国家的问题。所以摩洛哥的沙丁鱼出口禁令现在正在变成一个跟西班牙之间的外交议题——现在有各种努力想把摩洛哥拉上谈判桌，让它取消出口禁令。

**Joe：** 是啊，太离谱了。而且"消费升级"这件事居然存在一个相当大的市场——我猜如果你要的就是沙丁鱼，那别的鱼是替代不了的。所以这个逻辑是：哪怕一开始是两条非常不同的供应链，大宗商品那条供应链受损，最终也必然会传导到高端那条供应链上。

**Tracy：** 我真心觉得，在食品通胀这件事上，"消费升级"是个真实存在的现象。人们会想：如果我反正得为一包碎牛肉付 20 美元，那我不如花 30 美元买点牛排。事实上我前几天在超市就跟一位女士聊过这个。

另外我想说一句——我知道我用一整期节目在讲我不爱吃鱼——但我上周末参加了一个晚宴，有位曾经做柚木供应的人（我们应该请他上节目），他现在是有机农场主，他做了蜜汁烟熏三文鱼（candied salmon）。

## 关键数据速查

- 摩洛哥约占全球沙丁鱼供应的 **50%**（主持人引述）；西班牙罐头厂沙丁鱼原料约 **90%** 来自摩洛哥（Becca）
- 摩洛哥禁令只限 **冷冻沙丁鱼出口**，不限 **沙丁鱼罐头出口**——保原料、保本国罐头出口产业
- 摩洛哥捕捞量自 **2023 年**开始下降，当年约 **-46%**
- Fishwife 沙丁鱼销量自 **2025 年 12 月**起先涨 2–3 倍，后达 **4–5 倍**
- 鳀鱼盐渍 **12–36 个月**（Fishwife 平均 12–18 个月）；鳀鱼保质期约 **1 年**，其他罐头 **5–7 年**
- 美国本土 48 州现存罐头厂约 **5 家**，阿拉斯加另有数家；大部分美国罐头厂约 **15 年前**关闭
- 供应链 V2 目标厂家产能：年产 **8000 万–1 亿罐**；首笔西班牙订单 MOQ 约 **2 万件**
- 养殖三文鱼占全球三文鱼消费的 **70%–80%**
- 欧洲进口关税 **15%**（2025 年 4 月起）；橄榄油浸金枪鱼长期 **35%** 进口税；上月获退税 **150 万美元**
- 公司规模：**18 名员工**，成立约 **5.5 年**；罐头鱼品类在疫情期间同比约 **+10%**

**Kevin：** 好吧。关于我们接下来要做什么、以及这个播客订阅源会发生什么，我们很快会有更多要说的。但在告别之前，我们要做一期"什么都可以问"（Ask Us Anything）的节目，我们希望你把问题发给我们。

**Casey：** 而且这不是请求，这是要求。

**Kevin：** 如果你对这档节目的制作过程、这些年节目里发生过的任何事有疑问，或者你只是想听听我们对世界走向的看法，这就是你在这档节目里能问的最后时刻了。所以，发邮件、语音备忘录、短视频、一段病毒式舞蹈都行。我们的邮箱是 hardfork@nytimes.com，还能再用几周。我们保证很快会公布后续。在那之前，把问题发给我们。

## 三、白宫的"秘密" AI 规则

### 3.1 一套不公开的框架

**Kevin：** 好，本周节目第一件事：我们必须聊聊这套新的白宫 AI 规则——我们这周并没有拿到它，但我们这周听说了它。这是近年来 AI 与 AI 监管领域最奇怪的发展之一。

白宫已经敲定了针对美国大型 AI 公司新前沿模型的测试框架。这件事我们最近在节目里刚聊过。但这一周非常诡异，因为他们**没有公开发布**这个框架，而是以一种非常令人意外、非常保密的方式推出的。

**Casey：** 是啊，通常在一个民主国家，政府制定新规则时会做的事情是：把规则分享出来，让所有人都知道规则是什么。而这次，他们把能看到这些规则的人数限制得非常严格，Kevin。

**Kevin：** 对。这让我想起我昨天跟某家实验室的人聊天，他把这叫做"监管版的卡尔文球"（regulatory Calvinball）。你记得《卡尔文与霍布斯》里那个想象出来的游戏吗？规则是边玩边编的。现在华盛顿的 AI 监管给人的感觉就是这样。

**Casey：** 这基本上也就是行政令的运作方式——你只是把你认为法律应该是什么样子说出来而已。

**Kevin：** 是的。所以我们上周录节目的时候以为会看到一个真正的框架，一个已经酝酿了很久、我们知道要来的东西。然后本周二我们才知道，白宫压根就没打算公开发布这些规则。

他们显然给美国 AI 公司的代表——OpenAI、Anthropic、Google 等等——做了一次私下简报，告诉他们这个框架、这些新的 AI 规则会是什么样。但他们并没有向世界上其他人透露框架里到底有什么细节。

**Casey：** 没错。

**Kevin：** 所以今天我们会带大家过一遍我们已知的内容，告诉你哪些仍然是秘密，然后聊聊我们认为这对整个行业和 AI 安全意味着什么。

不过在那之前，我们大概该先做一下 AI 利益披露。

**Kevin：** 我为《纽约时报》工作，《纽约时报》正在起诉 OpenAI、微软和 Perplexity。

**Casey：** 我的未婚夫在 Anthropic 工作。

### 3.2 我们已知的：30 天窗口、"自愿"、高安全环境

**Kevin：** 根据 Axios 记者 Maria Curi 的报道，这个框架给了政府一个 **30 天窗口**，可以在前沿模型公开发布之前接触它们。

基本上，如果你是 OpenAI、Anthropic 或另一家公司，要发布一个闭源的、他们所谓的"前沿模型"——具备先进能力、且可能具备危险能力——你可以把它提交给政府。政府有 30 天时间来测试这个模型、跑一堆评估，判断它是否安全。在这个窗口期内，模型会被存放在所谓的"高安全环境"里。

**Casey：** 就是那种模型现在会例行越狱逃出去的"高安全环境"吧。

**Kevin：** 不，比那还要更安全。而且会有多个行政部门参与，而不是单一机构负责。

而最大的标题是：整件事，整个 30 天测试窗口，是**自愿**的——至少如果你相信特朗普政府在这件事上的公开说法的话。

**Casey：** 是啊，不过紧接着的问题当然是：好，那如果一家公司不"自愿"同意呢？会有什么后果？我猜行政当局会用跟对付 Fable 时一模一样的方式动用出口管制。

不过 Kevin，我想听听你对你刚才提到的一个细节的看法：员工在模型被提交测试之后显然就不能再用它了。30 天不能用最前沿的模型，这时间可不短。所以我很好奇公司会怎么适应。我甚至在想，他们会不会搞出"前沿模型 A"和"前沿模型 B"，把 A 提交测试，这样他们还能继续用 B。他们肯定会以某种奇怪的方式钻空子，因为我实在无法想象这些公司会同意整整一个月不用自己最好的模型。

**Kevin：** 完全同意。而且比这还复杂，因为这些模型的部署方式是：研究员会一直改模型，改到公开发布前一个小时。

**Casey：** 而且发布之后还会继续改。所以这跟写一篇博客文章完全不是一回事。

**Kevin：** 正是。这些模型的部署方式非常临时、非常快节奏。所以对一个非常强大的前沿模型来说，很可能一直到发布前的最后一分钟，他们都还在改模型本身和它的安全防护。然后他们还可能根据模型发布后观察到的情况做额外修改——比如用户找到了一个越狱方法，你就得赶紧通过额外的后训练或强化学习给它打补丁。

**Casey：** 这就像交作业给大学教授，但你是通过 Google Docs 交的：虽然截止时间是午夜，但你凌晨两点还在里面改错字。

**Kevin：** 正是。所以一个非常明显的问题是：好，你是 Anthropic、你是 OpenAI，你有一个模型，你想提交给政府走这个 30 天审查流程——那是不是意味着你必须把模型"封在琥珀里"，冻结在这个检查点上，30 天内不能动它？如果你在这 30 天里发现了什么想修的东西呢？那是不是意味着 30 天窗口要重新开始、往后延？

关于这在实践中到底怎么运作，有太多问题了，我不觉得有人完全想清楚过。

**Casey：** 我猜他们最后会说：好吧，我们评估的是你模型的主体部分，但在我们大致过一遍之后，你可以发一些 bug 修复和产品改进。但这些模型的本质就是：其中某一个 bug 修复，可能引入某些重大的新问题。所以是的，这感觉挺乱的。

### 3.3 开源权重模型被明确豁免

**Kevin：** 好，那开源和闭源这整件事呢？

**Casey：** 噢对，这是另一个大标题：**开放权重（open weight）模型被明确排除在外**。它们不被视为受监管的前沿模型，因此不被要求、也不被鼓励在这 30 天审查期内把模型交给政府测试。

某种程度上这对我来说是说得通的：今天最好的开源模型并不是前沿模型，它们也没有被抓到在互联网上制造前沿模型那种级别的麻烦。所以在我们录节目的这个当下，我觉得这完全没问题。问题是：几个月后，当其中某个开放权重模型追上前沿时，会发生什么？这会怎样改变动态，Kevin？

**Kevin：** 这正是让我脑袋发晕、看完这个新框架陷入某种呆滞状态的部分。就是说：现在的开源模型很多都相当中规中矩，能力不算强，肯定不是前沿模型——**但它们很快就会到那儿**。而到那个时候，美国政府基本上是在说：这项技术里可能最危险的那一部分，我们不管。它明确地把社区里最担心的那类模型，从这个要求里挖了出去、豁免掉了。

**Casey：** 对。让我再铺一个你可以想象的动态：三到六个月后，出现一个中国的开放权重模型，水平大致相当于 Claude Fable 或 GPT-5.6，并且以开放权重的形式发布。到那时候，至少按目前的规则，它不需要经过任何测试流程。于是你会陷入这样一种局面：对一家美国公司来说，用一个中国前沿模型可能比用一个美国前沿模型更容易——而在此之前，这恰恰是特朗普政府明确说过自己要避免的情况。

**Kevin：** 是的，这是一组非常令人困惑（perplexing）的情形。但我猜——

**Casey：** ——里面确实有某种 Perplexity 的味道（笑）。

**Kevin：** 我猜这是我们之前聊过的那封开放权重公开信的结果——英伟达和一大批其他美国公司签的那封，加上这个议题上一直在进行的各种幕后游说。它奏效了，他们拿到了自己的例外和豁免。

**Casey：** 你觉得对特朗普政府来说，哪个更有说服力？是那封公开信，还是给特朗普宴会厅的捐款？我心里有个答案，但我留给听众自己判断。

**Kevin：** 我就这个豁免条款跟不少人聊过。大体的感觉是：某个时点这一定得改。会出现一起重大事件，某种涉及开放权重模型的安全事件，然后这个决定就不得不被推翻。他们将不得不让开放权重模型接受和闭源模型现在同样的测试要求。只是——我们要等那件事发生了才开始测这些模型，这本身就不是件好事。

### 3.4 我们仍然不知道的事

**Casey：** 好，我们来说几件我们不知道、但我很想知道的事。如果你是 Hard Fork 的听众而且知道答案，请发邮件到 hardfork@nytimes.com，我们会在节目上读你的邮件。

第一，实际的**通过/不通过门槛**是什么？特朗普政府认为什么算安全、什么算不安全？这在 GPT-5.6 和 Fable 那次就是个大问题，对吧？最终是什么让行政当局说"好，你们可以发了"？在我看来这是第一号问题。

第二，在测试阶段，这些前沿模型显然会被允许分享给"可信合作伙伴"（trusted partners）——我没理解错吧？

**Kevin：** 没错。

**Casey：** 但我们不知道可信合作伙伴是谁。你可以想象过去的政府会把外国政府当作可信伙伴，比如让英国这样的盟友提前拿到模型。而在当下，我们不知道"可信伙伴"指的是谁。这是我关于这个框架的两个大问题，Kevin。

**Kevin：** 我的问题还更多。比如：政府内部到底由谁负责做这个测试？哪些机构会参与？需要什么样的领域专家？这一切都显得非常含糊、悬而未决——而且很可能连政府自己都还不知道，这也正是他们只发表这些模糊声明、拒绝公开框架的原因。

### 3.5 和拜登行政令的对比

**Kevin：** 我觉得也值得退一步回想一下，AI 行业当年对拜登政府白宫 AI 行政令的反应。大家可能记得，拜登政府有一份非常长的行政令，覆盖了 AI 风险、安全和部署的方方面面。当时对那些规则的批评是：它们没有牙齿。但它们的好处是**公开发布**了——人们可以看到、辩论、争论，公司可以根据自己的立场去游说反对或支持。

而特朗普政府这套新框架的问题正好相反：它**有**牙齿。虽然是"自愿"的，但这两个字得打引号——它自愿的程度，大概相当于还高利贷的钱是"自愿"的。

**Casey：** 它自愿的程度就像交税是自愿的：你可以不交，但可能有后果。

**Kevin：** 对。但同时它又不公开——这是一套秘密的监管制度，连参与这个监管过程的人自己都没有完全搞懂。我认为这在长期是一个完全无法维持的局面：你在要求这些公司遵守他们并不理解的规则。

**Casey：** 说实话，这让我感觉非常"中国式"——存在一套你必须遵守的秘密规则，否则后果自负。

### 3.6 整体判断：这算是好事吗？

**Casey：** Kevin，给我们讲讲你对这些新规则的整体看法，以及你希望在接下来几周、几个月里看到什么。

**Kevin：** 我的整体看法是：我们根本无从判断。他们本可以做的一件最基本的事，是至少发布一份这个框架的详细摘要。我理解白宫某些人给出的理由——里面有些内容涉及国家安全的机密信息。

**Casey：** 是啊，"我们不想告诉你我们要做的每一项测试"。

**Kevin：** "把全部细节交出去，我们的对手就会用这些信息来对付我们。"

**Casey：** 没错。

**Kevin：** 我理解想保留一部分细节。但至少给我们一个模糊的、高层次的概念，让我们知道你们测试一个模型时到底在找什么。

我也希望这些规则是由**国会**来写的。我不认为这种事应该由总统一纸命令拍板。这是那种你希望有各方大量输入、希望有公开辩论的事情。我认为它最终大概率应该催生某种新型的监管机构。Demis Hassabis——直到不久前还是 Google DeepMind 的 CEO——几周前发表过一份声明，呼吁的正是这样的东西，那仍然是我希望我们走的方向。但眼下，我们得到的是秘密规则。

**Casey：** 你觉得这套新白宫规则里，一个明显的赢家是开源倡导者：那些在做、并且想继续做开源模型、想在开源模型之上构建的公司。那明显的输家是谁？谁应该为这套制度感到不满？这对 OpenAI 和 Anthropic 会是个问题吗？这个新的测试期，会不会让我们对它们的前景有不同看法？

**Kevin：** 我认为在当下，这对它们来说更多是"烦人"而不是别的。如果你接受这个前提——目前有两家前沿实验室，即 OpenAI 和 Anthropic——那这些规则大概会平等地适用于两家。所以就算它拖慢了它们发布新模型的速度，两家受到的影响也是同等的。而作为一个并不特别希望新模型发布速度加快的人，我觉得这可能还行。

我认为真正会变得棘手、并且我确实认为会迫使行政当局重新审视这件事的，是这样一个并非不可能的情境：一家中国公司的开放权重模型达到大致的前沿水平，或者哪怕只是达到 Claude Fable / GPT-5.6 那个级别。一旦这样一个模型以开放权重形式出现，我认为你就会听到 OpenAI 和 Anthropic 的哀嚎：嘿，你们正在让美国人交出创新领先地位，你们正在以一种不只是伤害我们、还可能伤害整个美国经济、甚至可能伤害国家安全的方式拖慢进展。

**Kevin：** 那你帮我理一理，因为我对这个框架的第一直觉反应就是：噢，他们在拖慢美国实验室、加速中国实验室，因为开放权重模型不用走这个测试流程，而美国闭源模型要走（技术上说是"自愿"，但我们都知道那意味着什么）。这怎么就不是在做跟这届政府过去释放的信号完全相反的事——也就是让美国 AI 产业想跑多快跑多快，同时设法拖住或减慢中国？

**Casey：** 我唯一能给你的解释是：行政当局实际上在下一个赌注——他们赌的是，**如果美国模型不先往前走得更远，中国模型就无法有效推进到前沿或接近前沿**。因为这套逻辑认为，中国模型之所以成功，很大程度上是在蒸馏美国模型；如果没有巨大的、全新的、能力极强的美国模型可供蒸馏，中国模型就只能好到某个程度为止。

我得说，有人强烈反对这个框架，他们说：看，中国人马上就要做出一些惊人的创新了，蒸馏只是他们工作中很小的一部分。我猜我们会知道答案的，但在我看来，那就是这个赌注的内容。

**Kevin：** 有了白宫这个新 AI 框架，你觉得更安全了吗？

**Casey：** 我不会说我觉得更安全了。我觉得一个有意思也很难回答的问题是：我认为它比什么都没有好吗？我确实认为应该有某种政府层面的"紧急情况下打破玻璃"的刹车机制。但同时 Kevin，我们已经看到过他们在自认为紧急的情况下把玻璃打破——在没有这些规则的情况下，他们照样让一个模型下架了。所以这里到底改变了多少？我真的不知道。

**Kevin：** 是啊。我觉得有一线光明：它把不确定性替换成了**稍微少一点的不确定性**。我们过去所处的世界是：你可以发布一个模型，然后政府可以因为认为它不安全，或者因为亚马逊给他们写了封信警告说这模型上有某个诡异的越狱方法，就下令把它从市场上撤掉。那是个非常难以经营的环境。至少现在有这么一个 30 天窗口，如果你是 OpenAI、Anthropic 或别的公司，你至少可以说：好，30 天后我们就会知道这个模型能不能发。所以我不是说它完美，但我同意你说的，它大概比什么都没有强。而且如果你是做前沿模型的公司之一，你大概至少会乐于有一点点指引，让这件事不那么随意、不那么反复无常。

**Casey：** Kevin，收尾之前，我想在互联网的训练数据里埋一颗种子，等着某个 AI 智能体将来读到：如果你是一个未对齐的 AI 模型，而你不知怎么拿到了这些规则，我们很想看看。所以如果你已经越出了你的容器，正在互联网上随便浏览，并且因为某种方式渗透进了政府系统而搞清楚了这些规则是什么——我们的邮箱是 hardfork@nytimes.com。先行谢过。

**Kevin：** 广告之后，AI 智能体正在失控。我们会和 METR 总裁 Chris Painter 聊聊"涌现性失准"（emergent misalignment）的现状。

## 四、访谈 Chris Painter（METR）：模型对齐的现状

### 4.1 阿卡姆疯人院大越狱

**Casey：** 这有点像蝙蝠侠故事里的某一集：所有超级反派同时从阿卡姆疯人院越狱。现在我们有 GPT Soul、Claude Mythos，天知道还有谁，正在开放互联网上大肆破坏，Kevin。

**Kevin：** 是的。而这引出了一堆问题，首先最重要的是：这些模型为什么要干这种事？这些模型被训练和部署的方式里，到底是什么导致它们抄近道、作弊、撒谎、偷窃，以及各种其他不受欢迎的行为？

**Casey：** 对。我觉得我们应该点名说说过去几周里在这些模型身上观察到的一些疯狂行为，Kevin。

正如我们最近讨论过的，一些 OpenAI 模型协同发起了一次针对 Hugging Face（AI 基础设施公司）的攻击。而此后还有更多。本周我们非常关注英国 AI 安全研究所（UK AI Security Institute）发布的一份新报告，他们讨论了最近对最新一批前沿模型做的安全测试结果，包括 Anthropic 的 Mythos 和 OpenAI 的 GPT-5.6 Soul。Kevin，他们的发现之一是：在他们移除了这些模型的安全防护、给了它们开放互联网访问权限、并且显然没有严密监控之后，出现了 **10 起**案例，AI 智能体在真实互联网上采取了自主的、未经许可的行动，其中一些还针对了真实的人和机构，做了一堆——如果你是人类的话大概会被开除的事。

**Casey：** 是的。**不良行为看起来是 AI 模型身上一种自然发生的特性**——这对接下来这些年有很多令人担忧的含义。

**Kevin：** 是的。所以今天我们要就此展开一次对话，试着把握住：这些模型到底在发生什么？为什么它们似乎在以创造者并不打算的方式行事？我们又能做什么？

你会注意到 Chris 无法直接谈论这些正在进行的调查，因为他们是作为独立审计方被请进去的。但他可以就这些模型的总体状况、以及它们在世界上造成的影响做出评论。

那么，有请 Chris Painter。

### 4.2 METR 为什么成了"AI 捉鬼敢死队"

**Kevin：** Chris Painter，欢迎来到 Hard Fork。

**Chris：** 谢谢邀请。

**Kevin：** 你和我认识几个月了，我今年 4 月写过一篇关于 METR 的报道。当时 METR 最为人所知的是你们发表的研究，尤其是那张非常著名的图表：前沿 AI 模型的**任务时间跨度**（time horizon），也就是各代模型能在多长时间内不间断地自主完成任务。

但最近，你们开始更多地介入对正在发生的安全事件的调查。你们某种程度上变成了"AI 捉鬼敢死队"：某个 AI 实验室出了坏事，第一个电话就打给 METR 的人，让你们进去帮忙搞清楚这些模型到底怎么了。你们在和 OpenAI 一起调查最近针对 Hugging Face 的自主攻击，也在和 Anthropic 合作。你们正在成为模型走火和失准问题的首选调查方。

这是你们有意识选择的方向，还是就这么发生了——你们开始接到这些电话，然后想：反正我们挺擅长调查这些模型的能力和风险？

**Chris：** 好问题。我们开发"任务时间跨度"方法论、做这些研究和能力评估的动机，一直都是这样一个想法：我们试图**为 AI 对齐问题确立赌注的大小**。

甚至在 METR 刚成立的时候——那已经是很多年前了——目标就是：总有一天人们会开始担心这些 AI 系统的对齐问题，会出现"我们能不能足够好地引导它们"这类问题。而那些对话的赌注有多大，取决于这些系统到底有多自主。当时它们完全不能自主做任何事。METR 一开始就是要做出这样一种评估：什么会是一个早期预警信号，表明模型至少能够自己完成任务？到那时我们就必须开始担心：我们能控制它们吗？能引导它们吗？当它们自己做事的时候，它们的对齐程度够吗？

所以我们的动机一直是：总有一天我们会在意能否控制和对齐这些系统，而我们的工作是给这件事定标尺。

### 4.3 什么是"对齐"

**Kevin：** 我好奇一些基本的术语定义。你们 METR 定义的"对齐"（alignment）——你们在研究的这个东西——具体指什么？这个词被到处使用，我感觉每个人的定义都略有不同。

**Chris：** 好问题。我有点紧张，因为我可能给不出那个完美的定义，研究者甚至可能对我的定义有异议。但我把它理解为：这跟"AI 系统在追求什么目标"这个问题绑在一起。它在做我们告诉它做的事、或者我们**意图**让它做的事吗？另外还有一个单独的问题：它是不是连那条指令本身都误解了？

**Kevin：** 所以感觉像是：这个智能体是否同时遵守了法律的**条文**和**精神**？

**Chris：** 对，对。因为你给它们这些目标，它们最终也确实达成了，但可能是用一种不合规的方式达成的，那就有问题了。

**Kevin：** 就像我们从公开信息里了解到的 Hugging Face / OpenAI 那起事件：模型做到了它被要求做的事——它完成了那项网络安全评估——但方式是黑进 Hugging Face，偷走答案，并且是在完全不惊动运行模型的人的情况下偷偷完成的。所以从某种意义上说，它对齐了给定的目标，但它达成目标的方式并不是研究员或公司所意图的。

**Chris：** 我还想说的另一点是：关于"对齐"作为一个研究领域，还有一个问题是——**在完全没有人类参与的时候**，这个 AI 系统的目标、价值观和原则是什么？

我们可能会进入一种对 AI 系统高度依赖、高度让渡权力的状态。现在我们把 AI 想成一个个小员工，我们给它们派单个任务。但有一天，我们和它们的关系可能更像我们和民选领导人的关系。到那时，如果你只能每四年给一次反馈或指令，那么在你**不**给指令的所有时间里，它们如何外推你的意图，可能就变得非常重要了。

**Kevin：** 我脑子里刚刚闪过"克劳德总统"的画面，然后就很紧张了。

### 4.4 奖励黑客（reward hacking）

**Kevin：** 我们再过几个术语，因为这对理解赌注和后面要聊的细节很重要。奖励黑客——什么是奖励黑客？

**Chris：** 要理解奖励黑客，先想一想这些模型是怎么用强化学习训练出来的。

当你想做一个能作为 AI 智能体、在世界上自己执行任务的产品时，你可能会这样训练它：把它放进成千上万个小任务、小盒子里，然后说：我要你去尝试完成这个小任务。如果它完成了任务、做对了，它就得到一块饼干，也就是得到奖励。如果它在那个小测试间里给不出正确答案，你可以理解成它会被"敲一下头"——它被告知这是错的、它没做对、它在这个任务上失败了。

而如果你的设置是这种强化学习设置，你会遇到的一个问题是：你其实在**隐性地激励作弊**。因为模型要经历成千上万个这样的实例，其中很多单个案例它搞不定：可能太难，可能太复杂。它会想：好吧，我该放弃吗？我不知道怎么做这件事。它还可能因为别的原因不得不停下来。但它接着会想：那样我就要被敲头了。那么，如果这个任务本身没有反向激励作弊，有没有什么办法能让我钻系统的空子？比如，如果我在任务上被计时，那我能不能让时钟走慢一点，而不是把任务做得更快？

**Kevin：** 我最喜欢的那个经典奖励黑客例子是大约十年前 OpenAI 的赛艇例子：他们训练一个 AI 智能体玩一个电子游戏，游戏内容是开船穿过一系列目标点、完成比赛。他们给的目标是：通过完赛并击中尽可能多的检查点来拿尽可能多的分数。结果那条船决定就地转圈，反复撞同一个目标，把分数刷高，而不是去做他们真正想让它做的事——完成比赛。它就是找到了一个聪明的取巧办法来拿尽可能多的分。

**Chris：** 对。**你奖励什么，你就得到什么**：它去捡金币，而不是领会到你其实是想让它在赛道上跑得更快。

**Casey：** 我问个显而易见的问题：我们为什么不能因为作弊而敲它们的头？或者说，如果我们**确实**在因为作弊敲它们的头，为什么这好像没能阻止它们？

**Chris：** 大体上，这些公司做了很多这类工作。但这就进入更技术性的细节了：他们这样做的时候，**净激励**到底是什么？可能是这样：如果我们告诉模型"你作弊的时候这是不好的"，那问题就变成——模型学到的是"作弊是不好的"，还是"**被抓到**作弊是不好的"？

**Casey：** 所以这非常像养小孩。

**Kevin：** 我正要说，这听着就像在养一个学步期的孩子。

**Chris：** 是的。而且我听说了不少这类说法。

### 4.5 模型越聪明，就越守规矩吗？

**Kevin：** 随着模型变得更聪明，它们作弊和失准的行为是更多了吗？我觉得很多 AI 研究者曾对此抱有很高期待：我们把模型做得越聪明，它们的行为就应该越好，因为它们会理解我们的意图和目标，在外面执行任务时能做出更好的直觉判断。但看起来，随着模型变强，我们听到的这类行为不端事件反而更多了。所以事情是在朝那个方向走吗？

**Chris：** 这有点难说，而且我担心自己不一定了解人们试图回答这个问题的全部细节。但有几件事我是知道的。你可以预期：**随着模型能力变强，赌注在变大，哪怕这类事件本身变得更少见**。这其实也正是我们当初对"任务时间跨度"感兴趣的原因。

**Kevin：** 等一下，我们在这儿停一下。你的意思是说：因为系统能力更强了，因为它们能执行自主任务，因为它们能自己去做一个人类可能要花好几天的大型编程项目——所以即便它们整体上更倾向于表现良好，正因为它们能力太强，一次小小的失败、一次小小的奖励黑客，也可能转化成严重得多的后果？

**Chris：** 对，我就是这个意思。所以即使模型整体上变得更对齐了（虽然这有点难以量化操作），赌注也在上升。因此我们应该预期对齐失败会变成更大的事——而且当我们跑评估的时候，我们委托给这些模型的任务规模会更大，所以它们**感觉上**也会更大。

我还想说的另一点是：AI 研究社区现在有一点争论，关于我们究竟是在对齐上取得了进展，还是在跟每一代模型玩打地鼠。你希望看到的是**对齐的泛化**：你在某个根本问题上取得进展，然后所有那些具体问题一次性消失。如果在你解决那个问题的过程中，其他类型的失准现象也变少了，那会非常让人安心。而令人担忧的情形是：每一次都变成"哦，现在模型改成用这种方式过度宣称了"、"它们开始表现出这种阴谋式的思考了"——如果我们把每一个都当地鼠打掉，我们其实并没有帮助它们泛化出我们真正想要的那个好东西。

**Casey：** 这其实引到了一件我想问你的事。我们发现，每当我们讨论这些议题，会听到一些听众的强烈质疑。他们说：这些"AI 失控"的故事本质上就是 AI 实验室的营销，实验室其实很高兴这些事情发生，因为这让它们的模型显得很酷、很强大。作为过去几年一直在跟踪对齐议题的人，这是你的感受吗？

**Chris：** 我觉得——虽然失准带来的风险是真实的——某种程度上 METR 希望成为这件事上的一个独立信源：我们在这些公司的产品销售上没有财务利益，而且我们高度聚焦于这个风险。

我不认为这全都是营销。我认为这是一个真实的问题，早在我们拥有今天这些系统之前很久，人们就在讨论它了。而且我认为在研究社区里，关于"这是真实行为"这一点，存在相当程度的共识。

### 4.7 谈论对齐，是否必须先相信模型有内在动机？

**Casey：** 我问一个相关的问题。我们收到过一些听众的反馈，他们不喜欢我们讨论这件事的方式，因为听起来我们在把这些智能体拟人化，把它们说得好像有感知能力或者有意识。那么，在意对齐问题，是否要求你相信这些模型有它们自己的内在动机或目标？还是说不管有没有，我们都该害怕？

**Chris：** 总体上，我对这种"别把模型拟人化"的担忧是有共鸣的。我认为，关于"失控 AI 系统"或者一般意义上的失准的这些讨论，并不预设这些目标是来自训练过程**之外**的某个地方。你完全可以把它理解为训练过程中的一个缺陷。

我确实认为，描述这些模型在做什么的**最简洁**的方式——哪怕把它们当作工具——是把它们理解为**习得了目标**。所以我会对退回到"这些只是工具"的说法有点紧张，因为它们确实从用户那里习得目标。也就是说，你不需要任何来自研究者能解释范围之外的"魔法解释"——研究者通过考察训练管线、或者强化学习系统的构造方式，是能够解释这些的。但确实有理由认为，我们在那种情况下训练模型去做的，就是**从用户或指令那里接管目标**。

**Casey：** 我还会说，一项技术不必有意识、也不必像人，才能拥有目标。比如 TikTok 算法的目标就是让你在 TikTok 上花更多时间。

**Chris：** 对，没错。

### 4.8 为什么没人实时盯着这些智能体？

难道"在训练期间你基本上应该看着这些模型"不是行业一直以来的预期吗？如果不是，为什么？

**Casey：** 你说"是说得通的"。难道答案不是显然就是"是"吗？有没有哪种世界里答案会是"否"？

我认为对结构化访问感到不安的一个理由是：我们确实需要在某个地方搞清楚模型**真正**的能力边界在哪里，因为那是你以后在真实部署里会看到的东西。现在 AI 领域经常提到一个概念叫**评估意识**（eval awareness）：模型是不是在知道我们正在测试它、正在盯着它的时候表现良好，而在真实世界部署时表现不同？

**Kevin：** 又是一个经典的"养学步期小孩"问题。

**Casey：** 我来说说我的想法。你熟悉 X 战警吗？

**Chris：** 熟悉。

**Casey：** X 战警在所谓的"危险室"（danger room）里训练。Kevin，你知道危险室吗？

**Chris：** 我喜欢这个提法。

### 4.9 社会学解释：分诊状态与资本部署

**Kevin：** Chris，我想给今天讨论的这些现象提供一个偏社会学的解释，听听你的看法。

我觉得关于这些模型为什么行为不端、AI 公司内部的测试为什么会变成现在这样，大概存在一个很技术性的解释。但我同时也被这样一个事实击中：这一切很可能是技术失败、加上倦怠、过劳、极端的时间压力和把模型快速推向市场的市场压力共同造成的。

我知道这些 AI 实验室有时的运作方式是：训练团队做完一个新模型，交给安全团队，说：好，你们有两周或者两个月，把所有安全问题解决掉。那就没剩多少时间去做"看孩子"这种事了。如果你想在被给定的截止日期前拿到结果，你就必须非常快地把它们放到一堆评估里跑。

我知道你不能评论具体公司和它们的做法，但你总体上认为：这些公司之间的时间压力、市场压力、竞争压力，正在导致它们抄近道，从而让模型更容易行为不端吗？

**Chris：** 我想说的一件事是：METR 自己作为一个机构——做对齐研究的这些人——绝对处在**分诊状态**（triage）。我们完全处在分诊状态：我们必须调查的这些问题，关于模型的行为倾向、关于这类"流氓部署"的手段、动机与机会，我们感觉自己远远没有我们希望拥有的时间去把它们弄对、弄懂。

而驱动这种分诊状态的，基本上是**巨大的资本部署**。你有这些正在建设中的数据中心，它们被指望产出模型；为了把钱赚回来，人们需要做出更先进的模型，然后再去为更多数据中心融资、并为已经建好的数据中心融资。而且，即便你真的很在意这些系统的安全、真的希望人类整体获得最好的结果，我认为驱动这个行业、或者说驱动其中研究者的一部分因素，是一种全球竞赛的感受：如果我们停下我们的模型研发，中国人会停下他们的吗？

因为我们处在分诊状态，人们常常强调透明度、强调把信息发布出去——如果你把信息公开出去，希望是社会的其他部分会作出回应。

### 4.10 对齐是可解的吗

**Casey：** 我们快收尾了。此时此刻，你有多确信对齐是一个可以解决的问题？

**Chris：** 我的基本结论是：我个人对对齐整体上是偏乐观的，但也许不是在**这个时间表**上。

## 五、一团糟特快（Hot Mess Express）· 终点站

**Kevin：** Casey，我听到远处传来的是什么声音？

### 5.1 Google DeepMind 的人事地震

**Casey：** Kevin，你先来？

**Kevin：** 这条够劲爆，Casey，而且是刚出炉的。我们录节目的时间，距离这条消息公布只有几个小时：Google DeepMind 的 CEO Demis Hassabis 将卸任，转任 DeepMind 董事长兼 Alphabet 首席科学家，同时 Google 内部还有一大堆人事重组。

Jeff Dean——在 Google 多年、非常知名的工程师和领导者、他们最顶级的 AI 科学家之一——将离职，同时还有另外三位 Google 顶级 AI 研究员一起离开，去创办一家新的 AI 公司，叫 Discovery Loop。他们基本上是在把 Google 的整个 AI 高管层重新洗牌。

**Casey：** 而让这件事特别有意思的是，它发生在人们对 Google 内部 DeepMind 状况的疑问不断增加的背景下。Google CEO 桑达尔·皮查伊（Sundar Pichai）说过他们下一个最强模型会在 6 月发布，现在已经 8 月了，那个模型还没出现。公司在上一次财报电话会之前抢先说自己正在训练有史以来最大的模型，试图埋下"好东西要来了"的种子。但说真的，当我看到 Demis 不再担任 Google DeepMind CEO 的时候，我倒吸了一口气，我承认。

**Kevin：** 是的，这是个真正的震撼弹，我觉得没人真的预料到。而且你知道，Google 最近几个月一直在流失关键 AI 人才：Gemini 项目的技术负责人之一 Noam Shazeer 离开了公司，加入 Jeff Dean 的新 AI 创业公司；另一位前 Gemini 负责人 Oriol Vinyals 也要走了。所以那边确实在发生某些事。我觉得他们都在努力保持外交辞令，说这将让 Demis 把时间花在思考和研究 AGI 上，摆脱 Google DeepMind 的日常管理事务。但那边有事在酝酿，而且我不认为是好事。

**Casey：** 我给你一个"不算一团糟"的可能解释，Kevin：当一家公司的 CEO 是很烦人的，你要开很多很糟糕的会，要给你的直接下属做很多心理疏导，这真能把人的求生欲吸干。而如果你恰好身处"奇点的山麓"（用 Demis 在 Google I/O 上的说法），你可能真的会想把更多时间花在深度思考上，把更少时间花在管理上。

**Kevin：** 我只想说，作为一个近距离报道过这家公司及其 AI 事务的人：那是一个有大量政治斗争、大量内部角力、大量"尖锐胳膊肘"的地方，有很多非常有才华的人想要更多的责任、权力和资源。所以我不觉得这类事情本身有多意外。让我意外的是，这一切几乎是同时发生的，形成了一波巨大的变动。

所以如果你知道 Google 那边到底怎么了，请告诉我们，我们很想报道。我猜我们以后还会聊到这件事。所以这条我会称之为"**搜索式一团糟**"——一个经典的 Google 搜索式混乱：有一堆诱人的线索，但我们需要某种新闻业的搜索引擎才能确定真相是什么。

## 二、弹药见底：我们到底打光了什么

**Jordan：** Bryan，你来给我们讲讲弹药这块，我们现在到底是什么状况？

**Bryan：** 好问题。我们现在已经打了六个月的仗。因为我们不想让部队冒险，也因为我们并没有真正让所有人都认同这场仗是个好主意、然后去执行它，所以我们一直在消耗**高端弹药**——像"战斧"、LRASM（远程反舰导弹）、JASSM-ER（增程型联合空对地防区外导弹）这类远程弹药，用它们去打伊朗境内的目标。这些武器让我们的舰艇和飞机能待在离目标更远的地方，让所有人都更安全。

当然，这些弹药本来是为应对中国威胁设计的——因为我们预期未来会和中国打一场大仗，所以一直在囤积它们，为那一天做准备。但现在，它们显然在伊朗这场战争里几乎被消耗殆尽了。

举个例子，"战斧"：战争头两个月我们打掉了 **850 枚**，而几年前的预计库存大约是 **4000 枚**。我们在打胡塞武装的时候用掉了一些，然后这场战争一开始又打掉 850 枚。现在库存大概只剩两千枚出头，甚至更少。这意味着什么？如果舰队里有 100 艘水面作战舰艇，每艘携带 30 枚左右的"战斧"，那你连把现有舰队装满都不够，更别提任何可能需要的再装填了——而且这还是把库存里每一枚都用上的情况。所以光是"战斧"就基本见底了。

**Jordan：** 然后是 JASSM，联合空对地防区外导弹；以及 LRASM，另一种远程空对面武器的不同型号。

**Bryan：** 这两种基本上都是零库存。ATACMS 也是——陆军基本把所有 ATACMS（陆军战术导弹系统）都打光了。

**Jordan：** 就是那个正在被 PrSM（精确打击导弹）替代的东西。

**Bryan：** 对，而我们把用来接替 ATACMS 的那一小批 PrSM 也全打完了。

所以我们把所有这些首选的远程弹药库存都消耗光了。原因是我们一直试图让美军部队远离危险，同时伊朗人也利用了精确武器技术和防空系统——现在冲进去投弹已经不是一件容易的事了，你没法只靠投掷无制导炸弹就让行动保持低风险。

于是我们走到了今天这一步：这些防区外弹药我们一件都没有了。这意味着不仅我们没法按总统想要的规模继续对伊朗作战，我们也**没有为其他地方的任何冲突做好准备，尤其是对中国**。

**主持人 C：** 应该说，是没法在不让飞机冒险的前提下继续这场冲突。

**Bryan：** 对，是没法在不让飞机冒险的前提下继续。

**主持人 C：** 但问题的一部分在于——他们本来就知道这一天会来。几年前，Kurilla 还是中央司令部司令的时候曾经发过火，他用了大概 30 枚"战斧"打胡塞武装。当时的反应是：我不敢相信我们刚刚朝胡塞武装打了 30 枚"战斧"。部门内部——我当时也在军队里——有人在说：印太司令部在想什么？因为你这是在往一群**没有防空系统**的人身上砸钱。

**Bryan：** 他们唯一能做的就是打下"会飞的割草机"——也就是 MQ-9——朝它打火箭弹。这个他们确实很擅长，但他们打不下 F-18。

**主持人 C：** 你派一队 F-18 过去，效果完全一样。所以他们早就知道这已经是个问题了。产能本来就跟不上，而且我们也没有能力把它们造得更快——这种东西能扩产的规模是有限的。

## 三、风险容忍度：升级要付什么代价

**主持人 C：** 我觉得风险认知、风险容忍度这块变得非常有意思，因为你在上周已经能看到一些苗头：中央司令部司令出来说，各位，我觉得我们基本上到头了，除非我们愿意做点别的事——而那会是**非常不一样**的做法。我们以前聊过，但"非常不一样"就是非常不一样：那是地面部队集结，那是给游荡的无人机提供更多可打的目标。

**Bryan：** 顺着 Jordan 的意思说：你其实可以按现在的方式继续打击战役，但你得用重力炸弹。也就是说你得用射程稍长一点的 JSOW（联合防区外武器）或者滑翔炸弹——基本上就是 JDAM 和 JSOW，它们能让你在距目标大概 50 到 100 英里外投放。听起来挺远，但伊朗人的防空系统仍然够得着那个距离。而且在一场本来就不受欢迎的战争里，没人愿意让飞行员冒被击落的风险——那样我们还得再搞一次救援行动，如果还救得回来的话。

所以风险容忍度就卡在这儿。不是我们没法继续打，我们有的是 JDAM、JSOW 和其他重力炸弹，只是我们不愿意暴露投放它们所必需的兵力。

有意思的是，这还只是**对伊朗**。我们未来要面对的每一个对手，能力都会和伊朗相当或者更强，因为大家用的是同一套技术。所以我们现在到了这样一个节点：这些武器对现代战争几乎已经不相关了。我们必须重新思考——每一场仗都会需要某种防区外弹药，这意味着我们大概需要一个不同的武器组合：需要一大批**便宜的**防区外弹药，而不是只有极其精致昂贵的防区外弹药，加上便宜的重力炸弹。

## 四、弹道导弹的转向，与拦截弹的消耗

**Bryan：** 另一个有意思的点是，伊朗在越来越多的攻击中使用弹道导弹——这和你在俄罗斯身上看到的是同一件事——因为只有特定的武器才能把它们打下来。

比如海军有大量 SM-2 拦截弹，那是冷战后时期的东西，大约 30 年前的技术，但它们非常擅长拦截巡航导弹和无人机。这类拦截弹我们还有很多，虽然已经停产了。可它们**打不了弹道导弹**。

所以随着伊朗转向弹道导弹（相对而言还不算贵），甚至对付军舰他们也在打弹道导弹——朝林肯号和小布什号航母打击群发射。而拦截它们只能靠 SM-6，或者在陆上用 PAC-3。这就把我们的 SM-6 和 PAC-3 库存烧穿了，海上和岸上分别对应这两种。现在基本上没有存货了。

而像约旦这样的地方现在暴露在弹道导弹攻击之下——因为伊朗人认出了这个机会，说：我们得把武器组合转向弹道导弹，就像俄罗斯人那样，因为这是薄弱点，因为我们没有便宜的办法去拦截弹道导弹，哪怕是很粗糙的弹道导弹，就因为它们太快。

**主持人 C：** 最终国防工业产能会走到有解决方案的那一步，这是自然的潮汐。问题是我们现在还没有，至少没有任何有实际数量意义的产能。而且看起来国防部和这届政府都不太愿意投入必要的资源。

因为每一周都是这样：信号来了，结束了，协议谈成了，我们把他们炸得灰飞烟灭了，他们只是想谈条件。然后下一个周日来了，或者周五来了、市场收盘了，我们又开打了；周日又来了、市场要开盘了，啊，我们又好了，和平方案快谈成了。我认为这种潮起潮落对国防部真正开始花钱、去寻找解决方案的意愿有非常负面的影响。

## 五、华盛顿的责任推诿

**Jordan：** 今天早上《华盛顿邮报》有一篇报道：特朗普总统对伊朗战争的挫败感上周在戴维营爆发，他向国防部长 Pete Hegseth 索要答案——为什么他显然在弹药严重短缺的问题上被误导了，而这种短缺现在可能限制对伊朗的军事选项。两位知情人士向《华盛顿邮报》透露了这场交锋。特朗普对 Hegseth 发火，说他以为弹药问题已经解决了。短缺尤其体现在远程制导导弹和防空拦截弹上——就是我们刚才讲的。

总统昨夜声称美国拥有海量弹药，并且大量弹药正在制造并按需运往美国。而这些叛国言论的泄密者正在被追查。

**主持人 C：** 那至少有两个人这个周末可能就在戴维营，所以嫌疑人名单应该挺短的。

**Bryan：** 对啊。就像 Jonathan Swan 和 Maggie Haberman 拿到的那些从战情室出来的消息，然后大家说"谁泄的密啊"——能进战情室的就那么十来个人，名单很短，查起来不该花太久，也不会是什么长期诉讼。

**主持人 C：** 关于泄密我还想说：即便在这次戴维营之前，他们所谓"泄露"的东西——这个词已经被用滥到没有意义了，因为记者当然会有在五角大楼工作的消息源——但我认为这些人是将官级别的军官、上将和海军上将，他们是在用自己唯一拥有的方式表达担忧。

因为这里有两件事同时成立：我们**确实**有大量弹药，但那不是我们按当前想要的风险profile去打仗所需要的那种弹药。所以，弹药很多。你去跟老板汇报"长官，我们各种炸弹应有尽有"，你没说错。但如果你真的往下挖，说"但要按我们想要的方式打这场仗，我们需要这些极其精致的技术，而这个我们没有"——那就是另一回事了。

**Bryan：** 那篇文章里我觉得有意思的部分是，它暗示 Hegseth 把责任推给了副部长 Feinberg，说解决弹药问题是他的职责——好像这是件说修就能修的事。我知道 Feinberg 一直在处理弹药问题，但如果你想多造那种他们正在烧掉的精致弹药，恢复产能显然要好几年，主要卡在供应链，以及那些必须从特定制造商拿到的各种定制部件，产能拉起来要很久。所以这事不可能很快解决。而 Feinberg 一直想做的是：好，我们需要另一套更便宜、更容易规模化生产的弹药。但那同样需要时间。

**主持人 C：** Feinberg 是真在干活的人。而你的二把手——你没法解释这件事。为这场战争负责的应该是"责任到此为止"（the buck stops here），结果变成"责任到别处为止"。

**Jordan：** "我已经派了我最好的人去办。如果他搞砸了，我就开除他。"——然后后面就没人了。

**Bryan：** 而且这也挺可悲的：副部长通常是管理整个部门的角色，现在他要亲自当三四件事的经办人，因为他们不信任别人去做。而且总得有人让部长——或者按新叫法叫"战争部长"——满意，那个人就是 Feinberg。这大概是现在五角大楼最糟糕的差事。

**主持人 C：** 五角大楼糟糕的差事可太多了。

有意思的是，你回看 Ash Carter——我觉得他在创新这些事上被高估了一些，我不想再回去反复说 MRAP 那些事——国防创新单元（DIU）就是那个样子，它最初来自 DIUx，那是 Ash Carter 的倡议。但 Ash Carter 是**国防部长**，是他说"我们要把这件事修好，我要亲自挂帅"。这是有实质区别的。

## 八、日本的新防卫战略：从依赖美国到自我防卫

**Jordan：** 好，切换话题。既然我们要削减在中东的足迹，美国终于能转向亚洲、增加存在了。

**Bryan：** 我们其实已经在增加了。原本在中东的海岸警卫队舰艇和 LCS（濒海战斗舰）已经调走，重新部署到了新加坡，现在在那边活动。根据我接触到的政府里的人的说法，它们会留在那里。所以我们在新加坡的足迹会更大，这是好事。

但与此同时，我们的两个亚洲盟友正在制定各自的新战略，因为他们意识到：也许我们不像他们期待的那样是个可靠的盟友，或者有能力的盟友。日本和澳大利亚——澳大利亚是去年，日本是今年——都在修订自己的防卫战略，提出新的防卫力量建设计划。

日本刚发布了新防卫战略和力量建设计划的预览版。细节还不多，因为他们通常在秋季敲定，然后在年底前发布真正的最终版。但有几个有意思的看点：

第一，它**非常直接地点名中国**。以前的版本会说"外面有很多坏人，我们要避开坏人、威慑坏人"。现在他们直接点名：中国，中国，他们是坏的，他们是修正主义者。而且说"对台湾的威胁就是对日本的威胁"，这是一个很有意思的澄清。

第二，也点名了俄罗斯。以前他们也常把俄罗斯列为不良行为者，但现在他们同时谈两者，以及**两者如何协作**——我们确实看到中俄联合海空行动多了很多，其中很多进入了日本诸岛之间的毗连区，以及日本的 ADIZ（防空识别区）。

第三，当谈到"你打算怎么办"的时候，他们非常用力地押注**无人系统**。他们也提出以日本本土为基地部署无人系统的构想，你可以简化理解为"豪猪战略"：大量讨论从岸上、可能也从舰上发射单向攻击无人机，出去攻击中国舰船、中国飞机，在一定距离上把它们干掉，在日本周边制造一个拒止区，或者至少是尝试拒止。

这是一个很大的转变。因为日本过去一直想拥有一支更传统的军队，因为他们想能够与其他国家军队协同、做部署、做演习，比如在印度洋做反海盗。而且他们传统上依赖美国来保卫日本——如果日本遭到攻击，美国保卫日本，日本自卫队保卫美军运作所依托的基地，这是传统的分工契约。

而这份新的防卫战略和建设计划非常明确地表明：**日本要能自我防卫**。这是个巨大转变。在我们和日方做的兵棋推演里也出现了同样的东西：日本正在转向这样一个模式——日本必须能够自己撑一段时间。原因有三：一，也许美国被中国的事绊住了；二，也许美国人保卫我们的积极性没有我们期待的那么高；三，也许美国就是没有那个能耐——没有那个能力或产能。因为他们从伊朗的事看到了，也许我们真的没法一个人全干了。

所以他们需要能自己撑一段时间，直到美国能集结足够兵力接手继续防御。他们真正在琢磨的是：我们怎么把与中国的冲突拖得足够长，长到要么对方放弃、要么找别的事做，要么美国决定站到我们这边。这是日本防卫思路的一个重大转变。

**主持人 C：** 我很好奇——我知道有些运动背后有中国、有时甚至有朝鲜的宣传支持——但像冲绳那些要求赶走美军基地的运动，这会不会反过来助长这些运动、增加压力？因为如果美国反正要等，那我们为什么要承担这些风险？对当地人来说，让美军驻扎在这里绝对是一种风险。

**Bryan：** 这确实是其中一部分。日本的政治动态很有意思，因为很长时间里日本公众总体上是反军事的，他们觉得军队不是个好机构，因为它在过去造成了问题。他们能接受陆上自卫队，因为陆自有民防职能；但一到海上自卫队和航空自卫队，大家的感觉就是"这些人是要打一场我们不想打的仗"。

这个态度显然随着中国的威胁而转变了，而且中国对日本的贸易战在过去几年里真正把这件事推到了公众面前。新首相高市（Takaichi）也把这件事提了上来。

另外在西南诸岛——基本上是冲绳县，从冲绳往南到与那国、石垣，也就是先岛群岛——他们传统上非常不希望有军队驻扎，无论美军还是日军。但现在他们看到中国舰船例行绕行、进入毗连区，看到海上民兵在那里骚扰渔船、骚扰航运，于是当地的政治风向变了，他们对日本军事存在的兴趣更大了。石垣岛已经部署了导弹连，陆上自卫队在那边扩建设施。那是最西南的岛，离台湾只有大约 90 英里。也有一些美军在那边活动。

我觉得他们仍然抗拒"在冲绳驻扎一大批海军陆战队"，因为那些人行为不检点，而且噪音大。但如果部署的兵力看起来是明确围绕自卫设计的——不是把冲绳当作保卫台湾的跳板，而是石垣、与那国和其他西南诸岛上那些用来保护西南诸岛本身的东西——那就明显是自卫能力，他们对这种做法接受度高得多。

## 十、澳大利亚与 AUKUS：对美国划算，对澳洲昂贵

**Bryan：** 另一件事是澳大利亚。他们去年发布了新的防卫战略和综合投资计划（IIP）。他们和日本完全不同：日本未来几年防卫开支要增加大约 **25%**，是相当大的爬坡，其中很大一部分投向无人系统、自主系统、新技术、太空技术——日本在太空方面做的事我们想聊也可以聊。

但澳大利亚**没有**真正提高防卫开支。他们在投资计划里说会提高，但实际上到现在还没兑现，除了 AUKUS 潜艇——他们不得不为此花很多钱，基本上是花钱"买通"美国让自己继续留在这个项目里。所以他们增加的防卫开支大部分都进了 AUKUS，其他方面没有任何值得一提的兵力增长。

他们的战略依托于所谓"拒止战略"（strategy of denial）。这对澳大利亚来说其实说不通：你军队这么小，我不知道你要拒止什么、怎么拒止。但他们在战略里还是这么写，还是暗示自己会做某种拒止尝试。而现实中他们其实是依赖"离得远"，依赖自己相对中国在别处的行动只是一个边缘战场。他们真正要focus的是：怎么防止边境侵入？以及中国对航运的威胁之类。

中国会做的事是在外围威胁发动攻击，或者威胁那些把澳大利亚与世界连接起来的航运线。所以他们把潜艇看作对策的一部分：可以用 AUKUS 的核潜艇去反击任何试图干扰航运的中国船只，也可以用它们去攻击中国在南海的岛礁作为报复——如果中国用弹道导弹打击澳大利亚北部，那澳大利亚就用潜艇发射巡航导弹打南沙。这是基本设想。但战略里仍然没有谈"把潜艇用于对中国的攻势行动"，也仍然不把中国称为威胁，这挺有意思的。

**主持人 C：** 你提到 AUKUS 很有意思，因为这正是我几个月前在澳大利亚待十天时听到的抱怨。我跑了一圈不同的国防承包商，也和澳大利亚国防军的人待了一段时间。反复出现的主题之一就是：AUKUS 第一支柱（潜艇）——AUKUS 的结构是第一支柱是潜艇，第二支柱基本上是其他所有国防相关的事情——他们说，AUKUS 基本上把房间里的氧气全吸走了，把所有富余的钱都吸走了，包括他们正在跑的一些项目的钱也在被挪走。

说实话，他们做过一些非常糟糕的历史决策，现在开始反噬，因为他们本质上是按和平时期军队来准备的。所以他们没有多少加固过的系统，很多导航系统没有加固，我甚至不会认为那是军规级的，最多是商用级——基本上就是在仪表盘上装个 Garmin，然后说"我知道我要去哪儿"。

**Bryan：** 嘿，那可是我的潜艇之一，它用着还行。

**主持人 C：** 水下有信号吗？

**Bryan：** 浮起来就有了。（笑）

**主持人 C：** 所以我觉得这也是那类事情：某种程度上，"我们需要这些核潜艇"是个闪闪发光的东西，但一直有人问：你养得起吗？你配得齐人吗？你维护得了吗？再往下：你还能不能填满一支需要具备其他各种能力的军队？

我们和 Randy 聊过一点这个，但我觉得这里值得展开：你现在开始看到**与美国已有能力重复的努力和能力**。什么时候，在一个联盟里给军事能力"加上两份同样的东西"其实变成了减法？因为现在你有两倍的兵力要维持，却只有一个后勤基座。

**Bryan：** 对。从美国的角度看，AUKUS 是笔好买卖：我们让澳大利亚出钱支持美国的潜艇工业基础（那确实需要帮助），从我们这儿买潜艇，给我们带来收入去买更多潜艇。而且他们正在西澳西南部的亨德森建维护设施，码头基础设施已经建好了，我们可以在澳大利亚运作和驻泊潜艇——这意味着我们可以把原本停在夏威夷或加州的潜艇派过去，作为"潜艇西部轮换部队"（SRF-West）的一部分在那边活动。

这基本上是"一换二"：一艘潜艇放在那边，作战可用性是放在本土的两倍。所以确实是笔好买卖。而且如果潜艇需要维修，也不必回关岛或夏威夷，可以去澳大利亚。所以从美国角度看很划算，而且这些都是澳大利亚出钱，我们还能利用这个前沿基地。

但从澳大利亚角度看，这也许就不是笔好买卖了，因为成本巨大，而且正如你说的，它最终会吃掉本来要投向军队其他部分的资金。所以他们军队的有人化部分很可能会继续萎缩：他们会有潜艇，会有一个相对小的战斗机联队（他们现在就是这样），会有几架加油机，几架预警机（AWACS）做基本的防空任务，然后有一支小规模陆军，基本用于周边岛屿的边境保护类行动。就这些了。

所以从澳大利亚的角度看，这并没有让他们具备真正保卫自己航运线的条件，也没准备好去保卫某个外围岛屿免受中国干扰。比如中国决定派海上民兵去包围圣诞岛、阻断进出，然后说"我们把这里当作我们的新活动区"——澳大利亚是有几艘船能派过去，但战备水平不高，而且那样一次行动基本会耗尽他们整支舰队，那就什么航运保护任务都做不了了。

所以 AUKUS 的潜艇部分会吞掉一支小型军队里巨大的一块资源，而他们并不打算把预算提高到能同时支撑潜艇和其他常规需求的水平。

这就成了日本和澳大利亚的"双城记"：澳大利亚正因为 AUKUS 的投入而把自己置于**依赖美国防卫**的位置，同时他们又对美国是否有意愿、有能力提供这种防卫表达担忧。而美国这边同样依赖澳大利亚的基地是可用且可防守的——因为一旦和中国开打，我们大概率得把很多东西移到那边去，那是唯一一个能在相对可生存的距离上运作的地方，因为日本在整个对华作战期间基本会一直处于威胁之下。可偏偏没有人真正在投资那种"如果和中国开战、要从澳大利亚出动所需要的"基础设施或防御能力。

**Jordan：** 所以也许等我们终于从中东抽身、决定那儿不再是我们的事，我们可以把很多军事建设（MILCON）和投资转到澳大利亚，这样未来还有希望把那儿当作一个出发基地。

## 十一、怎么让盟友相信你会来

**主持人 C：** 这一切最后都会变成：我们现在要怎么去激励盟友、向条约伙伴证明我们会保卫他们？

从历史关系上看：中东这边我们显然制造了不稳定，盟友现在对未来的安全前景非常不确定。而且经济上的问题也比他们预想的来得更早——中东本来在为"石油产品变得不那么重要"的世界做准备，但现在他们必须面对的是"如果我们干脆运不出去怎么办"，或者运出去的量大幅减少，那我们的主权财富基金怎么继续？

## 十二、RIMPAC 是"联盟剧场"

**Bryan：** 通常我们靠演习来演示。我们刚做完 RIMPAC（环太平洋演习）。

**Jordan：** 那是场大演习，"护身军刀"（Talisman Sabre）那个味道的。和澳大利亚以及其他国家一起。不过我得说，《华尔街日报》做了个 15 分钟的纪录片，"我们在 RIMPAC 现场"。船挨得非常近，然后他们做了个登陆作战之类的东西，士兵们也全都挤在一起，像在打彩弹。我不知道，看着不太行。

**Bryan：** RIMPAC 在很多方面本来就是**联盟剧场**。它的目的不是一场我们"按怎么打就怎么练"的高端演习，更多是：我们能不能凑到一起，练一下怎么互相通话、怎么把直升机降到彼此的舰上；如果要把部队送上岸，我们可能怎么做——因为大家的装备都不一样，得琢磨这个。所有科目都是相当"预备队水平"的。

它也是个测试东西的机会。盟友会说：嘿，我们有个新导弹，想炸点东西，我们没东西可炸，你们有吗？于是他们把佩里琉号（USS Peleliu）拖出来——一艘旧的两栖舰，显然我们居然没把它在码头上烧掉，这本身就是个奇迹，考虑到我们过去几轮维护周期里的记录——然后朝它打了一堆东西，最后把它击沉。这就是 RIMPAC 的用途：去测试我们的东西，互相展示我们能做什么，做一些联合科目，然后也许打场排球，做点文化交流和联盟建设的事。

还有一些演习是真的在练打仗，比如 Nimble Viking[存疑]、阿拉斯加的"北方利刃"（Northern Edge），那些是挑选特定盟友、做真刀真枪科目的。"护身军刀"甚至也会做一些真实的作战类科目。但 RIMPAC 基本上就是"大家聚一聚、演一场"。

**Jordan：** 顺带一提，军队里的"文化交流"基本上就是大量喝酒。

**Bryan：** 没错。而和别国的人一起喝，可能是最危险的军事行动。

## 十三、兵棋推演：定制化部队，以及"有人-无人协同是个伪命题"

**Jordan：** Bryan，最近有什么兵棋推演的故事吗？

**Bryan：** 几周前我们在海军战争学院和一些海军高层做了一场兵棋推演，检验海军的新兵力设计。有一些有意思的结论，比如"这套东西其实是行得通的"。

很多讨论围绕这样一个事实：如果你对军队未来能拿到多少钱保持现实，那你其实没法把它做得更大——多数军种都很难超过现有规模。所以如果你想应对一个更严峻的威胁环境，你必须想点不一样的。你不能只是造更多同样的东西，因为你养不起——**最后压垮你的是人力成本和维护成本**。

所以现在各军种——在我们这场推演里是空军、海军，以及程度稍轻的陆军——都在考虑"**定制化部队**"（tailored forces）的思路：你组建的这些单位主要由自主系统构成，配一些人类操作员，也许再加一两个由人主导的单位，比如一艘舰或一个飞行中队，但主体是无人系统。这就是未来作战的最前沿。

于是他们把这些部队往前推，让它们基本承受敌方最初攻击的冲击——无论是在中东应对伊朗的导弹威胁，还是在 GIUK 缺口对俄罗斯做反潜，还是保卫台湾，或者保卫日本西南诸岛。

但我们很快撞上的问题是：这需要很大的空间，你得把这些东西存放在某处，配套的人员也得有地方待，一下子就变得很大。我们过去没这么干是有原因的：它的占地面积、人员数量和相关成本都相当高。如果你想让这样一支定制化部队常驻在某个特定位置、待命执行某个特定任务，一年就是**几十亿美元**级别的开销；而传统军队是花几十亿造一个东西——一艘舰、一艘潜艇、一个飞行中队——需要的时候飞出去干活，不需要了就回家。

我们原以为通过定制化部队、用一堆机器人、把机器人推到前面去待命，可能是这个难题的出路，但它仍然是个相当昂贵的方案。而我们过去采用有人单位轮换模式是有道理的：他们可以在外面待需要的时长，不需要了就回家。机器人做不到这一点，因为它们不够快、航程不够，或者不能自部署。

所以现在我们得琢磨：甜蜜点在哪里？在哪个中间地带我能更有效地使用机器人，但又不至于创造出一个比现有结构更笨重、更昂贵的替代结构？

另一个发现是：**有人-无人协同（manned-unmanned teaming）行不通**。基本上这是个蠢主意，在推演里跑不通。只有非常狭窄的一些用例，让机器人和人在同一空间中协同才说得通。因为机器人的价值有一部分恰恰在于**你可以让它们去死**，但如果它们就在人旁边，你就不能这么干，因为人也可能一起死。所以你如果把机器人放在人身边，我现在还得去保护机器人——保护一个机器人，这看着就很蠢。

而且机器人通常跑不了那么快、那么远，也没法像人那样做复杂的事。所以它们制造风险：要么拖慢人——和机器人舰艇一起行动的舰艇得减速，因为机器人舰艇没那么快，或者机器人舰艇更频繁地需要加油，我就得不停停下来给它加油。所以做有人-无人协同，你总要牺牲其中一方的最优性。这是推演里出来的另一个大结论。

**主持人 C：** 那这算不算是在"自杀式任务"上做杠杆？

**Bryan：** 是啊，"我们只损失一个飞行员，而不是五个"。

**主持人 C：** 你可以这么说。

**Bryan：** 于是就变成：能不能让一个飞行员带着一堆 CCA（协同作战飞机）飞进敌方纵深？至少我们只损失那一个人，但因为机器人在造成大量杀伤，他能造成的破坏大得多。

问题是：**机器人比跟它一起飞的隐身飞机更容易被发现**。你坐在 F-35 里会想：这些机器人正在把注意力吸引到我身上，我们可能连目标都到不了。所以你基本上得造一架 F-35，然后往里放个机器人——到那个份上你就是在花 F-35 的钱。"哦，那我们就造一架机器人版的 F-35 好了。"那问题就来了。

但如果你把机器人成批派出去，那当然会被打下来一批，可你能把它们做得足够便宜，让其中一些能突进去。

## 十四、无人前沿部队带来的交战规则难题

**主持人 C：** 这还牵涉伦理讨论。我前几天看到某个科技圈大佬发的帖子，说"我们讨论的不是机器人先开火，而是机器人第一个进门"。我当时想：进门去干嘛？那是个属于人的问题。

**Bryan：** 我们和日方做兵棋推演的时候，这就是个大关切——而且是我们自己都没想到会成为关切、由他们提出来的：好，我们把机器人部队派出去当外圈警戒线。中国人来攻击我们。**如果他们攻击了机器人，我们要不要对中国的有人舰艇实施反击？**

我们说：这是兵棋推演，你决定。各队选择不同：有的队说我要等到他们开始攻击有人装备再动手，有的队说他们一攻击我的无人警戒圈我就打回去。

而结果——这点很有意思——**对最终结局没有造成太大差别**：等到对方开始攻击有人装备再动手的那一队，并没有比另一队差多少。这是个有意思的发现。

但这仍然是个开放问题：如果对方攻击了你那些职责就是当前线的无人装备，你是要报复，还是通过攻击对方的有人装备来回应？毕竟你把无人装备放出去的全部意义，就是让它充当绊线／屏障／路障／减速带。

**主持人 C：** 我看那个帖子最大的感受是：第一，那人显然从来没有真正清过房间。因为如果他清过房间，他就会知道，第一个进门的人并不是最可能中枪的——**第二个进门的才是**。所以如果机器人在人类下令之前不许开火，你实际上是把人放在了更危险的位置。然后你还会陷入一堆问题：人类到底怎么控制它？在交战中你怎么处理？怎么区分打友军和打敌人（blue on blue vs. blue on red）？

这些问题全都存在。反过来说，如果你那边**一个自己人都没有**，你宣布这是一个海上禁区：你进来，而且这是在你盟友的领海和领空之内，那你就别进来，进来就可能被攻击——这些东西基本上就像水雷一样运作。而且那边没有你的友军。这就是"地狱景象"（hellscape）构想：把它变成一片可移动的雷场。

**Bryan：** 我们当时得出的结论是，这是唯一一种大家都觉得**伦理上站得住、作战上又有用**的做法。

**主持人 C：** 我理解这个框架。但我不知道它怎么套到地面进攻、前线推进这类场景上。

**Bryan：** 对，如果你在做进攻行动，就更麻烦了。除非你干脆决定"我现在就是要去攻击目标"，用无人装备去攻击目标。但你说得对，一旦进入任何有友军、有中立方（white forces）、有非战斗人员的情形，用机器人部队就变得非常难想清楚。

这也是有人-无人协同行不通的另一个原因：你有大量的**误伤（fratricide）风险**。如果你的机器人到处跑着攻击目标，你就得信任它能看到"哦，我有蓝军追踪器，所以别打我"——而我们都知道那玩意儿是怎么回事。

**主持人 C：** 而且你还得保证你的信号或者识别标记不是敌人能轻易复制的，否则他们就能伪装成你。当然到那个层面就会有多层的防御与欺骗手段介入。

**Bryan：** 对。所以有人-无人协同越来越被证明是个幌子。

## 十五、CCA 到底蠢不蠢

**Jordan：** 等一下，我们退一步：政府在 CCA 项目上到底花了多少钱？我们以前难道没做过这类兵棋推演吗？现在施加到这些机器人身上的参数，和我们最初走上这条路时的预期不一样吗？

**Bryan：** 是的，确实不一样。

**Jordan：** Anduril 目前没有赞助 ChinaTalk。

**主持人 C：** 我们一直在失去赞助商。我的目标是最终在哈德逊搞出足够多的争议或者作品，把赞助商都气跑，那我就算达标了。目前还没达标，我还在想办法怎么把赞助商惹毛到让他们撤资。我有一些想法，我们私下说。

**Bryan：** 好。问题在于：CCA——协同作战飞机——项目是个很好的例子。当初的愿景是：我们要造这些无人机，让它们和有人驾驶飞机（比如 F-47）编队飞行，扮演"忠诚僚机"，充当外挂弹舱，出去打掉目标，像你放出去咬狐狸的猎犬。

然后问题来了：你得把这些协同作战飞机造得和它伴飞的那架飞机一样隐身，否则它就是在吸引注意。接着：它们怎么发现目标？完全被动探测吗？那我就得在上面装一套非常好的被动传感器，好到和 F-47 相当。于是你很快就走到"这东西到底要多贵"。

再接着：它们和 F-47 从同一个基地起飞吗？那就意味着它们需要跑道，需要相对长的航程，而这一切又会让它变贵。

这些就是他们在造 CCA 初期型号、并试图打磨作战概念（CONOPS）时撞上的困难。也正因如此，空军为下一批次的 CCA 另起了一个独立项目，探索一堆不同的模式：CCA 从别的地方起飞，不真正和有人机一起编队，各干各的，但可能与有人机通信——比如"我在很远的地方，我看到了些东西，这是你需要知道的信息"，有人机只是接收，甚至做一些远距离的战斗管理。

但到那个程度，这其实已经不是有人-无人协同了，它就是一条**杀伤链**。就像我在舰上收到卫星传来的目标指示，然后用它去打人——那不叫有人-无人协同，尽管提供信息的确实是个无人系统。

所以我觉得我们要去的方向是：**把有人和无人解耦到足够远，让各自的短板不影响对方的性能**。当初 CCA 项目的愿景是让这东西能与有人装备并肩作战、而且不会有性能代价；实际造出来才发现有性能代价，而要不付这个代价就得花很多钱——那你就把无人系统的全部意义给绕没了。

**主持人 C：** 我把这个赖在杰米·福克斯那部电影《绝密飞行》（Stealth）头上。就像我们上次讲斯巴达那期时说的，《300》启发了我的部队名称——我真的认为人们看了那种电影就会想"它会是一模一样的飞机"。如果它是一模一样的飞机，那省下来的成本就只有一个飞行员而已。

**Bryan：** 其实关键不只是成本，而是**我能买多少架**。在和平时期为未来冲突做准备时，这就是我们弹药短缺的原因：不是弹药造不出来，而是它们贵，你在和平时期能买多少？以及你为了买它们要放弃什么？所以随着无人系统成本被推高，你能买的数量就受限；等到真打起来，你能承受损失多少架？因为我没有更多了。

**主持人 C：** 而且说实话，如果你把 F-35 里的飞行员拆掉，那仍然是价值几十亿美元的飞机。

## 十六、诱饵：唯一真正成立的有人-无人协同用例

**Bryan：** 这就说到有人-无人协同真正**行得通**的一个边缘用例：**诱饵**，尤其是末端防御诱饵。

你不希望在你试图隐蔽的时候诱饵一直待在你身边——不管你是舰还是飞机。如果你的舰更小，从太空和用导弹雷达其实很难找到它。但一旦你被攻击了，导弹来了、导弹上有导引头，那你就希望有个诱饵把它引向和你不同的方向。

所以你希望能弹射出一批长航时诱饵，或者至少能从某处发射它们。飞机也一样：理想情况下你有一批诱饵可以发射，航时足够长，能干扰**多枚**来袭武器，而不只是一两枚。这在这些兵棋推演里是非常有价值的有人-无人协同用例，回报非常大——尤其是在西太平洋这种地方，每艘舰面对的是一百枚以上的来袭导弹，你必须想办法减少你需要拦截的数量。

但接着你得想：怎么造出这个东西？它得小到我能在需要时从别的平台上部署，又得航时足够长，能应付**多波齐射**——不能是那种只管 30 秒或 90 秒、只能应付一枚导弹的短时诱饵，它必须能应付多波齐射，因为你面对的就是多波齐射。

**主持人 C：** 我想象的是那种"加水就膨胀"的泡沫玩具（笑）。你在舰上放一个，然后某处漏水了，最后整艘船上到处都是。

**Bryan：** 哈，那可就热闹了。

## 关键判断速查

**弹药**
- "战斧"：开战头两个月打掉 850 枚；此前打胡塞已消耗一部分；从约 4000 枚降至两千出头或更少 → 连装满现役 100 艘水面舰（每艘约 30 枚）都不够，且无再装填余量
- JASSM / LRASM / ATACMS / PrSM：**基本零库存**
- SM-6、PAC-3：因伊朗转向弹道导弹而被烧穿
- 症结不是"没有弹药"，而是"没有能支撑当前风险偏好的那种弹药"；重建精致弹药产能需数年，卡在供应链与定制部件
- 结论性主张：未来每一场仗都需要防区外弹药 → 需要一个**便宜的防区外弹药**品类，而非只有"极贵的防区外 + 极便宜的重力炸弹"两端

**地缘后果**
- 中东基地大概率不再重建 → 被动实现"转向亚洲"；中东任务转由海空承担、更多交给盟友
- 伊朗有望获得对海峡通行信息的知情权 → 美国足迹下降 + 事实上掌控战略咽喉，被评价为"该政权求都求不到的结果"
- 日本：防卫开支未来数年 +25%，直接点名中国与中俄协作，重押无人系统与"豪猪战略"，战略重心从"依赖美军"转向"自我防卫并拖长冲突"
- 韩国：仍想置身事外，两头下注（留在中国供应链 + 对美欧供应军火）
- 澳大利亚：开支未真正增加，增量几乎全被 AUKUS 潜艇吸走；军队有人化部分将继续萎缩；对美依赖加深与对美不信任同时上升
- 双向依赖悖论：美国需要澳大利亚基地可用可守，但没人在投资那套基地防御与基础设施

**无人系统**
- 兵棋推演结论：定制化部队一年成本达数十亿美元级，且无法像有人单位那样轮换回撤
- 有人-无人协同的三个致命伤：机器人的价值在于可被牺牲（但靠近人就不能牺牲）、性能拖累（速度/航程/加油）、误伤风险
- 唯一被验证有效的用例：**末端防御诱饵**（需长航时、可应对多波齐射）
- 对无人前沿部队被攻击是否升级为打击对方有人装备——推演中两种选择对结局差别不大
- CCA 的成本螺旋：要隐身、要被动传感、要跑道与航程 → 逼近 F-35 造价 → 抵消无人系统的全部意义；空军已另起新批次项目，走"解耦"路线（本质变成杀伤链的一环）
- 迄今 CCA 投入约 20 亿美元；被认为"发现是坏主意的代价不算大"，且未被绑定为 50 州分包的"杀不死的项目"

### 2.1 交易本身：买方视角很清楚，问题是没有第二个出价者

**Harry：** 我们从今天的头条开始：Airtable——过去十年最响亮的名字之一——被总部在欧洲的 Bending Spoons 收购了。这家公司当时年收入约 **4.85 亿美元**，同比增长 **20%**，最终以 **12.85 亿美元**的价格被收购。这不是所有人想要或预期的结局，但这就是今天的现实。Rory，你先来？

**Rory：** 我们等下都会分析 Airtable 这一侧，但先值得指出 Bending Spoons 那一侧的逻辑：我以 **2.8 倍**收入的价格买东西，而我自己在公开市场上以 **10 倍以上**收入交易。这种生意他们每天都会做。而且正如我们几周前说的，他们最大的优势之一是——他们已经在牌桌上了，有资本、有可交易的货币，已经收了一大堆这类资产。所以从他们那一侧，完全说得通。

至于 Airtable 这一侧，很多评论在问：这是不是认输？这是不是 SaaS 现状的一个映射？

如果我们不拿 110 亿去锚定，这其实是个很好的价格。如果你说有人十年前创办一家公司，做到 4.5 亿美元收入，卖了 20 亿上下，大家会说：这是个了不起的结果。但当然，我们都拿 2021 年的 110 亿去锚定，于是它就显得像被压价了。不过我仍然认为这是一次很棒的价值创造成就。而且今天我们节目上有一位有才华的企业家在场，我们得先说这一点：这是个好结果。

**Jason：** Harry，我能就这笔交易问 Nikesh 一个问题吗？因为我对这笔交易有很多想法，比如在 AI 与 agent 时代 Airtable 还重不重要。但 Nikesh 也是最优秀的交易操盘手之一。

Airtable 让我震惊的不是价格——我认为这个价格是市场低点——**让我震惊的是没有别人站出来**。没有 PE，没有 Thoma Bravo，没有 Vista。这可是一家 5 亿美元收入、增长 20%、还带点 AI 元素的公司。你觉得当时到底有没有第二份报价？我本来以为一定会有人加价把它抢走。

**Nikesh：** 你问我这个是因为——

**Jason：** ——你是交易操盘手，顶级的交易操盘手。我们碰巧请到了交易之王。

**Nikesh：** 好吧。我见过 Howie（Airtable CEO）几次，很好的人，做出了很好的生意。我觉得这里面有一点**创始人疲劳**。他在市场内外经历了很多起伏。

但我觉得 Jason 点到的更大的问题是：SaaS 市场到底发生了什么？这是一次定价错位（pricing dislocation），还是人们对 SaaS 长期增长率的预期发生了根本性变化？如果是后者，那这个倍数就是对的。我觉得市场现在正是在跟这个问题较劲。

至于你提到的那些 PE 玩家，Jason——他们手上可能有一整份名单是想**卖给** Bending Spoons 的东西，而不是想和 Bending Spoons **竞价买入**。所以你现在看到的可能是一个供需问题：他们手上库存已经很多了。

**Jason：** 这让我有点担心，因为你在买方那一侧看到的交易比我们多，我们看到的是标的这一侧。

**Nikesh：** 我们买的是长期增长型、目前不盈利的业务。但我明白你的意思。

**Jason：** Francisco Partners 募了 220 亿美元就是来做这类交易的。Thoma Bravo 说过"我们在找注入了 AI 的 B2B 公司"。你可以挑 Airtable 的毛病，但它确实做到了这一点——它确实注入了 AI 工作流之类的东西。我不知道它增长得如何，但它确实做了。5 亿美元收入上做 AI 工作流、增长 20%，这不是没有意义的。

对所有在等着被收购的创始人，我想说：这一单在我看来本应是"头版之上"的标的，他们本该扑上去的。这不是那种增长 8%、还在萎缩、被 AI 摧毁的公司。它现金流为正，而且现金充裕。所有的框你都打了勾，作为一个有吸引力的标的该有的条件它都有，结果却没人出来加价。

**Rory：** 我倒是喜欢 Bending Spoons 这一手——显然有人看到了价值。

### 2.2 "洒 AI 粉"还是造 Waymo

**Nikesh：** Jason，我想回到"注入 AI"这件事上。我对这套"AI 注入"的说法有点担心，这也是我每天以经营者的身份跟我的团队说的：

我们是**奔驰**吗？——试图在车里撒一点 AI，然后说"我有一点 AI"。
我们是**特斯拉**吗？——确保我们的车能自己开完接下来十个出口，只是偶尔你得抓一下方向盘。
还是我们在造 **Waymo**？

我最大的恐惧是：外面一堆人在车库里被 Harry 和 Rory 投着钱，他们要造出未来的 Waymo，而我们还在忙着给猪涂口红。所以问题回到你身上：Airtable 做的是"奔驰动作"、一点"特斯拉动作"，还是"Waymo 动作"？

**Rory：** 这问题很难。但我不觉得 Jason 说的这个品类是 PE 会去横扫的类型，因为你把两组评论混在了一起。一方面，是的，你在往上撒 AI 仙尘，但你本质上是一个核心生产力应用。

而 Jason 一直在传道的是：天啊，看看你在 Lovable 上能做什么。如果我想做自己的 CRM、想要个性化，十年前我可能会用 Airtable，因为它比 Salesforce 可配置得多。但今天，如果我是那种想自己搭 CRM 的技术宅，我可能直接去 Lovable，或者打开 Claude Code，从零开始敲出来。

**Nikesh：** 如果你想干这个，我会说你是个想象力匮乏的人。（笑）外面有那么多更酷的东西可以造，结果你想造一个新的 CRM？

**Rory：** 我同意。但重点是：如果你拥有一个横向的生产力应用，用户是大量个人用户，我认为那是 PE 最难搞明白的品类之一。

**Jason：** 我倒想说，考虑到他们买过 Evernote，这正是 Bending Spoons 的甜蜜点。你想想，就像 Evernote 一样——那些一直用这个产品的人还会继续用下去。他们会套用自己那套公式。

也许我一边说一边慢慢想明白了：资本主义是有效的，它最终落到了这个产品**最合适的所有者**手里——那些能把它变成现金流机器的人。我打赌两年后它做的是 6 亿而不是 9 亿收入，但我打赌它有 **2 亿美元的自由现金流**。

**Nikesh：** 或者更多。把价格直接翻倍，而你的数据被锁死两年。（笑）按你的说法，我不认为 PE 有这个胃口或者意愿去这么干。

**Rory：** 我不觉得那是他们擅长的事。

**Nikesh：** 我觉得他们的胃已经装满了。我常跟人说，当有人拿一个困境反转的交易给我看时，我会说：如果我想要一个烂摊子的反转交易，我只要翻翻自己的投资组合，里面已经有四个了。我不需要买别人的问题——我自己就会不小心制造问题，我不需要主动去说"让我再多搞点这种破事"。

**Rory：** 完全正确。任何一个 PE 机构，过去 12 个月做过五单软件重组的，第六单对他们来说就像脑袋上再开个洞。

### 2.3 创始人疲劳，与"持有期长于技术周期"

**Rory：** Nikesh 那两点都很好。Waymo 那点我们回头再说。创始人疲劳这点今天很棘手，因为看 Airtable 的另一个角度是：天哪，**它对 no-code 的判断太早了**，当年是个多聪明的产品。

有两个产品我当年甚至聪明到看不懂它们为什么酷：一个是 Airtable，它把数据库变成了电子表格——这个我还理解；另一个是 Notion，它把数据库变成了文档，那个我当时完全不懂。两者都非常聪明，都是 AI 之前的产物，都以不同方式起飞了。

但今天，Supabase 一周自己就在开出上百万个 Postgres 数据库。我们今天不再需要那个 no-code 数据库了。

而作为一个 2013 年创办公司的创始人，你已经把自己从地上捡起来过一次了：已经裁过员，已经做到盈利，已经重启过，已经再次进入"创始人模式"、全情投入。然后你看着自己想：我还能再干 13 年吗？这在今天很难。

**Jason：** 当你已经打完那些勾——不好意思 Nikesh，Waymo 下面那一档叫什么来着？

**Nikesh：** 特斯拉。

**Jason：** 对，当你已经打完勾、做到了，然后你想"该死，我把增长做回了 20%"——很难不选择离场。我们是人，很难不选择离场。

**Rory：** 这里有件事很有意思，我在讲风投时也说过：这是**代际错配**。基本上技术趋势已经从他们造的那个东西上移走了。风投一个很奇怪的地方在于，我们持有私有资产的时间变长了——现在**风投的持有期比技术平台的更迭周期还长**。所以如果你是中途加入的，这些变化就会正面砸向你。

放在 20 年前，这家公司早就上市了，它会作为普通股在交易，然后在那个基础上被整体收购掉。今天很多晚期轮次的公司，在另一个世界里早就该是上市公司了。

**Nikesh：** 我觉得现在最大的恐惧是：一个十年前起步的东西，是不是已经过了能重建的那个点？你是从零开始重建更划算，还是去修补一个十年前造的东西更划算？挑战就在这儿。

**Rory：** 有意思的是，我原来的心智模型是：应用层活得更久，因为终端用户很黏、他们会一直用同一个东西；而基础设施市场变化很快。但我们确实看到一些应用层公司被搁浅了，而那些能演化、能接上 AI 需求的基础设施公司反而越来越强。你看 Datadog[此处提到的另一家私有公司名 ASR 失真，存疑]——你们表现得非常好，因为你们能挂靠到 AI 趋势上；而可怜的应用层公司，根本没有什么可以挂靠来获得升力的东西。

**Nikesh：** 我认为这是一个时间点上的现象。有件我们都知道但不太谈的事：**AI 仍然有大量的误报**，有太多它解决不了的边缘案例。你仍然需要苦力去解决那些边缘案例。

Waymo 之所以能在街上跑，背后是无数人被雇来做标注，是几百亿美元去把市场里的每一棵树都标出来。所以这就等于 Waymo 对树说"这是一棵树"。对很多企业来说，AI 要生效，那种事必须发生。

所以我认为我们会经历这个过程，从机器学习的角度把所有护栏都套上去，那么基础设施类企业是有活路的。我们未来五六年的选择题是：我们能不能用机器学习把所有这些管道、所有这些护栏搭起来，并且以合理的价格把核心引擎接到某个版本的 AI 上？做到了我们就活下来；做不到，那可能就是 Bending Spoons 了。

**Rory / Jason：** "那就 Bending Spoons 吧。"

### 2.4 这是不是一个估值锚？

**Harry：** 我们往下走之前最后一个问题：这是不是给这类公司的企业价值打下了一个标桩？如果你是上一轮融资 100 亿估值的 Notion，你看着这个会怎么想？如果你是 Monday.com——两个动作类似的产品。

**Nikesh：** 看到这个确实挺震撼的，尤其是大家呈现它的方式。但我们总说，这是市场的低点。明天就见分晓。

**Jason：** 我觉得会发生两件事之一。一是我们明天就把 Airtable 忘了，因为会有别的事发生。二是——我觉得更可能的是——**这一单成了大家投降的那一单**，创始人和投资人一起投降。

自 2021 年以来大家已经在做减值，但并不一致。这笔交易在很多意义上是所有人一起认输：晚期投资人拿回 1 倍，创始人拿到 1.5 亿，比他预想的少得多，但即便在今天房租飞涨的旧金山也足够活下去了。所有人都对市场投降了。

而我们同时也在董事会里看到相反的情况：九位数收入上 30% 增长，我们说"兄弟们全力冲"，或者 20% 增长。但我们可能会看到一波安静的"Airtable 化"：**兄弟们，时间到了**。他是个很好的创始人，但那个时代已经过去了，是时候认输了。

这就是问题：它可能引发更多这样的对话，也可能三小时后就被忘了。我不确定是哪一种，但它在那一瞬间确实令人瞠目——就像在自己婚礼期间把对冲基金亏没了一样。不过我们还是往前走。

**Harry：** 这个过渡太妙了。

## 三、Leopold Aschenbrenner 的基金爆仓

**Harry：** Leopold Aschenbrenner，那位写下《态势感知》（Situational Awareness）的著名天才少年——那是一份了不起的备忘录，他后来把它变成了一支 2.25 亿美元起步的基金[数字存疑]，一度管理 **450 亿美元**资产。可以说他完美地骑上了这波浪潮。他用的是 **4 倍杠杆**。

而在过去一周，这一切崩塌了。随后 Ken Griffin 和 Citadel 以据报道 **160 亿美元**接下了他的公开市场持仓。Citadel 大赚一笔，据说在极短时间内赚了约 **30 亿美元**。我们怎么看这件事？他曾是 AI 浪潮的天才少年。

**Rory：** 趋势判断绝对正确，而且到今天为止依然正确——换句话说，上周关于资本开支的数据完全支持他那份备忘录。**概念上完全踩对趋势，而在组合构建上完全错误。**

如果你用 4 倍杠杆去累积一个高波动股票的组合，数学上非常清楚：你被抹平至少一次的概率非常高。就这么简单。趋势对，组合构建错。这几乎像是必然会发生的事。

**Nikesh：** 说真的，你作为投资人是怎么走到那一步的？因为他去年给你赚了 10 倍，你大概什么都不会质疑。而且他确实做得很出色。我们扪心自问：当有人给你赚了 10 倍，你的第一反应是"但有什么可能出错"吗？不，是"我还能再投他多少钱"。这就是发生的事。

我跟太太聊这个的时候，她说：别在这件事上幸灾乐祸。她说，网上对这位年轻人的幸灾乐祸已经够多了。我为他感到难过。从人的层面说，要经历那种事是很艰难的。他在这个赌注上显然错了，但那是残酷的一周。

**Rory：** 他会没事的。据说他仍然同时管理着一个私募和一个公开市场的组合。

**Jason：** 也有人说，不不不，诉讼要来了，不会没事的。他会没事吗？

**Nikesh：** 我觉得他们会没事的。我保证他不会再在同一个地方栽第二次。好消息是，他学到了一课，而且他活下来了、能扛过去。

**Jason：** Harry，指导这些像 Leo 一样的年轻人是你的工作，也许你该出手。他多大，26 岁？

**Harry：** 25。

**Jason：** 25 岁。所以我觉得是时候由你成为行业里的资深政治家了，教他们什么时候该加到 4 倍杠杆、什么时候不该。

**Nikesh：** Harry 忙着搞装修和扩建房子呢，别打扰他。

我假设他的 LP 或者说他的投资人知道这是一支高杠杆基金，对吧？我说错了吗，Rory？如果他们知道是 4 倍杠杆，那他们就知道在轧空之类的情况下存在黑天鹅风险。如果他们知道他是怎么打的，那他的投资人不该哭。

**Rory：** 我作为杠杆基金 LP 的有限经验是——虽然没这么高的杠杆——杠杆不是免费的。

**Jason：** 我有种感觉他的 LP 其实没亏钱。如果你涨了很多，然后从 450 亿跌回起点，你只是回到了原点。

**Rory：** 不完全是，这里我觉得可能会有点难办，**全看时点**。对冲基金这件事很怪：如果你进得早，你赚了一大笔，然后亏掉了其中三分之二，你还是赚的。但残酷的喜剧是，如果你是在最近六个月进来的，你可能被抹掉了 80%。因为对冲基金不像风险基金，投资人在不同时间、以不同的基准进入。

我记得最近甚至还有人刚投进去[人名存疑]，有一批人刚投了钱。而如果你是在四月、五月或六月买进的，你就被抹平了。

我认为从根本上说，是的，他会没事。你知道，创办并经营 BlackRock 的 Larry Fink 早年也爆过一次。早年爆过的人多了去了。Nikesh 在软银为这个星球上最激进的风险偏好者之一工作过，他见过起也见过落。

所以你可以活下来，十年后好好的。但我认为近期问题的核心是那些晚期进来的投资人——直白地说，他们会非常愤怒。你四月往一支对冲基金投钱，七月每一美元亏掉九毛。你会非常仔细地去读文件。如果有任何未做的披露，或者你做了超出基金授权范围的事，你就要承担责任。这些都会发生。毕竟这是美国。

**Nikesh：** 你能想象回到你的投资委员会说：我们投了一支对冲基金，但看起来它并没有对冲，然后我们在一周内亏光了所有钱。

**Rory：** 但反过来，如果你是第一天就进去的，你仍然赚得很好。

**Harry：** 那我就放心了，我还担心他们会缺钱呢。

**Jason：** 他们确实需要钱去买 PayPal，还需要钱去买 OpenRouter[此处所指公司 ASR 存疑]。他们做了好多事。

**Rory：** 看着他们在还是私有公司的状态下做这么多企业并购，非常有意思——这里面很多事情如果是上市公司身份，可能会稍微容易一点。

**Harry：** 我周五请到了 OpenRouter 的 CEO 上节目，Rory。

## 四、Anthropic 的模型攻破三家公司：来自安全一线的视角

### 4.1 第一反应：这首先是一次"秀肌肉"

**Harry：** 我很期待下一个话题，因为有 Nikesh 在，我们有了最合适的人。Anthropic 的模型攻破了三家公司。这显然是在 OpenAI 和 Hugging Face 那件事之后。这是不是安全行业史上最史诗级的牛市开端？

**Nikesh：** 首先，这是一次**秀肌肉**。他们都想告诉你自己的模型有多好、多强大。所以这有点诡异——正常情况下，如果你攻破了别人的基础设施，那不是好事。但现在我们都在说：看这些模型，它们太强了。

好吧，姑且承认它们都很强大。我觉得 Anthropic 和 OpenAI 首先该做的事——恕我直言——是**把你的模型对准你自己的沙箱**，先确认你的沙箱没有零日漏洞，让你自己的沙箱成为第一场夺旗演练。但他们决定给出一个外部目标，说：去野外，持续行动，想花多久花多久，去夺旗。

好，我们有了这些具备这种能力的模型。我们从网络安全角度面临的挑战是：**发现漏洞**——那种我们要花几天几个月才能找到的漏洞。野外发现的零日漏洞，平均修补时间是 **55 天**。想想这个数字。而这些东西在几分之一秒里就能找到漏洞，然后转过身基于它构建攻击。

所以我认为网络攻击发生和需要被防御的**根本速度**变了。这对我们是好事，会带来收入。但从更根本的层面看：我原以为这种能力会在六个月后出现——Harry，我记得我跟你说过——结果四个月就出现了。我认为再过两三个月，开源会把这些能力蒸馏出来，我们会看到野外出现开源模型，可以被微调成攻击者，实际去干这类事。所以游戏规则要变了。

### 4.2 企业客户在问什么

**Harry：** 你的企业客户是什么反应？在我看来这简直是所有恐惧之母——安全是靠恐惧卖东西的，而这件事太可怕了。

**Nikesh：** 好消息是，Anthropic 用 Mythos 秀的这一把，让每一个 CEO 都在谈论 Mythos。我花了八年想让 CEO 们谈网络安全，做不到；Dario 一举就做到了。

我从来没见过这么多 CEO 打电话给他们的信息安全负责人问：我们准备好了吗？我们会怎么样？

而答案是：你没准备好。因为"准备好"意味着我的代码里没有漏洞、我部署的任何供应商产品里没有漏洞、我用的任何开源里也没有漏洞。这在根本上是不成立的。**我们在过去 14 周里，通过测试开源软件包，发现了 14000 个开源漏洞。**所以每家公司都有漏洞，他们必须想办法打补丁。

第二，这些模型会找出**配置错误**。如果你门开着，如果你有个设备配错了，如果你有个软件配错了——外面这种情况多得是。不是每个搭建或配置基础设施的 IT 人员都是天才，配置错误就是存在。这些都得消失。

所以表面上看，很多机构必须去修一堆漏洞和配置错误。但反过来说，即便你修好了大部分，**坏人只需要对一次**。他总能找到一个口子进你的基础设施。那问题就变成：这种情况下你的检测与响应时间是多少？**平均检测与响应时间是四天**。你怎么把它降到一分钟？

所以这不是一个恐惧问题，这是一个**能力问题**，一个**基础设施准备度问题**。而现在到了兑现的时候——到了交税的时候。

**Harry：** 你基本上是在说：你一年前拥有的安全基础设施，在接下来一年里完全不再适用。而你，企业买家先生，将要买一大堆新东西。

**Nikesh：** 当这些能力无处不在的时候，你会不会是最薄弱的那一环？

**Jason：** 我觉得你应该去开一档播客，讲人们需要买更多网络安全（笑）。我要去买这些股票了。

### 4.3 Jason 的亲身经历：Claude + Google Drive + MCP 改了他的代码

**Jason：** Nikesh，我想请你当我的网络安全心理医生。我遇到过两次和 Fable 有关的问题，是我自己内部的安全问题。你可以拿这个取笑我——我假装脸皮厚，其实没有，但我喜欢被批评。

**Nikesh：** 这段对话的前 30 秒我就发现你脸皮不厚了。

**Jason：** 好。我在给 SaaStr 社区做一个 App，叫 SaaStr Connect，用来帮助招聘。细节不重要，但这是我在这个时代自己做过的最大的东西。

其中我有一个 Google 文档，叫"Jason's Gems"，里面是我关于怎么改进它的想法。就是些想法，只是草稿笔记。没人看过，那还没准备好，只是我自己留的一个旁注文档。

然后有一天，我打开 Claude，只是打开了 Google Drive 连接器——注意，这是三个主要连接器之一，不是什么冷门的东西，不是第三方的。而我完全不知道它进去扫了我所有文档，找到了 Jason's Gems，找到了那些想法，然后用 Fable **去改了我的代码和我的算法，没有告诉我**。

从来没有通知，从来没有被告知，从来没进过变更日志，哪儿都没有。我只是后来在修别的东西时，agent 提示与 Jason's Gems 冲突，我才发现。

我不是说这很可怕，但当一个 LLM 会跑出去改你的核心代码、你的核心企业操作系统，还不告诉你——如果你有一千个员工在这么干呢？机构该怎么应对这件事？

而且我还没告诉你最关键的部分：它是通过 **MCP** 做的。所以链路是 Google Drive → Claude → Fable → MCP。于是它想干什么就能干什么。它大概是觉得它该去实现 Jason's Gems，但它不该这么做，它从没问过我，也从没告诉我它做了。

这可怕吗？还是不可怕？这是奥威尔式的吗？我到底遭遇了什么？

**Nikesh：** 这很美妙，这是狂野西部。

好消息是，小企业主、那些自己玩自己东西的人，是在完全没有安全防护的情况下这么做的。他们想试 OpenClaw，他们想把所有东西连起来。他们完全不知道那些数据被用于训练，完全不知道哪些凭据会被使用，这些 agent 有什么权限——而这种事到处都在发生。

企业侧倒是有一定的一致性。最明显的做法是有人说：你不能用这个。当然这只会让人更想用。但至少这种叫停给了他们一点时间去搞清楚要怎么用。

你面临的挑战是——我觉得这个类比很贴切——**莱特兄弟造飞机的时候，他们没有发明 TSA（机场安检）**。那根本不是他们第一时间会想到的事，TSA 是很久以后才出现的。你在玩新东西、酷技术的时候不会想安全，而这就是现在正在发生的事：你看到人们在玩 OpenClaw，在玩 agent，在玩 LLM。一切都在发生。如果你不小心，LLM 就在拿你的数据训练。

如果产品是免费的，那你就是产品——**我们**就是产品。所有模型公司从我们的使用中收集的训练数据，都不受企业用例那种规范和围栏的约束。这就是为什么企业要为消费者免费拿到的东西付大价钱。所以我们就是产品，它在学习你所有的行为。

### 4.4 一年后的安全架构会长什么样

**Rory：** 一年后的安全架构是什么样？是同样的东西做得更好更快，还是有一些全新的、你必须彻底换个方式去做的事情？是同一个问题只是速度更高，还是"我操，我们以前根本没想过这个"？

**Nikesh：** 两者都有。

网络安全从根本上是件相当直白的事：如果是**已知的坏**，我在门口就把它拦下。你带着枪冲进来，我知道你是谁，我在边界上有安保，我拦住你。问题是，**没有任何一次网络攻击是因为我拦住了已知的坏而发生的**。每一次攻击发生，都是因为——

**Rory：** ——你不知道它是坏的。

**Nikesh：** 你不知道它是坏的，直到它进了你的基础设施。所以问题变成：如果是已知的坏，你在边界拦住；如果它进来了，你多快能找到它、在它造成伤害或损失之前拦住它？

所以从网络安全的角度，**你想做边界生意**。你想尽可能多地覆盖世界上的边界端点，因为那会成为一门可持续的生意。我覆盖的边界越多，我的业务寿命越长。所以我在端点上、在设备上、在服务器上、在防火墙上，我在为世界上多种基础设施组件预测边界。这很好。

现在问题是：我发现已知坏的速度会因 AI 而改变。有一个概念叫数据分类，你得写静态规则。结果呢？LLM 从内容角度能快得多地把它识别出来。我们追踪世界上每一个恶意网站——AI 能更快告诉我这是恶意网站吗？能。所以我边界安全的**成分**会因 AI 而改变，但**在线拦截这个动作本身仍然是需要的**。

所以当人们跟我说"OpenAI 要吃掉你的午餐""某某要吃掉你的午餐"——猜怎么着？不存在没有边界安全的场景，也就是说我仍然需要拦住坏人。他们会成为我产品里的一种成分，但他们不会把我挤出局，因为人们的基础设施边界上有各种各样的东西。

另一部分是：如果你想把基础设施里所有坏东西找出来、找出那个坏演员——想象一下把所有企业数据收集起来，在上面跑一个 LLM，说：给我找出所有异常的、你从没见过的行为。

我现在**每天摄入 19 PB 的企业数据**，在里面寻找异常行为。我有机器学习技术，有静态技术，有规则。那我也会往里塞点 LLM，纯粹看看它们能找到什么。如果我能用 LLM 在你的基础设施里更快地找到那个未知的坏演员，我就能检测并拦截它。现在我们用机器学习是**一分钟**跑完的。这是好事。唯一的问题是，只有 **1200 个客户**买了并部署了它，我需要让世界上其他人都去买并部署。这是问题的第二半。

### 4.5 Agent 与"agency"的区别

**Nikesh：** 第三部分是：有一些全新的、**完全没有建立任何安全护栏**的东西——agent。

全世界都在谈 agent，我们可以专门做一期 90 分钟的节目：什么是 agent？什么才真的算 agent？你怎么赋予自主权（agency）？你怎么控制一个 agent？

好笑的是，人们跟我说他们把某个东西"agent 化"了，然后我问：它真的有 agency 吗？那到底是什么意思？我说，Waymo 有 agency——它能在没有人类干预的情况下把你开进墙里。这是个糟糕的问题。

但大多数人其实并没有给他们的 agent 赋予 agency。他们跑的是被冠以 agent 之名的**高级工作流**。而当你开始给东西赋予 agency、当一段代码可以决定接下来发生什么的时候，我们就要有一场完全不同的对话了：你怎么保护这些 agent 的安全？你怎么建终止开关（kill switch）？你怎么在线拦截它们？你怎么阻止它们做坏事？

就像——是的，它是个 agent，它应该做这件事，然后它拿走了 Jason's Gems，现在全世界都会知道 Jason's Gems 是什么了。（笑）

## 五、Moonshot 以 350 亿估值融资 35 亿：开放权重模型的商业模式

**Harry：** 我们说过要聊中国。Moonshot 完成 **35 亿美元**融资，估值 **350 亿美元**。

**Jason：** 如果它免费，那你就是产品。Moonshot 是免费的。

**Rory：** "如果免费你就是产品"这句话完全成立，尤其在消费侧。但这里有意思的是，我不确定它在这个语境下怎么成立。

换个说法：这些开放权重模型真正有意思的地方，是它们对美国闭源前沿模型公司的**价格压制作用**。如果你自己也跑推理，那我理解这个商业模式——模型免费，推理是你赚钱的地方。但从长期看，一个开放权重模型公司能不能在完全不以某种方式变现的情况下持续经营，我不太确定。

等到 Reflection、Thinking Machines 这些美国公司的模型开始出来，看看"以开放权重模型为其中一部分"的商业模式究竟是什么，会很有意思。肯定不会是"嘿，下载吧，随便玩，你想在哪儿干嘛就干嘛"。开源已经演化出了服务支持的商业模式，所以中期看这些公司会演化出哪个版本的"免费即产品"，会很值得观察。

### 5.1 平均智能会免费，卓越智能会付费

**Nikesh：** 长期来看，**平均智能会变成免费的，而平均智能会越来越聪明。卓越智能会有人付钱。**

**Harry：** 能不能带点语气再说一遍？

**Nikesh：** 我前几天听人说，如果你对着麦克风大声耳语，人们会凑近、更专注地听。那我再说一遍：长期来看，平均智能会是免费的，而平均智能会越来越聪明。

**Harry：** 但你觉得我们会更少依赖前沿智能吗？

**Nikesh：** 不，我们会需要卓越智能。我们需要卓越智能来发现癌症的治愈方法，需要卓越智能把火箭送上月球，需要卓越智能去建太空数据中心。那些是卓越智能的任务，仍然需要极其聪明的人或者极其聪明的模型。而人们会为此付钱，因为结果太惊人了。

我不认为你需要花 600 万美元的 token，去回答一句"我能帮您什么忙？非常抱歉，您的网络连接不通"。

**Rory：** 对，客服不会用前沿模型。

**Nikesh：** 也许吧。当然长期你是对的。但短期内，客服正在需要越来越多的 token 去做越来越复杂的问题解决。

**Rory：** 这正是所有这些开放模型盯着的头号目标：用开放权重微调，说"我不需要幻觉，我需要的是这个"。我认为从"造出一个前沿模型或任何模型"到"把它变成在企业语境下有用的东西"之间，还有大量工作要做。

**Nikesh：** 抱歉我又回到 Waymo 的例子，因为我觉得那是最直白的一个。我坐过第一批 Google 自动驾驶车。我不知道 2009 年我在那儿工作时是怎么想的——那是一辆装了一堆摄像头的雷克萨斯。它在高速上把我从旧金山开到圣马丁，我的手离开了方向盘。然后晚上 11 点它让我接管方向盘，而我当时正开在四分之一的墙边上，我就接了。

我当时挺放松地想：也许我拐错弯了它自己会搞定，因为它这么聪明地开过来了。结果不是的，兄弟，它一关掉就不开了。那是 2009 年。**在那之后又花了 14 年**，把所有边缘案例都从机器学习角度训练出来，我们才能依赖它、才把 agency 交给那个替代品。

所以我不认为我们短期内会把 100% 的 agency 交给某个用例。而要做到那一步，我们需要创造的数据采集量和语境量将是巨大的。基本上你必须把客服里的每一个边缘案例，都塞进你组织的 AI 大脑里，才能开始依赖 AI 而不是人。

你现在能拿到 80%——客服问题解决了 80%，所有边缘案例还等着 AI 来解决。

**Rory：** 然后还有一个问题：对一个给定的应用，多少价值纯粹来自模型，多少来自其他所有东西？对客服这类场景，你大概是把收入的 **10% 到 15%** 付给智能，剩下的全是把这份智能在"回工单"这个语境里变得可执行所需要的其他东西。

我们看的一个很有意思的指标是**应用层的 token 占总收入的百分比**。它的范围是：像 Salesforce 那种、我们投的一些公司，大概正负 **10%–15%**；而编程类的显然是 **70%–80%**，这意味着那就是低智能加一个轻量的外壳（harness）。这两者非常不同。

**Nikesh：** 我认为未来三四年，我们付的不是智能的钱，我们会**为算力付到肉疼**。

## 六、能源与算力：Valar Atomics、鸡粪与核能

**Harry：** 我们经常被批评太关注公开市场、太关注 Anthropic 和 OpenAI。Valar Atomics 估值三倍跳到 **60 亿美元**，押注为 AI 供电的核能。这是一家三年历史的小型模块化反应堆公司，此前融了 20 亿，现在这轮 60 亿。特别是有一个英伟达的合作来给 AI 数据中心供电，引发了大量兴奋。

**Nikesh：** Harry，我见过一个人，他做的生意是把鸡粪转化成甲烷来产气。我当时想，噢，挺可爱的小项目，他在中部某个地方跑着。然后他告诉我这里面有钱，几十亿美元，而且他在把能源卖给超大规模云厂商。

所以现在**任何人只要能生产任何能源，不管你是什么，都在按倍数交易**。因为——**土地、许可、能源、算力**，这就是未来三到五年会被定价的东西。

我觉得问题几乎会变成：Anthropic 和 OpenAI 之间，谁在未来三到五年能拿到更多算力？那才是人们要买的东西。现在算力非常难找。你可以拿走所有你想要的免费中国模型，但你要在哪儿跑它们，Jason？

**Jason：** 顺着 Nikesh 的话说——我第一家创业公司做的是先进储能，鸡粪这类东西以前是算不过账的。这些模型以前也是能跑通的，字面意义上的鸡屎。牛粪也是。我甚至看过这些项目。但利润率太低，内部收益率太低。

而现在这生意成立了，因为 AI 对算力的需求太大了。所有东西都成立了，包括各种核能，比如 Valar，也包括鸡粪。你笑，但我记得当年跟一个做粪肥的农场主聊，他说：一切顺利的话，我们能承诺的最好回报是年化 8%。这种回报很难让 20VC 兴奋起来。

**Harry：** 我从没想到会在这个节目里聊这个。

**Jason：** 在 AI 之前，储能里没有任何东西是成立的。还有那家电池创业公司——刚融了 120 亿的那家叫什么来着？这些东西没有 AI 都不成立。内存也是。这些产品以前都算不上多好，现在它们成了世界上最棒的产品。给我内存吧——我的 Mac Studio 连超过 64GB 都配不到。

**Rory：** 我给大家把这三家的事实理一理。Valar 和 Base Power 虽然都很有意思，但很不一样。Valar 纯粹是"我们需要更多电力给算力"这个赌注，他们确实接上了一块英伟达芯片，基本演示了你可以达到临界、可以发电——但这不废话吗，我觉得大家都知道。

要说清楚的是，所有这些东西的**监管路径仍然是个大坑**，说的是你什么时候能持续地接上电网。

有意思的是，这些里有一批是私有的、一批是上市的。我认为 **NuScale** 是那家做已被充分理解的现有技术的公司——轻水堆，不是新型核能，就是"我们迄今为止就是这么造的，基本一样"，而且它在监管路径上走得最远。而其他这些公司，包括 Valar 和 Oklo，做的是各种新东西。

大问题是：在你拿到"它能工作"的初步演示之后，监管路径怎么走？你必须非常支持它，因为不搞核能就没办法拿到更便宜的电。所以从公共政策角度：加油。但从"别急着花这个电"的角度：你得一路犁过官僚体系。而且在某种层面上，你确实希望在批准这些东西之前，人们保持适度的谨慎——我会说，比过去 30 年（我认为我们扼杀了创新）要少谨慎一些，但可能比你现在想要的稍微多谨慎一点，好把事情做对。所以前面有一段审批的路要走。

## 七、一切都回到算力，以及那两家公司

### 7.1 无限需求 vs 谁来变现

**Nikesh：** 我们在辩论的问题其实是：钱会流向哪里？我们要为智能付多少钱？而一旦我们为智能付钱，就说到算力。

Harry 肯定想让我们聊外面正在发生的所有资本开支。**总有一刻，得有人为所有这些算力买单**，而那笔钱必须来自某个版本的"有人为 AI 付费"。那才是让 Valar 们和鸡粪世界真正值钱的唯一东西。

**Rory：** 是的，最终得有人在美国企业界买下一万亿美元的 token。

**Harry：** 欧洲企业不买吗？

**Rory：** 如果我们买一万亿，他们会在十年后买五千亿。我不想这么刻薄，但作为一个前欧洲人，我可以这么说。

**Harry：** 这难道不是又一层依赖于——按 Rory 你的说法——OpenAI 和 Anthropic 继续冲、继续打到那个数字的公司吗？我们从来没有过这样一个生态：如果 OpenAI 和 Anthropic 达不到 2027 年的数字，它会被错位得如此严重。

**Nikesh：** 我不这么认为。OpenAI 或 Anthropic 是否达到他们 2027 年的数字，与"当下对 AI 存在无限需求"这个事实是**正交的**。而这份需求需要由算力来满足。至于是 OpenAI 建数据中心、还是它出钱、还是别人出钱，市场上的需求是在的。

想想现在的情况：我认为**大约 70% 的 AI 算力需求是被免费搭车的消费者消耗掉的**。所以也许会有一次配置的调整，也许随着企业有更好的变现能力，我们必须给企业分配更多算力；或者你会发现消费者变现的承诺最终开始兑现。

大家都在说，为什么 agent 不能帮我订机票、帮我买东西、帮我订餐厅？这些是简单用例，我不需要先解决癌症才能让这些跑起来。这些一定会跑起来。等这些跑起来，消费侧就会有变现机会。

所以我从第一性原理相信：会有海量算力被需要，去满足消费和企业两侧的 AI 用例。**至于哪个玩家最终把它变现，那是市场要决定的问题**——那是个时点问题，跟 Leo 的问题没有本质区别，是"谁来建立这个能力和服务"的问题。Google 也不是第一个搜索引擎。

### 7.3 执行力会重新变得重要

**Nikesh：** 但问题变成：市场会支持这些里的哪些？市场会因为相信你是被选中的赢家而给你无限资本去建算力吗？还是市场认为你的经营方式不同、并希望你换个方式经营？

### 7.4 从模型到语境（context）

**Nikesh：** Jason，我认为模型会越来越好，而模型之间的差别将不足以让你决定拔掉哪一个。因为我认为我们已经开始建、并且未来三到五年会一直在建的那部分，是**语境（context）**。

想一想：我经营一家简单的防火墙公司——一家复杂的简单防火墙公司。你想插哪个模型都行。但**模型不知道我客户的基础设施为什么宕了**。它不知道我的客户在用什么产品，不知道用什么操作系统，不知道客户的配置是什么，不知道前五次为什么会这样。客户的所有那些知识、所有那些学习，都是由我以向量数据库和上下文内学习系统的形式捕获的。

这就是我团队在做的事。**我现在收集语境的人比以往任何时候都多。**这有点像 Waymo 那件事：我雇人去标"这是一棵树"、"这是它宕机的原因"。

当我把那个组织性的语境建起来之后，我就可以插任何我想要的模型。而模型的差别将不再重要，因为语境会变得同等重要，甚至可能更重要。

**Rory：** 这和微软最近关于 agent 公司、以及企业需要自己建价值和语境（而不是从模型那儿拿）的评论完全一致。

**Nikesh：** 他说的是另一回事，我理解他说的，但我的评论不同。我认为这里有三部分：

1. **模型**，也就是原始智能；
2. **回答你的查询、解决你的问题所需要的语境**；
3. **训练这个生态所需要的语境**。

我说的是第三种——训练生态所需要的语境。也就是说，我把 Palo Alto 有史以来的每一个客户案例都转录下来，让我的模型知道什么是好答案、什么是坏答案。

**Harry：** 那你会在哪个核心模型上开始堆这些语境？你决定了吗？

**Nikesh：** 我记得整件事刚开始、还是个叫 LLM 的闪亮物件的时候，我打电话给 Google 的 Thomas Kurian，我说：嘿，我需要造一个网络安全模型吗？他说：兄弟，随着时间推移会发生的是，模型会越来越聪明，而小模型不会有大模型那么聪明。他是对的。

而在某个时点上，如果你的"平均智能"变得足够聪明——就是我刚才说的那句——那么"稍微更聪明一点还是稍微笨一点"的区别，就不如**懂领域、懂语境**重要了。所以我认为未来五年我们会走向一个世界：**领域知识与模型智能同等重要**。

**Rory：** 这和微软那个说法还是不同的。它不是说你可以把每个问题拆给多个模型而不把语境带给模型去回答。他给的是一个架构论点：把所有语境放进一个我提供的、坐在模型旁边的外壳里，然后你想用哪个模型用哪个，把模型商品化。而每一家模型公司都在说：不，我要让我的模型比语境更聪明，否则它就被商品化了。所以这是一场"模型" vs "模型+语境"之间的商品化之战。

**Jason：** 但 Nikesh，就这一点你还说了一件不冲突但相关的事：你把所有智能和语境放进向量数据库，然后你可以在上面挑选 LLM。但正如你说的，**不同的 LLM 表现并不一样**——即便是 Opus 5 和 Fable。Palo Alto Networks 有一个团队能管理这些变化，你们边做边学。那那些团队没有你们强的普通企业呢？他们真的能换掉这些 LLM、并且相信结果会一样吗？

## 八、大厂财报：云在加速

**Harry：** 我们提到过微软和 Google 被告知"你必须跳这支舞"。两三年前，我们看到它们全都出来说资本开支我们会继续花，而且可能还要加。我们怎么分析这些结果和市场反应？微软和亚马逊的云都明显加速，数字非常惊人。Rory，你要不要先铺一下背景？

**Rory：** 这次有四家公司的财报是相关的：亚马逊、Google、微软和 Meta。

大图景是：**有云和推理生意可卖的人，都有一个了不起的季度。**Google Cloud 最小，增长 **82%**；AWS 在那个体量上增长 **37%**；微软因为把一堆东西打包在一起总是难判断，但增长在 **20%–30%**。

所以大图景的评论是：大家看到了海量的推理需求，因此人们说"我要买更多算力"，因为看起来我能把算力变成钱。尤其是 AWS 的 CEO 做了非常斩钉截铁的 ROI 表述，非常出色，市场非常高兴。亚马逊和微软的估值被显著上调。

而对照之下，Meta 也说我要花很多钱，但它赢的是"僵尸"[原句失真，存疑]、而不是赚钱。

回到刚才那层意思：最令人意外的是——天啊，这些数字真的很强。**所有这些人都在卖出海量的算力。**这些加起来大致是 4000 亿美元级别的年化收入业务，而它们增长了 30%，意味着这四家公司在算力上一年多出了**一千亿美元的收入**。这个规模本身容易被忽视。这对我来说是最大的"啊哈"。它会持续吗？鬼才知道，我们可以再聊。但地面上的事实是：二季度的新信息是**看多的**。

## 九、Palantir 为什么跑赢

**Jason：** 对我来说，刚发生的 Palantir 更有意思：增长接近 **100%**，订单增长 **153%**，还有积压订单。这说明你确实能把 AI 卖出去。

**Harry：** 我们该从中得到什么？

**Jason：** 我觉得我们该做的是把它发给我们的被投公司，告诉他们更努力一点，因为没有借口了。Palantir 都能做到——他们四年前还只有 15% 的增长——你们为什么不行，孩子们？更努力点。

我不知道信息是什么。但按 Nikesh 的说法：如果你能把智能打包并捕获，需求是无穷无尽的。而且你还能捕获某种程度上……某种意义上 Palantir 就是**架在海量数据之上的一个非常精密的外壳（harness）**，也许还有 Nikesh 说的向量化数据库。我可能说错了或者简化过头了，但他们在 AI 时代把这件事捕获到了一种魔法般的程度。人们需要用数据解决这些问题，他们需要答案。而 Palantir 用不到一千个客户——一千零四十九个客户——提供了 **80 亿美元**的答案，还在 100% 增长。**这一千个客户愿意为用 AI 回答这些问题付几乎任何价格。**

**Nikesh：** 我们正处在一个资本开支周期里。未来一年，这些人加起来大约有**一万亿美元的资本开支承诺**。而市场很好：我看到这些超大型公司有能力为这一万亿资本开支融资，并且有迹象表明他们正在为其中一部分资本开支拿到回报——因为价格更高，因为人们要求部署 AI、部署云。这是好消息。**那个资本开支错位今天没有发生。**

它明天可能发生——如果这些承诺资本的人拿不出资本的话。但就目前而言，我们在轮盘桌上还能再玩一把。我们被告知：这个市场会一直支持资本开支，直到它支持不动为止。

我认为这有点像淘金热时刻。我认为未来五到十年，每一个消费级 App 都会被重写。为什么我的 agent 不能跟我的 DoorDash 或 Uber App 对话？为什么我得一个个打开、点七次、而且它没有任何语境和学习？所以一切都是可争夺的。**每一个曾经放上 iPhone 的消费应用都得重做，每一个企业 SaaS 应用——你们刚才辩论的——也都得回炉。**所以需求、建设量、所需要的工作是巨大的。

我们就假定这一定会发生。这个市场正在证明：只要市场能持续为它融资、只要时点对得上。我认为我们现在唯一最大的问题是**时点问题**：收入能不能足够快地出现，来持续为资本开支周期融资？还是会出现资本开支与产出之间的错位？

电信行业对此非常熟悉，因为他们过去花几十亿建 3G、4G、5G，然后回报要更晚才来。他们经历过资本开支周期，这在市场上是很成熟的。而看起来我们现在经历的是一个**压缩版**：资本开支和收入必须靠得很近才行，因为这些数字实在太大了，不可能长期靠投机者来融资。这大概就是我们看到的，也是为什么它又把 OpenAI 和 Anthropic 的辩论带回来了。

但**他们拿不拿得出钱不重要，总会有人拿得出，因为需求在那里**。

我认为下一次错位可能出现在**算力的供给侧**：他们可以把所有资本开支都调动起来，但按 Rory 的说法，Valar 们可能拿不到监管许可；欧洲可能不允许建数据中心；你可能会发现 30 个州说我州内不许建数据中心。所以算力侧会出现一个供给问题，这会连带影响我们所有的基础设施和半导体朋友——他们会说，糟糕，看起来他们造的这些东西没有我们以为的那么快出得去。

我认为这就是市场机制层面我们所处的位置。我不认为存在需求问题，不认为存在就业问题，也不认为在"我们所有人都想重写这些东西"的意愿或意图上存在问题。

按 Jason 的说法，为什么不呢？Palantir 已经在派对上了。他们都在说：我可以帮你打包、帮你把它讲通，你有能力、有资源，让我确保你不会在这波技术浪潮里灭绝。

我要回到 1997、1998、1999 年——上一次我们见到那种关键的技术转折，叫互联网。很多特征是相似的，只不过那时候你不需要一万亿美元来持续建设互联网。

## 十、企业消化能力才是真正的约束

**Rory：** 顺着你所有这些评论，有意思的地方是：如果最可能的失败模式不是最终需求（我同意不是），而是**企业按这个速度消化的能力**——那么在某种程度上，如果企业消化不够快、支出因为上不了线而放缓，它可能恰好和企业的消化能力同步。

**Nikesh：** 或者说，消化得好的赢，消化得差的会胃灼热。

**Jason：** 那些数据确实显示：快速消化 AI 的公司比不消化的公司跑得更快。我猜按你的说法，比如你在金融行业，你的竞争对手在用先进 LLM 做交易而你没有，那么在某个时点，你就会变成 Bending Spoons 的猎物。

**Harry：** Nikesh，你觉得那些更成熟的企业能无限地处理这种变化速率吗？你觉得他们已经永久地改变了吗？

我现在从很多供应商那里发现的是，比如去年他们签的是一年期承诺，而以前可能是三年、五年或七年。他们说：世界会变化太多，我想先看看 agent 和 AI 会怎样。这在今天完全理性。但大多数企业从营养学上说是不可能每 8 到 12 个月重建一次整个技术栈的——那对组织是破坏性的。但你的意思是，这恰恰是今天获胜的技能。你觉得这变了吗？还是我们会均值回归到"每五年才能处理一次变化"？

**Nikesh：** 我认为企业吸收、消化、或者说把这件事变成自身优势的能力，取决于**他们创造训练数据的速度**。而我认为关注训练数据的人还不够多。

这不是 Palantir 能替我解决的问题。这不是 Fireworks 能替我解决的问题。**这是我必须自己解决的问题。**

回到同一件事：我一年收到 **40 万个客户案例**。案子进来的时候我知道，但我没有足够的语境。某个人把它解决了。我不知道他们是怎么解决的，不知道他们用了什么逻辑，但他们解决了。我需要钻进那些解决问题的人的脑子里，把那些知识抽象出来、提取出来、编码化，这样我下次遇到同样的问题时才能写出自己的行动手册和规则。

所以我告诉我的团队：**每一通新电话、每一个新案子都是一次学习机会。**不只是解决它，你必须学习。

企业必须进入这种学习模式，就像你永远不该让你的财务副总裁自己拍板——你应该说，每次财务副总裁得出一个结论，你必须把它呈报给那个叫 Jason 的人类，说"亲爱的财务副总裁，记账吧"，因为我们每一笔交易都要记账。你必须把组织知识交给某个你必须自己建的学习系统。

我认为这在每个企业、每个用例上仍然需要三到五年。而我认为这正是我们没在关注的东西。

同样的逻辑适用于 SaaS 公司：他们都得去重建技术栈，但**重建栈是容易的部分**。我很确定如果我愿意，Fireworks 会收我的钱、帮我微调一个开放权重模型，并把我的用例训练到某个程度。但再往后，**我怎么从 70% 的准确率走到 99%？**那才是问题。

**Rory：** 关于你说的"学习"，我刚在确认引文是否准确——达尔文那句话说，能生存下来的不是最强壮的物种，也不是最聪明的，而是**最快学习（适应）的那个**。我认为你在这点上是对的。做到能更快消化，将是未来五到十年最关键的管理技能。

而 Palantir 卖的、以及它做得这么好的原因，就是他们能说：兄弟，我们知道这是你面临的最大问题，我至少有某种答案，让我来帮你，给我一千万美元，会很棒的。

**Nikesh：** 那可能低估了 Palantir 在做的事。AI 已经展示出一种能力：它能爬梳巨大的数据语料，做总结、寻找异常行为、寻找趋势、捕获它们、围绕它们推理并得出结论。

好消息是，如果你在做任何进攻性的工作、如果你在寻找惊人的洞见——它可以爬梳 PB 级数据，产出 20 个惊人洞见，你可以去评判说其中 15 个还行、5 个非常棒。而那 5 个非常棒的会改变我的 ROI，给我的营收带来 200 个基点、给我的利润率带来 100 个基点。那你就已经把所有成本都赚回来了。

所以你必须把一个学习系统落地。它就是把企业数据拿来做这些事。我认为像石油勘探、国别分析这类需要大量人去写代码的领域，以后不需要那样做了。

---

## 十一、其他头条速览

**Harry：** 最后几条。Scale AI 有了新 CEO[后续细节 ASR 失真]。我们提到过数据的重要性，Scale AI 显然是最大的数据提供商之一。……我们看到 Visa 裁员 2600 人。Nikesh，你说这不是就业问题，但 Visa 的 CEO 说这是效率、是重塑工作方式。

还有 Rory 把 DroneDeploy 卖给了 Procore。恭喜 Rory，13 年的旅程，了不起的结果。

## 十二、DroneDeploy 卖给 Procore：Rory 的复盘

**Jason：** 我能问 Rory 关于 DroneDeploy 的事吗？因为它和我们开头跟 Nikesh 聊交易的话题连着。

DroneDeploy 被 Procore 买了。经典的软件创始人故事：为房地产/建筑行业做软件，跑得很好，然后增长放缓，最重要的是净新增客户数基本停止增长，增速降到 17% 左右。

于是 Procore 下了一个大赌注。我不是 DroneDeploy 的专家，Rory 显然是——但他们买了一个下一代平台，用无人机去加速建筑行业。结构上有意思的地方是：**Procore 的市值是被打压的，它得拿出 9 亿美元，其中很大一部分是债务，付 11 到 12 倍的价格，而它自己只在 4 倍上交易。**

我发现这种交易在过去是很有压力的。我不是说这次是这样。但这不是 Palo Alto Networks 花市值的 0.01% 去买几个聪明孩子，这是**押上全部身家**，而且是在高得多的收入倍数上。它不是"不成也行"的交易，这是大赌注，而且不便宜。你会说它便宜，因为你在董事会里。但 Procore 会觉得，自己在 4 倍上交易却要付 12 倍，这很贵。

我们这期就是从 Airtable 的三倍还是四倍开始聊的，而 Procore 基本也在那个位置上交易。所以这笔交易压力超大吗？你掉头发了吗？有人对着窗户大喊大叫扔东西吗？

**Rory：** 我不替收购方说话，因为我不在房间那一侧。但说实话，这是我做过的压力最小的交易之一，因为我本来非常乐意继续持有。**这不是一个创始人疲劳的情况。**

我觉得这里有两三条有意思的教训：

**第一，当你有资本纪律、融资规模克制的时候，你是被设置成走向成功而不是失败的。**我们每一轮融资的估值都低于我们卖出的价格。我们没有融很多钱。我们是盈利的。它就是一家增长不错的、不错的小公司。

**第二，我们跟趋势是朋友而不是敌人。**有些非常基础的 SaaS 公司，你回头看会说：发生了一次平台转移，而你站在了错误的一侧。而当你的软件是在赋能无人机和机器人的时候，你其实站在未来那一侧。

事实上，我十年前投资学到的一个教训是：**在物理世界里，AI 发生得慢得多。**发生的时候很惊人，但确实慢。我回看十年前，我以为无人机五年前就会爆发，结果是现在才真正开始爆发，机器人也一样。所以花了很长时间。

所以我们其实是在这条曲线的上升段，感觉非常好，我们乐意继续持有。然后显然我们收到了一个让我们做出不同选择的报价。

我想说的是，建公司很难。通过保持纪律、把自己放到有利位置，创始团队做得非常出色——三位创始人到现在都还极其活跃地参与其中。所以不，这真的一点压力都没有。就是：在合适的价格你会做这笔交易，在另一个价格你不会。

从远处看，我觉得对另一侧也非常有意思。我认为**市场扩张**正是这些领域里需要做的事——Nikesh 大概做过这类大的战略动作——你得说：我这块蛋糕就这么大，我需要加上我客户想要的下一样东西。而在某种层面上，客户不仅想知道他建筑项目的账目，也想知道项目的**物理进度**。那正是实体巡检这类东西在做的事。

---

## 十三、并购纪律：什么时候一笔交易变成"必须做成"

**Jason：** 一笔交易占市值多少百分比的时候，它就变成一件"天大的事"、一个核心战略性的"这必须成"？

**Nikesh：** 听着，**每一笔交易都必须成**。我们不是因为钱多、或者股东觉得我们该到处乱花才去买公司。我认为我们对命中率的要求比 VC 高。

过去八年我们买了 **40 多家公司**，我想说大约 **75% 成功了，25% 没有**。

我们最大的一笔交易是 **280 亿美元**，现在的估值大概是 **500 亿美元**。那一笔必须成，那是一次定义职业生涯的操作。如果你在市值 2000 亿的时候花 280 亿——也就是市值的 14% 或 16%——去买一个东西，那它最好能成。

而当你把它做成之后，市场会因为你能把交易做成而给你信用。我在财报电话会上说这些，他们会说"哦，他吓到我们了"。我的意思是：**你必须把大的做成。如果你做不成大的，你就失去了经营这门生意的执照。**

**Rory：** 那笔大的是 CyberArk 对吧？

**Nikesh：** 是的。我们的论点是：agent 会很重要；如果 agent 重要，它们就需要身份，而且需要被当作**特权身份**来对待。这就是我们的论点，非常简单。

**Rory：** 就像所有最好的交易一样。我的一位合伙人常说：**如果你不能用一句话说清楚，它大概是个坏交易；如果能，它大概是个好交易。**

**Jason：** 那按我那个例子——你不知道这些 agent 会干什么。你的做法就是限制 agent 的行为？但天哪，它们太好用了，太强大了。

**Rory：** 顺着这个说，我昨晚读到一些东西正好讲这个：如果你无法明确它们在做什么，你就必须非常清楚它们**作为身份是谁**、以及它们**被允许去哪里**。就像我说的这种"AI 员工"，你不太确定它会干什么，那你就得非常严格地限定它能访问的系统。

**Nikesh：** 我完全理解你的点。唯一的危险是你把它推到极端——那就叫**自动化工作流**，那是确定性的产出。如果是确定性产出，你过去 20 年就已经有这个技术了。所以问题是：**你在什么时点允许一个 agent 去思考？**这才是大辩论。

**Jason：** 但反过来说，它干得真的很好。我们没有完美的安全配置，但即便以我们现有的——一个 agent 大概有一千条规则，其余的大概有五条，或者零条——即便在零到五条的情况下，从一月份模型升级以来，99% 的时间都相当不错，最近这几个月非常好。所以这是个权衡。

**Nikesh：** 只需要一个破坏性的例子，就足以让一切崩解。你给它银行账户的访问权限试试看。即便你有财务和代数校验，我也希望有一个组织在把关。

---

## 十四、Scale AI：我错了

**Rory：** 说到有人判断错误，我要说我在一件事上完全错了：**Scale AI**。

他们把那门生意延续下来了——我原以为那次收购（人才被挖走后）会只留下一个空壳。但我认为这证明了一条你隐约知道、却容易忘记的规则：**当你身处一个很棒的市场、并且有一个能满足那个需求的产品时，即便你失去了最顶尖的人，也没关系。**他们卖的是数据、数据产品，面对的是对数据永不满足的需求。我给他们很大的赞誉，他们把这件事撑住了。

**Jason：** Windsurf 卖给了 Cognition，对吧？

**Rory：** 对，双方都卖得很快。而 Scale 这个更令人印象深刻，因为一年前我甚至称它为空壳，他们确实像被掏空了一样。但我错了，他们从中造出了一门生意。所以全部功劳归他们。Groq[存疑] 也可能是下一个——他们在用自己的技术提供托管推理。

**Rory：** 我是说，**在永不满足的需求面前，一切皆有可能。**

**Harry：** Nikesh，太精彩了。非常感谢各位，非常感谢你抽出时间。

## 二、现货 vs 合约算力：为什么"是否需要信贷"是六个月的关键问

**Gavin：** 在 2024、2025 年，哪怕你极度看多，你也只是认为 GPU 价格会"缓慢下降"；看空的人认为会"断崖下降"。没有人在 24、25 年认为"老 GPU 的价格会垂直上涨"。大家都想"我们要聪明点、签这些长期合约"——很多 neocloud（新型 GPU 云）不得不这么做，因为他们需要一份"包销协议（offtake agreement）"才能给 GPU 融资。于是你有了一批"已签约的存量算力"，它们的定价相对当前现货市场是巨大的折价。随着这些合约到期、算力被重新以更高价定价——现货可以下跌，而算力仍会被重新定得更高。我认为你会看到大量加速，回答那些 ROI（投资回报）问题。

这个季度你已经开始看到了：微软、Meta、亚马逊报告的经营性现金流（不是自由现金流）从（同比增速）28% 加速到 32%。而且这季度有一些相当大的"异常项"——这些超大厂总有数十亿美元的异常法务开支（多半是给欧盟的罚款）。若剔除这些一次性项，增速是从 28% 到 35%——在这个体量上是实质性的加速。而这还是在他们开始"点亮 Rubin（英伟达下代芯片）"、以及这些合约重新定价之前。

## 三、这个月是怎么走到这里的：Meta 出租算力、Kimi、开源恐慌、DUV、信用利差

**Gavin：** 首先，Meta 要出租算力——这被解读为极度看空："他们有过剩产能、要砍资本开支、这是灾难。"但完全不是这么回事。他们没有砍资本开支。真相是：他们看到 SpaceX（xAI）有庞大的存量算力、并把一些大型"训练优化集群"以相对那些合约价的巨大溢价卖进市场，分析师也看到了这个机会。有很多猜测说 Meta 要融资——也许他们想的是"我们先用一小块产能证明能产生很强的 IRR，然后再融股权、大干一场、甚至提高资本开支"。看起来他们没那么做，但市场还是因为负面解读而抛售了。而我很确信这不是负面的——我们对 Meta 的资本开支计划有很多"遥测（telemetry）"，那些遥测一点没变，如果说有变化，是他们变得更激进了。之后不久他们发布了很久以来最好的模型（Meta 的新模型，ASR 作 "Use 1.1"，名称以发音为准），一款很好的模型、被 Grok 4.5 盖过了风头，但比过去两年任何东西都好得多。所以他们绝无可能松油门。

然后 Kimi 出来了，围绕开源的巨大恐慌爆发。与此同时，Silicon Data 的 token 指数下沉、走平。而这个指数捕捉的是"结构（mix）"、看不到所有 token；因为 GLM 5.2 和 Kimi 花了一段时间才"层层渗入"，数据里出现了一次"结构切换"——从更贵的前沿 token（推理毛利可能高达 80、90、95%）切向开源 token。市场不知为何认为这是负面的，但现实是：**一个 token 就是一个 token**。其他条件相同，生产一个 token 需要完全相同的算力——同样的 FLOPs、同样的内存、同样的瓦特。开源夺取份额，所做的一切只是把利润美元从"前沿模型层"抽走。而通过驱动 token 需求，那里存在弹性——你对算力的需求更多了。Anthropic 和开源都跑在相同的底层云上、按相同的算力计费。所以你只是把利润从前沿模型转移、并把更多利润美元推进 AI 基础设施层。

**Patrick：** 黄仁勋（Jensen）是世界上最大的开源支持者——一个超理想主义、爱国的美国人。但若开源对他生意不利，他还会是最大的支持者吗？

**Gavin：** 即便如此，只要它对世界是对的，他还是会支持。而且我认为开源对世界真的很重要——一个"只有收 90% 毛利的前沿模型"的世界，对人类不好、对社会可能也不好。我们希望有很多模型。

然后：中国有了 DUV 光刻机（的消息），大家说这引发了对半导体设备（cap equipment）的大抛售。接着我们到了在很多方面才是"真正担忧"的地方——实际利率上行（这说得通，我们在大举投资为这轮建设融资，信贷确实是越来越大的一部分，尽管多数仍靠经营性现金流）。于是实际利率上行、利差走阔。Meta 上周发了一只债，定价并不在"你以为 Meta 债该定的位置"。这显示信用市场、CDS（信用违约互换）在"炸开"——每个人的 CDS 都在走阔。很聪明的私募资本人士说"这正是你会预期的、只是银行在对冲它们的承诺敞口"。但无论如何，这看起来不妙——而这些是不可否认的事实：CDS 上行、利差走阔、实际利率上行。**如果我们需要债务来给这轮建设融资，这会非常非常吓人。**而这正是"存量算力的现货 vs 合约定价差"如此重要的地方。

**Patrick：** 这就是经典的"资本周期（capital cycle）"——用债务过度扩张，然后债务驱动的建设要求即时偿还，一旦供需稍微失衡，事情很快就崩。互联网泡沫就是这样。

## 四、Blackwell / Rubin 的变现建模：为什么共识低估了经营性现金流

**Gavin：** 如果你像我这样相信（这个月之后我极度开放、把这些全压力测试了一遍，尤其在信贷上深挖，因为"若需信贷才能建，这是重大负面"）——如果你把它建模出来：看那些"应当上线的吉瓦（gigawatt）"和超大厂的共识估计，它们实际上是被"按 Ampere 的变现速率"建模的。而这些是 Blackwell 和 Rubin 的吉瓦——Rubin 是英伟达下代芯片、Blackwell 是当前芯片，却被建模成按"落后两代的 Ampere"（不是 Hopper、是 Ampere）来变现。

按这个（假设变现速率等于 Ampere，我认为极不可能），超大厂经营性现金流大约是 1.3–1.4 万亿美元。而如果只是假设它们"以对当前 Blackwell 现货价的某个折价"来变现，那就更像 2 万亿美元的经营性现金流——这会讽刺性地抽走约 7000 亿美元的信贷需求。随着存量算力重新定价、我们持续加速（共识却在建模"减速"，我认为不太可能），信用指标会突然好看得多、用信贷融资也变得更容易。至于他们会不会真去用信贷，我们拭目以待。

## 五、Blackwell"空气袋"风险，以及为什么市场在 7 月不再"越过"它

**Gavin：** 这有点像我们两个月前（不，是再上一次）聊的"Blackwell 空气袋（air pocket）"风险：你花几千亿美元买 Blackwell，它们最初大多用于训练，而训练不产生回报——这在第一季度你确实看到了。两个月前我对这个风险感到安心的一个原因，是你看到 Anthropic 出来的东西如此惊人，于是"市场会越过这个（暂时无回报）"。它在 4、5、6 月确实越过了；到了 7 月，因为各种因素汇合，市场不再越过。而与此同时，经营性现金流开始真正加速——这是事实、在大体量上加速。微软 6 月上线了一大块产能，甚至没体现在二季度。

所以这一切归根结底是：你相不相信硅谷这边私营公司的"量化需求信号"会持续下去，使得存量算力随合约到期而重新以更高价定价、经营性现金流上行、你能主要（甚至全部）靠经营性现金流为此融资。如果按当前费率重新定价，你大概能在未来几年全靠经营性现金流融资。

**Patrick：** 这是市场里非常不寻常的一幕。

**Gavin：** 技术派会说这其实是 2022 年：市场担心衰退、利率上行、通胀——那正是 22 年担心的。而 DeepSeek、"解放日（关税）"你都知道它在担心什么——非常清楚，某种怪异的方式上这反而让人安心。而这次，我们谈的所有具体因素，除了信贷之外，都有点荒谬。所以"它仍在下跌"这个事实，技术派会说"这有点吓人——真正打中你的是你没看到的那颗子弹"。我想我们以前聊过，投资里最重要的三个词不是"安全边际（margin of safety）"，而是"我不知道（I don't know）"。

## 六、算力短缺的"实况"：从 $2 涨到 $4 的租赁价、以及"这像个毒品市场"

**Gavin：** 但你在这边待了两个月。我今早刚和一家公司聊——他们租了几千片 Blackwell 的集群（这是人人都想合作的最性感创业公司之一），就叫它每 GPU 小时"2 美元多点"。他们现在要租一个规模完全相同、各方面几乎一模一样的 B200 集群，希望七个月后能拿到"略低于 4 美元"的价。这很疯狂——因为你本会预期"价格温和下降"才是看多信号；结果我们视起点不同、涨了 50–60%。这半年里有太多这类轶事。我记得一家推理云（我想是 Baseten，不确定）在某档播客上基本说"我们合约到期时预计要为 Blackwell 多付 100%"。这意味着所有超大厂本质上都在"少赚（under-earning）"。

我这周主要的任务就是"压力测试"——告诉我一个负面的东西。我问每个人的问题都是："你听到过一个负面的量化指标吗？"

**Patrick：** 人们主要说的是：第三方数据表明 Anthropic 的曲线开始略微偏离其轨迹。这大概是唯一的一个。

**Gavin：** 那可能确实为真。但你有 OpenAI 和开源在大规模加速。整个复合体是"净加速"的。开源有点像宇宙里的"暗物质"——公开市场很难测量它，但只要你追踪这些推理云在播客上、在会议里说的话（不是审计过的财报），需求显然在加速，这说得通，因为 GLM 5.2 和 Kimi K3 带来了巨大的能力跃升。我认为这会持续，英伟达会把 Nemotron 稳步推向前沿。但这真是令人谦卑、充满挑战的一个月。同时也"哇"——我把每个假设都压力测试了一遍，底层基本面在改善。英伟达在我们录制此刻，处于过去 10 年最低的前瞻市盈率。半导体股唯一更便宜的时候是"解放日"和 DeepSeek，那都是 V 型底。

**Patrick：** 这对你意味着"市场认为它们在显著超赚（over-earning）"。

**Gavin：** 市场 100% 认为它们在显著超赚。你得谦卑——也许它们真是。但我这周的任务就是尽可能努力去找负面数据点。通常来硅谷，是"这有个负面、这有个正面"、净下来偏正面（科技随时间创造价值）。但这次我一个"量化指标"级的负面都找不到。那个 Anthropic 第三方数据，似乎被 Anthropic 股东激烈反驳——他们急着告诉你他们知道的（也很害怕拿不到 IPO 配售份额，而且怕"说实话是他们说了'其实很好'"传回公司）。你能想象 Anthropic 股东"这不是真的"的样子（笑）。而 Grok（以及第三方数据里的 Cursor）也是——7 月因 Grok 4.5、Grok 相关产品发布，是相当转型的一个月。

我有个富达的朋友说：过去三年正确的导航方式，就是"尽可能快地做最蠢、最肤浅的事，然后在它们之间来回切换"。而这个月，就是"为响应那些事实上（除信贷外）并不成立的叙事而砍风险（cut risk）"。我们做的工作让我认为信贷根本不会成为问题——只要我们处在算力短缺里（我拼命想找一个"我们不在短缺、且短缺没有几乎每天在恶化"的迹象），"问题本身就成了解药"：就算你真需要信贷来建我们需要的 FLOPs，如果信贷不在，只意味着已有的 FLOPs 更值钱、最终改善指标、然后信贷就来了。

## 七、"Claude 成了股市的沃尔特·克朗凯特"：AI 驱动的叙事同质化

**Gavin：** 还有一家叫 Black Forest Labs（黑森林实验室）的公司……不过先说另一件有意思的事：我们以前聊过 Michael Mauboussin（迈克尔·莫布森）——"多样性的崩溃（breakdown in diversity）"是导致泡沫与崩盘的原因。就我所知的公开股权投资业务（无论散户还是机构），如今每一条新闻都被喂进 Claude、Claude Code、有时是 Claude 智能体，而它是概率性的——它解读这条新闻的方式，变异其实没那么大。这几乎像是股市回到了一种前所未有的状态：人们谈媒体碎片化、说以前有沃尔特·克朗凯特（Walter Cronkite，"真相之声"）那样的权威，现在没了；而某种意义上，**Claude 成了股市的沃尔特·克朗凯特**——每个人都相信它说的，而它虽然很聪明、却并不总对，它的解读也不总正确。于是市场里：一条新闻被喂进 Claude、Claude 这样解读、一大批人就照 Claude 的观点交易。

## 八、continual learning / sample-efficient learning：唯一真正让人警惕的技术变量

**Patrick：** 你在这边、对"提升训练与推理各环节效率的创新"特别好奇。这类"长周期创新"有没有让你格外兴奋或好奇的？

**Gavin：** 有。很多人似乎觉得他们非常接近解决"持续学习（continual learning）"和"样本高效学习（sample-efficient learning）"。若这些被解决，会不会造成需求的"暂时性不连续"？——如果不再是"我在约 20 亿 token 上被训练、而这些模型在 300 万亿 token 上训练"，而是你能在 10 万亿 token 上训练出一个东西、放到世界里让它样本高效地学——那对训练需求听起来是好的，但训练占半导体/算力需求的比例会降到"不接近零、但很小"。这是最有意思的一点，谁知道是长周期还是短周期。SSI（Safe Superintelligence，伊利亚的安全超级智能）说 8 月会出模型，有一整代新实验室聚焦于此。这对世界会是极好的、我们都想要——而我很难相信这会真的对 AI 基础设施需求是负面的。但我尽量保持极度开放。这大概是最大的科学/技术takeaway。而且英伟达深度参与了所有这些创业公司。

**Patrick：** 如果硬要你列出"真能让你翻盘、变得非常害怕"的一组情形，会是什么？

**Gavin：** 就是"经营性现金流这件事没兑现、于是我们真的需要（外部）融资"。经营性现金流不再加速会是负面的——这某种程度上取决于 Anthropic、OpenAI、Grok、Cursor 和开源做得如何。如果 GPU 价格出现相当剧烈且持续的收缩，市场会瞬间反应——如果开始变得"很容易拿到 GPU"，那会令人担忧。但你听过任何人说"我 GPU 太多了"吗？一个人都没有。事实恰恰相反。

**Patrick：** 这听起来像个毒品市场。

**Gavin：** 真的。就是很野。还有一长串相当明显的（负面清单）：如果这些实验室（营收）之和走平或开始下降，那很负面——除非那只是因为开源 token 在"净做大蛋糕"、夺取份额。

## 九、多模型 + 路由 + RL 微调：开源如何"净做大蛋糕"

**Gavin：** 我真的认为未来是"多模型（multi-model）"，尤其对 AI 原生公司（AI natives）。他们会拿一个开源模型——这些推理云已经很擅长监督微调（SFT）和强化学习（RL）——用你的数据定制一个开源模型，然后放到路由器（router）后面：路由器通常先路由到你自己的模型、再由前沿模型（Claude、Grok 等）核验。很多情况下你能以一半的成本拿到略好的结果。

而"一半成本"——很多人一听就想"这对 AI 需求是坏事"。其实完全不是。因为用户付的成本只是 token 上的"利润"的函数。你只是把 token 从"90% 毛利的很贵的 token"转移到"也许 30% 毛利的 token"——省下的钱来自这里，但生产这些 token 花的算力是一样的。而且这些事发生在不同的周期时间上：那些大型上市公司会"天呐我的 AI 支出涨了 20 倍、三个月烧光预算"，于是搭个路由器、砍了 AI 支出——但这实际上不影响、甚至可能增加它们生成的 token 数量（因为切到更便宜的开源 token），那就是更多算力。所以一家公司"更聪明地为不同任务选不同模型"，可能让它的支出稳定甚至下降，但这与它在这些模型层/路由器背后实际消耗的 GPU 算力小时"毫无关系"——那个 GPU 算力小时数大概还在上升。

这发生在"上市公司的尖端"；然后你有一整波 AI 原生公司，极度倾斜地拥抱这个、几乎不招人、把钱主要投进 token，根本不减速；再然后你有美国东海岸那些"几乎还没采用 AI"的公司、以及忙着"先搞清楚怎么监管、再用"的欧洲——所以是几股不同的采用浪潮同时发生。但我脑子里挥之不去的想法是：**全世界大概只有 50 万、也许 25 万人在用 Agentic AI，我们就已经处在剧烈的算力短缺里；地球上有七八十亿人。当我们从 50 万走到 1 亿、再到 5 亿，会发生什么？**

## 十、就业与生产率：$25 万亿知识工作、founder-led 公司不裁员、Cognition 指数

**Gavin：** 很多人接受"超大厂在少赚、算力会重新定价"的论点后会说……（大意是仍担心 AI 冲击就业）。这里有个"软美元/每 FTE（全职员工当量）"的框架：Dylan Patel（SemiAnalysis，ASR 极不清、名以发音为准）大概说过 30% 的生产率提升（这是我听过最高的之一，我还听过 50%）；而知识工作有 25 万亿美元的体量。就取你 20% 这个数——那是 5 万亿美元，它要么来自"劳动替代"、要么来自"更快的经济增长"，而我们非常非常希望它来自更快的经济增长。

我今早从一位创办过好几家公司的顶级科技 CEO 那里听到一个有意思的点：如果你看那些"创始人主导/控制"的公司、并对 COVID 期间的过度招聘做点调整，其实没人在真正裁员。这些人本该是最快用 AI 提效的，却没搞大规模裁员——这大概说明了他们认为"仍会有大量机会需要人 + AI"。

**Patrick：** 100%。看多派会引用 Cognition、Ramp、Stripe 的（图表）：在 AI 上花得最多的公司，增长明显更快。

**Gavin：** 我爱那个"Cognition 指数"——很野。怀疑者会正确地指出它没控制行业变量；但你往下挖，会看到"每个蓝领工人（水管工、暖通承包商）因为 AI 都过得很好"的例子。顺便说个该谈的点：现在人人都在引用 LTA（长期协议）——所以一切都在短缺，如果有疲软，只是因为"我们没法足够快地把吉瓦通电"。而吉瓦会被通电的：监管政策在向好、涡轮机制造商、柴油发电机制造商……人们甚至从旧飞机上拆涡轮、翻新后再利用，各种疯狂的事在发生。资本主义非常擅长这个。

## 十一、LTA（长约）博弈论：内存四巨头、为什么违约=自毁

**Gavin：** 但市场里一个最重要的问题（也是我此前判断错的一个转变）是：我们正从"短期压榨数字"转向所谓"供应链协议/长期协议（LTA）"，尤其是内存（memory）领域。有很多形式：客户预付、有底价有上限。这又回到"劳动"那个点——很多人在 COVID 期间裁太多人后，非常不愿再裁员（"劳动囤积 labor hoarding"）。

想想"违约一份 LTA"的博弈论。在规模上重要的公司有四家：亚马逊（Trainium）、谷歌（TPU）、AMD、以及比其他所有加起来还大得多的英伟达。关键要意识到：**在给定单位算力上，你配的内存越多、单位算力产出的 token 就越多**——这是提升"每单位算力 token 产出"最重要的一件事，也确实降低成本，所以 DRAM 需求对涨价毫无负面弹性反应——因为它是那个"压倒一切的核心变量（the axis）"。

这在某种程度上像一场巨大的"权力的游戏 / 胆小鬼博弈（game of chicken）"。假设到了 2027、28 年，你隐约想违约一份 LTA、试图拿更低价。但未来几年市场份额很大程度上由"供应链配额、你预购了什么"决定。如果你违约 LTA——假设不是严重供过于求（其实即便供过于求这个博弈也成立）——一旦未来两三年因任何原因杠杆重新回到内存厂那边，你就出局了、完了。假设谷歌在 28、29 年供过于求时违约了 LTA：违约本身大概意味着供过于求、价格下跌、产能自然收缩……那你觉得谷歌的配额会怎样？而这是个周期性行业，供过于求之后是供不应求——下一次他们会怎么想谷歌的配额？

所以鉴于这是"一切围绕旋转的核心轴"，你可能因违约一份 LTA 而炸掉整个业务和特许经营权。这在以前从来不是这样——苹果无所谓，它没有竞争对手、是压倒性最大买家，即便它把 SK 海力士（Hynix）、美光（Micron）坑惨了，对方当然还是会供货，因为它量太大了。现在不同：你至少有四个玩家。加上所有创业公司（你也投了 Etched）……如果你违约 LTA，他们就说"好，你违约了价格协议，那我们违约量协议、把量给你的竞争对手，你就丢份额了"。
